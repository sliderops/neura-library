dert hat", "Anna hat jetzt seit 6 Monaten gelernt, wieder zu schlafen, ohne Tabletten, ohne Tricks. Was hat sich verändert? Sie schläft jetzt durch. Sie geht um 22 Uhr ins Bett und schläft bis 6 Uhr durch, ohne um 3 Uhr aufzuwachen. Das ist das Größte, was sich verändert hat. Sie ist nicht mehr so müde. Früher war sie immer müde, weil sie nicht geschlafen hat. Heute ist sie wach, weil sie geschlafen hat. Sie ist weniger gereizt. Früher war sie immer gereizt, weil sie so müde war. Heute ist sie ruhiger, weil sie ausgeschlafen ist. Sie hat bessere Beziehungen. Früher war sie immer gereizt, wenn ihr Mann etwas gesagt hat, weil sie so müde war. Heute hört sie ihm zu, weil sie ausgeschlafen ist. Sie ist besser auf der Arbeit. Früher hat sie fast einen Fehler gemacht, weil sie so müde war. Heute macht sie keine Fehler mehr, weil sie ausgeschlafen ist. Sie hat auch gelernt, dass Schlaf nicht Luxus ist, sondern Notwendigkeit. Früher dachte sie, Schlaf sei Luxus, den man sich leisten kann, wenn man Zeit hat. Heute weiß sie, dass Schlaf Notwendigkeit ist, ohne die man nicht leben kann. Sie geht jetzt immer um 22 Uhr ins Bett, auch am Wochenende. Sie trinkt keinen Kaffee mehr nach 14 Uhr. Sie nimmt ihr Handy nicht mehr mit ins Bett. Sie schreibt jeden Abend ihre Sorgen-Liste. Sie macht jeden Tag Sport. Sie isst abends leicht. Das sind 6 Dinge, die sie jeden Tag macht, und sie helfen ihr, zu schlafen. Sie sind nicht schwer, aber man muss sie jeden Tag machen, auch wenn man müde ist. Und das ist der Punkt: Schlaf ist kein Zufall, sondern das Ergebnis von Dingen, die man jeden Tag tut. Wenn man jeden Tag die richtigen Dinge tut, dann schläft man nachts gut. Wenn man jeden Tag die falschen Dinge tut, dann schläft man nachts schlecht. Anna tut heute jeden Tag die richtigen Dinge, und sie schläft nachts gut. Ein Beispiel, das zeigt, was sich nach 6 Monaten verändert hat: Anna hat nach 6 Monaten nicht nur besser geschlafen, sondern auch besser gelebt. Sie ist nicht mehr so müde. Sie ist weniger gereizt. Sie hat bessere Beziehungen. Sie ist besser auf der Arbeit. Sie hat auch gelernt, dass Schlaf nicht Luxus ist, sondern Notwendigkeit. Früher dachte sie, Schlaf sei Luxus, den man sich leisten kann, wenn man Zeit hat. Heute weiß sie, dass Schlaf Notwendigkeit ist, ohne die man nicht leben kann. Sie geht jetzt immer um 22 Uhr ins Bett, auch am Wochenende. Sie trinkt keinen Kaffee mehr nach 14 Uhr. Sie nimmt ihr Handy nicht mehr mit ins Bett. Sie schreibt jeden Abend ihre Sorgen-Liste. Sie macht jeden Tag Sport. Sie isst abends leicht. Das sind 6 Dinge, die sie jeden Tag macht, und sie helfen ihr, zu schlafen. Sie sind nicht schwer, aber man muss sie jeden Tag machen, auch wenn man müde ist. Und das ist der Punkt: Schlaf ist kein Zufall, sondern das Ergebnis von Dingen, die man jeden Tag tut. Wenn man jeden Tag die richtigen Dinge tut, dann schläft man nachts gut. Wenn man jeden Tag die falschen Dinge tut, dann schläft man nachts schlecht. Anna tut heute jeden Tag die richtigen Dinge, und sie schläft nachts gut. Und das ist der größte Gewinn: Nicht dass sie besser schläft, sondern dass sie besser lebt, weil sie besser schläft. Ein weiterer Punkt zu Anna 6 Monate später ist, dass sie nicht perfekt schläft. Es gibt Nächte, in denen sie wieder nicht gut schläft, weil sie Schicht hat, weil ihr Sohn nachts aufwacht, weil sie sich Sorgen macht. Das ist kein Scheitern, das ist Leben. Sie bestraft sich nicht dafür, sondern sie sagt: Okay, heute Nacht habe ich nicht gut geschlafen, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal eine schlechte Nacht hat, der wird nie wieder gut schlafen. Wer weitermacht, auch wenn er einmal eine schlechte Nacht hat, der wird wieder gut schlafen, Nacht für Nacht. Anna bleibt dran, auch wenn sie mal eine schlechte Nacht hat. Sie hat gelernt, dass Rückfälle normal sind und dass sie nichts über ihren Wert aussagen. Sie sagen nur, dass sie ein Mensch ist, der manchmal schlecht schläft. Und das ist in Ordnung, solange sie danach wieder aufsteht und weitermacht. Das ist der Weg, um wieder durchzuschlafen, ohne Tabletten, ohne Tricks, sondern mit einem Plan, der wirklich funktioniert: Nicht perfekt sein, sondern dranbleiben, Nacht für Nacht, Tag für Tag.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Dein Plan für die nächsten 30 Tage - wieder durchschlafen, Schritt für Schritt", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein macht dich nicht schlafen. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Geh jeden Tag zur gleichen Zeit ins Bett und steh jeden Tag zur gleichen Zeit auf, auch am Wochenende. Schreib jeden Abend auf, wann du ins Bett gegangen bist und wann du aufgestanden bist. Nur aufschreiben, nichts ändern. Woche 2: Kein Kaffee nach 14 Uhr. Kein Handy im Schlafzimmer. Leg dein Handy um 21 Uhr in die Küche und hol es erst am nächsten Morgen wieder. Kauf dir einen echten Wecker, der nicht leuchtet. Woche 3: Schreib jeden Abend um 20 Uhr deine Sorgen-Liste. Schreib alles auf, was dir Sorgen macht, bis dir nichts mehr einfällt. Leg die Liste in eine Schublade und sag zu dir selbst: Meine Sorgen sind jetzt in der Schublade. Morgen früh hole ich sie wieder raus. Woche 4: Mach jeden Tag 30 Minuten Sport, spätestens 3 Stunden vor dem Schlafengehen. Iss abends leicht, spätestens 3 Stunden vor dem Schlafengehen. Kein Alkohol abends. Nach 30 Tagen wirst du merken, dass du besser schläfst. Nicht perfekt, aber besser. Anna hat nach 30 Tagen gemerkt, dass sie nicht mehr jede Nacht um 3 Uhr aufgewacht ist. Sie ist nur noch einmal in der Woche aufgewacht. Nach 3 Monaten ist sie gar nicht mehr aufgewacht. Nach 6 Monaten hat sie durchgeschlafen. Das ist kein Wunder, das ist ein Plan, der funktioniert, weil er klein und machbar ist. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du gestern ins Bett gegangen bist und wann du aufgestanden bist. Und frag dich: Was kann ich heute anders machen, damit ich heute Nacht besser schlafe? Das ist der erste Schritt, um wieder durchzuschlafen, ohne Tabletten, ohne Tricks, sondern mit einem Plan, der wirklich funktioniert. Ein Beispiel, das zeigt, wie der 30-Tage-Plan funktioniert: Anna hat in der ersten Woche nur aufgeschrieben, wann sie ins Bett gegangen ist und wann sie aufgestanden ist. Das war einfach, weil sie nur aufschreiben musste, nichts ändern. In der zweiten Woche hat sie aufgehört, nach 14 Uhr Kaffee zu trinken und ihr Handy mit ins Bett zu nehmen. Das war schwer, weil sie es gewohnt war. Aber nach einer Woche hat sie gemerkt, dass sie besser schläft, weil sie es getan hat. In der dritten Woche hat sie angefangen, jeden Abend ihre Sorgen-Liste zu schreiben. Das war neu, aber es hat ihr geholfen, weil ihr Kopf dadurch nachts ruhiger war. In der vierten Woche hat sie angefangen, jeden Tag Sport zu machen und abends leicht zu essen. Das war der letzte Schritt. Nach 30 Tagen hat sie gemerkt, dass sie besser schläft. Nicht perfekt, aber besser. Sie ist nicht mehr jede Nacht um 3 Uhr aufgewacht. Sie ist nur noch einmal in der Woche aufgewacht. Nach 3 Monaten ist sie gar nicht mehr aufgewacht. Nach 6 Monaten hat sie durchgeschlafen. Das ist kein Wunder, das ist ein Plan, der funktioniert, weil er klein und machbar ist. Fang heute an. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du gestern ins Bett gegangen bist und wann du aufgestanden bist. Das ist der erste Schritt, um wieder durchzuschlafen, ohne Tabletten, ohne Tricks, sondern mit einem Plan, der wirklich funktioniert. Ein weiterer Punkt zum 30-Tage-Plan ist, dass du nach 30 Tagen nicht fertig bist. Nach 30 Tagen hast du angefangen, aber du bist noch lange nicht am Ziel. Du musst dranbleiben, Monat für Monat, Jahr für Jahr. Anna hat nach 30 Tagen angefangen, aber sie ist nach 6 Monaten immer noch dabei. Sie wird auch in einem Jahr noch dabei sein, und in 5 Jahren. Das ist der Punkt: Gut schlafen ist kein Projekt, das man nach 30 Tagen abschließt und dann nie wieder darüber nachdenkt. Gut schlafen ist ein Prozess, der ein Leben lang dauert, weil man immer wieder aufpassen muss, dass man nicht wieder in alte Muster zurückfällt. Aber wenn man einmal gelernt hat, wie man gut schläft, dann wird es leichter. Anna hat gelernt, wie man gut schläft. Sie weiß jetzt, was sie tun muss, um gut zu schlafen, und sie tut es jeden Tag, auch wenn sie müde ist. Und das wird sie ihr ganzes Leben tun, weil sie weiß, dass es ihr gut tut. Das ist der größte Gewinn: Nicht dass sie besser schläft, sondern dass sie gelernt hat, wie man gut schläft, und dass sie dieses Wissen ihr ganzes Leben nutzen wird. Und das ist mehr wert als jede Schlaftablette, die man kaufen kann.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."]], "kat": "Sachbücher", "unter": "Gesundheit"}, {"title": "Der Mut, du selbst zu sein", "chapters": [["Die Frau, die immer die war, die andere wollten", "Sofia ist 34, arbeitet in Bielefeld in einem Café, und sie hat ein Problem, das sie lange nicht als Problem gesehen hat. Sie ist immer die, die andere wollen, dass sie ist. Wenn ihre Chefin will, dass sie lustig ist, dann ist Sofia lustig. Wenn ihr Freund will, dass sie ruhig ist, dann ist Sofia ruhig. Wenn ihre Mutter will, dass sie brav ist, dann ist Sofia brav. Sie hat sich so daran gewöhnt, sich zu verstellen, dass sie nicht mehr weiß, wer sie eigentlich ist. Eines Abends sitzt sie allein in ihrer Wohnung und schaut in den Spiegel. Sie sieht eine Frau, die sie nicht kennt. Sie fragt sich: Wer bin ich eigentlich, wenn niemand zuschaut? Was mag ich eigentlich, wenn ich nicht versuche, anderen zu gefallen? Was will ich eigentlich, wenn ich nicht versuche, es allen recht zu machen? Sie kann die Fragen nicht beantworten, weil sie so lange versucht hat, anderen zu gefallen, dass sie vergessen hat, was sie selbst will. Sie ist zu einer Beratung gegangen. Die Beraterin hat sie gefragt: Wann hast du das letzte Mal etwas getan, nur weil du es wolltest, nicht weil andere es wollten? Sofia konnte sich nicht erinnern. Sie hat immer getan, was andere wollten. Die Beraterin hat gesagt: Du musst nicht lernen, egoistisch zu sein. Du musst lernen, du selbst zu sein, auch wenn das bedeutet, dass nicht alle dich mögen. Denn wenn du immer nur die bist, die andere wollen, dann mag dich niemand wirklich, weil niemand weiß, wer du wirklich bist. In diesem Buch gehen wir genau das durch: Warum du dich verstellst, was es dich kostet, und wie du lernst, du selbst zu sein, mit Mut, Schritt für Schritt, ohne dich zu schämen. Was Sofia danach noch gelernt hat, war, dass man nicht von heute auf morgen man selbst wird. Man wird Schritt für Schritt man selbst, Tag für Tag, Woche für Woche. Am Anfang hat sie nur eine Maske abgelegt: Sie hat aufgehört, im Café immer lustig zu sein, wenn sie nicht lustig war. Sie hat angefangen, ehrlich zu sagen, wenn sie müde war. Sie hat gesagt: Heute bin ich müde, ich lächle heute nicht so viel. Die Kunden haben das verstanden. Sie haben nicht gesagt: Du bist nicht mehr lustig, wir kommen nicht mehr. Sie haben gesagt: Das ist in Ordnung, jeder ist mal müde. Das war eine Erleichterung für Sofia, weil sie gemerkt hat, dass sie nicht immer lustig sein muss, um gemocht zu werden. Sie kann auch müde sein und trotzdem gemocht werden. Das war der erste Schritt. Nach einer Woche hat sie eine zweite Maske abgelegt: Sie hat aufgehört, zu Hause immer ruhig zu sein, wenn sie eigentlich etwas sagen wollte. Sie hat angefangen, ihrem Freund zu sagen, was sie denkt, auch wenn er eine andere Meinung hat. Er hat nicht gesagt: Du bist nicht mehr ruhig, ich mag dich nicht mehr. Er hat gesagt: Es ist gut, dass du sagst, was du denkst. Ich will wissen, was du denkst, nicht nur, was du denkst, dass ich hören will. Das war der zweite Schritt. So hat Sofia Schritt für Schritt ihre Masken abgelegt, eine nach der anderen, bis sie am Ende nur noch sie selbst war, ohne Maske. Das hat 6 Monate gedauert. Nicht 6 Tage, nicht 6 Wochen, sondern 6 Monate. Denn man selbst zu werden, dauert Zeit, weil man so lange Masken getragen hat, dass man vergessen hat, wer man wirklich ist. Ein weiterer Punkt, den Sofia gelernt hat, ist, dass man nicht alles auf einmal ändern muss. Sie hat nicht von heute auf morgen angefangen, überall man selbst zu sein. Sie hat mit einer Sache angefangen: Sie hat einmal am Tag Nein gesagt, wenn sie Nein meinte. Nur einmal. Das war machbar. Nach einer Woche hat sie zweimal am Tag Nein gesagt. Nach einem Monat hat sie so oft Nein gesagt, wie sie Nein meinte. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Sofia hat auch gelernt, dass Rückschläge normal sind. Es gab Tage, an denen sie wieder eine Maske getragen hat, weil sie Angst hatte, ehrlich zu sein. Das war kein Scheitern, das war ein Rückfall. Sie hat sich nicht dafür bestraft, sondern sie hat gesagt: Okay, heute habe ich wieder eine Maske getragen, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie man selbst. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird man selbst, Schritt für Schritt, Tag für Tag. Was Sofia am Ende am meisten geholfen hat, war nicht ein einzelner Trick, sondern die Erkenntnis, dass sie gut genug ist, so wie sie ist. Sie muss sich nicht verstellen, um gemocht zu werden. Sie muss nur man selbst sein, und die Menschen, die sie wirklich mögen, werden sie mögen, weil sie sie selbst ist. Und die Menschen, die sie nicht mögen, weil sie sie selbst ist, waren nie echte Freunde.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, die zu sein, die andere wollen, und anfängst, die zu sein, die du wirklich bist. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um man selbst zu sein, mit Mut."], ["Warum du dich verstellst - was du als Kind gelernt hast", "Als Kind hat Sofia gelernt, dass sie geliebt wird, wenn sie brav ist, und dass sie nicht geliebt wird, wenn sie laut ist. Wenn sie als Kind laut gelacht hat, dann hat ihre Mutter gesagt: Sei leise, das gehört sich nicht für ein Mädchen. Wenn sie als Kind geweint hat, weil sie traurig war, dann hat ihr Vater gesagt: Heul nicht, sei stark. Wenn sie als Kind gesagt hat, dass sie etwas nicht will, dann haben ihre Eltern gesagt: Sei nicht so egoistisch. Sofia hat daraus eine Regel gemacht, die ihr ganzes Leben bestimmt hat: Ich muss mich verstellen, damit ich geliebt werde. Ich darf nicht zeigen, wer ich wirklich bin, weil ich sonst nicht geliebt werde. Als Erwachsene glaubt sie das immer noch, obwohl es nicht stimmt. Denn Erwachsene, die dich wirklich mögen, mögen dich, weil du du bist, nicht weil du dich verstellst. Aber ihr inneres Kind glaubt das immer noch. Es denkt, wenn sie zeigt, wer sie wirklich ist, dann wird sie nicht mehr geliebt. Das ist der Grund, warum sie sich verstellt. Es ist nicht, weil sie lügen will. Es ist, weil sie Angst hat, nicht mehr geliebt zu werden, wenn sie ehrlich ist. Die Aufgabe ist, diese alte Regel zu finden und zu prüfen, ob sie heute noch stimmt. Frag dich: Wenn ich heute zeige, wer ich wirklich bin, werde ich dann wirklich nicht mehr gemocht? Oder ist das nur eine alte Angst, die ich als Kind gelernt habe und die heute gar nicht mehr stimmt? Ein Beispiel, das zeigt, wie tief solche Regeln sitzen: Sofia hat einmal in einer Besprechung im Café eine Idee gehabt, wie man das Café schöner machen könnte. Sie hat sie nicht gesagt, weil sie dachte, sie sei nicht gut genug. Nach der Besprechung hat eine Kollegin die gleiche Idee gesagt, und alle haben sie gelobt. Sofia war wütend auf sich selbst, weil sie ihre Idee nicht gesagt hatte. Sie hat gemerkt, dass ihre Regel Ich muss perfekt sein, sonst bin ich nichts wert, sie daran gehindert hat, ihre Idee zu sagen. Sie dachte, ihre Idee müsse perfekt sein, sonst dürfe sie sie nicht sagen. In Wahrheit war ihre Idee gut genug, auch wenn sie nicht perfekt war. Das ist der Punkt: Perfekt gibt es nicht. Jede Idee, die man nicht sagt, ist eine verpasste Chance. Sofia hat angefangen, ihre Ideen zu sagen, auch wenn sie nicht perfekt sind. Sie hat gesagt: Ich habe eine Idee, sie ist noch nicht ganz ausgereift, aber vielleicht hilft sie uns weiter. Das war schwer, weil sie sich dabei verletzlich gefühlt hat. Aber es hat funktioniert, weil ihre Kollegen ihre Ideen geschätzt haben, auch wenn sie nicht perfekt waren. Sie haben gesagt: Danke, dass du das gesagt hast, das hilft uns. Das hat Sofia gezeigt, dass ihre Regel nicht stimmt. Man muss nicht perfekt sein, um etwas Wertvolles zu sagen. Man muss nur mutig genug sein, es zu sagen, auch wenn es nicht perfekt ist. Und Mut ist nicht, keine Angst zu haben. Mut ist, Angst zu haben und es trotzdem zu tun. Ein weiterer Punkt ist, dass man seine Kindheit nicht ändern kann, aber man kann ändern, was man daraus macht. Sofia kann nicht ändern, dass ihre Eltern ihr beigebracht haben, sich zu verstellen. Aber sie kann ändern, was sie heute daraus macht. Sie kann die alte Regel prüfen und fragen: Stimmt sie heute noch? Und wenn sie nicht mehr stimmt, dann kann sie eine neue Regel aufstellen, die zu dem Leben passt, das sie heute führen will. Zum Beispiel: Ich darf man selbst sein, und ich werde trotzdem gemocht. Das ist eine neue Regel, die besser zu ihrem Leben passt als die alte Regel: Ich muss mich verstellen, damit ich geliebt werde. Die alte Regel hat sie als Kind gelernt, als sie noch klein war und von ihren Eltern abhängig war. Die neue Regel hat sie als Erwachsene gelernt, als sie gemerkt hat, dass sie auch man selbst sein kann und trotzdem gemocht wird. Das ist der Unterschied zwischen Kindheit und Erwachsensein: Als Kind muss man sich verstellen, um geliebt zu werden. Als Erwachsene darf man man selbst sein und wird trotzdem geliebt. Das ist eine Erkenntnis, die Sofia frei gemacht hat, weil sie gemerkt hat, dass sie nicht mehr ein Kind ist, das brav sein muss, sondern eine Erwachsene, die selbst entscheiden darf, wer sie ist und wer sie sein will. Deine Kindheit ist nicht deine Schuld, aber sie ist deine Verantwortung. Du kannst nicht ändern, was deine Eltern damals gemacht haben, aber du kannst ändern, was du heute daraus machst. Du kannst die alte Regel prüfen und eine neue Regel aufstellen, die besser zu deinem Leben passt. Und das ist der Weg, um man selbst zu werden, mit Mut, Schritt für Schritt.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, die zu sein, die andere wollen, und anfängst, die zu sein, die du wirklich bist. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um man selbst zu sein, mit Mut."], ["Die Masken, die du jeden Tag trägst", "Sofia trägt jeden Tag verschiedene Masken. Im Café trägt sie die Maske der lustigen Kellnerin, die immer lächelt, auch wenn sie müde ist. Zu Hause trägt sie die Maske der ruhigen Freundin, die immer zuhört, auch wenn sie selbst etwas sagen will. Bei ihrer Mutter trägt sie die Maske der braven Tochter, die immer Ja sagt, auch wenn sie Nein meint. Bei ihren Freunden trägt sie die Maske der coolen Freundin, die alles mitmacht, auch wenn sie eigentlich lieber zu Hause bleiben würde. Sie hat so viele Masken, dass sie nicht mehr weiß, welche die echte ist. Jede Maske kostet sie Energie, weil sie sich anstrengen muss, sie zu tragen. Sie muss lächeln, wenn sie nicht lächeln will. Sie muss zuhören, wenn sie selbst sprechen will. Sie muss Ja sagen, wenn sie Nein meint. Das macht sie müde, nicht körperlich müde, sondern seelisch müde. Sie ist abends so erschöpft, dass sie nur noch auf dem Sofa liegt und nichts mehr tun will. Nicht weil sie körperlich gearbeitet hat, sondern weil sie den ganzen Tag Masken getragen hat. Die Frage ist: Welche Masken trägst du? Und welche Maske ist die echte? Oder gibt es gar keine echte Maske mehr, weil du dich so lange verstellt hast, dass du vergessen hast, wer du wirklich bist? Sofia hat angefangen, ihre Masken aufzuschreiben. Sie hat auf ein Blatt Papier geschrieben: Im Café bin ich lustig. Zu Hause bin ich ruhig. Bei meiner Mutter bin ich brav. Bei meinen Freunden bin ich cool. Dann hat sie sich gefragt: Wer bin ich, wenn ich allein bin? Und sie konnte die Frage nicht beantworten, weil sie noch nie allein war, ohne Maske. Das war der Moment, in dem sie gemerkt hat, dass sie sich selbst verloren hat. Ein Beispiel, das zeigt, wie Masken im Alltag funktionieren: Sofia hat früher, wenn sie mit ihren Freunden unterwegs war, immer so getan, als würde sie gerne feiern gehen, obwohl sie lieber zu Hause geblieben wäre. Sie hat gelacht, wenn andere gelacht haben, auch wenn sie den Witz nicht lustig fand. Sie hat getanzt, wenn andere getanzt haben, auch wenn sie keine Lust hatte zu tanzen. Sie hat getrunken, wenn andere getrunken haben, auch wenn sie eigentlich keinen Alkohol trinken wollte. Sie hat das gemacht, weil sie dachte, sie müsse so sein wie ihre Freunde, um dazuzugehören. Heute macht sie das nicht mehr. Wenn sie mit ihren Freunden unterwegs ist und keine Lust hat zu tanzen, dann tanzt sie nicht. Sie sitzt da und schaut zu. Wenn sie den Witz nicht lustig findet, dann lacht sie nicht. Sie sagt: Den Witz fand ich nicht lustig. Wenn sie keinen Alkohol trinken will, dann trinkt sie keinen Alkohol. Sie trinkt Wasser. Ihre Freunde haben zuerst komisch geschaut, weil Sofia sich verändert hat. Nach einer Weile haben sie gesagt: Es ist gut, dass du ehrlich bist. Früher hast du immer so getan, als würdest du gerne feiern, aber wir haben gemerkt, dass du eigentlich keine Lust hattest. Heute bist du ehrlich, und das gefällt uns besser. Das hat Sofia gezeigt, dass ihre Freunde sie nicht weniger mögen, weil sie ehrlich ist. Sie mögen sie sogar mehr, weil sie jetzt ehrlich ist und nicht mehr so tut, als wäre sie jemand, der sie nicht ist. Ein weiterer Punkt zu Masken ist, dass man sie nicht immer ablegen muss. Es gibt Situationen, in denen es sinnvoll ist, eine Maske zu tragen. Zum Beispiel: Wenn man bei der Arbeit mit einem schwierigen Kunden spricht, dann muss man freundlich sein, auch wenn man innerlich wütend ist. Das ist keine Lüge, das ist Professionalität. Wenn man mit einem Kind spricht, das Angst hat, dann muss man ruhig sein, auch wenn man selbst Angst hat. Das ist keine Lüge, das ist Fürsorge. Der Unterschied ist: Man trägt die Maske bewusst, weil man es will, nicht unbewusst, weil man Angst hat, nicht gemocht zu werden. Sofia hat gelernt, dass sie manchmal eine Maske trägt, weil sie es will, nicht weil sie muss. Wenn sie bei der Arbeit mit einem schwierigen Kunden spricht, dann trägt sie die Maske der freundlichen Kellnerin, weil sie es will, nicht weil höpft, weil er keine Energie dafür verbraucht hat, jemand zu sein, der er nicht ist. Sofia hat das erlebt. Sie ist heute abends nicht mehr erschöpft, weil sie keine Masken mehr trägt. Sie ist heute abends wach, weil sie man selbst ist. Ein weiterer Punkt zu Kosten ist, dass man nicht nur Energie verliert, wenn man sich verstellt, sondern auch Zeit. Sofia hat viel Zeit damit verbracht, Dinge zu tun, die sie eigentlich nicht tun wollte, nur um anderen zu gefallen. Sie ist mit ihren Freunden feiern gegangen, obwohl sie lieber zu Hause geblieben wäre. Sie hat mit ihrem Freund Fernsehen geschaut, obwohl sie lieber ein Buch gelesen hätte. Sie hat mit ihrer Familie gegessen, obwohl sie lieber allein gewesen wäre. Das war Zeit, die sie nie wieder bekommt. Zeit, die sie für Dinge hätte nutzen können, die ihr wirklich Spaß machen. Heute nutzt sie ihre Zeit für Dinge, die ihr Spaß machen. Sie geht zum Malkurs, sie geht allein spazieren, sie liest Bücher, die sie mag. Das sind Dinge, die ihr Energie geben, statt sie ihr zu nehmen. Früher hat sie ihre Zeit für Dinge verwendet, die ihr Energie genommen haben. Heute verwendet sie ihre Zeit für Dinge, die ihr Energie geben. Das ist der Unterschied zwischen einem Leben, in dem man sich verstellt, und einem Leben, in dem man man selbst ist. Das eine nimmt einem Energie und Zeit. Das andere gibt einem Energie und Zeit. Sofia hat heute mehr Energie und mehr Zeit, weil sie man selbst ist, nicht weil sie weniger zu tun hat, sondern weil sie ihre Zeit für Dinge verwendet, die ihr gut tun, statt für Dinge, die ihr nicht gut tun. Nicht man selbst zu sein, kostet dich Energie, Zeit, Beziehungen, und dein Selbstwertgefühl. Es kostet dich alles, was dir wichtig ist. Man selbst zu sein, gibt dir Energie, Zeit, Beziehungen, und dein Selbstwertgefühl zurück. Es gibt dir alles, was dir wichtig ist. Das ist der Unterschied zwischen einem Leben, in dem man sich verstellt, und einem Leben, in dem man man selbst ist.  Und genau das ist der Punkt, an d function lesezeit(b){var w=0;for(var i=0;i<b.chapters.length;i++){w+=b.chapters[i][1].split(/\s+/).length;}return Math.max(1,Math.round(w/200));}
