, weil ihr Freund sich zum ersten Mal wirklich gehört gefühlt hat. Und wenn man sich gehört fühlt, dann muss man nicht mehr schreien, um gehört zu werden. Man kann leise sprechen, und der andere hört trotzdem zu. Das ist der Unterschied zwischen einem Streit, bei dem beide schreien, und einem Gespräch, bei dem beide zuhören. Und ein Gespräch ist immer besser als ein Streit, weil bei einem Gespräch beide gewinnen, bei einem Streit beide verlieren. In einem Streit geht es oft nicht darum, wer Recht hat, sondern darum, dass man sich gesehen fühlt. Wenn du dich in einem Streit gesehen fühlst, dann musst du nicht mehr schreien, um gehört zu werden. Du kannst leise sprechen, und der andere hört trotzdem zu. Das ist der Unterschied zwischen einem Streit, bei dem beide verlieren, und einem Gespräch, bei dem beide gewinnen. Und ein Gespräch ist immer besser als ein Streit.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Arbeit - warum du dich dort immer anpasst", "Anna hat sich auch bei der Arbeit immer angepasst. Wenn ihre Chefin gefragt hat, ob sie Überstunden machen kann, hat Anna Ja gesagt, obwohl sie schon müde war. Wenn ihre Kollegin gefragt hat, ob sie ihre Schicht übernehmen kann, hat Anna Ja gesagt, obwohl sie schon drei Schichten hintereinander hatte. Sie dachte, sie müsse das tun, um ihren Job zu behalten. In Wahrheit hat sie ihren Job nicht behalten, weil sie immer Ja gesagt hat, sondern trotzdem. Und sie hat sich dabei selbst kaputt gemacht. Viele Menschen passen sich bei der Arbeit an, weil sie Angst haben, ihren Job zu verlieren, wenn sie Nein sagen. Das ist verständlich. Aber es gibt einen Unterschied zwischen Anpassen und Aufgeben. Anpassen heißt: Ich mache etwas, was ich nicht unbedingt will, aber ich weiß, warum ich es mache, und ich habe eine Grenze. Aufgeben heißt: Ich mache alles, was andere wollen, und ich habe keine Grenze mehr. Anna hat gelernt, bei der Arbeit Grenzen zu setzen. Sie hat gesagt: Ich kann heute Überstunden machen, aber morgen brauche ich frei. Sie hat gesagt: Ich kann deine Schicht übernehmen, aber nur, wenn du nächste Woche meine übernimmst. Das ist kein Nein, das ist ein Verhandeln. Und Verhandeln ist besser als Ja sagen, weil es zeigt, dass du dich selbst ernst nimmst. Wenn du bei der Arbeit immer Ja sagst, dann denken die anderen, dass du immer Zeit hast. Wenn du manchmal Nein sagst, dann denken die anderen, dass deine Zeit wertvoll ist. Und das stimmt. Deine Zeit ist wertvoll. Ein Beispiel, das zeigt, wie man bei der Arbeit Grenzen setzt, ohne den Job zu verlieren: Anna hat zu ihrer Chefin gesagt: Ich kann diese Woche Überstunden machen, aber nächste Woche brauche ich zwei Tage frei, weil ich schon drei Wochen hintereinander Überstunden gemacht habe. Ihre Chefin hat gesagt: Okay, das ist fair. Anna war überrascht, weil sie dachte, ihre Chefin würde sauer sein. In Wahrheit hat ihre Chefin das respektiert, weil Anna es klar und ruhig gesagt hat, ohne Vorwürfe, ohne Drama. Sie hat nicht gesagt: Du beutest mich aus. Sie hat gesagt: Ich kann das machen, aber ich brauche dafür einen Ausgleich. Das ist Verhandeln, nicht Jammern. Und Verhandeln ist besser als Ja sagen, weil es zeigt, dass du dich selbst ernst nimmst. Ein zweites Beispiel: Eine Kollegin hat Anna gefragt, ob sie ihre Schicht übernehmen kann. Anna hat gesagt: Ich kann deine Schicht am Freitag übernehmen, wenn du meine Schicht am Montag übernimmst. Die Kollegin hat Ja gesagt. Das ist ein Tausch, kein Opfer. Früher hätte Anna einfach Ja gesagt und hätte sich danach geärgert, weil sie am Freitag eigentlich frei haben wollte. Heute sagt sie Ja, aber nur, wenn sie dafür etwas bekommt. Das ist kein Egoismus, das ist Fairness. Und Fairness ist wichtig, damit man sich bei der Arbeit nicht ausgenutzt fühlt. Ein weiterer Punkt zu Arbeit ist, dass man nicht nur Nein sagen muss, sondern auch Ja sagen muss, wenn man etwas wirklich will. Anna hat nicht nur gelernt, Nein zu sagen, wenn sie Nein meinte, sondern auch Ja zu sagen, wenn sie Ja meinte. Früher hat sie auch zu Dingen Nein gesagt, die sie eigentlich wollte, weil sie dachte, sie sei nicht gut genug. Zum Beispiel: Sie wollte eine Fortbildung machen, aber sie hat Nein gesagt, weil sie dachte, sie sei nicht gut genug dafür. Sie wollte eine Gehaltserhöhung, aber sie hat nicht danach gefragt, weil sie dachte, sie verdiene sie nicht. Sie wollte einen neuen Job, aber sie hat sich nicht beworben, weil sie dachte, sie würde sowieso abgelehnt. Das ist das gleiche Muster, nur andersherum. Sie hat nicht nur Ja gesagt, wenn sie Nein meinte, sondern auch Nein gesagt, wenn sie Ja meinte. Heute sagt Anna Ja, wenn sie Ja meint. Sie hat die Fortbildung gemacht, sie hat nach einer Gehaltserhöhung gefragt, sie hat sich auf einen neuen Job beworben. Sie hat die Fortbildung bestanden, sie hat die Gehaltserhöhung bekommen, und sie hat den neuen Job nicht bekommen, aber sie hat es versucht. Und das ist schon ein Erfolg, weil sie es versucht hat, statt sich selbst klein zu machen. Das ist der Punkt: Selbstkenntnis heißt nicht nur, Nein zu sagen, wenn man Nein meint, sondern auch Ja zu sagen, wenn man Ja meint. Bei der Arbeit geht es nicht nur darum, was du tust, sondern auch darum, wie du es tust. Wenn du immer Ja sagst und dabei innerlich wütend bist, dann merken das die anderen, auch wenn du es nicht sagst. Sie spüren, dass du nicht ehrlich bist. Wenn du ehrlich Nein sagst, wenn du Nein meinst, dann merken die anderen, dass du ehrlich bist, und sie respektieren dich dafür. Ehrlichkeit ist ansteckend. Wenn du ehrlich bist, dann werden auch andere ehrlich zu dir sein.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Freundschaft - warum du dich verstellst, um dazuzugehören", "Anna hat sich auch bei ihren Freunden verstellt. Wenn ihre Freunde gesagt haben, dass sie am Samstag feiern gehen wollen, hat Anna Ja gesagt, obwohl sie eigentlich lieber zu Hause bleiben wollte. Sie hatte Angst, dass sie nicht mehr eingeladen wird, wenn sie Nein sagt. Sie hatte Angst, dass sie nicht mehr dazugehört, wenn sie nicht mitmacht. Das ist ein Gefühl, das fast jeder kennt. Man will dazugehören, man will gemocht werden, man will nicht allein sein. Aber wenn du dich verstellst, um dazuzugehören, dann gehörst du nicht wirklich dazu, weil die anderen nicht dich mögen, sondern die Rolle, die du spielst. Anna hat das gemerkt, als sie einmal Nein gesagt hat und trotzdem eingeladen wurde. Ihre Freunde haben gesagt: Schade, dass du nicht kommst, aber wir sehen uns nächste Woche. Sie waren nicht sauer. Sie haben sie immer noch gemocht. Das war eine Erleichterung für Anna. Sie hat gelernt, dass echte Freundschaft nicht davon abhängt, ob man immer Ja sagt, sondern davon, ob man ehrlich ist. Wenn du ehrlich sagst, dass du heute keine Lust hast, dann werden deine echten Freunde das verstehen. Und die, die es nicht verstehen, waren vielleicht gar keine echten Freunde, sondern nur Menschen, die dich brauchten, damit du immer Ja sagst. Das ist hart, aber es ist wahr. Und es ist besser, zwei echte Freunde zu haben, als zehn Freunde, bei denen man sich verstellen muss. Ein Beispiel, das zeigt, wie man echte Freundschaft erkennt: Anna hat eine Freundin, die immer nur anruft, wenn sie etwas braucht. Wenn Anna sie anruft, weil sie selbst etwas braucht, dann hat die Freundin keine Zeit. Anna hat lange gedacht, das sei normal, weil man Freunden helfen muss. Dann hat sie gemerkt, dass das keine Freundschaft ist, sondern ein Einbahnstraßen-Verhältnis. Sie gibt immer, die andere nimmt immer. Sie hat der Freundin gesagt: Ich habe das Gefühl, dass ich immer nur gebe und du immer nur nimmst. Ich brauche auch einmal Hilfe. Die Freundin war sauer und hat gesagt: Du bist egoistisch geworden. Anna war traurig, aber sie hat gemerkt, dass das keine echte Freundschaft war. Denn eine echte Freundin hätte gesagt: Oh, das tut mir leid, das habe ich gar nicht gemerkt. Lass uns darüber reden. Eine Freundin, die sauer wird, wenn man ehrlich sagt, wie man sich fühlt, ist keine Freundin. Anna hat diese Freundschaft beendet. Das war schwer, aber es hat ihr gut getan, weil sie jetzt mehr Zeit für die Freunde hat, die wirklich für sie da sind. Und sie hat gemerkt, dass sie lieber zwei echte Freunde hat als zehn Freunde, bei denen sie sich verstellen muss. Ein weiterer Punkt zu Freundschaft ist, dass man Freunde nicht nur braucht, wenn es einem gut geht, sondern auch, wenn es einem schlecht geht. Anna hat gemerkt, dass sie ihren Freunden immer nur dann erzählt hat, wenn es ihr gut ging. Wenn es ihr schlecht ging, hat sie nichts gesagt, weil sie dachte, sie dürfe ihre Freunde nicht belasten. Das ist kein Zeichen von Stärke, sondern von Angst. Sie hatte Angst, dass ihre Freunde sie nicht mehr mögen, wenn sie ihnen erzählt, wie es ihr wirklich geht. Als sie das erste Mal einer Freundin erzählt hat, dass es ihr nicht gut geht, weil sie immer Ja sagt und sich dabei selbst verliert, hat die Freundin gesagt: Das geht mir genauso. Ich sage auch immer Ja, obwohl ich Nein meine. Das war eine Erleichterung für Anna, weil sie gemerkt hat, dass sie nicht allein ist. Viele Menschen haben das gleiche Problem, aber niemand spricht darüber, weil alle denken, sie seien die Einzigen, die so sind. Wenn man darüber spricht, dann merkt man, dass man nicht allein ist. Und das ist der Anfang von echter Freundschaft, weil echte Freundschaft nicht davon abhängt, ob man immer gut drauf ist, sondern davon, ob man ehrlich ist, auch wenn es einem schlecht geht. Echte Freundschaft erkennt man nicht daran, dass man immer einer Meinung ist, sondern daran, dass man ehrlich sein kann, auch wenn man unterschiedlicher Meinung ist. Wenn du in einer Freundschaft nicht ehrlich sein kannst, dann ist es keine echte Freundschaft, sondern eine Rolle, die du spielst. Und eine Rolle zu spielen, macht müde. Ehrlich zu sein, macht frei, auch wenn es am Anfang schwer ist.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Dein Körper - was er dir sagen will, wenn du nicht hinhörst", "Anna hat lange nicht auf ihren Körper gehört. Sie hatte Kopfschmerzen, wenn sie gestresst war, aber sie hat eine Tablette genommen und weitergemacht. Sie hatte Bauchschmerzen, wenn sie Angst hatte, aber sie hat gesagt, das sei nur der Magen. Sie hatte Rückenschmerzen, wenn sie überfordert war, aber sie hat gesagt, das sei nur das Sitzen. Ihr Körper hat ihr immer wieder gesagt, dass etwas nicht stimmt, aber sie hat nicht hingehört. Erst als sie eines Abends auf dem Sofa geweint hat, ohne zu wissen, warum, hat sie verstanden, dass ihr Körper schon lange mit ihr gesprochen hat. Der Körper spricht nicht in Worten, sondern in Signalen. Kopfschmerzen können bedeuten: Du bist überfordert. Bauchschmerzen können bedeuten: Du hast Angst. Rückenschmerzen können bedeuten: Du trägst zu viel Last, nicht nur körperlich, sondern auch seelisch. Müdigkeit kann bedeuten: Du machst zu viel, was du nicht willst, und zu wenig, was du willst. Wenn du auf deinen Körper hörst, dann musst du nicht gleich alles ändern. Du musst nur fragen: Was will mir mein Körper gerade sagen? Wenn du Kopfschmerzen hast, dann frag dich: Was überfordert mich gerade? Wenn du Bauchschmerzen hast, dann frag dich: Wovor habe ich gerade Angst? Wenn du müde bist, dann frag dich: Was raubt mir gerade Energie? Das sind keine medizinischen Diagnosen, das sind Fragen, die dir helfen, dich selbst zu verstehen. Und wenn du sie dir stellst, dann wirst du merken, dass dein Körper oft schon weiß, was du brauchst, bevor dein Kopf es weiß. Ein Beispiel, das zeigt, wie der Körper spricht: Anna hatte immer Kopfschmerzen, wenn sie am Sonntagabend daran gedacht hat, dass am Montag wieder die Arbeit anfängt. Sie hat gedacht, das sei normal, weil niemand gerne montags arbeitet. In Wahrheit war es ein Signal, dass sie bei der Arbeit überfordert war und dass sie etwas ändern musste. Als sie angefangen hat, bei der Arbeit Nein zu sagen, sind ihre Kopfschmerzen weniger geworden. Sie hat nicht weniger gearbeitet, aber sie hat anders gearbeitet. Sie hat Pausen gemacht, sie hat Nein gesagt, wenn sie Nein meinte, und sie hat sich nicht mehr für alles verantwortlich gefühlt. Ihre Kopfschmerzen sind nicht komplett weg, aber sie sind viel weniger geworden. Das hat ihr gezeigt, dass ihr Körper schon lange mit ihr gesprochen hat, aber sie hat nicht hingehört. Heute hört sie hin. Wenn sie Kopfschmerzen hat, dann fragt sie sich: Was überfordert mich gerade? Wenn sie Bauchschmerzen hat, dann fragt sie sich: Wovor habe ich gerade Angst? Wenn sie müde ist, dann fragt sie sich: Was raubt mir gerade Energie? Das sind keine medizinischen Diagnosen, das sind Fragen, die ihr helfen, sich selbst zu verstehen. Und oft weiß ihr Körper schon, was sie braucht, bevor ihr Kopf es weiß. Ein weiterer Punkt zum Körper ist, dass man nicht nur auf Schmerzen hören sollte, sondern auch auf Müdigkeit, auf Hunger, auf Durst, auf das Bedürfnis nach Ruhe. Anna hat lange ignoriert, wenn sie müde war. Sie hat gesagt: Ich muss noch weitermachen, ich kann jetzt nicht schlafen. Sie hat ignoriert, wenn sie Hunger hatte. Sie hat gesagt: Ich esse später, ich muss erst noch das und das machen. Sie hat ignoriert, wenn sie Durst hatte. Sie hat gesagt: Ich trinke später, ich muss erst noch das und das machen. Das ist kein Zeichen von Stärke, sondern von Ignoranz gegenüber dem eigenen Körper. Der Körper ist kein Feind, den man besiegen muss, sondern ein Freund, der einem sagt, was man braucht. Wenn du müde bist, dann brauchst du Schlaf. Wenn du hungrig bist, dann brauchst du Essen. Wenn du durstig bist, dann brauchst du Wasser. Wenn du traurig bist, dann brauchst du Trost. Wenn du wütend bist, dann brauchst du eine Grenze. Das sind keine Schwächen, das sind Bedürfnisse. Und Bedürfnisse sind normal. Anna hat gelernt, auf ihre Bedürfnisse zu hören, ohne sich dafür zu schämen. Sie trinkt, wenn sie durstig ist, sie isst, wenn sie hungrig ist, sie schläft, wenn sie müde ist, sie weint, wenn sie traurig ist. Das ist kein Luxus, das ist Selbstfürsorge. Und Selbstfürsorge ist die Grundlage dafür, dass man überhaupt für andere da sein kann. Dein Körper ist dein bester Freund, wenn du ihm zuhörst. Er sagt dir, wenn du müde bist, wenn du hungrig bist, wenn du durstig bist, wenn du traurig bist, wenn du wütend bist. Wenn du ihm nicht zuhörst, dann wird er lauter, bis du nicht mehr weghören kannst. Hör ihm zu, wenn er noch leise spricht, dann musst du nicht warten, bis er schreit. Das ist Selbstfürsorge, und Selbstfürsorge ist die Grundlage für alles andere.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Selbstbewusstsein - nicht laut, sondern sicher", "Viele Menschen denken, Selbstbewusstsein heißt, laut zu sein, immer zu wissen, was man will, und nie Angst zu haben. Das stimmt nicht. Selbstbewusstsein heißt, sich selbst zu kennen und sich selbst zu vertrauen. Anna ist nicht laut geworden, als sie angefangen hat, sich selbst zu verstehen. Sie ist leiser geworden, aber sicherer. Sie weiß jetzt, was sie will und was sie nicht will. Sie weiß, dass sie Nein sagen kann, ohne dass die Welt untergeht. Sie weiß, dass sie Fehler machen kann, ohne dass sie ein schlechter Mensch ist. Sie weiß, dass sie Gefühle haben kann, ohne dass sie sie unterdrücken muss. Das ist Selbstbewusstsein. Es ist nicht laut, es ist sicher. Wie wirst du selbstbewusster? Nicht, indem du dich verstellst und so tust, als wärst du selbstbewusst. Sondern indem du kleine Dinge tust, die dir zeigen, dass du dich auf dich selbst verlassen kannst. Zum Beispiel: Sag einmal am Tag Nein, wenn du Nein meinst. Sag einmal am Tag, was du wirklich willst, ohne dich zu entschuldigen. Mach einmal am Tag etwas nur für dich, ohne dich dafür zu rechtfertigen. Das sind kleine Schritte, aber sie zeigen dir, dass du dich selbst ernst nimmst. Und wenn du dich selbst ernst nimmst, dann nehmen dich auch andere ernst. Selbstbewusstsein ist kein Talent, das man hat oder nicht hat. Es ist ein Muskel, den man trainieren kann, jeden Tag, mit kleinen Schritten. Ein Beispiel, das zeigt, wie man selbstbewusster wird, ohne laut zu werden: Anna hat in einer Besprechung einmal gesagt: Ich bin anderer Meinung. Das war schwer, weil sie Angst hatte, dass alle sie auslachen. Aber niemand hat gelacht. Alle haben zugehört, weil sie es ruhig und klar gesagt hat, ohne zu schreien, ohne zu weinen. Sie hat gesagt: Ich verstehe euren Punkt, aber ich sehe es anders, weil ich die Erfahrung gemacht habe, dass das so nicht funktioniert. Das war kein Angriff, das war eine Meinung. Und ihre Meinung wurde ernst genommen, weil sie sie ernst genommen hat. Das hat ihr gezeigt, dass Selbstbewusstsein nicht laut ist, sondern sicher. Man muss nicht schreien, um gehört zu werden. Man muss nur klar sagen, was man denkt, ohne sich dafür zu entschuldigen. Anna hat auch gelernt, dass man nicht immer eine Meinung haben muss. Manchmal ist es auch selbstbewusst zu sagen: Ich weiß es nicht, ich muss darüber nachdenken. Das ist kein Zeichen von Schwäche, sondern von Stärke, weil man ehrlich ist. Und Ehrlichkeit ist selbstbewusster als so zu tun, als wüsste man alles. Ein weiterer Punkt zu Selbstbewusstsein ist, dass man es nicht durch positive Affirmationen bekommt, indem man sich jeden Morgen sagt: Ich bin toll, ich bin stark, ich bin selbstbewusst. Das funktioniert nicht, weil man es selbst nicht glaubt, wenn man es sagt. Selbstbewusstsein bekommt man durch Taten, nicht durch Worte. Wenn du einmal Nein gesagt hast, obwohl du Angst hattest, dann hast du bewiesen, dass du es kannst. Wenn du einmal deine Meinung gesagt hast, obwohl du Angst hattest, dann hast du bewiesen, dass du es kannst. Wenn du einmal etwas für dich selbst getan hast, obwohl du dich dafür geschämt hast, dann hast du bewiesen, dass du es kannst. Das sind Taten, die Selbstbewusstsein aufbauen, weil sie dir zeigen, dass du dich auf dich selbst verlassen kannst. Anna hat das gemerkt, als sie das erste Mal Nein gesagt hat und die Welt nicht untergegangen ist. Sie hat gemerkt, dass sie es kann. Und beim zweiten Mal war es schon leichter. Beim dritten Mal war es schon fast normal. Das ist der Weg zu Selbstbewusstsein: Nicht durch Worte, sondern durch Taten. Kleine Taten, jeden Tag, die dir zeigen, dass du dich selbst ernst nimmst. Und wenn du dich selbst ernst nimmst, dann nehmen dich auch andere ernst. Selbstbewusstsein ist nicht etwas, das man hat oder nicht hat. Es ist etwas, das man jeden Tag aufbaut, mit kleinen Taten, die einem zeigen, dass man sich auf sich selbst verlassen kann. Jede kleine Tat, die du für dich selbst tust, macht dich ein bisschen selbstbewusster. Und nach einer Weile merkst du, dass du dich selbst ernst nimmst, und dass dich auch andere ernst nehmen. Das ist der Weg zu Selbstbewusstsein: Nicht durch Worte, sondern durch Taten.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Vergleichen - warum du dich immer schlechter fühlst als andere", "Anna hat sich immer mit anderen verglichen. Sie hat auf Social Media gesehen, dass andere Frauen glücklicher waren, schöner waren, erfolgreicher waren, mehr Freunde hatten, mehr Geld hatten. Sie hat sich gedacht: Warum bin ich nicht so? Warum habe ich das nicht? Das hat sie immer unglücklicher gemacht. Denn Vergleichen funktioniert nie fair. Du vergleichst dein Inneres, das du kennst, mit dem Äußeren von anderen, das du siehst. Du siehst, dass andere lachen, aber du siehst nicht, dass sie zu Hause weinen. Du siehst, dass andere erfolgreich sind, aber du siehst nicht, wie viele Fehler sie gemacht haben. Du siehst, dass andere glücklich sind, aber du siehst nicht, wie viel sie dafür gekämpft haben. Vergleichen ist wie ein Spiel, das man nicht gewinnen kann, weil man immer nur die besten Seiten von anderen sieht und die schlechtesten Seiten von sich selbst. Wie hörst du auf, dich zu vergleichen? Erstens: Weniger Social Media. Wenn du merkst, dass du dich nach Social Media schlechter fühlst als vorher, dann leg es weg. Zweitens: Vergleiche dich mit dir selbst, nicht mit anderen. Frag dich: Bin ich heute besser als gestern? Habe ich heute einmal Nein gesagt, als ich Nein meinte? Habe ich heute einmal etwas für mich getan? Das sind Vergleiche, die dich weiterbringen, weil sie dich mit dir selbst vergleichen, nicht mit anderen. Drittens: Erinnere dich daran, dass jeder Mensch seine eigenen Kämpfe hat, die du nicht siehst. Du bist nicht allein mit deinen Problemen. Alle haben Probleme, nur zeigen sie sie nicht auf Social Media. Ein Beispiel, das zeigt, wie Vergleichen schadet: Anna hat eine Kollegin, die immer perfekt aussieht, immer gute Laune hat, immer alles im Griff hat. Anna hat sich mit ihr verglichen und gedacht: Warum bin ich nicht so? Warum habe ich das nicht? Dann hat sie mit der Kollegin gesprochen und erfahren, dass die Kollegin gerade eine Trennung hinter sich hat, dass sie nachts nicht schlafen kann, und dass sie sich jeden Morgen schminkt, damit niemand merkt, wie schlecht es ihr geht. Anna war schockiert, weil sie dachte, die Kollegin hätte ein perfektes Leben. In Wahrheit hatte sie nur eine perfekte Fassade. Das hat Anna gezeigt, dass man nie weiß, was hinter der Fassade von anderen steckt. Jeder hat seine Kämpfe, die man nicht sieht. Vergleichen ist unfair, weil man immer nur die Fassade von anderen sieht und das Innere von sich selbst. Wenn man das versteht, dann hört man auf, sich zu vergleichen, weil man weiß, dass man nicht die ganze Wahrheit sieht. Anna vergleicht sich heute nicht mehr mit anderen, sondern mit sich selbst. Sie fragt sich: Bin ich heute besser als gestern? Habe ich heute einmal Nein gesagt, als ich Nein meinte? Das sind Vergleiche, die sie weiterbringen. Ein weiterer Punkt zu Vergleichen ist, dass man sich nicht nur mit anderen vergleicht, sondern auch mit einem Bild, das man von sich selbst hat. Anna hat sich nicht nur mit anderen Frauen verglichen, sondern auch mit dem Bild, das sie von sich selbst hatte, als sie 20 war. Sie hat gedacht: Früher war ich schlanker, früher war ich schöner, früher war ich glücklicher. Das ist kein fairer Vergleich, weil man sich mit einem Menschen vergleicht, der man einmal war, aber nicht mehr ist. Man verändert sich. Der Körper verändert sich, das Leben verändert sich, die Prioritäten verändern sich. Wenn man sich mit seinem 20-jährigen Ich vergleicht, dann wird man immer verlieren, weil man nicht mehr 20 ist. Und das ist in Ordnung. Man muss nicht mehr 20 sein, um glücklich zu sein. Man kann auch mit 34 glücklich sein, auch wenn man nicht mehr so aussieht wie mit 20. Anna hat das gelernt, als sie alte Fotos angeschaut hat und gemerkt hat, dass sie damals auch nicht glücklich war, obwohl sie schlanker war. Sie war damals auch unsicher, auch ängstlich, auch überfordert. Das hat ihr gezeigt, dass Glück nicht vom Aussehen abhängt, sondern davon, wie man mit sich selbst umgeht. Und heute geht sie besser mit sich selbst um als mit 20. Das ist ein Fortschritt, kein Rückschritt. Vergleichen ist wie ein Spiel, das man nicht gewinnen kann, weil man immer nur die besten Seiten von anderen sieht und die schlechtesten Seiten von sich selbst. Wenn du aufhörst, dich zu vergleichen, dann wirst du ruhiger, weil du nicht mehr versuchst, jemand zu sein, der du nicht bist. Du kannst dann du selbst sein, mit deinen Stärken und deinen Schwächen, und das ist gut genug. Du musst nicht perfekt sein, um geliebt zu werden. Du musst nur du selbst sein.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Vergebung - dir selbst und anderen", "Anna hat lange mit sich selbst gehadert, weil sie immer Ja gesagt hat. Sie hat sich Vorwürfe gemacht: Warum hast du das nicht früher gemerkt? Warum hast du dich so verhalten? Warum warst du so schwach? Diese Vorwürfe haben ihr nicht geholfen. Sie haben sie nur kleiner gemacht. Vergebung heißt nicht, dass man sagt, alles war gut. Vergebung heißt, dass man sagt: Ich habe das Beste getan, was ich damals konnte, mit dem, was ich damals wusste. Und jetzt weiß ich mehr, und jetzt mache ich es anders. Anna hat sich selbst vergeben, dass sie jahrelang Ja gesagt hat, obwohl sie Nein meinte. Sie hat verstanden, dass sie das getan hat, weil sie geliebt werden wollte. Das ist kein Fehler, das ist menschlich. Sie hat auch ihren Eltern vergeben, dass sie ihr beigebracht haben, immer Ja zu sagen. Sie haben es nicht böse gemeint. Sie wollten, dass sie ein nettes Kind ist. Und sie hat ihrem Freund vergeben, dass er nicht gemerkt hat, dass sie eigentlich Nein meinte. Er konnte es nicht wissen, weil sie es ihm nicht gesagt hat. Vergebung ist kein Geschenk an andere, es ist ein Geschenk an dich selbst. Denn wenn du nicht vergibst, dann trägst du die Wut immer weiter mit dir herum, und sie macht dich müde. Wenn du vergibst, dann legst du die Last ab, und du hast wieder Energie für das, was vor dir liegt. Das heißt nicht, dass du alles vergessen musst. Es heißt, dass du aufhörst, dich selbst dafür zu bestrafen, was du damals nicht besser wusstest. Ein Beispiel, das zeigt, wie Vergebung funktioniert: Anna hat sich lange Vorwürfe gemacht, weil sie ihrem Freund einmal in einem Streit gesagt hat, dass er egoistisch sei. Sie hat sich dafür geschämt und hat sich immer wieder daran erinnert. Sie hat gedacht, sie sei eine schlechte Freundin, weil sie das gesagt hat. Dann hat sie mit ihrem Freund darüber gesprochen und gesagt: Es tut mir leid, dass ich das gesagt habe. Ich war wütend und ich habe übertrieben. Ihr Freund hat gesagt: Das ist okay, ich habe auch schon Dinge gesagt, die ich nicht so gemeint habe. Das war eine Erleichterung für Anna, weil sie gemerkt hat, dass Vergebung nicht bedeutet, dass man alles vergisst, sondern dass man darüber spricht und es dann loslässt. Sie hat sich selbst vergeben, dass sie das gesagt hat, weil sie damals wütend war und nicht besser wusste, wie sie mit ihrer Wut umgehen soll. Heute weiß sie es besser. Und sie hat ihrem Freund vergeben, dass er manchmal nicht merkt, wenn es ihr schlecht geht. Er kann es nicht wissen, wenn sie es ihm nicht sagt. Vergebung ist kein Geschenk an andere, es ist ein Geschenk an dich selbst, weil du die Last ablegst und wieder frei bist für das, was vor dir liegt. Ein weiterer Punkt zu Vergebung ist, dass man auch anderen vergeben muss, die einen verletzt haben, nicht weil sie es verdient haben, sondern weil man selbst frei sein will. Anna hat einer Freundin vergeben, die sie einmal belogen hat. Sie hat ihr nicht vergeben, weil die Freundin es verdient hätte, sondern weil sie selbst nicht mehr wütend sein wollte. Sie hat gemerkt, dass Wut sie nur müde macht und dass sie die Wut loslassen muss, um wieder frei zu sein. Das heißt nicht, dass sie der Freundin wieder vertraut. Vertrauen muss man sich verdienen. Vergebung heißt nicht, dass man alles vergisst und so tut, als wäre nichts passiert. Vergebung heißt, dass man aufhört, sich selbst mit der Wut zu bestrafen. Anna hat der Freundin gesagt: Ich vergebe dir, aber ich vertraue dir nicht mehr so wie früher. Das ist ehrlich. Und es hat ihr geholfen, weil sie die Last abgelegt hat, ohne so zu tun, als wäre nichts passiert. Vergebung ist kein Geschenk an andere, es ist ein Geschenk an dich selbst, weil du dadurch frei wirst von der Wut, die dich sonst immer weiter begleitet. Vergebung ist kein einmaliges Ereignis, sondern ein Prozess, der Zeit braucht. Manchmal vergibt man jemandem, und dann wird man wieder wütend, weil man sich daran erinnert, was passiert ist. Das ist normal. Vergebung heißt nicht, dass man nie wieder wütend wird. Vergebung heißt, dass man die Wut loslässt, wenn sie kommt, und dass man sich selbst nicht mehr dafür bestraft, was damals passiert ist. Das ist ein Prozess, der ein Leben lang dauert, aber er macht einen frei.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Dein Plan für die nächsten 30 Tage - dich selbst wirklich kennenlernen", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein verändert nichts. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Schreibe jeden Abend auf, wann du Ja gesagt hast, obwohl du Nein meintest. Nur aufschreiben, nichts ändern. Woche 2: Sag einmal am Tag Nein, wenn du Nein meinst. Nur einmal. Nicht öfter. Woche 3: Mach jeden Tag 10 Minuten etwas nur für dich, ohne dich dafür zu entschuldigen. Ein Spaziergang, ein Buch, ein Bad, was du willst. Woche 4: Sprich mit einer Person, der du vertraust, darüber, wie es dir wirklich geht. Nicht: Mir geht es gut, sondern: Mir geht es so und so, und das ist der Grund. Nach 30 Tagen wirst du merken, dass du dich besser kennst. Nicht perfekt, aber besser. Anna hat nach 30 Tagen gemerkt, dass sie nicht mehr jedes Mal Ja sagte. Sie sagte manchmal Nein, und die Welt ist nicht untergegangen. Sie hat gemerkt, dass sie wieder Zeit für sich selbst hatte, und dass sie wieder lachen konnte, weil sie nicht mehr so müde war. Das ist kein Wunder, das ist Selbstkenntnis. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du das letzte Mal Ja gesagt hast, obwohl du Nein meintest. Und frag dich: Was hätte ich eigentlich sagen wollen? Das ist der erste Schritt, um dich selbst wirklich zu verstehen. Ein Beispiel, das zeigt, wie der 30-Tage-Plan funktioniert: Anna hat in der ersten Woche nur aufgeschrieben, wann sie Ja gesagt hat, obwohl sie Nein meinte. Sie hat gemerkt, dass sie 12 Mal in einer Woche Ja gesagt hat, obwohl sie Nein meinte. Das war viel mehr, als sie gedacht hatte. In der zweiten Woche hat sie einmal am Tag Nein gesagt. Das war schwer, aber sie hat es geschafft. In der dritten Woche hat sie jeden Tag 10 Minuten etwas nur für sich getan. Sie ist spazieren gegangen, sie hat ein Buch gelesen, sie hat ein Bad genommen. Das hat ihr gut getan, weil sie gemerkt hat, dass sie auch wichtig ist. In der vierten Woche hat sie mit ihrer besten Freundin darüber gesprochen, wie es ihr wirklich geht. Sie hat gesagt: Mir geht es nicht so gut, wie ich immer sage. Ich bin oft müde, weil ich immer Ja sage. Ihre Freundin hat gesagt: Das habe ich schon gemerkt, aber ich wollte dich nicht darauf ansprechen. Das war eine Erleichterung für Anna, weil sie gemerkt hat, dass sie nicht allein ist. Nach 30 Tagen hat sie gemerkt, dass sie sich besser kennt. Sie weiß jetzt, wann sie Ja sagt, obwohl sie Nein meint, und sie weiß, warum sie das tut. Und sie weiß, dass sie es ändern kann, Schritt für Schritt, Tag für Tag. Ein weiterer Punkt zum 30-Tage-Plan ist, dass man nach 30 Tagen nicht fertig ist. Selbstkenntnis ist kein Projekt, das man nach 30 Tagen abschließt und dann nie wieder darüber nachdenkt. Selbstkenntnis ist ein Prozess, der ein Leben lang dauert. Man lernt jeden Tag etwas Neues über sich selbst, weil man jeden Tag neue Situationen erlebt. Anna hat nach 30 Tagen gemerkt, dass sie sich besser kennt, aber sie hat auch gemerkt, dass sie noch viel zu lernen hat. Sie hat zum Beispiel gemerkt, dass sie in manchen Situationen immer noch Ja sagt, obwohl sie Nein meint, besonders wenn es um ihre Mutter geht. Das ist in Ordnung. Sie muss nicht perfekt sein. Sie muss nur dranbleiben, Tag für Tag, Schritt für Schritt. Und sie muss sich selbst vergeben, wenn sie einmal wieder in alte Muster zurückfällt. Denn Rückfälle sind normal. Wichtig ist, dass man nach einem Rückfall wieder aufsteht und weitermacht. Das ist der Unterschied zwischen Menschen, die sich selbst kennenlernen, und Menschen, die aufgeben. Die einen machen weiter, auch wenn es schwer ist. Die anderen geben auf, wenn es schwer wird. Anna macht weiter. Und das ist schon ein großer Erfolg. Nach 30 Tagen bist du nicht fertig, aber du hast angefangen. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann hast du schon mehr geschafft als die meisten Menschen, die nur darüber nachdenken, aber nie anfangen. Bleib dran, Tag für Tag, Schritt für Schritt. Und wenn du einmal zurückfällst, dann steh wieder auf und mach weiter. Das ist der Weg, um dich selbst wirklich kennenzulernen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."]], "kat": "Sachbücher", "unter": "Psychologie"}, {"title": "Der erste ETF - Ohne Fachchinesisch", "chapters": [["Der Mann, der 20 Jahre lang sein Geld auf dem Sparbuch liegen ließ", "Michael ist 45, arbeitet in Bielefeld als Lagerarbeiter, und er hat ein Problem, das er lange nicht gesehen hat. Er hat 20 Jahre lang jeden Monat 150 Euro auf sein Sparbuch gelegt. Das sind 36.000 Euro, die er eingezahlt hat. Als er vor einem Jahr auf sein Sparbuch geschaut hat, waren da 37.200 Euro drauf. Er hat 20 Jahre gespart und dafür 1.200 Euro Zinsen bekommen. In der gleichen Zeit ist alles teurer geworden. Ein Brot, das vor 20 Jahren 1,20 Euro gekostet hat, kostet heute 3,50 Euro. Eine Wohnung, die vor 20 Jahren 500 Euro Miete gekostet hat, kostet heute 900 Euro. Sein Geld ist also nicht mehr geworden, es ist weniger geworden, weil es weniger wert ist. Michael hat das nicht verstanden, bis sein Sohn ihn gefragt hat: Papa, warum liegt dein Geld auf dem Sparbuch, wenn es da nur 0,1 Prozent Zinsen gibt? Michael hatte keine Antwort. Er hatte das Sparbuch, weil seine Eltern auch ein Sparbuch hatten. Er dachte, Sparen heißt, Geld aufs Sparbuch zu legen. Niemand hatte ihm erzählt, dass es einen Unterschied gibt zwischen Sparen und Investieren. Sparen heißt, Geld zur Seite zu legen, damit es nicht weg ist. Investieren heißt, Geld so anzulegen, dass es mehr wird, weil es für dich arbeitet. Michael hat 20 Jahre lang gespart, aber er hat nie investiert. In diesem Buch gehen wir genau das durch: Was ein ETF ist, warum er für normale Menschen wie Michael besser ist als ein Sparbuch, und wie du deinen ersten ETF kaufst, ohne dass du BWL studiert haben musst. Ohne Fachchinesisch. Versprochen. Was Michael danach noch gelernt hat, war, dass Sparen allein nicht reicht, wenn man nicht investiert. Er hat 20 Jahre lang gespart, aber er hat in der Zeit nicht gemerkt, dass sein Geld weniger wert wird. Er hat gedacht, er tut etwas Gutes, weil er jeden Monat Geld zur Seite legt. In Wahrheit hat er Geld verloren, weil er es nicht investiert hat. Das ist kein Vorwurf an Michael. Niemand hat es ihm erzählt. In der Schule lernt man nicht, was Inflation ist. Man lernt, dass man sparen soll. Aber man lernt nicht, dass Sparen auf dem Sparbuch bei Inflation schlecht ist. Michael hat das erst verstanden, als sein Sohn ihn gefragt hat, warum sein Geld auf dem Sparbuch liegt. Das war ein Moment, in dem Michael gemerkt hat, dass er etwas ändern muss. Er hat nicht gewartet, bis er alles verstanden hat. Er hat angefangen, mit 50 Euro im Monat, und hat dabei gelernt. Das ist der Weg: Nicht warten, bis man alles weiß, sondern anfangen und dabei lernen. Denn wer wartet, bis er alles weiß, der wartet ewig. Michael hat angefangen, und er hat gelernt, dass Investieren nicht kompliziert ist, wenn man es einfach erklärt bekommt. Und genau das ist dieses Buch: Einfach erklärt, ohne Fachchinesisch, damit jeder es versteht, auch wenn er nie BWL studiert hat. Ein weiterer Punkt, den Michael gelernt hat, ist, dass man nicht alles auf einmal verstehen muss. Er hat am Anfang nicht verstanden, was ein ETF ist, was Inflation ist, was Zinseszins ist. Er hat einfach angefangen, mit 50 Euro, und hat dabei gelernt. Nach einem Jahr hat er verstanden, was ein ETF ist. Nach zwei Jahren hat er verstanden, was Inflation ist. Nach drei Jahren hat er verstanden, was Zinseszins ist. Das ist der Weg: Nicht warten, bis man alles versteht, sondern anfangen und dabei lernen. Denn wer wartet, bis er alles versteht, der wartet ewig. Michael hat angefangen, und er hat gelernt, dass Investieren nicht kompliziert ist, wenn man es einfach erklärt bekommt. Und genau das ist dieses Buch: Einfach erklärt, ohne Fachchinesisch, damit jeder es versteht, auch wenn er nie BWL studiert hat. Und wenn du dieses Buch gelesen hast, dann verstehst du mehr als 80 Prozent der Menschen in Deutschland, die ihr Geld nur auf dem Sparbuch liegen lassen. Was Michael am Ende am meisten geholfen hat, war nicht ein einzelner Trick, sondern die Erkenntnis, dass er nicht dumm ist, weil er nichts über ETFs wusste. Er wusste nur nichts darüber, weil es ihm niemand erzählt hat. Jetzt weiß er es, und er hat angefangen. Und das ist der Punkt: Du bist nicht dumm, wenn du nichts über ETFs weißt. Du hast es nur noch nicht gelernt. Jetzt hast du es gelernt, und du kannst anfangen. Fang heute an, mit 25 Euro, mit einem Depot, mit einem Sparplan. In 30 Tagen wirst du dich wundern, was sich verändert hat.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Was ein ETF überhaupt ist - erklärt wie für einen Freund", "Ein ETF ist ein Korb. Stell dir vor, du gehst auf den Markt und kaufst nicht nur einen Apfel, sondern einen ganzen Korb mit 500 verschiedenen Obstsorten. Wenn eine Sorte schlecht ist, dann ist das nicht schlimm, weil du noch 499 andere hast. Genau so ist ein ETF. ETF heißt Exchange Traded Fund, auf Deutsch: Ein Fonds, der an der Börse gehandelt wird. Aber das musst du dir nicht merken. Merk dir nur: Ein ETF ist ein Korb mit vielen Firmen drin. Zum Beispiel gibt es einen ETF, in dem die 500 größten Firmen aus Amerika drin sind: Apple, Microsoft, Amazon, Google, und 496 andere. Wenn du einen Anteil von diesem ETF kaufst, dann kaufst du ein kleines Stück von allen 500 Firmen auf einmal. Du musst dich nicht entscheiden, ob du Apple oder Microsoft kaufen sollst. Du kaufst einfach alle. Das ist der Vorteil: Du musst dich nicht auskennen. Du musst nicht wissen, welche Firma morgen gut läuft und welche nicht. Du kaufst einfach den ganzen Markt. Und der ganze Markt ist über lange Zeit fast immer gestiegen. Nicht jedes Jahr, aber über 10, 20, 30 Jahre ist er immer gestiegen. Das ist kein Versprechen, das ist Geschichte. Wer vor 20 Jahren 100 Euro in einen ETF auf die 500 größten amerikanischen Firmen gesteckt hat, der hat heute etwa 600 Euro. Wer 100 Euro aufs Sparbuch gelegt hat, der hat heute etwa 105 Euro. Der Unterschied ist riesig. Und der Grund ist: Firmen verdienen Geld, sie wachsen, sie werden mehr wert. Ein Sparbuch verdient kein Geld, es liegt nur da. Ein Beispiel, das zeigt, wie ein ETF funktioniert: Stell dir vor, du kaufst einen MSCI World ETF für 100 Euro. Du bekommst dafür ein kleines Stück von 1.500 Firmen. Wenn eine Firma, zum Beispiel ein Autohersteller, pleite geht, dann verlierst du nicht dein ganzes Geld, weil du noch 1.499 andere Firmen hast. Wenn eine andere Firma, zum Beispiel ein Handyhersteller, sehr gut läuft, dann profitierst du davon, weil du auch ein Stück von dieser Firma hast. Das ist der Vorteil von einem ETF: Du musst dich nicht entscheiden, welche Firma gut läuft. Du kaufst einfach alle. Ein zweites Beispiel: Wenn du eine einzelne Aktie kaufst, zum Beispiel von einem Autohersteller, und der Autohersteller macht einen Fehler, dann fällt die Aktie um 30 Prozent und du verlierst 30 Prozent. Wenn du einen ETF kaufst, in dem der Autohersteller nur 1 Prozent ausmacht, dann verlierst du nur 0,3 Prozent, wenn der Autohersteller um 30 Prozent fällt. Das ist der Unterschied zwischen Einzelaktie und ETF. Der ETF ist sicherer, weil er breiter ist. Und er ist einfacher, weil du dich nicht entscheiden musst. Du kaufst einfach den ganzen Markt. Und der ganze Markt ist über lange Zeit fast immer gestiegen. Das ist kein Versprechen, das ist Geschichte. Ein weiterer Punkt zu ETFs ist, dass man nicht nur auf den Preis schauen sollte, sondern auch auf die Kosten. Ein ETF kostet Geld, weil die Firma, die den ETF verwaltet, dafür bezahlt werden will. Aber die Kosten sind sehr niedrig. Ein MSCI World ETF kostet 0,2 Prozent im Jahr. Das heißt, wenn du 10.000 Euro in einen ETF steckst, dann zahlst du 20 Euro im Jahr an Kosten. Das ist weniger, als du für einen Kaffee im Monat ausgibst. Es gibt auch ETFs, die 0,07 Prozent kosten, also 7 Euro im Jahr bei 10.000 Euro. Das ist noch weniger. Und es gibt ETFs, die 0,5 Prozent kosten, also 50 Euro im Jahr. Das ist immer noch wenig, aber es ist mehr als nötig. Deshalb solltest du einen ETF mit niedrigen Kosten nehmen, unter 0,2 Prozent. Michael hat einen ETF mit 0,14 Prozent Kosten genommen. Das ist gut. Er zahlt bei 4.400 Euro Depot nur 6 Euro im Jahr an Kosten. Das ist weniger, als er für einen Döner ausgibt. Und das ist der Grund, warum ETFs so gut sind: Sie sind billig, sie sind breit, sie sind einfach. Du brauchst keinen teuren Berater, der dir sagt, was du kaufen sollst. Du brauchst nur einen ETF mit niedrigen Kosten, und du lässt ihn liegen. Ein ETF ist kein Zauber, sondern ein Korb mit vielen Firmen drin. Wenn du das verstanden hast, dann hast du schon mehr verstanden als die meisten Menschen. Du musst nicht wissen, welche Firma morgen gut läuft. Du kaufst einfach alle. Und über lange Zeit steigt der ganze Markt fast immer. Das ist kein Versprechen, das ist Geschichte. Und Geschichte wiederholt sich nicht immer, aber sie gibt dir eine Richtung, in die es geht, wenn du lange genug dabei bleibst.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Warum dein Sparbuch dich arm macht - die Inflation einfach erklärt", "Inflation heißt: Alles wird teurer. Wenn ein Brot vor einem Jahr 3 Euro gekostet hat und heute 3,20 Euro, dann ist das Inflation von etwa 6 Prozent. Dein Sparbuch gibt dir 0,1 Prozent Zinsen. Das heißt, dein Geld wird jedes Jahr 6 Prozent weniger wert, aber du bekommst nur 0,1 Prozent dazu. Du verlierst also jedes Jahr 5,9 Prozent. Das ist, als würdest du ein Eis in der Sonne liegen lassen. Es schmilzt, auch wenn du es nicht anfasst. Michael hat das 20 Jahre lang nicht gemerkt, weil die Zahl auf seinem Sparbuch immer größer geworden ist. 36.000 Euro eingezahlt, 37.200 Euro drauf. Die Zahl ist größer geworden. Aber was er mit dem Geld kaufen kann, ist weniger geworden. Vor 20 Jahren konnte er mit 36.000 Euro ein kleines Auto kaufen. Heute kann er mit 37.200 Euro kein kleines Auto mehr kaufen, weil ein kleines Auto heute 22.000 Euro kostet, aber er braucht auch noch Geld für Miete, für Essen, für alles andere. Das ist der Trick der Inflation: Sie macht die Zahl größer, aber den Wert kleiner. Viele Menschen denken, sie sparen, wenn sie Geld aufs Sparbuch legen. In Wahrheit verlieren sie Geld, langsam, aber sicher. Das ist kein Fehler von Michael. Niemand hat es ihm erzählt. In der Schule lernt man nicht, was Inflation ist. Man lernt, dass Sparen gut ist. Aber man lernt nicht, dass Sparen auf dem Sparbuch bei Inflation schlecht ist. Deshalb ist dieses Kapitel so wichtig: Wenn du verstehst, was Inflation ist, dann verstehst du, warum du investieren musst, nicht nur sparen. Ein Beispiel, das zeigt, wie Inflation wirklich funktioniert: Vor 10 Jahren hat ein Döner 3,50 Euro gekostet. Heute kostet ein Döner 7,50 Euro. Das ist mehr als doppelt so viel. Wenn du vor 10 Jahren 3,50 Euro auf dein Sparbuch gelegt hast und heute 3,60 Euro drauf hast, dann kannst du dir heute keinen Döner mehr kaufen, weil ein Döner heute 7,50 Euro kostet. Du hast Geld gespart, aber du kannst dir weniger kaufen als vorher. Das ist Inflation. Sie macht dein Geld weniger wert, auch wenn die Zahl auf deinem Konto größer wird. Viele Menschen merken das nicht, weil sie nur auf die Zahl schauen, nicht auf den Wert. Sie sehen, dass 3,60 mehr ist als 3,50, und sie denken, sie hätten gewonnen. In Wahrheit haben sie verloren, weil sie sich weniger kaufen können. Das ist der Grund, warum Sparen auf dem Sparbuch bei Inflation nicht reicht. Du musst dein Geld so anlegen, dass es schneller wächst als die Inflation. Und das geht nur mit Investieren, nicht mit Sparen auf dem Sparbuch. Denn ein Sparbuch gibt dir 0,1 Prozent Zinsen, aber die Inflation ist 2 bis 3 Prozent im Jahr. Du verlierst also jedes Jahr 2 bis 3 Prozent. Ein ETF gibt dir im Schnitt 7 Prozent im Jahr. Du gewinnst also jedes Jahr 4 bis 5 Prozent nach Inflation. Das ist der Unterschied. Ein weiterer Punkt zu Inflation ist, dass sie nicht nur dein Sparbuch betrifft, sondern auch deine Rente. Wenn du heute 1.000 Euro Rente bekommst und die Inflation 2 Prozent im Jahr ist, dann kannst du dir in 10 Jahren mit 1.000 Euro nur noch so viel kaufen wie heute mit 820 Euro. In 20 Jahren nur noch so viel wie heute mit 670 Euro. Das heißt, deine Rente wird jedes Jahr weniger wert, wenn du sie nicht investierst. Michael hat das verstanden, als er über seine Rente nachgedacht hat. Er hat gemerkt, dass seine Rente allein nicht reichen wird, wenn er in Rente geht. Er muss selbst vorsorgen, indem er in einen ETF investiert. Das ist kein Luxus, das ist Notwendigkeit. Denn der Staat wird dir nicht genug Rente zahlen, um davon gut zu leben. Du musst selbst dafür sorgen, dass du im Alter genug Geld hast. Und das geht nur, wenn du investierst, nicht wenn du nur sparst. Michael hat mit 45 angefangen. Er wird mit 67 in Rente gehen. Er hat also 22 Jahre Zeit, in denen sein Geld wachsen kann. Das ist nicht viel, aber es ist besser als nichts. Und sein Sohn wird mit 20 anfangen, und er wird mit 67 viel mehr Geld haben, weil er 47 Jahre Zeit hat. Das ist der Unterschied zwischen früh anfangen und spät anfangen. Inflation ist wie ein Eis in der Sonne. Es schmilzt, auch wenn du es nicht anfasst. Dein Geld auf dem Sparbuch schmilzt auch, auch wenn du es nicht anfasst, weil alles teurer wird. Wenn du dein Geld nicht investierst, dann wird es weniger wert, Jahr für Jahr, ohne dass du es merkst. Wenn du es investierst, dann wächst es, Jahr für Jahr, auch wenn du es nicht merkst. Das ist der Unterschied zwischen Sparen und Investieren. Sparen schützt dein Geld vor dir selbst. Investieren lässt dein Geld für dich arbeiten.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Die 3 größten Ängste vor der Börse - und warum sie nicht stimmen", "Michael hatte drei Ängste, bevor er seinen ersten ETF gekauft hat. Angst Nummer 1: Ich verliere alles. Er dachte, wenn er Geld in die Börse steckt, dann kann er alles verlieren, wie bei einem Casino. Das stimmt nicht, wenn man einen ETF kauft. Bei einem ETF kaufst du 500 Firmen auf einmal. Damit du alles verlierst, müssten alle 500 Firmen gleichzeitig pleite gehen. Das ist so wahrscheinlich, wie dass morgen alle Autos in Bielefeld gleichzeitig kaputt gehen. Es kann passieren, aber es ist extrem unwahrscheinlich. Und selbst wenn die Börse einmal um 30 Prozent fällt, abei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Der Zinseszins - warum Zeit wichtiger ist als Geld", "Der Zinseszins ist der mächtigste Effekt beim Geld. Er funktioniert so: Du legst 100 Euro an und bekommst 7 Prozent Zinsen im Jahr. Nach einem Jahr hast du 107 Euro. Im zweiten Jahr bekommst du nicht nur Zinsen auf 100 Euro, sondern auf 107 Euro. Du bekommst also 7,49 Euro Zinsen und hast 114,49 Euro. Im dritten Jahr bekommst du Zinsen auf 114,49 Euro, also 8,01 Euro, und hast 122,50 Euro. Das klingt nach wenig, aber über 30 Jahre wird es riesig. Beispiel: Michael legt mit 45 Jahren jeden Monat 100 Euro in einen ETF an, der 7 Prozent im Jahr macht. Mit 65 Jahren, also nach 20 Jahren, hat er 49.000 Euro. Er hat 24.000 Euro eingezahlt, und 25.000 Euro sind Zinsen und Zinseszinsen. Er hat also mehr durch Zinsen bekommen als durch seine eigenen Einzahlungen. Wenn Michael mit 25 Jahren angefangen hätte, also 40 Jahre lang 100 Euro im Monat, dann hätte er mit 65 Jahren 265.000 Euro. Er hätte 48.000 Euro eingezahlt, und 217.000 Euro wären Zinsen. Das ist der Zinseszins. Je länger dein Geld Zeit hat, desto mehr arbeitet es für dich. Deshalb ist Zeit wichtiger als Geld. Wer mit 25 Jahren 50 Euro im Monat anlegt, hat mit 65 mehr als jemand, der mit 45 Jahren 200 Euro im Monat anlegt. Nicht weil er mehr eingezahlt hat, sondern weil sein Geld länger Zeit hatte. Das ist der Grund, warum du nicht warten solltest, bis du viel Geld hast. Fang mit dem an, was du hast, auch wenn es nur 25 Euro sind. Dein Geld braucht Zeit, nicht viel Geld. Ein Beispiel, das zeigt, wie mächtig der Zinseszins ist: Wenn du jeden Monat 100 Euro anlegst und 7 Prozent Zinsen bekommst, dann hast du nach 10 Jahren 17.000 Euro. Du hast 12.000 Euro eingezahlt, und 5.000 Euro sind Zinsen. Nach 20 Jahren hast du 49.000 Euro. Du hast 24.000 Euro eingezahlt, und 25.000 Euro sind Zinsen. Nach 30 Jahren hast du 121.000 Euro. Du hast 36.000 Euro eingezahlt, und 85.000 Euro sind Zinsen. Du siehst: Je länger du dabei bist, desto mehr Geld kommt von den Zinsen und desto weniger von deinen eigenen Einzahlungen. Nach 30 Jahren kommt mehr als doppelt so viel Geld von den Zinsen wie von deinen Einzahlungen. Das ist der Zinseszins. Er arbeitet für dich, wenn du ihm Zeit gibst. Und Zeit ist das Einzige, was du nicht kaufen kannst. Du kannst nicht mit 65 Jahren sagen: Ich hätte gerne noch 20 Jahre Zinseszins. Du musst mit 25 oder 35 oder 45 anfangen, damit dein Geld Zeit hat. Michael hat mit 45 angefangen. Er wird mit 65 nicht reich sein, aber er wird mehr haben, als wenn er nicht angefangen hätte. Und sein Sohn wird mit 20 anfangen, weil er von seinem Vater gelernt hat, wie wichtig Zeit ist. Das ist der größte Gewinn: Dass Michael seinem Sohn beigebracht hat, früh anzufangen. Ein weiterer Punkt zum Zinseszins ist, dass er nicht nur bei ETFs funktioniert, sondern auch bei Schulden, nur andersherum. Wenn du Schulden hast und 14 Prozent Zinsen zahlst, dann arbeitet der Zinseszins gegen dich. Du zahlst nicht nur Zinsen auf deine Schulden, sondern auch Zinsen auf die Zinsen, die du schon gezahlt hast. Das ist, als würdest du einen Schneeball den Berg runterrollen, der immer größer wird. Michael hatte früher Schulden auf seiner Kreditkarte, 2.400 Euro, 14 Prozent Zinsen. Er hat jeden Monat nur die Mindestrate gezahlt und hat gemerkt, dass seine Schulden nicht weniger wurden, weil die Zinsen immer wieder dazukamen. Er hat seine Schulden zuerst abbezahlt, bevor er angefangen hat zu investieren. Das war richtig, weil Schulden mit 14 Prozent Zinsen teurer sind als ein ETF mit 7 Prozent Gewinn. Wenn du Schulden hast, dann bezahl s ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Depot eröffnen - in 15 Minuten, ohne dass dich jemand anruft", "Ein Depot ist ein Konto für deine ETFs. Ohne Depot kannst du keinen ETF kaufen. Michael dachte, ein Depot zu eröffnen sei kompliziert. Er dachte, er müsse zu einer Bank gehen, Formulare ausfüllen, und mit einem Berater sprechen, der ihm etwas verkaufen will. Das stimmt nicht. Du kannst heute ein Depot in 15 Minuten online eröffnen, ohne dass dich jemand anruft. Du brauchst nur deinen Personalausweis und dein Handy. So geht es: Erstens, du suchst dir einen Broker. Das ist eine Firma, bei der du dein Depot eröffnest. Es gibt viele, zum Beispiel Trade Republic, Scalable Capital, ING, DKB. Michael hat Trade Republic genommen, weil es dort keine Gebühren für einen Sparplan gibt. Zweitens, du lädst die App runter und meldest dich an. Du gibst deinen Namen, deine Adresse, deine Steuer-ID ein. Die Steuer-ID steht auf deinem letzten Steuerbescheid. Wenn du sie nicht findest, kannst du sie beim Finanzamt anfordern. Drittens, du machst eine Video-Identifikation. Du hältst deinen Personalausweis in die Kamera und sagst, dass du es bist. Das dauert 5 Minuten. Viertens, du wartest einen Tag, bis dein Depot freigeschaltet ist. Dann kannst du deinen ersten ETF kaufen. Das ist alles. Du musst zu keiner Bank, du musst mit niemandem sprechen, du musst kein Formular per Post schicken. Michael hat sein Depot an einem Sonntagabend eröffnet, während er auf dem Sofa saß. Am Montag war es freigeschaltet. Am Dienstag hat er seinen ersten ETF gekauft. Das war der Anfang. Ein Beispiel, das zeigt, wie einfach Depot eröffnen ist: Michael hat sein Depot an einem Sonntagabend eröffnet, während er auf dem Sofa saß und Fernsehen geschaut hat. Er hat die n machen. Und du musst dir auch keine Sorgen machen, wenn du mit 25 Euro oder 50 Euro anfängst. Dein Geld ist sicher, solange du einen seriösen Broker nimmst, der in Deutschland reguliert ist. Ein Depot zu eröffnen, dauert 15 Minuten. Du brauchst nur deinen Personalausweis und dein Handy. Du musst zu keiner Bank, du musst mit niemandem sprechen, du musst kein Formular per Post schicken. Alles geht online, in deinem Tempo, ohne Druck. Wenn du 15 Minuten Zeit hast, dann hast du genug Zeit, um ein Depot zu eröffnen. Und wenn du ein Depot hast, dann hast du den schwersten Teil schon geschafft. Der Rest ist einfach: Sparplan einrichten, und laufen lassen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Dein erster Sparplan - 25 Euro reichen", "Ein Sparplan heißt: Jeden Monat wird automatisch ein Betrag von deinem Konto abgebucht und in einen ETF gesteckt. Du musst nichts tun. Du musst nicht jeden Monat daran denken. Es passiert automatisch. Michael hat einen Sparplan mit 100 Euro im Monat eingerichtet. Er hat gesagt: Am 1. jeden Monats gehen 100 Euro von meinem Konto in meinen MSCI World ETF. Das war alles. Er musste nicht jeden Monat überlegen, ob er kaufen soll oder nicht. Es passierte automatisch. Das ist der Vorteil von einem Sparplan: Du musst dich nicht entscheiden. Du musst nicht überlegen, ob der Kurs gerade hoch oder niedrig ist. Du kaufst einfach jeden Monat, egal ob der Kurs hoch oder niedrig ist. Wenn der Kurs niedrig ist, dann bekommst du mehr Anteile für dein Geld. Wenn der Kurs hoch ist, dann bekommst du weniger Anteile, aber deine Anteile, die du schon hast, sind mehr wert. Das nennt man Cost-Average-Effekt. Auf Deutsch: Du kaufst im Durchschnitt zu einem guten Preis, weil du manchmal billig und manchmal teuer kaufst. Du musst nicht den perfekten Zeitpunkt finden. Es gibt keinen perfekten Zeitpunkt. Wer versucht, den perfekten Zeitpunkt zu finden, der wartet meistens ewig und kauft nie. Michael hat nicht gewartet. Er hat einfach angefangen, mit 100 Euro im Monat. Du kannst auch mit 25 Euro anfangen. Das ist ein Abendessen weniger im Monat. Oder zwei Mal weniger bestellen. Das ist machbar. Und nach einem Jahr hast du 300 Euro investiert, nach 5 Jahren 1.500 Euro, nach 20 Jahren 6.000 Euro, plus Zinsen. Fang klein an, aber fang an. Ein Beispiel, das zeigt, wie ein Sparplan funktioniert: Michael hat seinen Sparplan am 1. jeden Monats. Am 1. geht sein Lohn ein. Am 1. gehen 100 Euro automatisch in seinen ETF. Er muss nichts tun. Er muss nicht daran denken. Es passiert automatisch. Am 2. schaut er auf sein Konto und sieht, dass 100 Euro weg sind, aber er vermisst sie nicht, weil er sie nie gesehen hat. Sie waren nie auf seinem Girokonto, sie sind direkt in seinen ETF gegangen. Das ist der Trick: Wenn du das Geld nie siehst, dann gibst du es auch nicht aus. Wenn du erst am Ende des Monats schaust, ob noch Geld übrig ist, dann ist nie Geld übrig. Deshalb ist ein Sparplan so gut: Er nimmt das Geld weg, bevor du es ausgeben kannst. Michael hat das gelernt, als er früher versucht hat, am Ende des Monats zu sparen. Am Ende des Monats war nie Geld übrig, weil er es schon für andere Dinge ausgegeben hatte. Seit er einen Sparplan hat, spart er jeden Monat, ohne darüber nachzudenken. Das ist der Unterschied zwischen Sparen, das man sich vornehmen muss, und Sparen, das automatisch passiert. Automatisches Sparen funktioniert, weil man sich nicht jeden in froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Was passiert, wenn die Börse fällt - und warum du dann nicht verkaufen darfst", "Michael hat seinen ersten ETF im Januar gekauft. Im März ist die Börse um 20 Prozent gefallen, weil es eine Krise gab. Sein ETF, der 300 Euro wert war, war plötzlich nur noch 240 Euro wert. Er hat 60 Euro verloren, auf dem Papier. Er war panisch. Er wollte verkaufen, um nicht noch mehr zu verlieren. Sein Sohn hat ihm gesagt: Papa, verkauf nicht. Das ist wie ein Schlussverkauf. Wenn dein ETF billiger wird, dann kannst du mehr Anteile für das gleiche Geld kaufen. Das ist gut, nicht schlecht. Michael hat nicht verkauft. Er hat seinen Sparplan weiterlaufen lassen. Er hat jeden Monat weiter 100 Euro gekauft, auch als der Kurs gefallen ist. Ein Jahr später war sein ETF wieder bei 350 Euro. Er hatte nicht nur das Geld zurück, das er verloren hatte, sondern noch mehr. Weil er in der Zeit, als der Kurs niedrig war, mehr Anteile gekauft hat. Das ist der wichtigste Punkt bei ETFs: Wenn die Börse fällt, dann verkauf nicht. Kauf weiter. Denn die Börse fällt immer wieder. Sie ist 2008 gefallen, 2020 gefallen, 2022 gefallen. Und jedes Mal ist sie wieder gestiegen und hat neue Höchststände erreicht. Wer in der Krise verkauft, der macht den Verlust wirklich. Wer in der Krise weiter kauft, der macht Gewinn, wenn die Börse wieder steigt. Das ist schwer, weil man Angst hat, wenn man sieht, dass sein Geld weniger wird. Aber es ist der Unterschied zwischen Menschen, die mit ETFs Geld verdienen, und Menschen, die mit ETFs Geld verlieren. Die einen verkaufen in der Krise, die anderen kaufen in der Krise. Michael hat gelernt, dass eine fallende Börse kein Grund zur Panik ist, sondern ein Grund zur Freude, weil er dann billiger kaufen kann. Ein Beispiel, das zeigt, warum man nicht verkaufen darf, wenn die Börse fällt: Michael hat einen Freund, der 2020, als Corona kam, seinen ETF verkauft hat, weil er Angst hatte, dass er alles verliert. Er hat 5.000 Euro verkauft, als der Kurs um 30 Prozent gefallen war. Er hat also 1.500 Euro Verlust gemacht. Ein Jahr später war der Kurs wieder höher als vorher. Wenn er nicht verkauft hätte, hätte er 6.000 Euro gehabt. Weil er verkauft hat, hat er nur 3.500 Euro gehabt. Er hat 2.500 Euro verloren, weil er in Panik verkauft hat. Michael hat nicht verkauft. Er hat weiter gekauft, auch als der Kurs gefallen ist. Er hat in der Krise billiger gekauft, und als die Börse wieder gestiegen ist, hatte er mehr Gewinn. Das ist der Unterschied zwischen Panik und Geduld. Panik macht Verlust. Geduld macht Gewinn. Das ist schwer, weil man Angst hat, wenn man sieht, dass sein Geld weniger wird. Aber es ist der wichtigste Punkt bei ETFs: Wenn die Börse fällt, dann verkauf nicht. Kauf weiter. Denn die Börse fällt immer wieder, und sie steigt immer wieder. Wer in der Krise verkauft, der macht den Verlust wirklich. Wer in der Krise weiter kauft, der macht Gewinn, wenn die Börse wieder steigt. Das hat Michael gelernt, und das hat ihm 2.500 Euro gespart, die sein Freund verloren hat. Ein weiterer Punkt zu fallender Börse ist, dass man nicht nur auf sein Depot schauen sollte, sondern auch auf die Nachrichten. Wenn die Börse fällt, dann gibt es immer Nachrichten, die sagen, dass alles schlimm ist. Die Börse wird crashen, die Welt geht unter, alles wird schlecht. Das ist normal. Die Nachrichten leben von Angst, weil Angst Klicks bringt. Michael hat gelernt, dass er in solchen Zeiten keine Nachrichten schauen sollte, weil sie ihn nur ängstlich machen. Er schaut nur einmal im Monat auf sein Depot, wenn sein Sparplan ausgeführt wird. Das reicht. Er liest keine Nachrichten über die Börse, er schaut keine Videos über die Börse, er hört nicht auf Freunde, die sagen, dass die Börse crashen wird. Er lässt seinen Sparplan einfach laufen. Das ist schwer, weil man neugierig ist. Aber es funktioniert, weil man dann nicht in Panik verkauft. Die Börse wird immer wieder fallen, und sie wird immer wieder steigen. Wer das weiß, der bleibt ruhig, wenn sie fällt. Wer das nicht weiß, der verkauft in Panik. Michael bleibt ruhig, weil er weiß, dass die Börse wieder steigen wird. Und er hat Recht behalten, jedes Mal, wenn sie gefallen ist, ist sie wieder gestiegen. Wenn die Börse fällt, dann verkauf nicht. Das ist der wichtigste Satz in diesem Buch. Wenn du ihn dir merkst, dann hast du schon mehr gelernt als die meisten Menschen, die an der Börse Geld verlieren. Wer verkauft, wenn es fällt, der macht den Verlust wirklich. Wer weiter kauft, wenn es fällt, der macht Gewinn, wenn es wieder steigt. Und die Börse steigt immer wieder, nach jedem Fall, in der Geschichte war es immer so.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Steuern - so viel musst du wirklich zahlen", "Viele Menschen haben Angst vor Steuern, wenn sie in ETFs investieren. Michael hatte auch Angst. Er dachte, er müsse einen Steuerberater bezahlen, um seine ETF-Steuern zu machen. Das stimmt nicht. Bei ETFs ist es einfach. Wenn du einen ETF verkaufst und Gewinn gemacht hast, dann musst du 25 Prozent Steuern auf den Gewinn zahlen, plus Solidaritätszuschlag und Kirchensteuer, wenn du in der Kirche bist. Das
