l besser du schläfst. Thomas hat die ersten drei Nächte geflucht und wollte das Gerät zurückgeben. Am vierten Tag hat er gemerkt, dass er zum ersten Mal seit Jahren ohne Kopfschmerzen aufgewacht ist. Seitdem benutzt er es jede Nacht. Ein weiterer Punkt, der oft übersehen wird, ist, dass Schlafapnoe nicht nur Männer betrifft, die übergewichtig sind. Auch Frauen und schlanke Menschen können Schlafapnoe haben. Eine Frau, die Thomas kennt, ist schlank, 35 Jahre alt, und hat trotzdem Schlafapnoe, weil ihr Kiefer zu klein ist und ihre Zunge nachts nach hinten fällt und den Atemweg blockiert. Sie hat es erst gemerkt, als ihr Mann ihr gesagt hat, dass sie nachts aufhört zu atmen. Sie hat ein Atemgerät bekommen und schläft heute wieder durch. Das zeigt: Schlafapnoe ist kein Problem, das nur dicke Männer haben. Es kann jeden treffen. Und es ist wichtig, dass man es abklären lässt, wenn man Symptome hat. Ein zweiter Punkt ist: Kinder können auch Schlafapnoe haben, wenn ihre Mandeln zu groß sind. Wenn dein Kind nachts laut schnarcht, tagsüber müde ist, und in der Schule nicht aufpassen kann, dann lass es vom Kinderarzt untersuchen. Vielleicht sind die Mandeln zu groß und müssen entfernt werden. Das ist kein kleiner Eingriff, aber er kann das Leben deines Kindes verändern, weil es danach wieder gut schlafen kann. Und gut schlafen ist für Kinder noch wichtiger als für Erwachsene, weil sie wachsen und lernen müssen. Ein weiterer Punkt zu Schnarchen ist, dass es nicht nur den Schnarcher stört, sondern auch den Partner. Viele Partner schlafen schlecht, weil der Partner schnarcht. Sie wachen auf, sie können nicht wieder einschlafen, sie sind am nächsten Tag müde, obwohl sie selbst gar kein Schlafproblem haben. Die Lösung ist nicht, sich zu streiten, sondern gemeinsam eine Lösung zu finden. Thomas und seine Frau schlafen jetzt in getrennten Zimmern, wenn er Nachtschicht hat, und sie schlafen besser, weil sie sich nicht gegenseitig stören. Das ist kein Zeichen, dass ihre Ehe schlecht ist. Das ist ein Zeichen, dass sie verstanden haben, dass sie unterschiedlich schlafen und dass sie beide Schlaf brauchen, um gut miteinander umgehen zu können.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Schichtarbeit - wie du schläfst, wenn andere wach sind", "Thomas arbeitet im Schichtdienst. Er hat Frühschicht von 6 bis 14 Uhr, Spätschicht von 14 bis 22 Uhr, und Nachtschicht von 22 bis 6 Uhr. Jede Schicht ist ein Angriff auf seinen Schlaf. Bei Frühschicht muss er um 4:30 Uhr aufstehen. Das heißt, er muss um 20:30 Uhr ins Bett, wenn er 8 Stunden schlafen will. Aber um 20:30 Uhr ist es noch hell, und seine Familie ist noch wach. Bei Spätschicht kommt er um 22:30 Uhr nach Hause, ist noch aufgeputscht, und kann erst um 1 Uhr einschlafen. Bei Nachtschicht schläft er tagsüber, wenn es hell ist, wenn die Kinder spielen, wenn die Nachbarn Rasen mähen. Wie kann man in so einem Leben gut schlafen? Erstens: Verdunkle dein Schlafzimmer komplett. Nicht mit Vorhängen, die noch Licht durchlassen, sondern mit Verdunkelungsrollos oder mit einer Schlafmaske für 5 Euro. Zweitens: Sag deiner Familie, wann du schläfst, und bitte sie, in dieser Zeit leise zu sein. Das ist kein Luxus, das ist Gesundheit. Drittens: Halte deine Schlafzeiten auch am Wochenende ein. Wenn du in der Woche um 5 Uhr aufstehst und am Wochenende bis 10 Uhr schläfst, dann ist dein Körper verwirrt. Er weiß nicht, wann er schlafen soll. Viertens: Iss vor der Nachtschicht eine warme Mahlzeit, und nach der Nachtschicht nur etwas Leichtes. Wenn du nach der Nachtschicht ein schweres Essen isst, dann kann dein Körper nicht schlafen, weil er mit Verdauen beschäftigt ist. Fünftens: Trinke in der Nachtschicht keinen Kaffee nach 3 Uhr nachts, sonst kannst du morgens nicht einschlafen. Das sind keine Wundermittel, aber sie helfen. Thomas hat mit diesen 5 Punkten seinen Schlaf um die Hälfte verbessert, noch bevor er sein Atemgerät bekommen hat. Ein Beispiel für Schichtarbeit, das Thomas erlebt hat: Er hat früher nach der Nachtschicht noch mit seinen Kindern gefrühstückt, weil er dachte, er müsse für die Familie da sein. Dann ist er um 9 Uhr ins Bett gegangen, aber er konnte nicht einschlafen, weil er noch aufgeputscht war vom Frühstück und vom Tageslicht. Er hat bis 11 Uhr wach gelegen und dann nur noch 4 Stunden geschlafen, bis die Kinder von der Schule kamen und ihn geweckt haben. Heute macht er es anders: Nach der Nachtschicht isst er nur etwas Leichtes, zum Beispiel Joghurt mit Haferflocken, dann duscht er lauwarm, dann geht er in sein verdunkeltes Schlafzimmer, setzt seine Schlafmaske auf und schläft. Er sagt seiner Familie vorher, dass er jetzt schläft und dass sie ihn nur wecken sollen, wenn es wirklich wichtig ist. Seine Frau hat dafür einen Zettel an die Tür gehängt: Papa schläft, bitte leise. Das funktioniert, weil die Kinder es verstehen. Sie wissen, dass Papa nachts gearbeitet hat und dass er schlafen muss, um wieder fit zu sein. Ein zweiter Punkt ist: Thomas macht nach der Nachtschicht keinen Sport. Früher hat er gedacht, Sport mache ihn müde und er könne danach besser schlafen. In Wahrheit macht Sport ihn wach, weil sein Körper Adrenalin ausschüttet. Er macht Sport jetzt vor der Schicht, nicht nach der Schicht. Das hat seinen Schlaf verbessert, weil sein Körper nach der Schicht zur Ruhe kommen kann, statt noch einmal aufgeputscht zu werden. Ein weiterer Punkt für Schichtarbeit ist, dass man nicht nur den Schlaf anpassen muss, sondern auch das Essen. Thomas hat früher in der Nachtschicht um 2 Uhr nachts eine Currywurst mit Pommes gegessen, weil er Hunger hatte. Danach war er noch wacher, weil sein Körper mit Verdauen beschäftigt war, und er konnte morgens nicht schlafen, weil sein Magen noch voll war. Heute isst er in der Nachtschicht nur etwas Leichtes, zum Beispiel ein Brot mit Käse oder einen Joghurt. Und er trinkt Wasser statt Cola, weil Cola Koffein hat und ihn wach hält. Das hat seinen Schlaf verbessert, weil sein Körper nachts nicht mehr verdauen muss. Ein zweiter Punkt ist: Nach der Nachtschicht sollte man nicht direkt ins Bett gehen, wenn man noch aufgeputscht ist. Thomas geht nach der Nachtschicht erst 30 Minuten spazieren, an der frischen Luft, ohne Handy, ohne Musik, einfach nur gehen. Das beruhigt ihn, und danach kann er besser einschlafen. Das ist kein Wundermittel, aber es hilft, weil sein Körper lernt, dass die Schicht vorbei ist und dass es jetzt Zeit ist zu schlafen. Und ein dritter Punkt ist: Sag deinen Freunden und deiner Familie, dass du Schicht arbeitest und dass du tagsüber schlafen musst. Viele Menschen verstehen das nicht, weil sie nie Schicht gearbeitet haben. Sie rufen an, sie klingeln, sie kommen vorbei. Sag ihnen, dass du tagsüber schläfst und dass sie dich nur anrufen sollen, wenn es wichtig ist. Das ist kein Luxus, das ist Gesundheit. Ein weiterer Punkt für Schichtarbeit ist, dass man sich nicht mit anderen vergleichen sollte, die nicht Schicht arbeiten. Wer nie Schicht gearbeitet hat, versteht nicht, wie es ist, tagsüber zu schlafen, wenn alle anderen wach sind. Thomas hat aufgehört, sich mit seinen Freunden zu vergleichen, die jeden Tag um 22 Uhr ins Bett gehen und um 6 Uhr aufstehen. Er hat seinen eigenen Rhythmus gefunden, der zu seiner Schicht passt. Und er hat gelernt, dass es in Ordnung ist, anders zu schlafen als andere, solange man genug schläft und sich ausgeschlafen fühlt. Das ist der Punkt: Es gibt keinen perfekten Schlaf, es gibt nur den Schlaf, der zu deinem Leben passt.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Kinder und Schlaf - warum dein Kind um 21 Uhr noch wach ist", "Kinder schlafen anders als Erwachsene. Ein Baby braucht 14 bis 16 Stunden Schlaf, ein Kleinkind 12 Stunden, ein Schulkind 10 Stunden, ein Teenager 9 Stunden. Aber viele Kinder schlafen weniger, weil sie abends noch am Handy sind, weil sie Angst haben, weil sie nicht zur Ruhe kommen. Familie Berger hat einen Sohn, der 8 Jahre alt ist. Er sollte um 20 Uhr ins Bett, aber er war um 21:30 Uhr noch wach, weil er noch gelesen hat, weil er noch Durst hatte, weil er noch einmal aufs Klo musste, weil er noch eine Frage hatte. Das ist normal. Kinder testen, wie weit sie gehen können. Die Lösung war ein festes Ritual: Um 19:30 Uhr wird das Handy ausgemacht, um 19:45 Uhr wird geduscht, um 20 Uhr wird eine Geschichte vorgelesen, um 20:15 Uhr wird das Licht ausgemacht. Das Ritual dauert 45 Minuten, aber es funktioniert, weil es jeden Abend gleich ist. Der Körper des Kindes lernt: Wenn das Ritual anfängt, dann geht es bald ins Bett. Ein zweiter Punkt ist: Kein Handy im Kinderzimmer. Wenn das Handy im Zimmer ist, dann schaut das Kind nachts drauf, wenn es aufwacht. Es spielt ein Spiel, es schaut ein Video, und dann kann es nicht wieder einschlafen. Ein dritter Punkt ist: Kinder brauchen Dunkelheit und Ruhe, genau wie Erwachsene. Wenn das Kinderzimmer hell ist, weil die Straßenlaterne reinscheint, dann schläft das Kind schlechter. Verdunkle das Zimmer, mach es leise, und lass das Kind nicht mit dem Handy einschlafen. Das gilt auch für Teenager. Teenager sind oft Nachtschwärmer, weil ihre Hormone sie erst spät müde machen. Das ist normal. Aber wenn ein Teenager um 1 Uhr nachts noch am Handy ist und um 6 Uhr aufstehen muss, dann ist er den ganzen Tag müde, und in der Schule kann er sich nicht konzentrieren. Sprich mit deinem Teenager darüber, ohne Vorwürfe. Sag ihm, was Schlaf mit seinem Körper macht, und bitte ihn, das Handy eine Stunde vor dem Schlafengehen wegzulegen. Ein Beispiel, das Familie Berger erlebt hat: Ihr Sohn hat abends immer noch Hunger gehabt und hat gesagt, er könne nicht schlafen, weil er Hunger habe. Sie haben ihm abends noch ein Butterbrot gegeben, aber er ist trotzdem nicht eingeschlafen, weil er danach noch Durst hatte, dann noch aufs Klo musste, dann noch eine Frage hatte. Das war kein Hunger, das war ein Trick, um länger wach zu bleiben. Sie haben es so gelöst: Um 19:30 Uhr gibt es ein Abendessen, das satt macht, zum Beispiel Nudeln mit Soße oder Brot mit Käse und Gemüse. Danach gibt es nichts mehr zu essen. Wenn er danach noch Hunger hat, dann gibt es nur noch einen Apfel oder ein Glas Wasser. Das hat funktioniert, weil er wusste, dass es danach nichts mehr gibt. Er hat aufgehört, nach Essen zu fragen, weil er wusste, dass es nichts bringt. Ein zweites Beispiel: Ihre Tochter hat Angst vor Dunkelheit gehabt und wollte nicht allein schlafen. Sie haben ihr ein Nachtlicht gekauft, das so dunkel ist, dass es kaum Licht macht, aber sie sieht, dass sie nicht allein ist. Und sie haben ihr eine Geschichte vorgelesen, in der es um Mut geht. Nach zwei Wochen hat sie keine Angst mehr gehabt. Das ist kein Zauber, das ist ein Ritual, das Sicherheit gibt. Kinder brauchen Rituale, weil Rituale ihnen sagen, was als Nächstes passiert. Wenn das Ritual immer gleich ist, dann weiß das Kind, dass es jetzt Zeit ist zu schlafen, und es kann loslassen. Ein weiterer Punkt für Kinder ist, dass Kinder nicht nur Schlaf brauchen, sondern auch Rituale. Ein Kind, das jeden Abend zur gleichen Zeit ins Bett geht und jeden Abend das gleiche Ritual hat, schläft besser als ein Kind, das jeden Abend zu einer anderen Zeit ins Bett geht. Familie Berger hat das erlebt. Früher ist ihr Sohn mal um 20 Uhr, mal um 21:30 Uhr ins Bett gegangen, je nachdem, wie der Tag war. Er war oft müde, weil er keinen Rhythmus hatte. Heute geht er jeden Abend um 20 Uhr ins Bett, auch am Wochenende. Das war am Anfang schwer, weil er am Wochenende länger aufbleiben wollte. Aber nach zwei Wochen hat er sich daran gewöhnt, und er schläft besser. Ein zweiter Punkt ist: Kinder brauchen kein Handy, um einzuschlafen. Viele Eltern geben ihren Kindern ein Handy oder ein Tablet, damit sie einschlafen. Das ist, als würdest du einem Kind Kaffee geben, damit es einschläft. Es funktioniert nicht, weil das Licht und die Inhalte das Kind wach halten. Gib deinem Kind stattdessen ein Buch oder eine Geschichte. Das beruhigt, weil es keine Reize hat, die wach halten. Und: Lass dein Kind nicht mit dem Handy im Zimmer schlafen. Wenn das Handy im Zimmer ist, dann schaut das Kind nachts drauf, wenn es aufwacht. Das ist ein Teufelskreis, den man nur durchbrechen kann, wenn das Handy aus dem Zimmer ist. Ein weiterer Punkt für Kinder ist, dass Kinder nicht nur Schlaf brauchen, sondern auch Nähe. Ein Kind, das Angst hat, braucht keine Tabletten, sondern einen Menschen, der da ist. Familie Berger hat ihrem Sohn gesagt: Wenn du Angst hast, dann komm zu uns, wir sind da. Das hat ihm geholfen, weil er wusste, dass er nicht allein ist. Und sie haben ihm eine Geschichte vorgelesen, die ihm Mut gemacht hat. Nach zwei Wochen hatte er keine Angst mehr, weil er wusste, dass seine Eltern da sind, wenn er sie braucht. Das ist wichtiger als jede Schlafregel. Kinder schlafen besser, wenn sie sich sicher fühlen. Und sie fühlen sich sicher, wenn sie wissen, dass ihre Eltern da sind.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Dein Schlafzimmer - der Raum, der über deinen Schlaf entscheidet", "Dein Schlafzimmer ist nicht nur ein Raum mit einem Bett. Es ist der Raum, in dem du ein Drittel deines Lebens verbringst. Und viele Schlafzimmer sind so eingerichtet, dass man darin nicht gut schlafen kann. Erstens: Die Temperatur. Die ideale Temperatur zum Schlafen ist 16 bis 18 Grad. Viele Menschen schlafen bei 21 oder 22 Grad, weil sie denken, es sei gemütlich. Aber bei 22 Grad schwitzt dein Körper, und du wachst öfter auf. Mach das Fenster auf, bevor du ins Bett gehst, und lass die Heizung im Schlafzimmer aus oder auf niedrig. Zweitens: Die Dunkelheit. Dein Schlafzimmer sollte so dunkel sein, dass du deine Hand vor Augen nicht siehst. Wenn Licht reinkommt, dann produziert dein Gehirn weniger Melatonin. Verdunkelungsrollos oder eine Schlafmaske helfen. Drittens: Die Ruhe. Wenn du in einer lauten Straße wohnst, dann helfen Ohrstöpsel oder ein leises Rauschen, zum Beispiel ein Ventilator, der gleichmäßig brummt. Viertens: Das Bett. Eine Matratze, die 15 Jahre alt ist und durchgelegen ist, ist kein Bett, sondern ein Problem. Eine gute Matratze kostet 300 bis 500 Euro und hält 8 bis 10 Jahre. Das sind 50 Euro im Jahr für guten Schlaf. Das ist weniger, als du für Kaffee ausgibst. Fünftens: Kein Fernseher im Schlafzimmer. Wenn du im Bett fernsiehst, dann lernt dein Gehirn, dass das Bett nicht nur zum Schlafen da ist, sondern auch zum Fernsehen. Dann wirst du im Bett wach, weil dein Gehirn denkt, jetzt kommt Fernsehen. Das Bett ist nur zum Schlafen da. Und zum anderen, was man im Bett macht. Aber nicht zum Fernsehen, nicht zum Arbeiten, nicht zum Essen. Wenn du das einhältst, dann lernt dein Körper: Wenn ich ins Bett gehe, dann schlafe ich. Ein Beispiel, das Thomas erlebt hat: Er hat früher mit offenem Fenster geschlafen, weil er dachte, frische Luft sei gut. Aber er wohnt an einer Straße, und nachts sind Autos vorbeigefahren, die ihn geweckt haben. Er hat das Fenster zugemacht und einen Ventilator angemacht, der leise brummt. Der Ventilator macht ein gleichmäßiges Geräusch, das die Autogeräusche überdeckt. Seitdem schläft er besser, weil er nicht mehr bei jedem Auto aufwacht. Ein zweites Beispiel: Seine Matratze war 12 Jahre alt und hatte eine Kuhle in der Mitte. Er ist immer in die Kuhle gerollt und hat Rückenschmerzen bekommen. Er hat eine neue Matratze für 380 Euro gekauft und ein neues Kissen für 45 Euro. Seitdem hat er keine Rückenschmerzen mehr am Morgen. Das ist kein Luxus, das ist Gesundheit. Viele Menschen geben 1.000 Euro für ein Handy aus, das sie alle zwei Jahre wechseln, aber sie schlafen 10 Jahre auf einer Matratze, die kaputt ist. Das ist, als würdest du jeden Tag in Schuhen laufen, die dir zu klein sind, und dich wundern, dass deine Füße wehtun. Eine gute Matratze ist wichtiger als ein gutes Handy, weil du ein Drittel deines Lebens darauf verbringst. Und: Wenn du eine neue Matratze kaufst, dann probiere sie im Laden aus, lieg 10 Minuten darauf, und nimm eine, die zu deinem Körper passt, nicht die, die am teuersten ist. Ein weiterer Punkt für das Schlafzimmer ist, dass man es nicht als Abstellkammer benutzen sollte. Viele Menschen haben im Schlafzimmer einen Wäscheständer, einen Schreibtisch, einen Fernseher, und Kisten, die sie nicht mehr brauchen. Das Schlafzimmer ist dann kein Ort zum Schlafen, sondern ein Ort zum Arbeiten und zum Aufräumen. Das Gehirn lernt: Wenn ich ins Schlafzimmer gehe, dann muss ich arbeiten. Dann kann man nicht schlafen. Familie Berger hat ihr Schlafzimmer aufgeräumt. Sie haben den Schreibtisch rausgestellt, den Fernseher rausgestellt, und die Kisten in den Keller gestellt. Jetzt ist im Schlafzimmer nur noch ein Bett, ein Nachttisch, und ein Schrank. Das ist langweilig, aber es funktioniert, weil das Gehirn lernt: Wenn ich ins Schlafzimmer gehe, dann schlafe ich. Ein zweiter Punkt ist: Das Schlafzimmer sollte nicht zu voll sein. Wenn es zu voll ist, dann fühlt man sich erdrückt, und man kann nicht zur Ruhe kommen. Räume dein Schlafzimmer auf, mach es leer, mach es dunkel, mach es kühl. Das sind die drei Dinge, die ein Schlafzimmer braucht: Leer, dunkel, kühl. Alles andere ist nicht nötig. Und: Wenn du im Schlafzimmer arbeitest, dann hör damit auf. Arbeite im Wohnzimmer oder in der Küche, aber nicht im Schlafzimmer. Denn das Schlafzimmer ist zum Schlafen da, nicht zum Arbeiten. Ein weiterer Punkt für das Schlafzimmer ist, dass man es nicht nur dunkel und kühl machen sollte, sondern auch aufgeräumt. Wenn das Schlafzimmer unordentlich ist, dann fühlt man sich unwohl, und man kann nicht zur Ruhe kommen. Familie Berger hat ihr Schlafzimmer aufgeräumt, sie haben alles rausgestellt, was nicht ins Schlafzimmer gehört, und jetzt ist es ein Ort, an dem man sich wohlfühlt. Das ist kein Luxus, das ist wichtig, weil man sich in einem aufgeräumten Raum besser entspannen kann als in einem chaotischen Raum. Räume dein Schlafzimmer auf, mach es leer, mach es dunkel, mach es kühl. Das sind die drei Dinge, die ein Schlafzimmer braucht.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Grübeln - wenn der Kopf nachts nicht abschaltet", "Die meisten Menschen, die nicht einschlafen können, haben kein Schlafproblem, sondern ein Grübelproblem. Sie liegen im Bett und denken nach: Was muss ich morgen tun? Habe ich die E-Mail vergessen? Warum hat mein Chef mich so komisch angeschaut? Was ist, wenn das Geld nicht reicht? Diese Gedanken sind normal. Aber im Bett sind sie ein Problem, weil du sie nicht lösen kannst. Du kannst um 23 Uhr keine E-Mail schreiben, du kannst um 23 Uhr kein Geld verdienen, du kannst um 23 Uhr nicht mit deinem Chef sprechen. Die Lösung ist: Schreibe es auf, bevor du ins Bett gehst. Nimm ein Blatt Papier und schreibe 10 Minuten lang alles auf, was dich beschäftigt. Nicht schön, nicht ordentlich, einfach alles, was dir im Kopf herumgeht. Dann lege das Blatt neben dein Bett und sag dir: Das ist für morgen. Jetzt schlafe ich. Wenn du nachts aufwachst und wieder grübelst, dann schreibe es wieder auf, im Dunkeln, mit einem Stift, der auf dem Nachttisch liegt. Du musst es nicht lesen können. Du musst es nur loswerden. Ein zweiter Trick ist: Atme langsam. Atme 4 Sekunden ein, halte 4 Sekunden, atme 6 Sekunden aus. Das beruhigt dein Nervensystem. Dein Herz schlägt langsamer, deine Muskeln entspannen sich. Mach das 5 Minuten lang, und du wirst merken, dass du müder wirst. Ein dritter Trick ist: Wenn du nach 30 Minuten immer noch nicht eingeschlafen bist, dann steh auf. Geh in ein anderes Zimmer, lies ein langweiliges Buch, trinke einen Tee, und geh erst wieder ins Bett, wenn du wirklich müde bist. Bleib nicht im Bett liegen und warte darauf, dass du einschläfst. Denn dann lernt dein Gehirn, dass das Bett ein Ort ist, an dem man wach liegt und grübelt. Und das willst du nicht. Ein Beispiel für Grübeln, das Thomas erlebt hat: Er hat abends im Bett darüber nachgedacht, ob er genug Geld für den Urlaub hat. Er hat gerechnet, er hat sich Sorgen gemacht, er hat sich vorgestellt, was passiert, wenn das Auto kaputtgeht. Er ist immer wacher geworden, je mehr er darüber nachgedacht hat. Heute macht er es anders: Um 20 Uhr setzt er sich an den Küchentisch und schreibt 10 Minuten lang alles auf, was ihn beschäftigt. Er schreibt: Urlaub, Auto, Geld, Arbeit. Dann schreibt er daneben, was er morgen tun kann. Zum Beispiel: Morgen rufe ich bei der Werkstatt an und frage, was die Reparatur kostet. Morgen schaue ich, wie viel Urlaubsgeld ich bekomme. Das ist kein Plan, das ist ein Zettel, der ihm sagt, dass er morgen etwas tun kann. Heute kann er nichts tun, also schläft er. Das funktioniert, weil sein Gehirn weiß, dass das Problem aufgeschrieben ist und dass es morgen gelöst wird. Es muss nicht mehr im Kopf herumgetragen werden. Ein zweiter Trick, den er gelernt hat, ist: Wenn er nachts aufwacht und grübelt, dann steht er auf, geht ins Wohnzimmer, setzt sich auf einen Stuhl und wartet, bis er wieder müde ist. Er schaut nicht aufs Handy, er schaut nicht fern, er sitzt einfach nur da. Nach 10 Minuten ist er wieder müde und geht zurück ins Bett. Das ist langweilig, aber es funktioniert, weil sein Gehirn lernt, dass das Bett nur zum Schlafen da ist, nicht zum Grübeln. Ein weiterer Trick gegen Grübeln ist, sich vorzustellen, dass man in einem Kino sitzt und seine Gedanken wie Filme sieht. Thomas hat das von einem Therapeuten gelernt. Er stellt sich vor, dass er in einem Kino sitzt und dass seine Gedanken wie Filme auf einer Leinwand laufen. Er schaut sie an, aber er greift nicht ein. Er sagt nicht: Das muss ich morgen tun, oder: Das war falsch. Er sagt nur: Ah, da ist ein Gedanke. Und dann lässt er ihn vorbeiziehen. Das ist schwer, weil man gewohnt ist, jeden Gedanken sofort zu lösen. Aber wenn man es übt, dann wird man ruhiger. Nach zwei Wochen hat Thomas gemerkt, dass er schneller einschläft, weil er nicht mehr jeden Gedanken festhält. Ein zweiter Trick ist: Wenn du nachts aufwachst und nicht wieder einschlafen kannst, dann zähle nicht Schafe, sondern zähle deine Atemzüge. Atme ein, zähle 1, atme aus, zähle 2, atme ein, zähle 3. Wenn du dich verzählst, fang wieder bei 1 an. Das ist langweilig, aber es funktioniert, weil dein Gehirn sich auf das Zählen konzentrieren muss und nicht mehr grübeln kann. Das sind keine Wundermittel, aber sie helfen, weil sie deinem Gehirn eine Aufgabe geben, die langweilig ist, und Langeweile macht müde. Ein weiterer Trick gegen Grübeln ist, sich vorzustellen, dass man auf einer Wolke liegt und dass die Gedanken wie Wolken vorbeiziehen. Thomas hat das von einem Therapeuten gelernt. Er stellt sich vor, dass er auf einer Wolke liegt und dass seine Gedanken wie Wolken vorbeiziehen. Er schaut sie an, aber er hält sie nicht fest. Er lässt sie vorbeiziehen, und nach einer Weile ist sein Kopf leer. Das ist schwer, weil man gewohnt ist, jeden Gedanken festzuhalten. Aber wenn man es übt, dann wird man ruhiger. Und wenn man ruhiger wird, dann schläft man besser. Das ist kein Wundermittel, aber es hilft, weil es deinem Gehirn eine Aufgabe gibt, die langweilig ist, und Langeweile macht müde.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Schlafmittel - was sie wirklich bringen und was sie kaputt machen", "Viele Menschen nehmen Schlafmittel, weil sie nicht einschlafen können. Schlafmittel helfen kurzfristig, aber sie lösen das Problem nicht. Sie machen dich zwar müde, aber sie verändern deinen Schlaf. Du hast weniger Tiefschlaf und weniger Traumschlaf, und du fühlst dich am nächsten Morgen benommen. Außerdem machen Schlafmittel abhängig. Wenn du sie länger als 2 Wochen nimmst, dann kannst du ohne sie nicht mehr schlafen, weil dein Körper sich daran gewöhnt hat. Das gilt auch für pflanzliche Schlafmittel wie Baldrian oder Melatonin. Melatonin ist kein Schlafmittel, sondern ein Hormon, das deinem Körper sagt, dass es Nacht ist. Es hilft, wenn du Jetlag hast oder wenn du Schicht arbeitest. Aber es hilft nicht, wenn du grübelst oder wenn du zu viel Kaffee trinkst. Was wirklich hilft, ist, die Ursache zu finden. Wenn du nicht schlafen kannst, weil du zu viel Kaffee trinkst, dann hilft kein Schlafmittel, sondern weniger Kaffee. Wenn du nicht schlafen kannst, weil du schnarchst, dann hilft kein Schlafmittel, sondern ein Arztbesuch. Wenn du nicht schlafen kannst, weil du grübelst, dann hilft kein Schlafmittel, sondern Aufschreiben. Schlafmittel sind wie ein Pflaster auf einer Wunde, die genäht werden muss. Sie verdecken das Problem, aber sie heilen es nicht. Wenn du schon Schlafmittel nimmst, dann sprich mit deinem Arzt darüber, wie du sie wieder absetzen kannst. Mach das nicht allein, weil du sonst Entzugserscheinungen bekommen kannst. Und: Nimm keine Schlafmittel von Freunden oder aus dem Internet. Das ist gefährlich, weil du nicht weißt, was drin ist und wie viel du davon nehmen darfst. Ein Fall, den der Arzt Thomas erzählt hat: Eine Frau, 38 Jahre alt, hat jeden Abend eine Schlaftablette genommen, weil sie nicht einschlafen konnte. Nach einem Jahr hat sie gemerkt, dass sie ohne Tablette gar nicht mehr einschlafen konnte, auch wenn sie müde war. Sie hat die Tabletten abgesetzt, aber sie hat drei Wochen lang kaum geschlafen, weil ihr Körper Entzugserscheinungen hatte. Sie hat es geschafft, weil sie mit ihrem Arzt einen Plan gemacht hat: Sie hat die Dosis langsam reduziert, jede Woche ein bisschen weniger, und sie hat gleichzeitig angefangen, ein Abendritual zu machen und das Handy wegzulegen. Nach einem Monat konnte sie wieder ohne Tabletten schlafen. Das ist kein Einzelfall. Viele Menschen nehmen Schlafmittel, weil sie denken, sie helfen. In Wahrheit machen sie das Problem größer, weil sie den Körper daran gewöhnen, ohne Tabletten nicht mehr zu schlafen. Wenn du Schlafmittel nimmst, dann sprich mit deinem Arzt darüber, wie du sie wieder absetzen kannst. Mach das nicht allein. Und: Wenn du Melatonin nimmst, dann nimm es nicht jeden Abend, sondern nur, wenn du es wirklich brauchst, zum Beispiel wenn du Jetlag hast oder wenn du Schicht arbeitest. Melatonin ist kein harmloses Vitamin, sondern ein Hormon, das deinen Körper durcheinanderbringt, wenn du es jeden Tag nimmst. Thomas hat nie Schlafmittel genommen, weil er Angst davor hatte. Er hat lieber seinen Alltag geändert. Das war schwerer, aber es hat länger gehalten. Ein weiterer Punkt zu Schlafmitteln ist, dass viele Menschen Baldrian nehmen, weil sie denken, es sei harmlos, weil es pflanzlich ist. Baldrian ist nicht harmlos. Es kann Nebenwirkungen haben, wie Kopfschmerzen, Übelkeit, und Schwindel. Und es kann mit anderen Medikamenten zusammenwirken, die du nimmst. Sprich mit deinem Arzt, bevor du Baldrian nimmst, auch wenn es rezeptfrei ist. Ein zweiter Punkt ist: Viele Menschen nehmen Melatonin, weil sie denken, es helfe beim Einschlafen. Melatonin hilft, wenn du Jetlag hast oder wenn du Schicht arbeitest, weil es deinem Körper sagt, dass es Nacht ist. Aber es hilft nicht, wenn du grübelst oder wenn du zu viel Kaffee trinkst. Und wenn du Melatonin jeden Abend nimmst, dann gewöhnt sich dein Körper daran und produziert selbst weniger Melatonin. Das ist, als würdest du jeden Tag eine Krücke benutzen, obwohl dein Bein gesund ist. Nach einer Weile kannst du ohne Krücke nicht mehr laufen. So ist es auch mit Melatonin. Nimm es nur, wenn du es wirklich brauchst, und sprich mit deinem Arzt darüber, wie lange du es nehmen darfst. Thomas hat nie Melatonin genommen, weil er Angst hatte, dass sein Körper sich daran gewöhnt. Er hat lieber seinen Alltag geändert. Das war schwerer, aber es hat länger gehalten. Ein weiterer Punkt zu Schlafmitteln ist, dass man sie nicht nehmen sollte, wenn man Alkohol getrunken hat. Schlafmittel und Alkohol zusammen sind gefährlich, weil sie sich gegenseitig verstärken. Man kann dann so tief schlafen, dass man nicht mehr aufwacht, wenn etwas passiert. Oder man kann am nächsten Tag so benommen sein, dass man nicht Auto fahren kann. Sprich mit deinem Arzt, wenn du Schlafmittel nimmst und Alkohol trinkst. Und: Nimm keine Schlafmittel, die dir jemand gegeben hat, ohne dass ein Arzt sie dir verschrieben hat. Das ist gefährlich, weil du nicht weißt, was drin ist und wie viel du davon nehmen darfst. Thomas hat nie Schlafmittel genommen, weil er Angst davor hatte. Er hat lieber seinen Alltag geändert. Das war schwerer, aber es hat länger gehalten.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Dein 7-Tage-Schlafprotokoll - so findest du dein Muster", "Wenn du nicht weißt, warum du schlecht schläfst, dann musst du es messen. Nicht mit einer teuren Uhr, sondern mit einem Blatt Papier. Schreibe 7 Tage lang auf: Wann bist du ins Bett gegangen? Wann bist du eingeschlafen? Wie oft bist du aufgewacht? Wann bist du aufgestanden? Wie hast du dich am Morgen gefühlt, von 1 bis 10? Was hast du am Abend gegessen und getrunken? Warst du am Handy? Hast du Sport gemacht? Nach 7 Tagen hast du ein Muster. Familie Berger hat das gemacht und festgestellt, dass Thomas immer dann besonders schlecht geschlafen hat, wenn er abends Pizza gegessen und danach noch zwei Bier getrunken hatte. An den Tagen, an denen er abends nur eine Suppe gegessen und keinen Alkohol getrunken hatte, hat er besser geschlafen. Das war kein Zufall, das war ein Muster. Ein zweites Muster war: Wenn Thomas am Abend noch am Handy war, hat er 45 Minuten länger gebraucht, um einzuschlafen. An den Tagen, an denen er das Handy um 20 Uhr weggelegt hatte, ist er innerhalb von 10 Minuten eingeschlafen. Das sind keine Vermutungen, das sind Zahlen aus seinem Protokoll. Und Zahlen lügen nicht. Mach dein Protokoll 7 Tage lang, ehrlich, ohne zu schummeln. Schreibe auch auf, wenn du schlecht geschlafen hast. Nur dann kannst du sehen, was wirklich hilft und was nicht. Und: Zeig das Protokoll deinem Arzt, wenn du zum Arzt gehst. Der Arzt kann damit viel mehr anfangen als mit dem Satz: Ich schlafe schlecht. Denn der Arzt sieht dann, wann du schläfst, wie lange du schläfst, und was du abends machst. Das ist die Grundlage für eine gute Diagnose. Ein Beispiel für ein Schlafprotokoll, das Thomas geführt hat: Er hat 7 Tage lang aufgeschrieben, wann er ins Bett gegangen ist, wann er eingeschlafen ist, wie oft er aufgewacht ist, und wie er sich am Morgen gefühlt hat. Nach 7 Tagen hat er gesehen, dass er an den Tagen, an denen er abends Pizza gegessen hatte, schlechter geschlafen hat als an den Tagen, an denen er abends Suppe gegessen hatte. Er hat auch gesehen, dass er an den Tagen, an denen er Sport gemacht hatte, besser geschlafen hat als an den Tagen, an denen er den ganzen Tag gesessen hatte. Und er hat gesehen, dass er an den Tagen, an denen er das Handy um 20 Uhr weggelegt hatte, schneller eingeschlafen ist als an den Tagen, an denen er bis 22 Uhr am Handy war. Das sind keine Vermutungen, das sind Zahlen aus seinem Protokoll. Und Zahlen lügen nicht. Wenn du dein Protokoll führst, dann schreibe auch auf, was du am Abend gegessen und getrunken hast, ob du Sport gemacht hast, ob du am Handy warst, und ob du dich gestritten hast. Nach 7 Tagen wirst du ein Muster sehen. Vielleicht schläfst du immer dann schlecht, wenn du dich gestritten hast. Vielleicht schläfst du immer dann gut, wenn du Sport gemacht hast. Das ist dein Muster, und nur du kannst es finden, weil nur du weißt, was du abends gemacht hast. Zeig das Protokoll deinem Arzt, wenn du zum Arzt gehst. Der Arzt kann damit viel mehr anfangen als mit dem Satz: Ich schlafe schlecht. Ein weiterer Punkt für das Schlafprotokoll ist, dass du auch aufschreiben solltest, wie du dich tagsüber fühlst. Nicht nur, wie du geschlafen hast, sondern auch, wie du dich am Tag gefühlt hast. Warst du müde? Warst du gereizt? Konntest du dich konzentrieren? Hast du Fehler gemacht? Wenn du das aufschreibst, dann siehst du einen Zusammenhang zwischen Schlaf und Tag. Thomas hat gemerkt, dass er an den Tagen, an denen er schlecht geschlafen hatte, mehr Fehler bei der Arbeit gemacht hat und schneller gereizt war. An den Tagen, an denen er gut geschlafen hatte, war er geduldiger mit seinen Kindern und konnte sich besser konzentrieren. Das hat ihm gezeigt, dass Schlaf nicht nur für die Nacht wichtig ist, sondern für den ganzen Tag. Und es hat ihm gezeigt, dass es sich lohnt, sich um seinen Schlaf zu kümmern, weil es seinen ganzen Tag besser macht. Ein zweiter Punkt ist: Führe das Protokoll nicht nur 7 Tage, sondern 30 Tage, wenn du wirklich wissen willst, wie du schläfst. Nach 7 Tagen hast du ein Muster, nach 30 Tagen hast du Gewissheit. Und: Sei ehrlich im Protokoll. Schreib auch auf, wenn du schlecht geschlafen hast, weil du zu viel Alkohol getrunken hast oder weil du zu lange am Handy warst. Nur wenn du ehrlich bist, kannst du etwas ändern. Ein weiterer Punkt für das Schlafprotokoll ist, dass du es nicht nur für dich selbst führen solltest, sondern auch für deinen Arzt. Wenn du zum Arzt gehst und sagst: Ich schlafe schlecht, dann kann der Arzt damit wenig anfangen. Wenn du zum Arzt gehst und ihm ein Protokoll zeigst, auf dem steht, wann du ins Bett gegangen bist, wann du eingeschlafen bist, wie oft du aufgewacht bist, und wie du dich gefühlt hast, dann kann der Arzt dir viel besser helfen. Er sieht dann, ob du zu wenig schläfst, ob du zu spät ins Bett gehst, ob du zu viel Kaffee trinkst, oder ob du vielleicht Schlafapnoe hast. Das Protokoll ist die Grundlage für eine gute Diagnose. Ohne Protokoll rät der Arzt nur. Mit Protokoll weiß er, was los ist.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Dein Plan für die nächsten 30 Tage - Nacht für Nacht besser schlafen", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein macht dich nicht ausgeschlafen. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Führe ein Schlafprotokoll. Nur aufschreiben, nichts ändern. Woche 2: Leg das Handy eine Stunde vor dem Schlafengehen weg und trinke keinen Kaffee nach 14 Uhr. Woche 3: Verdunkle dein Schlafzimmer, mach es kühler, und richte dir ein festes Abendritual ein: Duschen, Zähne putzen, 10 Minuten aufschreiben, was dich beschäftigt, dann ins Bett. Woche 4: Halte deine Schlafzeiten ein, auch am Wochenende, und steh jeden Tag zur gleichen Zeit auf, auch wenn du schlecht geschlafen hast. Das ist der schwierigste Teil, aber er ist der wichtigste. Denn wenn du jeden Tag zur gleichen Zeit aufstehst, dann lernt dein Körper, wann er schlafen soll. Nach 30 Tagen wirst du merken, dass du besser schläfst. Nicht perfekt, aber besser. Thomas hat nach 30 Tagen gemerkt, dass er morgens nicht mehr zwei Kaffee brauchte, sondern einer reichte. Nach 60 Tagen hat er gemerkt, dass er abends nicht mehr auf dem Sofa einschlief. Nach 90 Tagen hat er gemerkt, dass er wieder lachen konnte, weil er nicht mehr so müde war. Das ist kein Wunder, das ist Schlaf. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Und in 30 Tagen wirst du dich wundern, was sich verändert hat. Ein Beispiel für einen 30-Tage-Plan, den Thomas gemacht hat: In der ersten Woche hat er nur aufgeschrieben, wie er schläft, ohne etwas zu ändern. In der zweiten Woche hat er das Handy um 20 Uhr weggelegt und keinen Kaffee mehr nach 14 Uhr getrunken. In der dritten Woche hat er sein Schlafzimmer verdunkelt und ein Abendritual eingeführt. In der vierten Woche hat er seine Schlafzeiten eingehalten, auch am Wochenende. Nach 30 Tagen hat er gemerkt, dass er morgens nicht mehr zwei Kaffee brauchte, sondern einer reichte. Nach 60 Tagen hat er gemerkt, dass er abends nicht mehr auf dem Sofa einschlief. Nach 90 Tagen hat er gemerkt, dass er wieder lachen konnte, weil er nicht mehr so müde war. Das ist kein Wunder, das ist Schlaf. Und das ist der Punkt: Schlaf ist kein Schalter, den man umlegt. Schlaf ist ein Prozess, der Zeit braucht. Wenn du 30 Tage lang jeden Tag eine kleine Sache änderst, dann wirst du nach 30 Tagen besser schlafen. Nicht perfekt, aber besser. Und besser ist schon viel, wenn du vorher schlecht geschlafen hast. Fang heute an. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du ins Bett gehst, wann du aufstehst, und wie du dich fühlst. Das ist der erste Schritt. Und in 30 Tagen wirst du dich wundern, was sich verändert hat. Ein weiterer Punkt für den 30-Tage-Plan ist, dass du nicht alles auf einmal ändern musst. Wenn du in der ersten Woche nur das Handy weglässt, dann ist das schon ein Erfolg. Wenn du in der zweiten Woche nur den Kaffee weglässt, dann ist das schon ein Erfolg. Du musst nicht in einer Woche alles ändern. Fang mit einer Sache an, und mach sie richtig. Wenn du sie eine Woche lang geschafft hast, dann nimm die nächste Sache dazu. So baust du dir Schritt für Schritt einen besseren Schlaf auf, ohne dich zu überfordern. Thomas hat es so gemacht. In der ersten Woche hat er nur das Handy weggelegt. In der zweiten Woche hat er nur den Kaffee weggelassen. In der dritten Woche hat er nur sein Schlafzimmer verdunkelt. In der vierten Woche hat er nur seine Schlafzeiten eingehalten. Nach 30 Tagen hatte er vier Dinge geändert, ohne sich überfordert zu fühlen. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Fang klein an, und bleib dran. Das ist der ganze Trick. Ein weiterer Punkt für den 30-Tage-Plan ist, dass du dir nicht vornehmen solltest, in 30 Tagen perfekt zu schlafen. Perfekt gibt es nicht. Es gibt nur besser. Wenn du nach 30 Tagen besser schläfst als vorher, dann hast du schon viel erreicht. Thomas hat nach 30 Tagen nicht perfekt geschlafen, aber er hat besser geschlafen als vorher. Er brauchte nur noch einen Kaffee statt zwei, er ist abends nicht mehr auf dem Sofa eingeschlafen, und er konnte wieder lachen, weil er nicht mehr so müde war. Das ist kein kleines Ding, das ist ein großes Ding. Denn wer besser schläft, lebt besser. Und das ist der Punkt: Schlaf ist kein Luxus, Schlaf ist Leben.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."], ["Was Thomas heute anders macht - und was du daraus lernen kannst", "Thomas schläft heute nicht perfekt. Er hat immer noch Nächte, in denen er schlecht schläft, weil er Schicht hat oder weil er krank ist. Aber er schläft besser als vor einem Jahr. Er geht um 22 Uhr ins Bett, wenn er Frühschicht hat, und um 23 Uhr, wenn er Spätschicht hat. Er trinkt keinen Kaffee nach 14 Uhr. Er legt sein Handy um 20 Uhr weg. Er hat ein Verdunkelungsrollo im Schlafzimmer und eine Schlafmaske, wenn er tagsüber schlafen muss. Er hat ein Atemgerät, das ihm nachts hilft, und er benutzt es jede Nacht, auch wenn es unbequem ist. Er schreibt abends auf, was ihn beschäftigt, damit er nicht grübelt. Und er steht jeden Tag zur gleichen Zeit auf, auch am Wochenende. Das ist kein perfektes Leben, aber es ist ein Leben, in dem er wieder wach ist. Er kann wieder Auto fahren, ohne einzuschlafen. Er kann wieder mit seinen Kindern spielen, ohne einzuschlafen. Er kann wieder lachen, ohne müde zu sein. Das ist mehr wert als jeder Schlaf, den man mit Schlafmitteln erzwingen kann. Und das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du wieder wach bist, nicht nur körperlich, sondern auch im Kopf. Dass du morgens aufwachst und dich fühlst, als hättest du wirklich geschlafen. Fang heute an. Mit einem Blatt Papier und einem Stift. Ein Beispiel, das Thomas heute noch erlebt: Er hat immer noch Nächte, in denen er schlecht schläft, weil er Nachtschicht hat oder weil er krank ist. Aber er weiß jetzt, was er tun kann, wenn er schlecht schläft. Er weiß, dass er nicht in Panik geraten muss, wenn er eine Nacht schlecht schläft. Er weiß, dass eine schlechte Nacht nicht heißt, dass er für immer schlecht schlafen wird. Er weiß, dass er am nächsten Tag trotzdem aufstehen und seinen Alltag machen kann, auch wenn er müde ist. Und er weiß, dass er am nächsten Abend wieder besser schlafen wird, wenn er seine Rituale einhält. Das ist der Unterschied zwischen früher und heute: Früher hatte er Angst vor dem Schlafengehen, weil er wusste, dass er nicht schlafen konnte. Heute freut er sich aufs Schlafengehen, weil er weiß, dass er schlafen kann. Das ist kein kleines Ding, das ist ein großes Ding. Denn wer sich aufs Schlafengehen freut, der hat sein Leben zurückbekommen. Und das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du dich wieder aufs Schlafengehen freust, dass du morgens aufwachst und dich fühlst, als hättest du wirklich geschlafen, und dass du den Tag nicht mehr mit Kaffee überleben musst, sondern mit Schlaf. Fang heute an. Mit einem Blatt Papier und einem Stift. Ein letzter Punkt, den Thomas gelernt hat, ist, dass man Schlaf nicht erzwingen kann. Je mehr man versucht, einzuschlafen, desto wacher wird man. Das ist, als würdest du versuchen, dich zu entspannen, indem du dir sagst: Entspann dich, entspann dich. Das funktioniert nicht. Was funktioniert, ist, loszulassen. Thomas hat gelernt, dass er nicht einschlafen muss. Er muss nur im Bett liegen und sich ausruhen. Wenn er einschläft, ist es gut. Wenn er nicht einschläft, ist es auch gut, weil er sich ausruht. Seit er das so sieht, schläft er schneller ein, weil er keinen Druck mehr hat. Er hat auch gelernt, dass eine schlechte Nacht nicht das Ende der Welt ist. Wenn er eine Nacht schlecht schläft, dann ist er am nächsten Tag müde, aber er weiß, dass er in der nächsten Nacht wieder besser schlafen wird. Er hat keine Angst mehr vor einer schlechten Nacht, weil er weiß, dass sie vorbeigeht. Das ist der Unterschied zwischen früher und heute: Früher hatte er Angst vor dem Schlafengehen, weil er wusste, dass er nicht schlafen konnte. Heute freut er sich aufs Schlafengehen, weil er weiß, dass er schlafen kann. Und das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du dich wieder aufs Schlafengehen freust. Ein letzter Punkt, den Thomas gelernt hat, ist, dass man Schlaf nicht erzwingen kann, aber man kann ihn einladen. Man kann sein Schlafzimmer dunkel und kühl machen, man kann das Handy weglegen, man kann keinen Kaffee nach 14 Uhr trinken, man kann ein Ritual machen, man kann aufschreiben, was einen beschäftigt. Das alles lädt den Schlaf ein. Ob er dann kommt, entscheidet dein Körper. Aber wenn du ihn jeden Abend einlädst, dann wird er kommen. Und wenn er einmal kommt, dann wird er immer öfter kommen. Das ist der Unterschied zwischen früher und heute: Früher hat Thomas versucht, den Schlaf zu erzwingen, und er ist nicht gekommen. Heute lädt er ihn ein, und er kommt. Und das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du den Schlaf einlädst und dass er kommt, jede Nacht, Nacht für Nacht.  Schlaf ist kein Zufall. Schlaf ist das Ergebnis von dem, was du am Tag machst, was du isst, was du trinkst, wann du das Handy weglegst, wie dunkel und kühl dein Schlafzimmer ist. Wenn du das verstehst, dann kannst du deinen Schlaf verändern, Nacht für Nacht, Schritt für Schritt."]], "kat": "Sachbücher", "unter": "Gesundheit"}, {"title": "Verstehe dich selbst - Aber richtig", "chapters": [["Die Frau, die immer Ja sagte, obwohl sie Nein meinte", "Anna ist 34, arbeitet in Bielefeld in einer Kita, und sie hat ein Problem, das sie lange nicht als Problem gesehen hat. Sie sagt immer Ja. Wenn ihre Kollegin fragt, ob sie ihre Schicht übernehmen kann, sagt Anna Ja, obwohl sie eigentlich frei haben wollte. Wenn ihre Mutter anruft und fragt, ob sie am Sonntag zum Essen kommen kann, sagt Anna Ja, obwohl sie eigentlich ausschlafen wollte. Wenn ihr Freund fragt, ob sie Lust hat, mit seinen Freunden Fußball zu schauen, sagt Anna Ja, obwohl sie eigentlich lieber ein Buch lesen wollte. Am Anfang dachte Anna, das sei nett. Sie dachte, nette Menschen sagen Ja. Dann hat sie gemerkt, dass sie immer müder wurde. Sie hatte keine Zeit mehr für sich selbst. Sie war gereizt, weil sie immer Dinge tat, die sie eigentlich nicht tun wollte. Eines Abends saß sie auf dem Sofa und hat geweint, ohne zu wissen, warum. Sie hatte alles, was man haben sollte: einen Job, einen Freund, eine Wohnung, Freunde. Aber sie fühlte sich leer. Sie ist zu einer Beratung gegangen. Die Beraterin hat sie gefragt: Wann hast du das letzte Mal etwas nur für dich getan, ohne dich dafür zu entschuldigen? Anna konnte sich nicht erinnern. Sie hat immer für andere gelebt, nie für sich selbst. Die Beraterin hat ihr gesagt: Du musst nicht lernen, egoistisch zu sein. Du musst lernen, dich selbst zu verstehen. Warum sagst du Ja, wenn du Nein meinst? Was hast du Angst zu verlieren, wenn du Nein sagst? Anna hat angefangen, darüber nachzudenken. Sie hat gemerkt, dass sie Angst hatte, dass andere sie nicht mehr mögen, wenn sie Nein sagt. Sie hatte als Kind gelernt, dass man geliebt wird, wenn man brav ist und Ja sagt. Als Erwachsene hat sie das immer noch geglaubt. In diesem Buch gehen wir genau das durch: Warum du so reagierst, wie du reagierst, was deine Gefühle dir wirklich sagen, und wie du lernen kannst, dich selbst zu verstehen, ohne dass du ein anderer Mensch werden musst. Was Anna danach noch gelernt hat, war, dass Ja sagen nicht immer nett ist. Manchmal ist Ja sagen unfair, weil man der anderen Person nicht die Wahrheit sagt. Wenn Anna zu ihrer Kollegin Ja gesagt hat, obwohl sie eigentlich Nein meinte, dann hat sie ihrer Kollegin nicht geholfen, sondern sie hat ihr vorgemacht, dass alles in Ordnung ist. In Wahrheit war Anna wütend, und ihre Kollegin hat das gespürt, ohne zu wissen, warum. Das hat ihre Beziehung schlechter gemacht, nicht besser. Als Anna angefangen hat, ehrlich Nein zu sagen, hat ihre Kollegin das zuerst komisch gefunden, aber nach einer Weile hat sie gesagt: Jetzt weiß ich wenigstens, woran ich bin. Das ist ehrlicher als ein Ja, das man nicht meint. Anna hat auch gelernt, dass man nicht für alles verantwortlich ist. Früher dachte sie, sie müsse alle Probleme lösen, die andere hatten. Wenn ihre Mutter traurig war, dann dachte Anna, sie müsse sie aufmuntern. Wenn ihr Freund gestresst war, dann dachte Anna, sie müsse ihn beruhigen. Heute weiß sie: Jeder ist für seine eigenen Gefühle verantwortlich. Sie kann da sein, sie kann zuhören, sie kann helfen, wenn sie will. Aber sie muss nicht die Gefühle von anderen reparieren. Das hat sie entlastet, weil sie nicht mehr das Gefühl hatte, dass sie für das Glück aller anderen verantwortlich ist. Sie ist nur für ihr eigenes Glück verantwortlich. Und das ist schon genug Arbeit. Ein weiterer Punkt, den Anna gelernt hat, ist, dass man nicht alles auf einmal ändern muss. Sie hat nicht von heute auf morgen angefangen, überall Nein zu sagen. Sie hat mit einer Sache angefangen: Sie hat einmal am Tag Nein gesagt, wenn sie Nein meinte. Nur einmal. Das war machbar. Nach einer Woche hat sie zweimal am Tag Nein gesagt. Nach einem Monat hat sie so oft Nein gesagt, wie sie Nein meinte. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Anna hat auch gelernt, dass Rückschläge normal sind. Es gab Tage, an denen sie wieder Ja gesagt hat, obwohl sie Nein meinte. Das war kein Scheitern, das war ein Rückfall. Sie hat sich nicht dafür bestraft, sondern sie hat gesagt: Okay, heute habe ich wieder Ja gesagt, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie etwas ändern. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird etwas ändern, Schritt für Schritt, Tag für Tag. Und das ist der Punkt: Es geht nicht darum, perfekt zu sein, sondern darum, dran zu bleiben, auch wenn es einmal nicht klappt. Was Anna am Ende am meisten geholfen hat, war nicht ein einzelner Trick, sondern die Erkenntnis, dass sie nicht kaputt ist, sondern dass sie ein Muster gelernt hat, das sie jetzt ändern kann. Sie ist nicht zu nett, sie ist nicht zu schwach, sie ist nicht zu dumm. Sie hat nur gelernt, immer Ja zu sagen, weil sie dachte, das sei der einzige Weg, um geliebt zu werden. Jetzt weiß sie, dass es einen anderen Weg gibt: Ehrlich zu sein, zu sich selbst und zu anderen. Und das ist der Weg, der sie frei macht.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Warum du in Stress immer gleich reagierst", "Wenn du gestresst bist, dann reagierst du immer gleich. Das ist kein Zufall, das ist ein Muster, das du als Kind gelernt hast. Es gibt drei Muster, die fast jeder kennt: Kämpfen, Fliehen, Erstarren. Wenn Anna gestresst war, dann hat sie gekämpft, indem sie noch mehr Ja gesagt hat. Sie hat noch mehr gearbeitet, noch mehr geholfen, noch mehr gelächelt, obwohl sie innerlich wütend war. Andere Menschen fliehen, wenn sie gestresst sind. Sie gehen weg, sie machen die Tür zu, sie schauen aufs Handy, sie sagen: Lass mich in Ruhe. Wieder andere erstarren. Sie sitzen da und wissen nicht, was sie tun sollen. Sie starren auf den Bildschirm und können sich nicht entscheiden. Welches Muster du hast, hängt davon ab, was du als Kind gelernt hast. Wenn deine Eltern dich gelobt haben, wenn du brav warst, dann hast du gelernt zu kämpfen, indem du brav bist. Wenn deine Eltern dich bestraft haben, wenn du wütend warst, dann hast du gelernt zu fliehen, wenn du wütend bist. Wenn deine Eltern dich ignoriert haben, wenn du traurig warst, dann hast du gelernt zu erstarren, wenn du traurig bist. Das ist kein Charakterfehler. Das ist ein Lernprogramm, das in deinem Gehirn gespeichert ist. Und das Gute ist: Ein Lernprogramm kann man ändern. Nicht über Nacht, aber Schritt für Schritt. Der erste Schritt ist, dein Muster zu erkennen. Wenn du das nächste Mal gestresst bist, dann frag dich: Was mache ich gerade? Kämpfe ich, fliehe ich, oder erstarre ich? Allein diese Frage hilft dir, weil du aus dem Autopilot aussteigst und wieder selbst entscheidest. Ein Beispiel, das zeigt, wie stark so ein Muster ist: Anna war im Urlaub und sollte sich eigentlich erholen. Aber sie hat im Urlaub genauso reagiert wie zu Hause. Sie hat Ja gesagt, als ihr Freund vorgeschlagen hat, jeden Tag etwas zu unternehmen, obwohl sie eigentlich einen Tag nur am Strand liegen wollte. Sie hat Ja gesagt, als ihre Mutter angerufen hat und gefragt hat, ob sie ihr helfen kann, obwohl sie im Urlaub war. Sie hat sogar im Urlaub noch E-Mails von der Arbeit beantwortet, weil sie dachte, sie müsse das tun. Das hat ihr gezeigt, dass ihr Muster nicht vom Ort abhängt, sondern von ihr selbst. Es ist egal, wo sie ist, sie reagiert immer gleich. Das ist der Grund, warum Urlaub oft nicht erholsam ist, wenn man sein Muster nicht ändert. Man nimmt sich selbst mit in den Urlaub. Die Lösung ist nicht, in den Urlaub zu fahren, sondern zu lernen, anders zu reagieren, egal wo man ist. Anna hat im zweiten Urlaub anders reagiert. Sie hat gesagt: Heute mache ich nichts, ich liege nur am Strand. Ihr Freund war zuerst enttäuscht, aber nach einer Stunde hat er sich zu ihr gelegt und gesagt: Eigentlich ist das ganz schön, einfach nur zu liegen. Das war ein Moment, in dem Anna gemerkt hat, dass Nein sagen nicht nur ihr hilft, sondern auch anderen. Weil andere dann auch merken, dass sie nicht immer etwas tun müssen, um glücklich zu sein. Ein weiterer Punkt ist, dass Stress nicht nur im Kopf ist, sondern auch im Körper. Wenn Anna gestresst war, dann hat sie nicht nur gedacht, dass sie gestresst ist, sondern sie hat es auch im Körper gespürt: Ihr Herz hat schneller geschlagen, ihre Hände haben geschwitzt, ihr Magen hat sich zusammengezogen. Das sind Signale, dass ihr Körper im Alarmzustand ist. Wenn du diese Signale erkennst, dann kannst du etwas dagegen tun, bevor es zu spät ist. Anna hat gelernt, dass sie, wenn sie merkt, dass ihr Herz schneller schlägt, eine Pause macht. Sie geht auf die Toilette, atmet dreimal tief durch, trinkt ein Glas Wasser, und geht dann zurück. Das dauert zwei Minuten, aber es hilft, weil ihr Körper wieder zur Ruhe kommt. Früher hat sie das nicht gemacht. Sie hat einfach weitergemacht, bis sie abends auf dem Sofa zusammengebrochen ist. Heute macht sie Pausen, wenn sie merkt, dass ihr Körper Alarm schlägt. Das ist kein Luxus, das ist Selbstfürsorge. Und Selbstfürsorge ist nicht egoistisch, sondern notwendig, damit man überhaupt für andere da sein kann. Wenn du selbst kaputt bist, kannst du für niemanden da sein. Wenn du für dich selbst sorgst, dann kannst du auch für andere da sein. Das hat Anna gelernt, und das hat ihr Leben verändert. Ein weiterer Punkt ist, dass man sein Muster nicht allein ändern muss. Anna hat sich Hilfe geholt, weil sie gemerkt hat, dass sie es allein nicht schafft. Sie ist zu einer Beratung gegangen, sie hat mit ihrer Freundin gesprochen, sie hat Bücher gelesen. Das ist kein Zeichen von Schwäche, sondern von Stärke, weil man erkennt, dass man Hilfe braucht und sich Hilfe holt. Wenn du merkst, dass du allein nicht weiterkommst, dann hol dir Hilfe. Das ist kein Versagen, das ist klug.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Gefühle sind keine Feinde - was sie dir wirklich sagen", "Viele Menschen denken, Gefühle seien ein Problem. Sie denken, man müsse Gefühle kontrollieren, unterdrücken, wegmachen. Das ist falsch. Gefühle sind Informationen. Wut sagt dir: Hier wurde eine Grenze überschritten. Trauer sagt dir: Hier hast du etwas verloren, das dir wichtig war. Angst sagt dir: Hier ist etwas, das dir gefährlich erscheint. Freude sagt dir: Hier ist etwas, das dir gut tut. Scham sagt dir: Hier hast du das Gefühl, dass du nicht dazugehörst. Wenn du deine Gefühle unterdrückst, dann unterdrückst du Informationen, die du brauchst, um gute Entscheidungen zu treffen. Anna hat ihre Wut jahrelang unterdrückt, weil sie dachte, nette Menschen seien nicht wütend. In Wahrheit war sie wütend, weil sie immer Ja gesagt hat, obwohl sie Nein meinte. Ihre Wut war ein Signal, dass sie ihre eigenen Grenzen nicht eingehalten hat. Als sie angefangen hat, ihre Wut ernst zu nehmen, hat sie angefangen, Nein zu sagen. Nicht aus Wut, sondern weil sie verstanden hat, was ihre Wut ihr sagen wollte. Ein zweites Beispiel: Wenn du Angst hast, vor einem Gespräch mit deinem Chef, dann sagt dir deine Angst, dass dir das Gespräch wichtig ist. Sie sagt dir nicht, dass du das Gespräch absagen sollst. Sie sagt dir, dass du dich vorbereiten sollst. Wenn du deine Angst ernst nimmst und dich vorbereitest, dann wird die Angst kleiner. Wenn du deine Angst ignorierst, dann wird sie größer. Gefühle sind wie Kinder, die nach Aufmerksamkeit rufen. Wenn du ihnen zuhörst, werden sie leiser. Wenn du sie ignorierst, werden sie lauter. Ein Beispiel, das viele kennen: Du bist wütend, weil dein Partner wieder die Spülmaschine nicht ausgeräumt hat. Du sagst nichts, weil du denkst, das sei nicht wichtig. Aber du bist innerlich wütend, und die Wut wird immer größer. Am Abend explodierst du wegen einer Kleinigkeit, und dein Partner versteht nicht, warum du so wütend bist. Das passiert, weil du deine Wut nicht ernst genommen hast, als sie noch klein war. Wenn du deine Wut ernst nimmst, wenn sie noch klein ist, dann kannst du sagen: Mich stört, dass die Spülmaschine noch voll ist. Das ist kein Drama, das ist eine Information. Dein Partner kann dann sagen: Oh, das habe ich vergessen, ich mache es gleich. Das ist besser, als drei Tage lang wütend zu sein und dann zu explodieren. Anna hat das gelernt. Früher hat sie ihre Wut unterdrückt, bis sie explodiert ist. Heute sagt sie ihre Wut, wenn sie noch klein ist. Sie sagt: Ich bin gerade wütend, weil ich das Gefühl habe, dass ich alles alleine mache. Das ist kein Vorwurf, das ist ein Gefühl. Und ihr Freund kann darauf reagieren, ohne sich angegriffen zu fühlen. Das hat ihre Beziehung besser gemacht, weil sie nicht mehr explodiert, sondern spricht, bevor es zu spät ist. Gefühle sind wie ein Feueralarm. Wenn du ihn ignorierst, wird das Feuer größer. Wenn du ihn ernst nimmst, kannst du das Feuer löschen, bevor es groß wird. Ein weiterer Punkt zu Gefühlen ist, dass man sie nicht wegmachen kann, indem man sie ignoriert. Wenn du wütend bist und sagst: Ich darf nicht wütend sein, dann wird die Wut nicht weg, sondern sie wird größer. Sie staut sich an, bis sie irgendwann explodiert. Anna hat das erlebt. Sie hat ihre Wut jahrelang unterdrückt, bis sie eines Abends wegen einer Kleinigkeit explodiert ist und ihren Freund angeschrien hat, obwohl er gar nichts Schlimmes gemacht hatte. Sie hat sich danach geschämt und hat sich gefragt, warum sie so überreagiert hat. Die Antwort war: Weil sie ihre Wut zu lange unterdrückt hatte. Wenn sie ihre Wut früher ernst genommen hätte, dann hätte sie nicht explodieren müssen. Sie hätte sagen können: Ich bin wütend, weil ich das Gefühl habe, dass ich alles alleine mache. Das wäre kein Drama gewesen, das wäre ein Gespräch gewesen. Heute macht Anna das so. Sie sagt ihre Gefühle, wenn sie noch klein sind, nicht wenn sie schon groß sind. Sie sagt: Ich bin gerade traurig, weil ich das Gefühl habe, dass du mir nicht zuhörst. Das ist kein Vorwurf, das ist ein Gefühl. Und ihr Freund kann darauf reagieren, ohne sich angegriffen zu fühlen. Das hat ihre Beziehung besser gemacht, weil sie nicht mehr explodiert, sondern spricht, bevor es zu spät ist. Gefühle sind wie Wetter. Manchmal ist es sonnig, manchmal regnet es, manchmal stürmt es. Man kann das Wetter nicht kontrollieren, aber man kann lernen, damit umzugehen. Wenn es regnet, nimmt man einen Regenschirm. Wenn es stürmt, bleibt man zu Hause. So ist es auch mit Gefühlen. Man kann sie nicht wegmachen, aber man kann lernen, damit umzugehen. Und wenn man lernt, damit umzugehen, dann wird man ruhiger, auch wenn es draußen stürmt.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Deine Kindheit - was du gelernt hast, ohne es zu merken", "Als Kind hast du nicht nur gelernt, wie man spricht und wie man läuft. Du hast auch gelernt, wie man mit Gefühlen umgeht, wie man mit anderen Menschen umgeht, und was man tun muss, um geliebt zu werden. Anna hat als Kind gelernt, dass sie geliebt wird, wenn sie brav ist, wenn sie nicht widerspricht, wenn sie immer hilft. Ihre Eltern haben sie gelobt, wenn sie Ja gesagt hat, und sie haben sie kritisiert, wenn sie Nein gesagt hat. Sie hat gelernt: Ja sagen heißt geliebt werden. Nein sagen heißt abgelehnt werden. Als Erwachsene hat sie das immer noch geglaubt, obwohl ihre Eltern das nie so gemeint haben. Sie wollten nur, dass sie ein nettes Kind ist. Aber Anna hat daraus eine Regel gemacht, die ihr ganzes Leben bestimmt hat: Ich muss immer Ja sagen, sonst mag mich keiner. Viele Menschen haben solche Regeln, ohne es zu wissen. Zum Beispiel: Ich muss immer perfekt sein, sonst bin ich nichts wert. Oder: Ich darf keine Fehler machen, sonst lachen alle über mich. Oder: Ich muss immer stark sein, sonst bin ich schwach. Diese Regeln sind wie Brillen, durch die du die Welt siehst. Wenn du eine Brille trägst, die sagt: Ich muss immer perfekt sein, dann siehst du jeden Fehler als Katastrophe. Wenn du die Brille absetzt und fragst: Stimmt diese Regel wirklich? Dann merkst du, dass sie nicht stimmt. Niemand ist immer perfekt. Fehler sind normal. Und Menschen, die dich wirklich mögen, mögen dich auch, wenn du Nein sagst. Die Aufgabe ist, deine alten Regeln zu finden und zu prüfen, ob sie heute noch stimmen. Ein Beispiel, das zeigt, wie tief solche Regeln sitzen: Anna hat einmal in einer Besprechung eine Idee gehabt, aber sie hat sie nicht gesagt, weil sie dachte, sie sei nicht gut genug. Nach der Besprechung hat eine Kollegin die gleiche Idee gesagt, und alle haben sie gelobt. Anna war wütend auf sich selbst, weil sie ihre Idee nicht gesagt hatte. Sie hat gemerkt, dass ihre Regel Ich muss immer perfekt sein, sonst bin ich nichts wert, sie daran gehindert hat, ihre Idee zu sagen. Sie dachte, ihre Idee müsse perfekt sein, sonst dürfe sie sie nicht sagen. In Wahrheit war ihre Idee gut genug, auch wenn sie nicht perfekt war. Das ist der Punkt: Perfekt gibt es nicht. Jede Idee, die man nicht sagt, ist eine verpasste Chance. Anna hat angefangen, ihre Ideen zu sagen, auch wenn sie nicht perfekt sind. Sie hat gesagt: Ich habe eine Idee, sie ist noch nicht ganz ausgereift, aber vielleicht hilft sie uns weiter. Das war schwer, weil sie sich dabei verletzlich gefühlt hat. Aber es hat funktioniert, weil ihre Kollegen ihre Ideen geschätzt haben, auch wenn sie nicht perfekt waren. Sie haben gesagt: Danke, dass du das gesagt hast, das hilft uns. Das hat Anna gezeigt, dass ihre Regel nicht stimmt. Man muss nicht perfekt sein, um etwas Wertvolles zu sagen. Man muss nur mutig genug sein, es zu sagen, auch wenn es nicht perfekt ist. Ein weiterer Punkt zu Kindheit ist, dass man seine Eltern nicht dafür verantwortlich machen muss, was sie damals gemacht haben. Anna hat lange gedacht, ihre Eltern seien schuld daran, dass sie immer Ja sagt. Sie hat ihnen Vorwürfe gemacht, innerlich, ohne es ihnen zu sagen. Das hat ihr nicht geholfen, weil sie dadurch in der Opferrolle geblieben ist. Sie hat gedacht: Ich bin so, weil meine Eltern so waren. Erst als sie verstanden hat, dass ihre Eltern es nicht böse gemeint haben, sondern dass sie es selbst nicht besser wussten, konnte sie loslassen. Sie hat ihren Eltern vergeben, nicht weil sie alles richtig gemacht haben, sondern weil sie verstanden hat, dass sie auch nur Menschen sind, die ihre eigenen Muster hatten. Ihre Mutter hat auch immer Ja gesagt, weil sie es so gelernt hat. Ihr Vater hat auch immer alles alleine gemacht, weil er es so gelernt hat. Anna hat das Muster von ihren Eltern übernommen, ohne es zu merken. Aber sie ist nicht dazu verurteilt, das Muster für immer zu wiederholen. Sie kann es ändern, weil sie es jetzt erkannt hat. Und das ist der Punkt: Man kann seine Kindheit nicht ändern, aber man kann ändern, was man daraus macht. Man kann die alten Regeln prüfen und fragen: Stimmen sie heute noch? Und wenn sie nicht mehr stimmen, dann kann man neue Regeln aufstellen, die zu dem Leben passen, das man heute führen will. Deine Kindheit ist nicht deine Schuld, aber sie ist deine Verantwortung. Du kannst nicht ändern, was deine Eltern damals gemacht haben, aber du kannst ändern, was du heute daraus machst. Du kannst die alten Regeln prüfen, du kannst neue Regeln aufstellen, du kannst neue Muster lernen. Das ist Arbeit, aber es ist Arbeit, die sich lohnt, weil sie dich frei macht von den alten Mustern, die dich heute noch gefangen halten.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Der innere Kritiker - warum du so hart zu dir selbst bist", "Anna hat eine Stimme in ihrem Kopf, die immer sagt: Du bist nicht gut genug. Du hast wieder Ja gesagt, obwohl du Nein wolltest. Du bist zu schwach. Du bist zu nett. Du bist zu dumm. Diese Stimme nennt man den inneren Kritiker. Fast jeder Mensch hat ihn. Er ist wie ein Lehrer, der immer nur kritisiert und nie lobt. Woher kommt er? Meistens von den Stimmen, die wir als Kind gehört haben. Wenn deine Eltern oft gesagt haben: Das kannst du besser, dann hast du diese Stimme übernommen und sagst sie dir heute selbst. Wenn deine Lehrer gesagt haben: Du bist faul, dann sagst du dir heute selbst: Ich bin faul. Der innere Kritiker will dich eigentlich schützen. Er will, dass du keine Fehler machst, damit du nicht abgelehnt wirst. Aber er macht das Gegenteil. Er macht dich klein, er macht dich ängstlich, er macht dich müde. Wie gehst du mit ihm um? Erstens: Erkenne ihn. Wenn du merkst, dass du dich selbst kritisierst, dann sag dir: Ah, da ist wieder mein innerer Kritiker. Zweitens: Sprich mit ihm, als wäre er ein Mensch. Sag ihm: Danke, dass du mich schützen willst, aber ich brauche dich gerade nicht. Drittens: Frag dich: Würde ich das zu meiner besten Freundin sagen? Wenn Anna zu ihrer Freundin sagen würde: Du bist zu schwach, weil du Ja gesagt hast, dann wäre sie keine gute Freundin. Warum sagt sie das zu sich selbst? Wenn du lernst, freundlicher zu dir selbst zu sein, dann wird der innere Kritiker leiser. Nicht weg, aber leiser. Und das reicht schon, um besser mit dir selbst umzugehen. Ein Beispiel, das zeigt, wie der innere Kritiker arbeitet: Anna steht vor dem Spiegel und sagt zu sich selbst: Du siehst heute schrecklich aus. Du hast wieder zugenommen. Du hast Falten. Du bist nicht schön genug. Würde sie das zu ihrer besten Freundin sagen? Nein, niemals. Sie würde zu ihrer Freundin sagen: Du siehst gut aus, du hast eine tolle Ausstrahlung, du bist schön, so wie du bist. Warum sagt sie das zu sich selbst nicht? Weil sie gelernt hat, hart zu sich selbst zu sein, um sich zu schützen. Sie denkt, wenn sie hart zu sich selbst ist, dann ist sie vorbereitet, wenn andere hart zu ihr sind. In Wahrheit macht sie sich damit nur kleiner. Die Lösung ist nicht, sich selbst zu belügen und zu sagen: Ich bin perfekt. Die Lösung ist, freundlicher zu sich selbst zu sein. Anna hat angefangen, jeden Abend drei Dinge aufzuschreiben, die sie an dem Tag gut gemacht hat. Nicht große Dinge, sondern kleine: Ich habe Nein gesagt, als ich Nein meinte. Ich habe eine Pause gemacht, als ich müde war. Ich habe meiner Freundin zugehört, als sie traurig war. Das hat ihr gezeigt, dass sie nicht nur Fehler macht, sondern auch gute Dinge. Und es hat ihren inneren Kritiker leiser gemacht, weil er nicht mehr die einzige Stimme in ihrem Kopf war. Es gab jetzt auch eine Stimme, die sagte: Du hast heute etwas gut gemacht. Und das reicht schon, um besser mit sich selbst umzugehen. Ein weiterer Punkt zum inneren Kritiker ist, dass er oft lauter wird, wenn man müde ist oder gestresst. Anna hat gemerkt, dass ihr innerer Kritiker abends am lautesten war, wenn sie müde war. Er hat gesagt: Du hast heute wieder nichts geschafft. Du bist zu faul. Du bist zu dumm. Am Morgen, wenn sie ausgeschlafen war, war er leiser. Das hat ihr gezeigt, dass der innere Kritiker nicht die Wahrheit sagt, sondern dass er ein Symptom von Müdigkeit und Stress ist. Wenn du müde bist, dann bist du anfälliger für Selbstkritik. Wenn du ausgeschlafen bist, dann bist du freundlicher zu dir selbst. Deshalb ist es wichtig, gut zu schlafen, Pausen zu machen, und sich nicht zu überfordern. Denn wenn du überfordert bist, dann wird dein innerer Kritiker lauter, und du glaubst ihm eher. Anna hat gelernt, dass sie, wenn ihr innerer Kritiker laut wird, zuerst fragt: Bin ich gerade müde? Bin ich gerade gestresst? Habe ich heute genug gegessen und getrunken? Oft war die Antwort Ja, und dann hat sie sich erst einmal ausgeruht, bevor sie sich selbst kritisiert hat. Das hat ihr geholfen, weil sie gemerkt hat, dass der innere Kritiker nicht immer Recht hat. Manchmal ist er nur ein Zeichen dafür, dass man eine Pause braucht. Der innere Kritiker wird nie ganz verschwinden. Er wird immer da sein, leise im Hintergrund. Aber er muss nicht mehr der Chef in deinem Kopf sein. Du kannst ihn zu einem Berater machen, der dir sagt, was du besser machen kannst, ohne dich dabei klein zu machen. Wenn er sagt: Du hast einen Fehler gemacht, dann kannst du sagen: Ja, das stimmt, und ich lerne daraus. Das ist ein Unterschied zwischen Kritik, die dich klein macht, und Kritik, die dich weiterbringt.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Nein sagen - ohne schlechtes Gewissen", "Anna hat gelernt, Nein zu sagen, ohne sich schlecht zu fühlen. Das war nicht leicht. Am Anfang hat sie sich nach jedem Nein schlecht gefühlt. Sie dachte, die andere Person sei jetzt sauer auf sie. In Wahrheit war die andere Person oft gar nicht sauer. Sie hat einfach jemand anderen gefragt. Anna hat gelernt, dass ein Nein kein Drama ist. Es ist eine Information. Wenn du Nein sagst, dann sagst du: Ich kann das jetzt nicht, weil ich etwas anderes vorhabe. Das ist kein Angriff auf die andere Person. Es ist eine Entscheidung für dich selbst. Wie sagst du Nein, ohne dich schlecht zu fühlen? Erstens: Sag nicht sofort Ja. Sag: Ich muss kurz nachdenken, ich melde mich in einer Stunde. Das gibt dir Zeit, zu überlegen, ob du wirklich Ja sagen willst. Zweitens: Sag Nein ohne lange Erklärung. Du musst dich nicht rechtfertigen. Ein einfaches: Nein, das geht bei mir heute nicht, reicht. Wenn du dich lange rechtfertigst, dann fühlt sich das Nein wie eine Lüge an. Drittens: Biete eine Alternative an, wenn du willst. Zum Beispiel: Heute kann ich nicht, aber nächste Woche könnte ich. Das zeigt, dass du helfen willst, aber nicht heute. Viertens: Halte das schlechte Gewissen aus. Es wird da sein, am Anfang. Es ist wie ein Muskel, der wehtut, wenn man ihn trainiert. Nach einer Weile wird es weniger. Anna hat nach drei Monaten gemerkt, dass sie kein schlechtes Gewissen mehr hatte, wenn sie Nein sagte. Sie hatte ein gutes Gefühl, weil sie sich selbst ernst genommen hatte. Das ist der Unterschied zwischen Nein sagen aus Angst und Nein sagen aus Selbstachtung. Ein Beispiel, das zeigt, wie schwer Nein sagen am Anfang ist: Anna hat das erste Mal Nein gesagt, als ihre Chefin sie gefragt hat, ob sie am Samstag arbeiten kann. Sie hat gesagt: Nein, das geht bei mir am Samstag nicht, weil ich schon etwas vorhabe. Ihre Chefin hat gesagt: Okay, dann frage ich jemand anderen. Anna war danach eine Stunde lang nervös. Sie dachte, ihre Chefin sei jetzt sauer auf sie. Sie dachte, sie würde ihren Job verlieren. In Wahrheit hat ihre Chefin das schon nach fünf Minuten vergessen. Sie hat jemand anderen gefragt, und der hat Ja gesagt. Anna hat gelernt, dass ein Nein oft viel weniger Drama ist, als man denkt. Man stellt sich vor, dass die andere Person tagelang sauer ist, aber in Wahrheit ist sie nach fünf Minuten schon wieder bei etwas anderem. Das ist der Grund, warum Nein sagen am Anfang so schwer ist: Man überschätzt, wie schlimm es wird. Wenn man es einmal gemacht hat, merkt man, dass es gar nicht so schlimm war. Und beim zweiten Mal ist es schon leichter. Beim dritten Mal ist es schon fast normal. Anna sagt heute Nein, ohne darüber nachzudenken, wenn sie Nein meint. Das ist kein Talent, das ist Übung. Und Übung macht den Meister, auch beim Nein sagen. Ein weiterer Punkt zu Nein sagen ist, dass man auch zu sich selbst Nein sagen muss. Anna hat nicht nur zu anderen Ja gesagt, sondern auch zu sich selbst. Sie hat zu sich selbst Ja gesagt, wenn sie eigentlich Nein meinte. Zum Beispiel: Sie hat Ja gesagt zu noch einer Folge auf Netflix, obwohl sie eigentlich schlafen wollte. Sie hat Ja gesagt zu noch einem Stück Kuchen, obwohl sie eigentlich satt war. Sie hat Ja gesagt zu noch einer Stunde Arbeit, obwohl sie eigentlich Feierabend machen wollte. Das ist das gleiche Muster, nur gegen sich selbst gerichtet. Sie hat gelernt, auch zu sich selbst Nein zu sagen. Sie sagt zu sich selbst: Nein, ich schaue jetzt keine Folge mehr, ich gehe ins Bett, weil ich morgen fit sein will. Nein, ich esse jetzt kein Stück Kuchen mehr, weil ich satt bin. Nein, ich arbeite jetzt nicht mehr weiter, weil ich Feierabend habe. Das ist schwer, weil man sich selbst nicht widersprechen will. Aber es ist wichtig, weil man sonst immer über seine eigenen Grenzen geht. Und wenn man immer über seine eigenen Grenzen geht, dann ist man irgendwann kaputt. Anna hat gelernt, dass Nein sagen zu sich selbst genauso wichtig ist wie Nein sagen zu anderen. Denn wer nicht zu sich selbst Nein sagen kann, der kann auch zu anderen nicht Nein sagen. Nein sagen ist kein einmaliges Ereignis, sondern eine Gewohnheit, die man jeden Tag übt. Am Anfang ist es schwer, weil man es nicht gewohnt ist. Nach einer Weile wird es leichter, weil man merkt, dass die Welt nicht untergeht, wenn man Nein sagt. Und nach einer Weile wird es normal, weil man merkt, dass man sich selbst ernst nimmt, wenn man Nein sagt, wenn man Nein meint. Und das ist der Punkt: Nein sagen ist kein Egoismus, sondern Selbstachtung.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, jemand zu sein, der du nicht bist, sondern wenn du anfängst, du selbst zu sein, mit deinen Stärken, mit deinen Schwächen, mit deinen Gefühlen, mit deinen Grenzen. Wenn du das tust, dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und wenn du mit dir selbst bist, dann kannst du auch besser mit anderen sein. Das ist der Weg, um dich selbst wirklich zu verstehen, und das ist der Weg, der dich frei macht, Schritt für Schritt, Tag für Tag."], ["Streit - was wirklich dahinter steckt", "Anna und ihr Freund haben sich oft gestritten, weil sie immer Ja gesagt hat und dann wütend war, weil sie eigentlich Nein meinte. Er hat nicht verstanden, warum sie wütend war, weil sie doch Ja gesagt hatte. Sie hat nicht verstanden, warum er nicht gemerkt hat, dass sie eigentlich Nein meinte. Das ist ein typischer Streit: Zwei Menschen reden aneinander vorbei, weil keiner sagt, was er wirklich will. In einem Streit geht es selten um das, worum es zu gehen scheint. Wenn Anna und ihr Freund sich darüber gestritten haben, wer den Müll rausbringt, dann ging es nicht um den Müll. Es ging darum, dass Anna sich nicht gesehen fühlte, weil sie immer alles gemacht hat, und er sich nicht gesehen fühlte, weil er dachte, er mache schon genug. In einem Streit geht es oft um drei Dinge: Ich will gesehen werden. Ich will gehört werden. Ich will ernst genommen werden. Wenn du das verstehst, dann kannst du anders streiten. Statt zu sagen: Du machst nie etwas, sag: Ich fühle mich überfordert, weil ich das Gefühl habe, dass ich alles alleine mache. Das ist kein Vorwurf, das ist ein Gefühl. Und Gefühle kann man nicht bestreiten. Man kann sagen: Ich sehe das anders, aber man kann nicht sagen: Du fühlst das nicht. Anna hat gelernt, in einem Streit nicht mehr zu sagen: Du bist immer so, sondern: Ich fühle mich so, wenn das passiert. Das hat ihre Streits verändert, weil ihr Freund nicht mehr das Gefühl hatte, angegriffen zu werden, sondern das Gefühl hatte, dass Anna ihm sagt, wie es ihr geht. Und das ist der Anfang von einem echten Gespräch. Ein Beispiel, das zeigt, wie man anders streiten kann: Anna und ihr Freund haben sich einmal darüber gestritten, wer das Bad putzen soll. Früher hätte Anna gesagt: Du machst nie etwas, ich muss immer alles machen. Ihr Freund hätte gesagt: Das stimmt nicht, ich habe gestern den Müll rausgebracht. Dann hätten sie sich darüber gestritten, wer was gemacht hat, und am Ende wären beide wütend gewesen. Heute macht Anna es anders. Sie sagt: Ich fühle mich überfordert, weil ich das Gefühl habe, dass ich das Bad immer alleine putze. Ich brauche Hilfe. Ihr Freund sagt dann: Okay, ich putze das Bad am Samstag, und du machst dafür die Wäsche. Das ist kein Streit, das ist eine Verhandlung. Der Unterschied ist, dass Anna nicht mehr sagt: Du bist schuld, sondern: Ich fühle mich so. Das ist kein Vorwurf, das ist ein Gefühl. Und Gefühle kann man nicht bestreiten. Man kann sagen: Ich sehe das anders, aber man kann nicht sagen: Du fühlst das nicht. Das hat ihre Streits verändert, weil sie nicht mehr darüber streiten, wer Recht hat, sondern darüber, wie sie sich fühlen und was sie brauchen. Und das ist der Anfang von einem echten Gespräch, bei dem beide gewinnen. Ein weiterer Punkt zu Streit ist, dass man in einem Streit oft nicht zuhört, sondern nur darauf wartet, dass man selbst reden kann. Anna hat das gemerkt, als sie sich mit ihrem Freund gestritten hat. Er hat etwas gesagt, und sie hat schon während er noch gesprochen hat, darüber nachgedacht, was sie darauf antworten will. Sie hat ihm gar nicht zugehört. Sie hat nur darauf gewartet, dass er aufhört zu reden, damit sie selbst reden kann. Das ist kein Zuhören, das ist Warten. Echtes Zuhören heißt, dass man dem anderen zuhört, ohne schon zu überlegen, was man darauf antworten will. Anna hat gelernt, dass sie, wenn ihr Freund spricht, erst einmal nur zuhört, ohne zu unterbrechen, ohne zu widersprechen. Sie nickt, sie sagt: Hmm, sie sagt: Ich verstehe. Und erst wenn er fertig ist, sagt sie, was sie denkt. Das hat ihre Streits verändert
