s nimmt ihre Hand. Und für einen Moment ist alles still und richtig. Am Ende dieses Kapitels weiß Tom: Es geht weiter. Es muss weitergehen. Denn diese Geschichte ist noch lange nicht zu Ende - und das nächste Kapitel wird alles entscheiden. Wenn du weiterliest, wirst du erfahren, was als Nächstes passiert. Bleib dran."]], "kat": "Romane", "unter": "Mystery"}, {"title": "Das stille Haus in der Senne - Ein Krimi aus Bielefeld", "chapters": [["1. Die Rückkehr", "Mara stand am Bahnhof von Bielefeld und wusste nicht, ob sie wirklich aussteigen sollte. Der Zug war schon weitergefahren, die Türen waren zu, und auf dem Bahnsteig roch es nach Regen und nach Pommes vom Kiosk. Fünfzehn Jahre war sie nicht mehr hier gewesen. Fünfzehn Jahre, in denen sie sich gesagt hatte, dass sie nie wieder zurückkommen würde. Und jetzt stand sie hier, mit einem Koffer, der zu schwer war, und einer Tasche, in der ihr Laptop, ihr Notizbuch und ein altes Foto lagen. Auf dem Foto war sie zwölf, sie stand vor einem Haus in der Senne, und neben ihr stand ihre Großmutter, die Hand auf ihrer Schulter. Das Haus gibt es noch. Das wusste Mara. Was sie nicht wusste, war, ob sie es betreten konnte. Sie nahm ein Taxi. Der Fahrer fragte, wohin. In die Senne, sagte Mara. Zum alten Haus am Waldrand. Der Fahrer schaute sie im Rückspiegel an. Da wohnt doch keiner mehr, sagte er. Doch, sagte Mara. Jetzt wieder ich. Er fuhr los, ohne weiter zu fragen. Vorbei an Straßen, die sie kannte, und an Straßen, die sie nicht mehr kannte. Neue Häuser, neue Supermärkte, ein Kreisverkehr, wo früher eine Wiese war. Als sie in die kleine Straße einbogen, wurde ihr Herz schneller. Da war es. Das Haus. Grau, mit grünen Fensterläden, ein Garten, der verwildert war, und eine Schaukel, die immer noch am Baum hing. Mara bezahlte, stieg aus und stand lange vor dem Gartentor. Der Schlüssel lag noch unter dem Blumentopf, genau wie früher. Sie schloss auf. Die Tür knarrte. Drinnen roch es nach Staub und nach Holz und ein bisschen nach dem Parfüm ihrer Großmutter. Auf dem Tisch im Wohnzimmer lag eine Staubschicht, und auf der Staubschicht lag ein Zettel. Mara nahm ihn in die Hand. Ihre Großmutter hatte ihn geschrieben, kurz vor ihrem Tod. Darauf stand nur ein Satz: Mara, schau im Keller nach. Nicht im Schrank. Im Keller. Sie legte den Zettel zurück und ging durchs Haus. Küche, Schlafzimmer, Bad. Alles war noch da, wie sie es verlassen hatte. Die Tassen im Schrank. Die Decke auf dem Sofa. Das Bild an der Wand, das sie als Kind gemalt hatte. Ein schiefes Haus mit einer Sonne, die viel zu groß war. Sie setzte sich aufs Sofa und merkte erst da, wie müde sie war. Nicht nur vom Zug. Von den letzten Monaten. Von der Arbeit in Hamburg, von der Redaktion, die sie verlassen hatte, von dem Artikel, den sie nicht mehr schreiben konnte. Sie war gekommen, um Ruhe zu finden. Stattdessen hatte sie einen Zettel gefunden, der sagte: Schau im Keller nach. Am Abend ging sie in den Keller. Die Treppe knarrte. Unten war es kalt. Sie schaltete das Licht an. Da standen Kisten, ein altes Fahrrad, ein Regal mit Einmachgläsern. Und an der Wand hing eine Tür, die sie noch nie gesehen hatte. Oder doch? Sie hatte sie als Kind einmal gesehen und ihre Großmutter hatte gesagt: Da ist nur die Heizung drin. Mara legte die Hand auf die Türklinke. Sie war kalt. Sie drückte sie runter. Die Tür war verschlossen. Sie rüttelte daran. Nichts. Sie ging wieder nach oben, holte einen Schraubenzieher, kam zurück und versuchte es noch einmal. Die Tür blieb zu. In dieser Nacht schlief Mara schlecht. Sie hörte den Wind im Garten, sie hörte die Schaukel quietschen, sie hörte ein Geräusch, das sie nicht einordnen konnte. War es ein Tier? War es der Wind? War es jemand, der ums Haus ging? Sie stand auf, schaute aus dem Fenster. Der Garten war leer. Nur die Schaukel bewegte sich leicht, obwohl kaum Wind war. Mara zog die Decke bis zum Kinn und dachte an den Zettel. Morgen, dachte sie. Morgen finde ich heraus, was im Keller ist. Und dann fahre ich wieder nach Hamburg. Das sagte sie sich. Aber tief in ihr wusste sie schon, dass sie bleiben würde. Sie dachte an Hamburg, an die laute Redaktion, an die Artikel, die sie nicht mehr schreiben wollte, weil sie sich leer anfühlten. Sie dachte an ihre Großmutter, die immer gesagt hatte: Wenn du nicht weißt, wohin du gehörst, dann geh nach Hause. Mara hatte damals gelacht. Jetzt verstand sie es. Sie stand auf, ging in die Küche, trank Wasser und schaute aus dem Fenster in den dunklen Garten. Irgendwo da draußen, zwischen den Bäumen, stand das Haus, in dem sie aufgewachsen war. Und irgendwo darin war eine Tür, die sie noch nie geöffnet hatte. Mara ging in die Küche und machte sich einen zweiten Kaffee. Sie setzte sich ans Fenster und schaute in den Garten. Der Garten war verwildert, aber sie sah schon, was daraus werden könnte. Ein Beet für Kräuter. Ein Platz für einen Tisch. Eine Schaukel, die wieder gerade hing. Sie nahm ihr Notizbuch und schrieb auf, was sie am Haus machen wollte. Nicht alles auf einmal. Erst die Fenster. Dann die Heizung. Dann den Garten. Sie dachte an ihre Großmutter, die immer gesagt hatte: Ein Haus ist wie ein Mensch. Man muss sich darum kümmern, sonst wird es traurig. Mara lächelte. Das Haus war lange traurig gewesen. Jetzt würde sie sich darum kümmern. Sie ging nach draußen, holte einen Besen und fing an, die Terrasse zu fegen. Es war harte Arbeit, aber es tat gut. Als sie fertig war, setzte sie sich auf die Terrasse und trank ihren Kaffee. Die Sonne schien. Ein Nachbar kam vorbei und sagte: Schön, dass wieder jemand hier wohnt. Mara sagte: Ja. Ich bleibe erst einmal. Der Nachbar nickte und ging weiter. Mara blieb sitzen und dachte: Vielleicht ist das der Anfang von etwas Neuem. Nicht nur für das Haus. Auch für mich. Mara schloss das Notizbuch und wusste, dass sie am nächsten Tag wieder in den Keller gehen würde, weil sie noch nicht alles gesehen hatte, was ihre Großmutter aufgeschrieben hatte, und weil sie spürte, dass der wichtigste Ordner noch fehlte. Mara trank ihren Kaffee langsam aus und schaute noch einmal aus dem Fenster, weil sie das Gefühl hatte, dass sie etwas Wichtiges übersehen hatte, das direkt vor ihr lag."], ["2. Die Tür im Keller", "Am nächsten Morgen kochte Mara Kaffee und setzte sich an den Küchentisch. Draußen schien die Sonne, die Vögel sangen, und für einen Moment sah alles ganz normal aus. Ein altes Haus, ein Garten, ein freier Tag. Sie hätte spazieren gehen können. Sie hätte die Nachbarn besuchen können. Stattdessen ging sie wieder in den Keller. Die Tür war immer noch da. Sie klopfte dagegen. Hinter der Tür klang es hohl. Nicht wie eine Wand. Wie ein Raum. Sie ging nach oben und rief ihre Mutter an. Mama, sagte sie, im Keller ist eine Tür, die ich nicht kenne. Was ist dahinter? Am anderen Ende war es lange still. Dann sagte ihre Mutter: Das hat deine Großmutter nie erzählt. Sie hat immer gesagt, der Keller ist nur Keller. Mara fragte: Und du hast nie nachgeschaut? Nein, sagte ihre Mutter. Ich hatte Angst. Mara lachte kurz. Angst wovor? Vor dem, was wir finden könnten, sagte ihre Mutter. Und dann legte sie auf. Mara fuhr in den Baumarkt und kaufte einen Bolzenschneider, eine Taschenlampe und ein neues Vorhängeschloss. Der Verkäufer fragte, ob sie einbricht. Nein, sagte Mara. Ich breche in mein eigenes Haus ein. Zu Hause legte sie die Taschenlampe auf den Tisch und schaute sich die Tür genauer an. Die Tür war alt, das Holz war dunkel, das Schloss war neu. Nicht alt. Neu. Jemand hatte das Schloss in den letzten Jahren ausgetauscht. Wer? Ihre Großmutter war vor zwei Jahren gestorben. Wer war seitdem im Haus gewesen? Sie versuchte es mit dem Bolzenschneider. Das Schloss gab nicht nach. Sie versuchte es mit einem Dietrich, den sie aus einem Video kannte. Auch das klappte nicht. Sie setzte sich auf die Kellertreppe und dachte nach. Vielleicht gab es einen Schlüssel. Vielleicht lag er irgendwo im Haus. Sie durchsuchte alle Schubladen. In der Kommode im Schlafzimmer fand sie alte Briefe. In der Küche fand sie ein altes Kochbuch. Im Wohnzimmer fand sie unter dem Sofa eine kleine Metallbox. Darin lag ein Schlüssel. Klein, aus Messing, mit einem Anhänger, auf dem ein Wort stand: Keller. Mara nahm den Schlüssel und ging wieder runter. Ihre Hände zitterten ein bisschen. Sie steckte den Schlüssel ins Schloss. Er passte. Sie drehte ihn um. Klick. Die Tür ging auf. Dahinter war ein kleiner Raum. Kein Heizungsraum. Ein Raum mit einem Tisch, einem Stuhl und einem Regal. Auf dem Regal standen Ordner. Viele Ordner. Auf dem Tisch lag ein Notizbuch. Mara öffnete es. Auf der ersten Seite stand in der Handschrift ihrer Großmutter: Wenn du das liest, dann bist du bereit. Ich habe es dir nie erzählt, weil ich dich schützen wollte. Aber jetzt musst du es wissen. Sie las weiter. Ihre Großmutter hatte über Jahre hinweg etwas beobachtet. Im Dorf verschwanden Dinge. Erst kleine Dinge. Ein Fahrrad. Ein Hund. Dann größere Dinge. Ein Auto. Ein Mensch. Im Jahr 1987 war ein Mädchen verschwunden. Sie hieß Lena. Sie war sechzehn. Man hat sie nie gefunden. Die Polizei hat den Fall geschlossen. Aber ihre Großmutter hatte nicht aufgegeben. Sie hatte alles aufgeschrieben. Namen. Daten. Orte. Und sie hatte eine Vermutung, die Mara das Blut in den Adern gefrieren ließ. Der Mensch, der Lena damals gesehen hatte, war kein Fremder. Es war jemand aus dem Dorf. Jemand, den alle kannten. Mara klappte das Notizbuch zu und setzte sich auf den Stuhl. Der Raum war kalt, aber sie schwitzte. Sie dachte an Lena. Sie dachte an ihre Großmutter, die allein in diesem Haus gesessen und Ordner geschrieben hatte. Sie dachte an sich selbst, die Journalistin, die nach Hamburg gegangen war, um große Geschichten zu schreiben, und die jetzt in einem Keller in der Senne saß und eine Geschichte fand, die größer war als alles, was sie je geschrieben hatte. Sie nahm das Notizbuch mit nach oben. Sie würde es lesen. Alles. Von vorne bis hinten. Und dann würde sie entscheiden, was sie damit macht. Sie machte sich Tee, setzte sich ans Fenster und las, bis es dunkel wurde. Draußen ging ein Mann mit einem Hund vorbei. Er schaute zum Haus herüber. Mara zog die Gardine zu. Sie wusste noch nicht, ob sie Angst haben musste. Aber sie wusste, dass sie nicht mehr einfach wegfahren konnte. Am Abend setzte sich Mara noch einmal an den Tisch im Keller. Sie öffnete einen zweiten Ordner. Darin lagen Zeitungsausschnitte. Auf einem stand: Mädchen vermisst. Auf einem anderen: Polizei sucht Zeugen. Auf einem dritten: Fall Lena Berger: Keine neuen Erkenntnisse. Mara las jeden Artikel genau. Sie schrieb sich die Daten auf. 14. September 1987. 16 Jahre alt. Rote Jacke. Bushaltestelle. Sie dachte an ihre Großmutter, die diese Artikel gesammelt hatte. Wie viele Stunden hatte sie damit verbracht? Wie viele Abende hatte sie allein in diesem Keller gesessen und geschrieben? Mara stellte sich vor, wie ihre Großmutter hier gesessen hatte. Mit einer Lampe, mit einem Stift, mit einer Tasse Tee. Allein. Weil niemand ihr geglaubt hatte. Mara nahm einen Stift und schrieb in ihr eigenes Notizbuch: Ich glaube dir, Oma. Ich mache weiter. Dann klappte sie das Buch zu und ging nach oben. Draußen war es dunkel geworden. Sie schloss die Haustür ab und stellte einen Stuhl davor. Nicht aus Angst. Sondern weil sie sich sicher fühlen wollte. Sie ging ins Bett und schlief ein. Und zum ersten Mal träumte sie von ihrer Großmutter. Sie stand im Garten und lächelte. Sie sagte nichts. Sie musste nichts sagen. Sie stellte die Taschenlampe zurück auf den Tisch, schloss die Kellertür leise hinter sich und ging nach oben, wo sie sich einen Tee machte und noch einmal alle Namen aufschrieb, die sie im Notizbuch gefunden hatte, damit sie keinen vergaß. Mara legte den Stift weg, rieb sich die Augen und dachte daran, dass ihre Großmutter genau an diesem Tisch gesessen und genau dieselben Fragen gestellt hatte wie sie jetzt."], ["3. Lena", "Mara las die ganze Nacht. Das Notizbuch war dick. Auf jeder Seite standen Daten, Namen, kleine Skizzen. Ihre Großmutter hatte wie eine Detektivin gearbeitet. Sie hatte mit Leuten gesprochen, sie hatte Zeitungsartikel ausgeschnitten, sie hatte Fotos eingeklebt. Und immer wieder kam ein Name vor: Lena Berger. Sechzehn Jahre alt. Verschwunden am 14. September 1987 auf dem Weg von der Schule nach Hause. Letzte Sichtung: An der Bushaltestelle in der Senne. Sie trug eine rote Jacke. Sie hatte einen Rucksack dabei. Sie wollte zu ihrer Freundin. Mara legte das Notizbuch weg und machte sich einen Tee. Draußen wurde es langsam hell. Sie öffnete ihren Laptop und suchte nach Lena Berger. Es gab fast nichts. Ein alter Zeitungsartikel, drei Zeilen lang. Ein Forum, in dem jemand fragte, ob sich noch jemand an den Fall erinnert. Ein Kommentar: Meine Mutter hat damals gesagt, wir sollen nicht mehr allein durch den Wald gehen. Mehr nicht. Mara schrieb den Namen in ihr eigenes Notizbuch. Dann schrieb sie: Wer war Lena? Wer hat sie zuletzt gesehen? Wer hat damals im Dorf gewohnt? Am Vormittag ging Mara ins Dorf. Sie ging zum Bäcker, zum kleinen Supermarkt, zur Bushaltestelle. Die Bushaltestelle war noch da. Ein kleines Häuschen aus Glas und Metall. Sie setzte sich auf die Bank und stellte sich vor, wie Lena hier gesessen hatte. Sechzehn, mit roter Jacke, mit Rucksack, wartend auf den Bus. Was hatte sie gedacht? Hatte sie Angst gehabt? Hatte sie jemanden gesehen, den sie kannte? Im Bäcker traf sie eine alte Frau, die sie von früher kannte. Frau Brandt. Sie war damals schon alt gewesen, jetzt war sie sehr alt. Mara kaufte ein Brot und fragte: Erinnern Sie sich noch an Lena Berger? Frau Brandt wurde blass. Die Hände zitterten, als sie das Brot einpackte. Warum fragst du?, sagte sie. Mara sagte: Ich habe das Notizbuch meiner Großmutter gefunden. Frau Brandt schaute sich um, als ob jemand zuhören könnte. Dann sagte sie leise: Deine Großmutter war die Einzige, die nicht aufgegeben hat. Alle anderen wollten es vergessen. Komm heute Abend zu mir. Aber sag niemandem, dass du kommst. Mara ging nach Hause und wartete. Die Stunden zogen sich. Sie las weiter im Notizbuch. Ihre Großmutter hatte geschrieben: Lena hatte ein Tagebuch. Es wurde nie gefunden. Sie hatte einen Freund, den niemand kannte. Sie hatte am Tag ihres Verschwindens einen Brief in ihrer Schultasche. Der Brief wurde nie gefunden. Mara schrieb sich alles auf. Ein Tagebuch, das fehlt. Ein Freund, den niemand kennt. Ein Brief, der fehlt. Drei Dinge, die fehlen. Das war kein Zufall. Am Abend ging Mara zu Frau Brandt. Das Haus war klein, die Gardinen waren zugezogen, auf dem Tisch stand Tee. Frau Brandt setzte sich und sagte: Ich erzähle dir, was ich weiß. Aber du musst mir versprechen, dass du vorsichtig bist. Lena war ein liebes Mädchen. Sie war nicht so, wie die Leute gesagt haben. Sie war nicht weggelaufen. Sie ist nicht einfach abgehauen. Jemand hat sie mitgenommen. Und ich glaube, ich weiß, wer es war. Aber ich habe es nie jemandem gesagt, weil ich Angst hatte. Mara fragte: Wer? Frau Brandt schaute sie lange an. Dann sagte sie einen Namen, den Mara kannte. Einen Namen, den jeder im Dorf kannte. Mara wurde kalt. Wenn das stimmte, dann war der Mensch, der Lena mitgenommen hatte, immer noch da. Vielleicht sogar ganz in der Nähe. Frau Brandt nahm Maras Hand und sagte: Deine Großmutter hat mir einmal gesagt, dass sie alles aufschreibt, damit es jemand findet, wenn sie nicht mehr da ist. Jetzt hast du es gefunden. Jetzt bist du diejenige, die es zu Ende bringen muss. Am nächsten Tag ging Mara zum Friedhof. Sie wusste nicht, warum. Sie wollte einfach nur spazieren gehen. Auf dem Friedhof war es still. Sie ging zwischen den Gräbern hindurch und las die Namen. Viele Namen kannte sie. Alte Nachbarn. Lehrer. Freunde ihrer Großmutter. Sie blieb vor einem Grab stehen. Es war das Grab ihrer Großmutter. Auf dem Stein stand: In Liebe. Mara kniete sich hin und legte eine Blume darauf. Eine weiße Blume, die sie im Garten gefunden hatte. Sie sagte leise: Oma, ich habe das Notizbuch gefunden. Ich mache weiter. Ich verspreche es. Sie blieb lange dort sitzen. Die Sonne schien durch die Bäume. Ein Vogel sang. Mara dachte an ihre Kindheit. An die Sommer, die sie hier verbracht hatte. An die Abende, an denen ihre Großmutter ihr Geschichten erzählt hatte. Geschichten, die sie damals für Märchen gehalten hatte. Jetzt wusste sie: Es waren keine Märchen. Es waren Warnungen. Und sie hatte sie nicht verstanden. Jetzt verstand sie sie. Sie stand auf und ging nach Hause. Auf dem Weg kaufte sie Brot und Milch. Ganz normale Dinge. Aber sie fühlten sich nicht mehr normal an. Sie fühlten sich an wie der Anfang von etwas Wichtigem. Sie legte das Foto von Lena neben das Notizbuch und schrieb darunter in ihr eigenes Heft, dass Lena eine rote Jacke getragen hatte, einen Rucksack dabei hatte und zu ihrer Freundin wollte, und dass sie genau diese drei Dinge nie vergessen würde. Mara schrieb den Namen Lena Berger noch einmal in ihr Notizbuch, unterstrich ihn zweimal und legte das Heft neben das Foto, damit sie ihn immer vor Augen hatte, wenn sie weiterlas."], ["4. Der Name", "Der Name, den Frau Brandt gesagt hatte, war Heinrich Weber. Mara kannte ihn. Jeder kannte ihn. Er war damals Lehrer an der Schule. Er war beliebt. Er organisierte Ausflüge, er half bei den Hausaufgaben, er war der nette Lehrer, den alle mochten. Er war jetzt über achtzig, er wohnte noch immer im Dorf, in einem kleinen Haus am Ortsrand. Er ging jeden Morgen spazieren, er kaufte beim Bäcker ein, er grüßte alle freundlich. Niemand hätte gedacht, dass er etwas mit Lenas Verschwinden zu tun haben könnte. Und genau das machte Mara Angst. Sie ging nach Hause und schlug das Notizbuch ihrer Großmutter auf. Da stand der Name. Heinrich Weber. Nicht einmal. Oft. Ihre Großmutter hatte geschrieben: H.W. hat Lena oft nach der Schule angesprochen. H.W. hat Lena Bücher geliehen. H.W. war am Tag des Verschwindens an der Bushaltestelle gesehen worden. Er sagte, er sei nur zufällig da gewesen. Mara las die Zeilen immer wieder. Zufällig. Ein Lehrer, der zufällig an der Bushaltestelle steht, an der ein Mädchen verschwindet. Das konnte Zufall sein. Oder es war kein Zufall. Mara wusste, was sie als Journalistin tun musste. Nicht raten. Beweise finden. Sie ging am nächsten Tag zur Schule. Die Schule war noch da, aber sie war renoviert worden. Neue Fenster, neuer Anstrich. Sie fragte nach alten Unterlagen. Die Sekretärin sagte, alte Unterlagen seien im Archiv. Mara durfte ins Archiv. Dort fand sie alte Klassenbücher, alte Fotos, alte Listen. Auf einem Foto von 1987 stand Lena in der ersten Reihe. Sie lächelte. Neben ihr stand Heinrich Weber. Er hatte die Hand auf ihrer Schulter. So wie Lehrer das damals gemacht haben. Ganz normal. Oder nicht ganz normal. Sie kopierte das Foto und ging nach Hause. Sie legte es neben das Notizbuch. Dann rief sie einen alten Kollegen in Hamburg an. Ich brauche deine Hilfe, sagte sie. Kannst du mir etwas über einen alten Fall besorgen? Der Kollege sagte: Schick mir, was du hast. Mara schickte ihm die Fotos vom Notizbuch. Eine Stunde später rief er zurück. Mara, sagte er, deine Großmutter hat recht gehabt, dass da etwas nicht stimmt. Aber du musst vorsichtig sein. Wenn der Mann noch lebt, dann ist das gefährlich. Mara sagte: Ich weiß. Aber ich kann nicht aufhören. Am Abend ging Mara spazieren. Sie ging absichtlich an Heinrich Webers Haus vorbei. Das Haus war klein, der Garten war ordentlich, vor der Tür stand ein Fahrrad. Er saß auf einer Bank vor dem Haus und las Zeitung. Als er Mara sah, lächelte er. Du bist doch die Enkelin von der alten Frau aus dem Haus am Waldrand, sagte er. Mara nickte. Er sagte: Deine Großmutter war eine gute Frau. Sie hat immer alles aufgeschrieben. Mara fragte: Was hat sie aufgeschrieben? Er schaute sie lange an. Dann sagte er: Das weißt du doch schon. Sonst wärst du nicht hier. Mara wurde kalt. Er wusste, dass sie das Notizbuch gefunden hatte. Woher wusste er das? Sie ging schnell nach Hause. Zu Hause schloss sie die Tür ab, was sie vorher nie gemacht hatte. Sie schaute aus dem Fenster. Die Straße war leer. Sie setzte sich an den Tisch und schrieb alles auf, was er gesagt hatte. Er hatte nicht gesagt: Was meinst du? Er hatte nicht gesagt: Welches Notizbuch? Er hatte gesagt: Das weißt du doch schon. Das hieß, er wusste, was im Keller war. Und das hieß, er hatte vielleicht auch gewusst, dass ihre Großmutter alles aufgeschrieben hatte. Mara nahm ihr Handy und schrieb Frau Brandt eine Nachricht: Er weiß es. Frau Brandt antwortete sofort: Dann musst du jetzt sehr vorsichtig sein. Geh heute Nacht nicht mehr raus. Mara legte das Handy weg und schaute aus dem Fenster. Draußen war es dunkel. Im Garten bewegte sich wieder die Schaukel. Langsam. Als ob jemand sie gerade losgelassen hätte. Am Abend ging Mara noch einmal zu Heinrich Webers Haus. Sie wollte ihn noch einmal sehen. Nicht mit ihm reden. Nur sehen, wie er lebt. Er saß wieder auf der Bank vor seinem Haus. Er las wieder Zeitung. Aber diesmal schaute er immer wieder auf. Als ob er auf jemanden wartete. Oder als ob er Angst hätte, dass jemand kommt. Mara versteckte sich hinter einem Baum und beobachtete ihn. Er stand auf, ging ins Haus, kam wieder raus, setzte sich wieder hin. Er wirkte nervös. Unruhig. Nicht wie ein Mann, der nichts zu verbergen hat. Mara machte ein Foto mit ihrem Handy. Nicht von seinem Gesicht. Von seinem Haus. Von der Bank. Von der Zeitung, die er las. Sie wusste noch nicht, wofür sie das Foto brauchte. Aber sie wusste, dass sie alles festhalten musste. Alles, was sie sah. Alles, was sie hörte. Weil sie nicht wusste, was später wichtig sein würde. Sie ging nach Hause und schrieb alles auf. Was er anhatte. Was er gemacht hatte. Wie er geschaut hatte. Sie schrieb es in ihr Notizbuch, mit Datum und Uhrzeit. So, wie es eine Journalistin macht. So, wie es ihre Großmutter gemacht hatte. Sie dachte: Oma, ich mache es genau wie du. Und sie fühlte sich ihrer Großmutter so nah wie nie zuvor. Sie ging zum Fenster, schaute auf die Straße, auf der Heinrich Weber gerade seinen Spaziergang machte, und notierte sich die Uhrzeit, weil sie als Journalistin gelernt hatte, dass genaue Zeiten später einmal wichtig werden könnten. Mara zog ihre Jacke enger, weil es draußen kälter geworden war, und ging langsam nach Hause, wobei sie immer wieder stehen blieb und sich umschaute, ob ihr jemand folgte."], ["5. Die Nacht", "In dieser Nacht schlief Mara nicht. Sie lag im Bett und hörte jedes Geräusch. Den Wind. Die Schaukel. Ein Auto, das langsam vorbeifuhr. Sie stand auf und schaute aus dem Fenster. Das Auto war weg. Die Straße war leer. Sie ging in die Küche und trank Wasser. Dann hörte sie es. Ein leises Klopfen. Nicht an der Haustür. An der Kellertür. Sie erstarrte. Wer klopft nachts an eine Kellertür von innen? Oder von außen? Sie nahm die Taschenlampe und ging langsam die Treppe runter. Die Kellertür war zu. Das Klopfen war weg. Sie stand lange im Keller und lauschte. Nichts. Nur ihr eigener Atem. Am nächsten Morgen fand sie etwas auf der Fußmatte. Einen Zettel. Darauf stand in krakeliger Handschrift: Hör auf. Lass es. Oder du endest wie sie. Mara nahm den Zettel und legte ihn zu den anderen Papieren. Sie hatte Angst. Aber sie hatte auch Wut. Wer drohte ihr? Wer wusste, dass sie hier war und was sie tat? Sie rief die Polizei an. Die Polizei kam, ein junger Polizist, freundlich, aber nicht sehr interessiert. Ein Zettel, sagte er. Das kann jeder geschrieben haben. Vielleicht ein Scherz. Mara sagte: Es ist kein Scherz. Es geht um Lena Berger. Der Polizist wurde still. Lena Berger, sagte er. Das ist lange her. Der Fall ist geschlossen. Mara sagte: Der Fall ist nicht geschlossen. Nicht für mich. Sie ging zu Frau Brandt. Frau Brandt war blass. Sie sagte: Ich habe dir gesagt, du sollst vorsichtig sein. Mara fragte: Wer war damals mit Heinrich Weber befreundet? Wer hat ihm geholfen? Frau Brandt sagte: Er hatte einen Freund. Einen Mann, der damals Hausmeister an der Schule war. Er hieß Karl. Karl Neumann. Er ist vor zehn Jahren gestorben. Aber er hatte einen Sohn. Der Sohn wohnt noch im Dorf. Er heißt Thomas. Mara schrieb den Namen auf. Thomas Neumann. Noch ein Name. Noch ein Mensch, der vielleicht etwas wusste. Am Nachmittag ging Mara zu Thomas Neumann. Er wohnte in einem Haus am Ortsrand, nicht weit von Heinrich Weber. Er war etwa fünfzig, er arbeitete in einer Autowerkstatt. Mara sagte, sie schreibe einen Artikel über das Dorf. Über die alten Zeiten. Thomas schaute sie misstrauisch an. Was willst du wirklich?, fragte er. Mara sagte die Wahrheit. Ich will wissen, was mit Lena passiert ist. Thomas wurde blass. Er sagte: Mein Vater hat mir nie etwas erzählt. Aber er hat einmal gesagt: Wenn du jemals etwas über den Keller hörst, dann lauf. Mara fragte: Welcher Keller? Thomas sagte: Frag nicht weiter. Und dann machte er die Tür zu. Mara ging nach Hause und dachte nach. Keller. Schon wieder Keller. Es gab den Keller in ihrem Haus. Gab es noch einen Keller? Einen Keller bei Heinrich Weber? Einen Keller bei der Schule? Sie schlug das Notizbuch auf. Ihre Großmutter hatte geschrieben: Der Keller unter der alten Schule. Da ist etwas. Aber die Schule wurde renoviert. Der Keller wurde zugemauert. Oder nicht? Mara suchte im Internet nach alten Bauplänen der Schule. Sie fand einen Plan von 1985. Darauf war ein Keller eingezeichnet. Ein kleiner Raum unter der Turnhalle. Sie druckte den Plan aus und legte ihn auf den Tisch. Wenn es den Keller noch gab, dann musste sie ihn finden. Und wenn sie ihn fand, dann würde sie vielleicht endlich erfahren, was mit Lena passiert war. Sie legte den Plan neben das Foto von Lena. Sie schaute lange darauf. Dann schloss sie alle Türen ab, stellte einen Stuhl unter die Türklinke und versuchte zu schlafen. In der Nacht wachte Mara von einem Geräusch auf. Es war wieder das Klopfen. Aber diesmal kam es nicht aus dem Keller. Es kam von der Haustür. Sie stand auf, zog sich einen Pullover über und ging zur Tür. Sie schaute durch den Spion. Niemand da. Sie öffnete die Tür einen Spalt. Auf der Fußmatte lag ein Stein. Darauf war ein Wort geritzt: Hör auf. Mara nahm den Stein und legte ihn auf den Tisch. Sie hatte Angst. Aber sie hatte auch Wut. Wer tat so etwas? Wer schlich nachts ums Haus und legte Steine vor die Tür? Sie rief die Polizei an. Der Polizist sagte: Das ist nur ein Stein. Mara sagte: Es ist kein Stein. Es ist eine Drohung. Der Polizist sagte: Wir können nichts machen. Mara legte auf und setzte sich an den Tisch. Sie dachte nach. Wer wusste, dass sie hier war? Wer wusste, was sie tat? Frau Brandt wusste es. Sabine wusste es. Heinrich Weber wusste es. Thomas Neumann wusste es. Einer von ihnen musste es sein. Oder jemand, den sie noch nicht kannte. Sie nahm ihr Handy und schrieb Frau Brandt: Jemand hat einen Stein vor meine Tür gelegt. Frau Brandt antwortete: Komm morgen zu mir. Bring den Stein mit. Mara sagte: Das mache ich. Sie legte den Stein in eine Tüte und stellte ihn neben die Tür. Dann ging sie wieder ins Bett. Aber sie schlief nicht mehr. Sie lag wach und hörte zu. Jedem Geräusch. Jedem Knacken. Jedem Schritt draußen auf der Straße. Sie legte den Zettel mit der Drohung in eine Plastiktüte, schrieb das Datum darauf und legte ihn zu den anderen Papieren, weil sie wusste, dass auch eine Drohung ein Beweis ist, wenn man sie richtig aufbewahrt. Mara stellte einen Stuhl unter die Türklinke, legte ihr Handy neben das Bett und ließ das Licht im Flur an, weil sie sich in dieser Nacht einfach sicherer fühlen wollte."], ["6. Der Keller unter der Schule", "Mara ging am nächsten Tag zur Schule und fragte nach dem Keller unter der Turnhalle. Die Sekretärin sagte: Da ist kein Keller. Da ist nur die Heizung. Mara sagte: Auf dem alten Plan ist ein Keller eingezeichnet. Die Sekretärin schaute sie komisch an. Wo haben Sie den Plan her?, fragte sie. Mara sagte: Aus dem Archiv. Die Sekretärin wurde nervös. Sie sagte: Ich muss den Direktor fragen. Mara wartete. Der Direktor kam. Er war ein freundlicher Mann, etwa sechzig. Er sagte: Der Keller wurde vor zwanzig Jahren zugemauert. Da ist nichts mehr. Mara fragte: Kann ich ihn trotzdem sehen? Der Direktor sagte: Nein. Das geht nicht. Das ist gefährlich. Die Decke könnte einstürzen. Mara ging nach Hause und wusste: Er lügt. Oder er hat Angst. Sie rief ihren Kollegen in Hamburg an. Er sagte: Ich habe etwas gefunden. Heinrich Weber wurde damals einmal vernommen. Er hat gesagt, er sei an dem Tag an der Bushaltestelle gewesen, weil er auf einen Bus gewartet habe. Aber es gab keinen Bus, der zu der Zeit fuhr. Die Polizei hat das nicht weiter verfolgt. Mara fragte: Warum nicht? Der Kollege sagte: Weil sein Vater damals Bürgermeister war. Und weil niemand glauben wollte, dass der nette Lehrer etwas getan hat. Am Abend traf Mara sich mit Frau Brandt. Frau Brandt brachte etwas mit. Ein altes Foto. Darauf war Lena mit einer Freundin. Die Freundin hieß Sabine. Sabine wohnte noch im Dorf, aber sie war weggezogen und wiedergekommen. Frau Brandt sagte: Sprich mit Sabine. Sie war Lenas beste Freundin. Sie weiß mehr, als sie sagt. Mara fragte: Wo wohnt sie? Frau Brandt gab ihr eine Adresse. Am Ortsrand, in einem kleinen Haus mit einem roten Dach. Mara ging am nächsten Morgen zu Sabine. Sabine war etwa fünfzig, sie hatte graue Haare, sie trug eine Brille. Sie machte die Tür auf und sagte: Ich weiß schon, warum du hier bist. Mara fragte: Woher? Sabine sagte: Weil Frau Brandt angerufen hat. Und weil ich schon lange darauf warte, dass jemand fragt. Komm rein. Mara setzte sich. Sabine kochte Tee. Dann sagte sie: Lena hatte Angst vor Heinrich Weber. Sie hat es mir gesagt. Er hat ihr Briefe geschrieben. Sie hat sie mir gezeigt. Ich habe sie aufbewahrt. Mara wurde hellhörig. Briefe? Sabine stand auf, holte eine kleine Kiste und legte sie auf den Tisch. Darin lagen Briefe. Viele Briefe. Alle in der gleichen Handschrift. Alle an Lena. Mara las einen Brief. Darin stand: Liebe Lena, du bist ein besonderes Mädchen. Du verstehst mich wie kein anderer. Ich möchte dir ein Buch geben. Komm nach der Schule zu mir. Dein Heinrich. Mara wurde übel. Das war kein Lehrer-Brief. Das war ein Brief von einem Mann, der ein Mädchen wollte. Sabine sagte: Lena wollte nicht hingehen. Aber sie hatte Angst, dass er ihr schlechte Noten gibt, wenn sie nicht kommt. Am Tag, an dem sie verschwand, wollte sie zu ihm gehen und ihm sagen, dass er aufhören soll. Mara fragte: Und dann? Sabine sagte: Dann ist sie nie wiedergekommen. Mara nahm die Briefe mit. Sie versprach Sabine, dass sie vorsichtig sein würde. Zu Hause legte sie die Briefe neben das Notizbuch. Jetzt hatte sie Beweise. Nicht nur Vermutungen. Briefe. Ein Foto. Ein Notizbuch. Eine Zeugin. Sie schrieb alles in ihr eigenes Notizbuch. Dann rief sie die Polizei an. Diesmal einen anderen Polizisten. Einen, der älter war und den Fall vielleicht kannte. Er sagte: Kommen Sie morgen vorbei. Bringen Sie alles mit. Mara sagte: Das mache ich. Sie legte auf und dachte: Endlich bewegt sich etwas. Aber in der Nacht hörte sie wieder das Klopfen im Keller. Diesmal lauter. Diesmal länger. Sie stand auf, ging zur Kellertür und sagte laut: Wer ist da? Niemand antwortete. Sie öffnete die Tür. Der Keller war leer. Nur die Kisten. Nur das Regal. Nur die kleine Tür im Keller, die jetzt offen stand, obwohl sie sie zugemacht hatte. Am nächsten Tag brachte Mara den Stein zu Frau Brandt. Frau Brandt schaute ihn sich an und sagte: Das ist kein Zufall. Das ist eine Warnung. Mara fragte: Von wem? Frau Brandt sagte: Von jemandem, der nicht will, dass du weiter machst. Mara fragte: Was soll ich tun? Frau Brandt sagte: Weitermachen. Aber vorsichtig. Sag niemandem, was du als Nächstes tust. Nicht einmal mir. Mara nickte. Sie ging nach Hause und überlegte, was sie als Nächstes tun sollte. Sie hatte den Keller unter der Schule gefunden. Sie hatte das Tagebuch gefunden. Sie hatte die Briefe gefunden. Was fehlte noch? Sie schlug das Notizbuch ihrer Großmutter auf. Auf einer Seite stand: Frag nach dem Hund. Mara dachte nach. Welcher Hund? Sie blätterte weiter. Da stand: Lenas Hund hieß Bello. Er ist am Tag nach Lenas Verschwinden weggelaufen und nie wiedergekommen. Mara schrieb den Namen auf. Bello. Ein Hund, der weggelaufen ist. Oder ein Hund, der etwas gesehen hat. Sie ging nach draußen und fragte die Nachbarn, ob sie sich an den Hund erinnern. Ein alter Mann sagte: Ja, der Hund war immer bei Lena. Er hat sie überall hin begleitet. Nur an dem Tag nicht. An dem Tag war er zu Hause. Weil Lena gesagt hat, er soll zu Hause bleiben. Mara fragte: Warum? Der Mann sagte: Weil sie wusste, dass sie zu jemandem geht, der Hunde nicht mag. Mara schrieb alles auf. Wer mag keine Hunde? Heinrich Weber. Er hatte einmal gesagt, dass er Hunde nicht mag. Weil sie bellen. Weil sie stinken. Mara wusste: Das war ein kleines Detail. Aber kleine Details sind oft die wichtigsten. Sie faltete den alten Bauplan der Schule zusammen, steckte ihn in ihre Tasche und beschloss, am nächsten Tag noch einmal zur Schule zu gehen und genau nachzusehen, wo die zugemauerte Tür unter der Turnhalle gewesen sein musste. Mara steckte den Bauplan in ihre Tasche, nahm ihre Taschenlampe und ihren Schlüssel und ging noch einmal zur Schule, um sich die zugemauerte Tür unter der Turnhalle genauer anzusehen."], ["7. Das Tagebuch", "Am nächsten Morgen ging Mara zur Polizei. Sie nahm das Notizbuch ihrer Großmutter, die Briefe und die Fotos mit. Der Polizist war freundlich, er hörte zu, er machte sich Notizen. Dann sagte er: Das ist viel. Das müssen wir prüfen. Aber Sie müssen verstehen: Das ist dreißig Jahre her. Viele Beweise gibt es nicht mehr. Mara sagte: Aber die Briefe sind Beweise. Er sagte: Ja. Aber sie beweisen nicht, dass er sie mitgenommen hat. Sie beweisen nur, dass er ihr geschrieben hat. Mara fragte: Und das reicht nicht, um ihn zu vernehmen? Er sagte: Wir werden ihn vernehmen. Aber Sie müssen jetzt aufhören, selbst zu ermitteln. Das ist gefährlich. Mara ging nach Hause und war wütend. Aufhören? Nach allem, was sie gefunden hatte? Sie setzte sich an den Tisch und dachte nach. Was fehlte noch? Das Tagebuch von Lena. Ihre Großmutter hatte geschrieben, dass Lena ein Tagebuch hatte. Es wurde nie gefunden. Wenn sie das Tagebuch finden würde, dann hätte sie vielleicht die ganze Wahrheit. Wo könnte es sein? Bei Lena zu Hause? Bei Sabine? Im Keller unter der Schule? Sie rief Sabine an. Sabine sagte: Lena hat ihr Tagebuch immer bei sich getragen. In ihrem Rucksack. Der Rucksack wurde nie gefunden. Mara fragte: Und der Brief, den sie am Tag ihres Verschwindens dabei hatte? Sabine sagte: Der war auch in ihrem Rucksack. Mara dachte nach. Rucksack, Tagebuch, Brief. Alles in einem Rucksack. Und der Rucksack ist weg. Wenn jemand Lena mitgenommen hat, dann hat er auch den Rucksack mitgenommen. Oder er hat ihn versteckt. Mara ging wieder in den Keller in ihrem Haus. Sie schaute sich den kleinen Raum noch einmal genau an. Die Ordner, der Tisch, der Stuhl. Sie öffnete jeden Ordner. In einem Ordner fand sie etwas, das sie vorher übersehen hatte. Ein kleines, in Stoff eingewickeltes Päckchen. Sie wickelte es aus. Darin lag ein Schlüssel. Nicht der Schlüssel für die Kellertür. Ein anderer Schlüssel. Kleiner. Mit einem Anhänger, auf dem ein Wort stand: Schule. Mara nahm den Schlüssel und fuhr zur Schule. Es war Abend, die Schule war leer. Sie ging zur Turnhalle. Hinter der Turnhalle gab es eine kleine Tür, die sie vorher nicht bemerkt hatte. Sie war zugemauert, aber nicht ganz. Ein Teil der Mauer war neu. Sie klopfte dagegen. Es klang hohl. Sie nahm einen Stein und schlug gegen die Mauer. Ein Stück Putz fiel ab. Darunter war eine Tür. Eine alte Holztür. Sie steckte den Schlüssel ins Schloss. Er passte. Sie drehte ihn um. Die Tür ging auf. Dahinter war Dunkelheit. Sie schaltete ihre Taschenlampe an und ging rein. Der Raum war klein. Es roch nach Moder und nach altem Papier. Auf dem Boden lag ein Rucksack. Rot. Alt. Verstaubt. Mara kniete sich hin und öffnete ihn. Darin lag ein Tagebuch. Und ein Brief. Sie nahm das Tagebuch in die Hand. Ihre Hände zitterten. Auf dem Tagebuch stand: Lena. Sie schlug es auf und las die erste Seite. Liebe Sabine, wenn du das liest, dann bin ich nicht mehr da. Ich habe Angst. Er lässt mich nicht in Ruhe. Ich gehe heute zu ihm und sage ihm, dass er aufhören soll. Wenn ich nicht zurückkomme, dann sag es jemandem. Sag es meiner Mutter. Sag es der Polizei. Sag es allen. Mara klappte das Tagebuch zu und weinte. Sie hatte es gefunden. Nach fast vierzig Jahren. Sie nahm den Rucksack und ging nach Hause. Sie rief die Polizei an. Sie sagte: Ich habe Lenas Rucksack gefunden. Im Keller unter der Schule. Der Polizist sagte: Bleiben Sie, wo Sie sind. Wir kommen sofort. Mara blieb. Sie saß auf dem Sofa und hielt den Rucksack fest, als wäre er ein kleines Mädchen, das sie beschützen musste. Sie dachte an Lena, an das Mädchen mit der roten Jacke, das nie wieder nach Hause gekommen war. Sie dachte an ihre Großmutter, die alles aufgeschrieben hatte, weil niemand ihr geglaubt hatte. Und sie dachte an sich selbst. Sie hatte es gefunden. Wirklich gefunden. Als Mara den Rucksack gefunden hatte, saß sie lange im Keller unter der Schule. Sie hielt das Tagebuch in der Hand und las es noch einmal. Nicht nur die erste Seite. Alle Seiten. Auf einer Seite stand: Heute hat er mir wieder einen Brief geschrieben. Ich habe Angst, ihn zu lesen. Auf einer anderen Seite stand: Sabine sagt, ich soll es meiner Mutter sagen. Aber ich habe Angst, dass sie mir nicht glaubt. Auf einer dritten Seite stand: Wenn ich morgen nicht zurückkomme, dann sucht im Wald. Nicht in der Stadt. Im Wald. Mara wurde kalt. Im Wald. Genau da, wo sie später gefunden werden sollte. Oder wo sie liegen gelassen wurde. Sie klappte das Tagebuch zu und weinte. Sie weinte um ein Mädchen, das sie nie gekannt hatte. Um ein Mädchen, das so mutig gewesen war, dass es allein zu einem Mann gegangen war, um ihm zu sagen, dass er aufhören soll. Um ein Mädchen, das gewusst hatte, dass es gefährlich war, und das trotzdem gegangen war. Mara nahm das Tagebuch und den Rucksack und ging nach draußen. Die Polizei wartete schon. Sie gaben ihr eine Decke, weil sie zitterte. Nicht vor Kälte. Vor Wut. Vor Trauer. Vor Erleichterung. Weil sie es gefunden hatte. Endlich. Nach fast vierzig Jahren. Sie fuhr nach Hause und legte das Tagebuch auf den Tisch. Daneben legte sie die Briefe. Daneben legte sie das Foto. Sie machte ein Foto von allem und schickte es ihrer Mutter. Ihre Mutter schrieb zurück: Ich bin stolz auf dich. Mara lächelte. Zum ersten Mal seit Tagen lächelte sie wirklich. Sie trug den Rucksack nach Hause, stellte ihn auf den Küchentisch und las noch einmal die letzte Seite des Tagebuchs, auf der Lena geschrieben hatte, dass sie Angst hatte, aber trotzdem hingehen wollte, weil sie endlich sagen wollte, dass es aufhören soll. Mara hielt das Tagebuch fest in beiden Händen, las die letzte Seite noch einmal und dachte daran, wie mutig Lena gewesen sein musste, als sie diese Zeilen geschrieben hatte."], ["8. Die Vernehmung", "Die Polizei kam schnell. Zwei Polizisten, ein älterer und ein jüngerer. Sie nahmen den Rucksack mit, sie fotografierten den Keller, sie sperrten die Schule ab. Der ältere Polizist sagte zu Mara: Sie haben gute Arbeit gemacht. Aber jetzt lassen Sie uns arbeiten. Mara sagte: Ich will nur, dass die Wahrheit rauskommt. Er sagte: Das wollen wir auch. Am nächsten Tag wurde Heinrich Weber vernommen. Mara erfuhr es von Frau Brandt, die es von jemandem gehört hatte, der es von jemandem gehört hatte. Im Dorf sprach sich alles schnell rum. Heinrich Weber sagte, er könne sich an nichts erinnern. Er sei alt. Er sei krank. Er habe Lena nie Briefe geschrieben. Die Briefe seien gefälscht. Mara lachte bitter, als sie das hörte. Gefälscht? Die Briefe waren in seiner Handschrift. Sabine hatte sie aufbewahrt. Wie sollten sie gefälscht sein? Die Polizei durchsuchte sein Haus. Sie fanden nichts. Kein Tagebuch. Kein Rucksack. Kein Brief. Nur alte Bücher und eine Zeitung. Mara dachte: Natürlich finden sie nichts. Er hatte vierzig Jahre Zeit, alles zu verstecken. Aber sie hatte das Tagebuch. Und sie hatte die Briefe. Und sie hatte Sabine. Das musste reichen. Am Abend kam Sabine zu Mara. Sie war aufgeregt. Sie sagte: Ich habe noch etwas gefunden. In meiner alten Kiste. Ein Foto. Darauf ist Lena mit Heinrich Weber. Aber nicht in der Schule. Im Wald. Hinter dem Haus am Waldrand. Mara schaute sich das Foto an. Es war unscharf, aber man konnte Lena erkennen. Und Heinrich Weber. Sie standen nah beieinander. Zu nah für einen Lehrer und eine Schülerin. Sabine sagte: Lena hat mir das Foto gezeigt und gesagt: Wenn mir etwas passiert, dann war er es. Mara nahm das Foto und legte es zu den anderen Beweisen. In der Nacht konnte Mara nicht schlafen. Sie dachte an Lena. An das Mädchen mit der roten Jacke, das nie wieder nach Hause gekommen war. An ihre Mutter, die jahrelang gewartet hatte. An ihre Großmutter, die alles aufgeschrieben hatte, weil niemand ihr geglaubt hatte. Mara stand auf und ging in den Keller. Sie setzte sich auf den Stuhl in dem kleinen Raum und dachte: Großmutter, ich habe es gefunden. Ich habe es wirklich gefunden. Und jetzt bringe ich es zu Ende. Sie nahm das Notizbuch ihrer Großmutter und blätterte darin. Auf einer Seite stand: Ich habe Angst, dass mir niemand glaubt. Aber ich schreibe es trotzdem auf. Für Mara. Für Lena. Für alle, die nach mir kommen. Mara schloss das Buch und weinte leise. Sie verstand jetzt, warum ihre Großmutter so lange allein in diesem Haus gesessen hatte. Sie hatte nicht nur eine Geschichte aufgeschrieben. Sie hatte eine Aufgabe weitergegeben. Und Mara hatte sie angenommen. Am nächsten Morgen rief die Polizei an. Sie wollten Mara noch einmal sprechen. Sie gingen alle Beweise noch einmal durch. Der Polizist sagte: Wir haben jetzt genug, um Anklage zu erheben. Aber wir brauchen noch eine Aussage von Sabine. Und wir brauchen Ihre Aussage. Mara sagte: Ich sage alles aus. Alles, was ich weiß. Er sagte: Gut. Dann machen wir das. Und Mara wusste: Es war noch nicht vorbei. Aber es hatte angefangen. Die Wahrheit kam ans Licht. Nach fast vierzig Jahren. Sie ging nach Hause, setzte sich an den Küchentisch und schrieb alles auf, was sie der Polizei gesagt hatte. Damit sie nichts vergaß. Damit sie nichts durcheinander brachte. Sie schrieb bis es dunkel wurde. Draußen ging der Nachbar mit seinem Hund vorbei. Er winkte. Mara winkte zurück. Zum ersten Mal seit Tagen fühlte sie sich nicht mehr allein in diesem Dorf. Nach der Vernehmung ging Mara spazieren. Sie ging in den Wald, hinter das Haus am Waldrand. Sie ging den Weg, den Lena damals gegangen sein musste. Der Weg war schmal, die Bäume waren hoch, es war still. Sie blieb stehen und hörte zu. Nichts. Nur der Wind. Nur die Vögel. Sie dachte an Lena, die hier entlang gegangen war. Allein. Mit Angst. Mit einem Rucksack, in dem ihr Tagebuch lag. Mit einem Brief, den sie nie abgeschickt hatte. Mara ging weiter. Sie kam an die Lichtung, die die Polizei ihr gezeigt hatte. Sie blieb stehen. Sie legte eine zweite Rose auf den Boden. Eine weiße Rose. Für die Hoffnung. Sie setzte sich auf einen Stein und blieb lange sitzen. Sie dachte an ihre Großmutter, die diesen Weg auch oft gegangen war. Auf der Suche nach Spuren. Auf der Suche nach Antworten. Mara nahm einen Stein vom Boden und steckte ihn ein. Nicht als Andenken. Als Erinnerung. Daran, dass sie weitermachen musste. Daran, dass sie nicht aufgeben durfte. Auch wenn es schwer war. Auch wenn es weh tat. Sie stand auf und ging zurück nach Hause. Auf dem Weg traf sie einen alten Mann, der sie fragte, ob alles in Ordnung sei. Mara sagte: Ja. Jetzt ist alles in Ordnung. Der Mann nickte und ging weiter. Mara ging nach Hause und schrieb alles auf, was sie im Wald gesehen und gefühlt hatte. Damit sie es nicht vergaß. Damit es nicht verloren ging. Wie so vieles in dieser Geschichte verloren gegangen war. Sie legte das Foto mit Lena und Heinrich Weber in einen Umschlag, schrieb Sabines Namen darauf und beschloss, es am nächsten Tag zur Polizei zu bringen, damit es zu den anderen Beweisen gelegt werden konnte. Mara fuhr mit dem Bus nach Hause, schaute aus dem Fenster und dachte an das Foto, das Sabine ihr gegeben hatte, und an das, was es für die Polizei bedeuten würde."], ["9. Die Mutter", "Mara fuhr zu Lenas Mutter. Sie wohnte noch immer im Dorf, in einem kleinen Haus mit einem Garten, in dem Rosen blühten. Sie war alt geworden. Ihr Haar war weiß. Sie öffnete die Tür und schaute Mara lange an. Du bist die Enkelin von der Frau aus dem Haus am Waldrand, sagte sie. Mara nickte. Die Mutter sagte: Komm rein. Ich habe schon lange auf dich gewartet. Sie setzten sich in die Küche. Auf dem Tisch stand ein Foto von Lena. Sechzehn, mit roter Jacke, lächelnd. Die Mutter sagte: Jeden Tag denke ich an sie. Jeden Tag frage ich mich, was passiert ist. Die Polizei hat mir damals gesagt, sie sei weggelaufen. Aber ich wusste, dass sie nicht weggelaufen ist. Lena wäre nie weggelaufen. Sie hatte Angst vor der Dunkelheit. Sie hätte nie allein durch den Wald gegangen. Mara sagte: Ich habe ihr Tagebuch gefunden. Und ihren Rucksack. Die Mutter begann zu weinen. Leise, ohne ein Wort. Mara nahm ihre Hand und sagte nichts. Manchmal muss man nichts sagen. Manchmal reicht es, da zu sein. Nach einer Weile sagte die Mutter: Ich habe ihr damals nicht geglaubt, als sie gesagt hat, dass der Lehrer ihr Briefe schreibt. Ich habe gesagt: Das bildest du dir ein. Das macht ein Lehrer nicht. Sie hat geweint und gesagt: Doch, Mama. Er schreibt mir. Ich habe ihr nicht geglaubt. Und das werde ich mir nie verzeihen. Mara sagte: Sie haben es nicht gewusst. Sie konnten es nicht wissen. Die Mutter schüttelte den Kopf. Ich hätte es wissen müssen. Ich bin ihre Mutter. Mara erzählte ihr, was sie gefunden hatte. Die Briefe. Das Tagebuch. Das Foto. Die Mutter hörte zu und nickte immer wieder. Dann sagte sie: Meine Tochter war ein mutiges Mädchen. Sie wollte zu ihm gehen und ihm sagen, dass er aufhören soll. Sie war sechzehn und sie war mutiger als ich. Mara sagte: Sie war sehr mutig. Die Mutter lächelte zum ersten Mal. Ja, sagte sie. Das war sie. Bevor Mara ging, gab ihr die Mutter etwas. Einen kleinen Anhänger. Ein Herz aus Glas. Lena hat ihn immer getragen, sagte sie. Ich habe ihn nach ihrem Verschwinden in ihrem Zimmer gefunden. Ich möchte, dass du ihn hast. Du hast sie gefunden. Mara nahm den Anhänger und steckte ihn ein. Sie fühlte, wie schwer er war. Nicht vom Gewicht. Von der Geschichte. Auf dem Heimweg dachte Mara an ihre eigene Mutter. An die Gespräche, die sie nie geführt hatten. An die Dinge, die sie nie gesagt hatte. Sie rief ihre Mutter an und sagte: Mama, ich habe dich lieb. Ihre Mutter war überrascht. Sie sagte: Ich dich auch. Und Mara merkte, wie gut es tat, das einmal zu sagen. Nicht irgendwann. Jetzt. Zu Hause legte Mara den Anhänger auf den Tisch, neben das Foto von Lena. Sie schaute ihn lange an. Ein Herz aus Glas. Zerbrechlich. Klar. Wunderschön. Wie Lena. Wie die Wahrheit. Wie alles, was lange verborgen war und jetzt ans Licht kam. Sie machte ein Foto vom Anhänger und schickte es Sabine. Sabine schrieb zurück: Das hat Lena immer getragen. Jeden Tag. Mara legte das Handy weg und ging in den Garten. Die Sonne ging unter. Sie setzte sich auf die Schaukel und dachte an Lena. An das Mädchen, das sie nie gekannt hatte und das sie jetzt kannte, besser als viele Menschen, die sie jeden Tag sah. Am Tag nach der Beerdigung ging Mara noch einmal zum Friedhof. Sie wollte allein sein. Sie setzte sich auf eine Bank und schaute auf den kleinen Stein mit Lenas Namen. Sie dachte an die Mutter, die jeden Tag Rosen pflanzte. An Sabine, die Briefe aufbewahrt hatte. An Frau Brandt, die alles gewusst und nichts gesagt hatte, weil sie Angst hatte. An ihre Großmutter, die alles aufgeschrieben hatte, weil sie nicht mehr schweigen wollte. Mara nahm ihr Notizbuch und schrieb einen Brief. Nicht an Lena. An ihre Großmutter. Liebe Oma, schrieb sie, ich habe es gefunden. Ich habe es zu Ende gebracht. Du musst dir keine Sorgen mehr machen. Sie faltete den Brief und legte ihn auf das Grab ihrer Großmutter. Sie wusste, dass ihre Großmutter ihn nicht lesen würde. Aber sie wusste auch, dass es sich richtig anfühlte. Sie stand auf und ging nach Hause. Auf dem Weg kaufte sie Blumen. Weiße Rosen. Für Lena. Für ihre Großmutter. Für alle, die nicht mehr da waren. Zu Hause stellte sie die Blumen in eine Vase und stellte sie auf den Tisch. Daneben stellte sie das Foto von Lena. Und das Foto ihrer Großmutter. Zwei Frauen, die sie nie vergessen würde. Zwei Frauen, die ihr Leben verändert hatten. Ohne dass sie es gewusst hatten. Oder vielleicht doch. Vielleicht hatten sie es gewusst. Vielleicht hatten sie genau darauf gewartet, dass jemand kommt und die Geschichte zu Ende erzählt. Und Mara war gekommen. Und sie hatte sie zu Ende erzählt. Sie steckte den Glasanhänger in ihre Jackentasche, weil sie ihn bei sich tragen wollte, und ging langsam nach Hause, wobei sie an jeder Straßenecke stehen blieb und an Lena dachte, die diesen Weg damals auch gegangen war. Mara nahm den Anhänger aus ihrer Tasche, hielt ihn gegen das Licht und sah, wie das Glas in der Sonne funkelte, genau wie es damals bei Lena gefunkelt haben musste."], ["10. Das Geständnis", "Heinrich Weber wurde noch einmal vernommen. Diesmal mit den neuen Beweisen. Mit den Briefen. Mit dem Tagebuch. Mit dem Foto. Der Polizist legte alles auf den Tisch. Heinrich Weber schaute es sich an und schwieg lange. Dann sagte er: Ich war ein junger Mann. Ich war einsam. Ich habe Fehler gemacht. Mara erfuhr es von ihrem Kollegen in Hamburg, der es von der Polizei gehört hatte. Sie saß am Küchentisch und las die Nachricht immer wieder. Ich habe Fehler gemacht. Das war kein Geständnis. Aber es war ein Anfang. Am nächsten Tag rief die Polizei Mara an. Sie wollten, dass sie zur Vernehmung kommt. Als Zeugin. Mara ging hin. Sie erzählte alles. Von dem Notizbuch ihrer Großmutter. Von dem Keller. Von den Briefen. Von Sabine. Von dem Rucksack. Der Polizist schrieb alles mit. Dann sagte er: Wir haben ihn. Er hat gestanden. Nicht alles. Aber genug. Er hat gesagt, dass er Lena an dem Tag getroffen hat. Dass sie gestritten haben. Dass sie weggerannt ist. Dass er ihr gefolgt ist. Dass sie gestürzt ist. Dass er Angst bekommen hat und sie liegen gelassen hat. Mara wurde kalt. Liegen gelassen. Ein Mädchen, sechzehn, allein im Wald. Sie fragte: Wo? Der Polizist sagte: Im Wald hinter dem Haus am Waldrand. Dort, wo das Foto gemacht wurde. Mara dachte an den Wald. An die Bäume. An den Weg, den sie als Kind so oft gegangen war. Sie war dort gewesen. Hunderte Male. Und sie hatte nie gewusst, dass dort ein Mädchen gelegen hatte. Ein Mädchen, das nie nach Hause gekommen war. Die Polizei fuhr mit Mara in den Wald. Sie zeigten ihr die Stelle. Es war eine kleine Lichtung, versteckt hinter Bäumen. Mara stand da und stellte sich vor, wie Lena dort gelegen hatte. Allein. Im Dunkeln. Mit Angst. Sie kniete sich hin und legte eine Rose auf den Boden. Eine rote Rose. Wie Lenas Jacke. Sie blieb lange dort stehen. Sie weinte. Nicht laut. Leise. Wie die Mutter geweint hatte. Wie Sabine geweint hatte. Wie alle geweint hatten, die Lena geliebt hatten. Am Abend ging Mara zu Sabine. Sabine saß auf dem Sofa und weinte. Mara setzte sich zu ihr. Sie sagten lange nichts. Dann sagte Sabine: Sie ist endlich gefunden. Mara sagte: Ja. Sie ist gefunden. Und Sabine sagte: Jetzt kann sie ruhen. Mara nickte. Jetzt kann sie ruhen. Und wir auch. Ein bisschen. In dieser Nacht schlief Mara zum ersten Mal seit langem gut. Sie träumte von Lena. Nicht von einem verschwundenen Mädchen. Von einem Mädchen, das lachte und eine rote Jacke trug und durch den Wald lief und rief: Komm, Mara, wir sind fast da. Mara lief hinter ihr her. Und sie lachte. Und als sie aufwachte, war sie nicht mehr traurig. Sie war erleichtert. Weil die Wahrheit endlich da war. Weil Lena endlich gefunden war. Sie stand auf, machte Kaffee und setzte sich an den Tisch. Draußen schien die Sonne. Die Vögel sangen. Und zum ersten Mal fühlte sich das Haus nicht mehr still an. Es fühlte sich lebendig an. Als der Artikel erschienen war, bekam Mara einen Brief von einer Frau, die sie nicht kannte. Die Frau schrieb: Ich habe damals auch an der Schule gearbeitet. Ich habe gesehen, wie Heinrich Weber Lena nach der Schule angesprochen hat. Ich habe nichts gesagt, weil ich Angst hatte, meinen Job zu verlieren. Es tut mir leid. Mara las den Brief zweimal. Dann legte sie ihn zu den anderen Papieren. Sie dachte an all die Menschen, die etwas gesehen und nichts gesagt hatten. Aus Angst. Aus Scham. Aus Bequemlichkeit. Sie war nicht wütend auf sie. Sie verstand sie. Es ist schwer, etwas zu sagen, wenn alle anderen schweigen. Aber sie wusste auch: Wenn einer anfängt zu sprechen, dann fangen auch andere an. So war es bei ihr gewesen. Sie hatte angefangen. Und dann hatten auch andere angefangen. Frau Brandt. Sabine. Die Mutter. Und jetzt diese Frau. Mara schrieb der Frau zurück. Sie schrieb: Danke, dass Sie mir geschrieben haben. Es ist nie zu spät. Die Frau schrieb zurück: Danke, dass Sie zugehört haben. Mara legte den Brief zu den anderen Briefen und dachte: Das ist der Anfang von etwas Neuem. Nicht nur für mich. Für das ganze Dorf. Das Dorf, das so lange geschwiegen hatte, fing an zu sprechen. Und das war gut. Das war sehr gut. Sie fuhr mit der Polizei zurück ins Dorf, setzte sich in ihr Auto und schaute lange auf die Lichtung im Wald, auf der sie die rote Rose hingelegt hatte, und wusste, dass sie noch einmal dorthin zurückkehren würde, wenn alles vorbei war. Mara setzte sich auf den Stein an der Lichtung, legte die Hände in den Schoß und blieb noch eine Weile sitzen, weil sie noch nicht bereit war, wieder nach Hause zu gehen."], ["11. Die Beerdigung", "Eine Woche später gab es eine Beerdigung. Nicht eine echte Beerdigung, denn Lenas Körper wurde nie gefunden. Heinrich Weber hatte gesagt, er habe sie liegen gelassen, aber er wisse nicht mehr genau, wo. Die Polizei hatte den Wald durchsucht, aber nichts gefunden. Trotzdem gab es eine Feier. Für Lena. Für ihre Mutter. Für alle, die sie geliebt hatten. Auf dem Friedhof stand ein kleiner Stein. Darauf stand: Lena Berger. 1971 bis 1987. Sie wird nie vergessen. Viele Menschen kamen. Ihre Mutter. Sabine. Frau Brandt. Mara. Und viele andere, die Lena gekannt hatten. Oder die von ihr gehört hatten. Der Pfarrer sagte ein paar Worte. Er sagte: Lena war ein junges Mädchen, das viel zu früh gehen musste. Aber sie wird in unseren Herzen bleiben. Mara weinte. Sabine weinte. Die Mutter weinte. Aber es war ein anderes Weinen als vorher. Nicht mehr das Weinen des Nicht-Wissens. Sondern das Weinen des Abschieds. Endlich Abschied nehmen zu können. Nach der Feier gingen sie alle zusammen ins Gemeindehaus. Es gab Kaffee und Kuchen. Die Leute erzählten Geschichten über Lena. Wie sie gelacht hatte. Wie sie gesungen hatte. Wie sie einmal einen Hund gerettet hatte, der in einen Teich gefallen war. Mara hörte zu und dachte: So viele Geschichten. So viel Leben. Und so lange hat niemand darüber gesprochen. Jetzt sprachen alle. Und das war gut. Die Mutter kam zu Mara und sagte: Danke. Ohne dich hätten wir das nie erfahren. Mara sagte: Ohne meine Großmutter hätte ich es nie erfahren. Sie hat alles aufgeschrieben. Die Mutter nickte. Deine Großmutter war eine starke Frau. Sie hat nie aufgegeben. Mara sagte: Ja. Das war sie. Und ich bin stolz auf sie. Am Abend ging Mara nach Hause. Sie war müde. Aber es war eine gute Müdigkeit. Sie setzte sich aufs Sofa und schaute aus dem Fenster. Der Garten war still. Die Schaukel bewegte sich nicht. Es war, als ob das Haus endlich zur Ruhe gekommen wäre. Als ob auch das Haus lange gewartet hätte, bis die Wahrheit ans Licht kam. Mara dachte an den Zettel ihrer Großmutter: Schau im Keller nach. Sie hatte im Keller nachgeschaut. Und sie hatte gefunden, was sie finden sollte. Nicht nur einen Raum. Sondern die Wahrheit. Sie nahm das Notizbuch ihrer Großmutter und legte es auf den Tisch. Daneben legte sie Lenas Tagebuch. Daneben legte sie den Anhänger. Drei Dinge, die zusammen gehörten. Drei Dinge, die eine Geschichte erzählten. Eine traurige Geschichte. Aber auch eine Geschichte von Mut. Von einer Großmutter, die nicht aufgegeben hat. Von einer Freundin, die Briefe aufbewahrt hat. Von einer Mutter, die nie aufgehört hat zu hoffen. Und von einem Mädchen, das endlich gefunden wurde. Mara machte ein Foto von den drei Dingen. Sie schickte es ihrer Mutter. Ihre Mutter schrieb zurück: Das ist schön. Das ist richtig. Mara legte das Handy weg und ging ins Bett. Sie schlief sofort ein. Und sie träumte nichts. Zum ersten Mal seit Wochen träumte sie nichts. Nur Stille. Nur Ruhe. Als Mara das Buch fast fertig hatte, lud sie Sabine und Frau Brandt zum Essen ein. Sie kochte Nudeln mit Tomatensoße. Zu viel Knoblauch, wie früher bei ihrer Großmutter. Sie saßen in der Küche und erzählten sich Geschichten. Frau Brandt erzählte von ihrer Kindheit. Sabine erzählte von Lena. Mara erzählte von Hamburg. Sie lachten viel. Sie weinten ein bisschen. Es war ein schöner Abend. Am Ende des Abends sagte Frau Brandt: Weißt du, Mara, deine Großmutter hat immer gesagt, dass dieses Haus einmal wieder lebendig werden würde. Ich habe ihr nicht geglaubt. Aber jetzt glaube ich es. Mara sagte: Das Haus ist lebendig. Weil ihr da seid. Weil wir da sind. Sabine sagte: Und weil Lena da ist. Nicht wirklich. Aber in unseren Herzen. Mara nickte. Ja, sagte sie. In unseren Herzen. Sie räumten zusammen den Tisch ab, spülten das Geschirr und verabschiedeten sich. Als sie gegangen waren, setzte sich Mara noch einmal an den Schreibtisch und schrieb weiter. Sie schrieb die letzten Seiten des Buches. Sie schrieb, wie sie sich fühlte. Nicht wie eine Journalistin. Wie eine Frau, die nach Hause gekommen war und geblieben war. Und die endlich wusste, wo sie hingehörte. Sie nahm den kleinen Stein vom Friedhof mit nach Hause, stellte ihn auf ihren Schreibtisch und legte daneben das Foto von Lena, damit sie jeden Tag daran erinnert wurde, warum sie diese Geschichte zu Ende erzählt hatte. Mara ging langsam vom Friedhof zurück nach Hause, kaufte auf dem Weg Brot und Blumen und dachte daran, dass sie am nächsten Tag wiederkommen würde, um Lena eine Rose zu bringen."], ["12. Der Artikel", "Mara schrieb den Artikel. Sie schrieb ihn in drei Tagen. Sie schrieb ihn im Haus am Waldrand, am Küchentisch, mit Blick in den Garten. Sie schrieb über Lena. Über ihre Großmutter. Über Sabine. Über die Briefe. Über den Keller. Über die Wahrheit. Sie schrieb nicht wie eine Journalistin, die eine Geschichte will. Sie schrieb wie eine Frau, die eine Geschichte erzählen muss. Weil sie sonst niemand erzählt. Als der Artikel fertig war, schickte sie ihn an ihre alte Redaktion in Hamburg. Ihr alter Chef rief sie an. Mara, sagte er, das ist der beste Artikel, den du je geschrieben hast. Wir drucken ihn. Auf der ersten Seite. Mara sagte: Danke. Aber es geht nicht um mich. Es geht um Lena. Er sagte: Ich weiß. Und genau deswegen ist er so gut. Der Artikel erschien an einem Samstag. Auf der ersten Seite stand: Das Mädchen mit der roten Jacke. Darunter stand Maras Name. Viele Menschen lasen ihn. Im Dorf. In Bielefeld. In Hamburg. Überall. Mara bekam Anrufe. Von Leuten, die sie kannte. Von Leuten, die sie nicht kannte. Von einer Frau, die sagte: Ich habe damals auch einen Brief von ihm bekommen. Von einem Mann, der sagte: Ich habe damals auch etwas gesehen, aber ich habe mich nicht getraut, etwas zu sagen. Mara hörte zu und schrieb alles auf. Die Geschichte war noch nicht zu Ende. Sie hatte gerade erst angefangen. Am Abend nach dem Artikel saß Mara mit Frau Brandt und Sabine in der Küche. Sie tranken Tee und aßen Kuchen. Frau Brandt sagte: Deine Großmutter wäre stolz auf dich. Mara sagte: Ich hoffe es. Sabine sagte: Sie ist stolz. Ganz sicher. Mara lächelte. Sie dachte an ihre Großmutter, die allein in diesem Haus gesessen und Ordner geschrieben hatte. Die niemandem erzählt hatte, was sie wusste, weil niemand ihr geglaubt hätte. Jetzt glaubten alle. Jetzt wussten alle. Mara beschloss, im Haus zu bleiben. Nicht für immer. Aber für eine Weile. Sie würde das Haus renovieren. Sie würde den Garten wieder herrichten. Sie würde die Schaukel reparieren. Und sie würde weiter schreiben. Nicht nur über Lena. Auch über andere Geschichten. Geschichten, die niemand erzählen will. Geschichten, die erzählt werden müssen. Sie richtete sich ein kleines Arbeitszimmer ein. Im Keller. In dem kleinen Raum, in dem ihre Großmutter gesessen hatte. Sie stellte einen Schreibtisch hin, einen Stuhl, eine Lampe. Und sie hängte ein Foto an die Wand. Ein Foto von ihrer Großmutter. Und ein Foto von Lena. Zwei Frauen, die sie nie vergessen würde. Sie schrieb den ersten Satz für das nächste Projekt auf einen Zettel und klebte ihn an die Wand. Darauf stand: Es gibt Geschichten, die man nicht vergessen darf. Mara las den Satz und nickte. Sie wusste, dass sie noch viele Geschichten schreiben würde. Aber diese hier, die Geschichte von Lena, würde immer die wichtigste bleiben. Weil sie damit angefangen hatte. Weil sie damit nach Hause gekommen war. Am letzten Abend, bevor ihre Mutter wieder nach Hause fuhr, saßen Mara und ihre Mutter zusammen im Garten. Sie tranken Tee und schauten in den Himmel. Die Sterne waren klar zu sehen. So klar wie selten in der Stadt. Ihre Mutter sagte: Weißt du noch, wie du als Kind immer gesagt hast, dass du einmal ein Buch schreiben willst? Mara sagte: Ja. Ich wollte immer ein Buch schreiben. Aber ich dachte, es wird ein Buch über etwas Großes. Über die Welt. Über Politik. Über Hamburg. Ihre Mutter sagte: Und jetzt ist es ein Buch über ein kleines Dorf in der Senne. Mara sagte: Ja. Und es ist das wichtigste Buch, das ich je schreiben werde. Ihre Mutter nahm ihre Hand und sagte: Deine Großmutter wäre so stolz. Mara sagte: Ich weiß. Sie saßen lange so da. Hand in Hand. Unter den Sternen. Und Mara dachte: Das ist mein Zuhause. Nicht Hamburg. Nicht die Redaktion. Nicht die große Welt. Dieses Haus. Dieser Garten. Diese Sterne. Und die Menschen, die hier leben. Sie ging ins Bett und schlief sofort ein. Und sie träumte von ihrer Großmutter. Sie stand im Garten und lächelte. Sie sagte: Gut gemacht, Mara. Gut gemacht. Und Mara lächelte im Traum zurück. Sie druckte den Artikel aus, legte ihn in einen Ordner und schrieb auf den Ordner mit einem Stift den Titel: Das Mädchen mit der roten Jacke, weil sie wusste, dass sie diesen Artikel nie wieder verlieren wollte. Mara legte den ausgedruckten Artikel auf den Küchentisch, las ihn noch einmal von vorne bis hinten und korrigierte mit einem Stift einen kleinen Fehler, den sie beim ersten Lesen übersehen hatte."], ["13. Das neue Leben", "Die Wochen vergingen. Mara lebte sich ein. Sie lernte die Nachbarn kennen. Sie ging jeden Morgen spazieren. Sie kaufte beim Bäcker ein. Sie sprach mit Frau Brandt. Sie trank Tee mit Sabine. Sie renovierte das Haus, Zimmer für Zimmer. Zuerst die Küche. Dann das Wohnzimmer. Dann den Garten. Die Schaukel hing wieder gerade. Die Fensterläden waren wieder grün. Das Haus sah wieder aus wie früher. Nur schöner. Weil es wieder lebte. Sie schrieb weiter. Nicht nur über Lena. Über das Dorf. Über die Menschen. Über die Geschichten, die in jedem Haus steckten. Sie schrieb über Frau Brandt, die als Kind den Krieg erlebt hatte. Sie schrieb über Sabine, die ihre beste Freundin verloren und wiedergefunden hatte. Sie schrieb über die Mutter von Lena, die jeden Tag Rosen in den Garten pflanzte, für ihre Tochter. Die Menschen im Dorf begannen, ihr ihre Geschichten zu erzählen. Weil sie wussten, dass Mara zuhörte. Wirklich zuhörte. Eines Tages kam ein Brief. Von einem Verlag. Sie wollten, dass Mara ein Buch schreibt. Über Lena. Über ihre Großmutter. Über das Haus. Mara las den Brief zweimal. Dann legte sie ihn weg und ging in den Garten. Sie setzte sich auf die Schaukel und dachte nach. Ein Buch. Das wäre viel Arbeit. Viel Zeit. Viel Mut. Aber sie wusste schon, dass sie es machen würde. Weil die Geschichte es verdient hatte. Weil Lena es verdient hatte. Weil ihre Großmutter es verdient hatte. Sie rief ihre Mutter an und erzählte ihr von dem Brief. Ihre Mutter sagte: Mach es. Deine Großmutter hätte es gewollt. Mara sagte: Ich habe Angst. Ihre Mutter sagte: Das ist normal. Mut heißt nicht, keine Angst zu haben. Mut heißt, es trotzdem zu tun. Mara lachte. Das hatte ihre Großmutter auch immer gesagt. Oder hatte sie das nur gedacht? Egal. Es stimmte. Am Abend saß Mara am Schreibtisch im Keller und fing an zu schreiben. Nicht den Artikel. Das Buch. Sie schrieb die erste Zeile: Mara stand am Bahnhof von Bielefeld und wusste nicht, ob sie wirklich aussteigen sollte. Sie las die Zeile und lächelte. Das war der Anfang. Und sie wusste, wie es weitergehen würde. Sie würde alles aufschreiben. Von Anfang an. Damit niemand es je wieder vergessen würde. Sie schrieb bis spät in die Nacht. Sie schrieb über den Bahnhof, über das Haus, über den Keller, über Lena, über Sabine, über Frau Brandt, über Heinrich Weber, über die Mutter, über die Beerdigung, über den Artikel. Sie schrieb, bis ihre Hand weh tat. Dann legte sie den Stift weg und ging ins Bett. Draußen war es still. Drinnen war es warm. Und das Haus, das so lange still gewesen war, war jetzt voller Leben. Als das Buch fertig war, schickte Mara es an den Verlag. Sie wartete zwei Wochen. Dann kam die Antwort. Wir drucken es, stand darin. Mara las den Brief dreimal. Dann rief sie ihre Mutter an. Dann rief sie Sabine an. Dann rief sie Frau Brandt an. Alle freuten sich. Am Abend ging Mara in den Garten und setzte sich auf die Schaukel. Sie schaukelte langsam hin und her und dachte an alles, was passiert war. An den Bahnhof. An das Haus. An den Keller. An Lena. An ihre Großmutter. An Sabine. An Frau Brandt. An Heinrich Weber. An die Polizei. An den Artikel. An das Buch. Sie dachte: Vor einem Jahr stand ich am Bahnhof und wusste nicht, ob ich aussteigen sollte. Jetzt stehe ich hier und weiß: Es war die beste Entscheidung meines Lebens. Sie stand auf, ging ins Haus und legte das Manuskript auf den Tisch. Daneben legte sie das Foto von Lena. Und das Foto ihrer Großmutter. Und den Anhänger. Ein Herz aus Glas. Sie schaute alles lange an. Dann schloss sie das Haus ab, ging ins Bett und schlief ein. Draußen war es still. Drinnen war es warm. Und das Haus in der Senne, das so lange still gewesen war, schlief endlich ruhig. Wie Mara. Wie alle, die endlich die Wahrheit kannten. Und wie Lena, die endlich gefunden worden war. Sie stellte das Manuskript auf das Regal im Keller, neben die Ordner ihrer Großmutter, und dachte daran, dass jetzt zwei Generationen von Frauen in diesem kleinen Raum geschrieben hatten, was niemand vergessen sollte. Mara stellte die Vase mit den weißen Rosen auf den Tisch im Keller, setzte sich an ihren Schreibtisch und schrieb den ersten Satz für das nächste Kapitel ihres Buches auf ein leeres Blatt."], ["14. Das stille Haus", "Ein Jahr später stand Mara wieder am Bahnhof von Bielefeld. Aber diesmal fuhr sie nicht weg. Sie holte jemanden ab. Ihre Mutter. Ihre Mutter kam zu Besuch. Sie stieg aus dem Zug und schaute sich um. Es ist schön hier, sagte sie. Mara sagte: Ja. Es ist schön. Sie fuhren zusammen zum Haus. Die Mutter schaute sich alles an. Den Garten. Die Schaukel. Das Haus. Sie sagte: Deine Großmutter wäre stolz. Mara sagte: Ich weiß. Am Abend saßen sie zusammen im Garten. Die Sonne ging unter. Die Vögel sangen. Die Schaukel bewegte sich leicht im Wind. Mara erzählte ihrer Mutter von dem Buch. Es ist fast fertig, sagte sie. Ihre Mutter sagte: Ich will es als Erste lesen. Mara sagte: Das wirst du. Versprochen. Als ihre Mutter ins Bett gegangen war, ging Mara noch einmal in den Keller. Sie setzte sich auf den Stuhl in dem kleinen Raum. Auf dem Tisch lag das Buch. Nicht gedruckt. Noch handgeschrieben. Aber fast fertig. Sie blätterte darin. Sie las die letzte Seite. Darauf stand: Und das Haus war nicht mehr still. Es war wieder lebendig. Weil jemand zurückgekommen war, um die Wahrheit zu finden. Und weil die Wahrheit, auch wenn sie weh tut, immer besser ist als das Schweigen. Mara klappte das Buch zu und ging nach oben. Sie schloss die Kellertür ab. Nicht, weil sie Angst hatte. Sondern weil der Raum jetzt ein Arbeitszimmer war. Und ein Arbeitszimmer schließt man ab, wenn man Feierabend hat. Sie ging ins Wohnzimmer, setzte sich aufs Sofa und schaute aus dem Fenster. Der Garten war still. Aber es war eine andere Stille als früher. Nicht die Stille des Vergessens. Sondern die Stille des Friedens. Sie dachte an Lena. An ihre Großmutter. An Sabine. An Frau Brandt. An alle, die ihr geholfen hatten. Sie dachte an das Mädchen mit der roten Jacke, das endlich gefunden worden war. Sie dachte an das Haus, das so lange still gewesen war und jetzt wieder lebte. Und sie dachte an sich selbst. An die Frau, die vor einem Jahr am Bahnhof gestanden und nicht gewusst hatte, ob sie aussteigen sollte. Sie war ausgestiegen. Und das war die beste Entscheidung ihres Lebens gewesen. Mara stand auf, ging zur Tür und schloss sie ab. Dann ging sie ins Bett. Draußen war es still. Drinnen war es warm. Und das Haus in der Senne, das so lange still gewesen war, schlief endlich ruhig. Wie Mara. Wie alle, die endlich die Wahrheit kannten. Am nächsten Morgen wachte Mara auf und wusste: Das Buch ist fertig. Nicht nur auf dem Papier. Auch in ihrem Kopf. Und in ihrem Herzen. Sie ging in den Garten, setzte sich auf die Schaukel und lächelte. Das war das Ende. Und gleichzeitig der Anfang. Ein Jahr später stand Mara wieder am Bahnhof. Aber diesmal wartete sie auf jemanden. Auf eine junge Frau, die sie aus Hamburg kannte. Die Frau wollte das Haus sehen. Sie wollte die Geschichte hören. Sie wollte ein Interview machen. Mara lächelte. Sie wusste schon, was sie sagen würde. Sie würde von Lena erzählen. Von ihrer Großmutter. Von dem Keller. Von dem Tagebuch. Von der Wahrheit. Sie würde alles erzählen. Von Anfang an. Damit niemand es je wieder vergessen würde. Sie stieg in den Zug und fuhr nach Hause. Nach Hause in die Senne. In das Haus am Waldrand. Das Haus, das nicht mehr still war. Das Haus, das wieder lebte. Weil jemand zurückgekommen war. Weil jemand geblieben war. Weil jemand die Wahrheit gefunden hatte. Und weil die Wahrheit, auch wenn sie weh tut, immer besser ist als das Schweigen. Mara schaute aus dem Fenster und sah die Bäume vorbeifliegen. Sie dachte an Lena. An ihre Großmutter. An sich selbst. Und sie wusste: Das ist erst der Anfang. Es gibt noch so viele Geschichten, die erzählt werden müssen. Und sie würde sie erzählen. Alle. Eine nach der anderen. Bis es keine stillen Häuser mehr gibt. Bis alle Geschichten erzählt sind. Sie schloss die Haustür ab, stellte die Tasche mit dem fertigen Buch neben die Tür und wusste, dass sie am nächsten Morgen zum Verlag fahren würde, um es persönlich abzugeben, weil dieses Buch ihr wichtiger war als alles, was sie je geschrieben hatte. Mara stellte ihre Tasche neben die Tür, zog ihre Schuhe aus und ging barfuß durch das Haus, weil sie das Gefühl hatte, dass sie endlich wirklich zu Hause angekommen war."]], "kat": "Romane", "unter": "Krimi"}, {"title": "Das Erbe der Nebelkrone - Ein Fantasy-Roman aus Bielefeld", "chapters": [["1. Das Buch im Keller", "Lina stand im Keller ihres Elternhauses in Bielefeld und wusste nicht, warum sie überhaupt heruntergekommen war. Sie war nur gekommen, um eine Kiste mit Winterjacken zu holen. Stattdessen stand sie jetzt vor einem Regal, das sie noch nie gesehen hatte. Oder hatte sie es nur vergessen? Das Regal war alt, das Holz war dunkel, und darauf stand ein Buch, das nicht zu den anderen Büchern passte. Es war dicker, schwerer, und auf dem Einband stand kein Titel. Nur ein Zeichen. Eine Krone aus Nebel. Lina nahm das Buch in die Hand. Es war kalt. Kälter, als ein Buch sein sollte. Sie schlug es auf. Auf der ersten Seite stand in einer Handschrift, die sie kannte: Für Lina, wenn du bereit bist. Darunter stand ein Name: Oma Greta. Lina wurde kalt. Ihre Großmutter war vor drei Jahren gestorben. Wie konnte sie ein Buch für sie hinterlassen haben, das sie nie gesehen hatte? Sie blätterte weiter. Auf der zweiten Seite stand eine Karte. Nicht von Bielefeld. Nicht von Deutschland. Von einem Land, das sie nicht kannte. Eldoria. Darunter stand: Wenn der Nebel kommt, dann geh. Folge dem Licht. Lina lachte kurz. Das war ein Scherz. Oder ein altes Märchenbuch. Sie klappte das Buch zu und wollte es zurückstellen. Da hörte sie es. Ein Geräusch. Wie Wind. Aber es gab keinen Wind im Keller. Sie drehte sich um. Hinter ihr stand Nebel. Echter Nebel. Im Keller. Er kam aus der Wand. Oder aus dem Buch? Lina hielt das Buch fest. Der Nebel wurde dichter. Er roch nach Regen und nach Wald und nach etwas, das sie nicht benennen konnte. Nach Magie. Sie wollte nach oben rufen. Mama! Papa! Aber ihre Stimme kam nicht raus. Der Nebel umhüllte sie. Und dann war sie nicht mehr im Keller. Sie stand auf einer Wiese. Vor ihr stand ein Wald. Über ihr stand ein Himmel mit zwei Monden. Lina ließ das Buch fallen. Es fiel nicht auf den Boden. Es schwebte. Sie nahm es wieder in die Hand und schaute sich um. Wo bin ich?, flüsterte sie. Eine Stimme antwortete. Nicht laut. Leise. Wie ein Flüstern im Wind. In Eldoria, sagte die Stimme. Und du bist die Letzte, auf die wir gewartet haben. Lina wollte weinen. Sie wollte lachen. Sie wollte nach Hause. Aber tief in ihr wusste sie schon, dass sie nicht mehr einfach zurück konnte. Nicht, bevor sie verstand, warum sie hier war. Sie ging langsam auf den Wald zu. Das Buch in ihrer Hand wurde warm. Auf dem Einband leuchtete die Krone aus Nebel. Und Lina wusste: Das war erst der Anfang. Lina setzte sich auf den Boden des Kellers und schlug das Buch noch einmal auf. Auf einer neuen Seite stand eine Zeichnung von zwei Monden. Darunter stand: Wenn du die zwei Monde siehst, dann bist du zu Hause. Lina dachte an Bielefeld, an den Himmel über Bielefeld, an den einen Mond, den sie von zu Hause kannte. Hier gab es zwei Monde. Das war der Unterschied. Sie stand auf, ging nach oben und holte eine Tasche. Sie packte Wasser, Brot, eine Decke und das Buch ein. Sie wusste nicht, wie lange sie in Eldoria bleiben würde. Vielleicht einen Tag. Vielleicht eine Woche. Vielleicht länger. Sie schrieb ihrer Mutter eine Nachricht auf einen Zettel und legte ihn auf den Küchentisch. Darin stand: Bin kurz weg. Mache mir keine Sorgen. Ich bin in Eldoria. Ihre Mutter würde das nicht verstehen. Aber Lina wusste, dass sie es später erklären würde. Wenn sie zurückkam. Wenn sie die Geschichte zu Ende erzählt hatte. Sie ging zurück in den Keller, nahm das Buch und sagte laut: Ich bin bereit. Und der Nebel kam wieder. Nicht bedrohlich. Eher wie ein Freund, der sie abholt. Sie schloss die Augen. Als sie sie wieder öffnete, stand sie wieder auf der Wiese. Vor dem Wald. Mira wartete schon auf sie. Sie lächelte und sagte: Ich wusste, dass du wiederkommst. Lina lächelte zurück und sagte: Natürlich komme ich wieder. Ich habe doch noch nicht alles gesehen. Sie gingen zusammen los. In den Wald. Zu den Menschen. Zu den Geschichten, die noch erzählt werden mussten. Lina fühlte sich zum ersten Mal seit langem nicht mehr wie ein Gast. Sie fühlte sich wie jemand, der nach Hause gekommen war. Nach einem langen Weg. Nach vielen Jahren. Nach einer Suche, von der sie nicht einmal gewusst hatte, dass sie sie suchte. Lina stand auf, ging zum Fenster und schaute in den Garten, wo die Schaukel noch immer am Baum hing und sich leicht im Wind bewegte, als ob sie ihr sagen wollte, dass alles gut werden würde, wenn sie nur weitergehen würde. Lina dachte an den Moment, als sie das Buch zum ersten Mal in der Hand gehalten hatte, und wusste, dass sie damals noch nicht ahnen konnte, was alles passieren würde, wenn sie es aufschlagen würde. Lina atmete tief durch, weil sie spürte, dass dieser Moment wichtig war und dass sie ihn nie wieder vergessen würde, egal, was noch passieren sollte. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["2. Eldoria", "Der Wald war nicht wie der Wald in Bielefeld. Die Bäume waren höher. Die Blätter waren nicht nur grün, sie waren grün und blau und ein bisschen lila, wenn das Licht darauf fiel. Auf dem Boden wuchsen Blumen, die Lina noch nie gesehen hatte. Sie leuchteten schwach, als ob sie selbst Licht machten. Lina ging vorsichtig weiter. Jeder Schritt knackte leise auf dem Moos. Sie hatte Angst, aber sie hatte auch Neugier. Sie war schon immer neugierig gewesen. Ihre Mutter hatte immer gesagt: Lina, deine Neugier bringt dich noch einmal in Schwierigkeiten. Und jetzt war sie in Schwierigkeiten. Oder in einem Wunder. Sie wusste es noch nicht. Nach einer Weile hörte sie Wasser. Ein kleiner Bach. Sie kniete sich hin und trank. Das Wasser schmeckte nach Minze und nach etwas Süßem. Sie setzte sich auf einen Stein und schlug das Buch auf. Auf der Seite, auf der vorher die Karte war, stand jetzt ein Text. Du bist in Eldoria, stand da. Eldoria war einmal ein Land der Magie. Aber der Nebel hat die Magie gestohlen. Nur die Trägerin der Nebelkrone kann sie zurückbringen. Lina las den Text zweimal. Trägerin der Nebelkrone? Meinten sie sie? Sie schaute auf ihre Hände. Ganz normale Hände. Kein Leuchten. Keine Magie. Sie stand auf und ging weiter. Nach einer Stunde kam sie an ein Dorf. Kleine Häuser aus Stein und Holz, mit Blumen vor den Fenstern. Menschen, die sie ansahen, als ob sie ein Geist wäre. Ein altes Mädchen, vielleicht acht Jahre alt, kam auf sie zu und sagte: Du bist sie. Du bist die mit dem Buch. Lina fragte: Woher weißt du das? Das Mädchen sagte: Oma Greta hat es uns gesagt. Sie hat gesagt, eines Tages kommt ein Mädchen aus der anderen Welt. Mit einem Buch. Und mit einer Krone, die man nicht sehen kann. Lina fragte: Wo ist Oma Greta? Das Mädchen zeigte auf ein Haus am Ende der Straße. Sie wartet schon lange auf dich. Aber sie ist nicht mehr hier. Sie ist gegangen, um den Nebel aufzuhalten. Lina ging zu dem Haus. Drinnen roch es nach Kräutern und nach Tee. Auf dem Tisch lag ein Brief. Für Lina, stand darauf. Sie öffnete ihn. Darin stand: Meine liebe Lina, wenn du das liest, dann bin ich nicht mehr da. Aber du bist da. Und das ist gut. Eldoria braucht dich. Der Nebel hat alles genommen. Die Magie. Die Erinnerung. Die Hoffnung. Nur du kannst sie zurückbringen. Weil du meine Enkelin bist. Und weil die Krone dich gewählt hat. Lina legte den Brief weg und weinte. Nicht laut. Leise. Weil sie ihre Großmutter vermisste. Und weil sie Angst hatte. Und weil sie zum ersten Mal verstand, dass ihre Großmutter nicht nur eine alte Frau aus Bielefeld gewesen war. Sie war eine Magierin aus Eldoria gewesen. Und jetzt war Lina die Nächste. Am Abend saßen Lina und Mira zusammen am Feuer. Die Menschen im Dorf hatten ihnen Brot und Käse gebracht. Ein Mann spielte auf einer Flöte. Ein Kind schlief auf dem Schoß seiner Mutter. Lina fragte Mira: Wie war es hier, bevor der Nebel kam? Mira sagte: Ich war noch nicht geboren. Aber meine Mutter hat es mir erzählt. Es war bunt. Die Menschen konnten Magie. Sie konnten heilen. Sie konnten mit Tieren sprechen. Sie konnten Licht machen. Und dann kam der Nebel. Und alles wurde grau. Lina fragte: Und Oma Greta? Mira sagte: Oma Greta war die Letzte, die noch Magie konnte. Sie hat den Nebel aufgehalten, so gut sie konnte. Aber sie wurde alt. Und müde. Und dann ist sie gegangen. Nach Bielefeld. Zu dir. Lina wurde still. Ihre Großmutter war nach Bielefeld gegangen, um sie zu beschützen. Um sie großzuziehen. Um ihr Geschichten zu erzählen. Geschichten, die keine Märchen waren. Lina nahm das Buch und blätterte darin. Auf einer Seite stand ein Foto. Ein altes Foto. Darauf war ihre Großmutter als junge Frau. Sie stand auf einer Wiese in Eldoria. Neben ihr stand ein Mann mit einem langen Bart. Der Wächter. Lina zeigte Mira das Foto. Mira sagte: Das ist der Wächter. Als er noch jung war. Bevor der Nebel kam. Lina schaute das Foto lange an. Der Wächter hatte gelächelt. Er hatte glücklich ausgesehe
