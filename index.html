enen sie wieder Ja sagt, obwohl sie Nein meint. Das ist kein Scheitern, das ist ein Rückfall. Sie bestraft sich nicht dafür, sondern sie sagt: Okay, heute habe ich wieder Ja gesagt, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie etwas ändern. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird etwas ändern, Schritt für Schritt, Tag für Tag. Ein weiterer Punkt zu Lena 6 Monate später ist, dass sie nicht perfekt ist. Es gibt Tage, an denen sie wieder Ja sagt, obwohl sie Nein meint. Das ist kein Scheitern, das ist ein Rückfall. Sie bestraft sich nicht dafür, sondern sie sagt: Okay, heute habe ich wieder Ja gesagt, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie etwas ändern. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird etwas ändern, Schritt für Schritt, Tag für Tag. Und das ist der Punkt: Es geht nicht darum, perfekt zu sein, sondern darum, dran zu bleiben, auch wenn es einmal nicht klappt. Lena bleibt dran, auch wenn sie mal einen Rückfall hat. Sie hat gelernt, dass Rückfälle normal sind und dass sie nichts über ihren Wert aussagen. Sie sagen nur, dass sie ein Mensch ist, der manchmal in alte Muster zurückfällt. Und das ist in Ordnung, solange sie danach wieder aufsteht und weitermacht. Das ist der Weg, um Nein sagen zu lernen, ohne sich schlecht zu fühlen: Nicht perfekt sein, sondern dranbleiben, Tag für Tag, Schritt für Schritt. Lena ist heute nicht perfekt, aber sie ist glücklicher, weil sie ehrlich ist, zu sich selbst und zu anderen. Sie hat mehr Zeit für sich selbst, sie ist weniger gereizt, sie hat bessere Beziehungen. Das ist kein Wunder, das ist Nein sagen. Und das kannst du auch. Du musst nicht perfekt sein, du musst nur anfangen, Schritt für Schritt, Tag für Tag.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Dein Plan für die nächsten 30 Tage - Nein sagen lernen, Schritt für Schritt", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein verändert nichts. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Schreibe jeden Abend auf, wann du Ja gesagt hast, obwohl du Nein meintest. Nur aufschreiben, nichts ändern. Woche 2: Sag einmal am Tag Nein, wenn du Nein meinst. Nur einmal. Nicht öfter. Benutze Satz Nummer 1: Ich muss kurz nachdenken, ich melde mich später. Woche 3: Sag zweimal am Tag Nein, wenn du Nein meinst. Benutze Satz Nummer 2: Nein, das geht bei mir heute nicht. Woche 4: Sag dreimal am Tag Nein, wenn du Nein meinst, und sag einmal am Tag Ja, wenn du Ja meinst. Benutze auch Satz Nummer 7: Nein. Nur Nein. Nach 30 Tagen wirst du merken, dass du dich besser fühlst. Nicht perfekt, aber besser. Lena hat nach 30 Tagen gemerkt, dass sie nicht mehr jedes Mal Ja sagte. Sie sagte manchmal Nein, und die Welt ist nicht untergegangen. Sie hat gemerkt, dass sie wieder Zeit für sich selbst hatte, und dass sie wieder lachen konnte, weil sie nicht mehr so müde war. Das ist kein Wunder, das ist Nein sagen. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du das letzte Mal Ja gesagt hast, obwohl du Nein meintest. Und frag dich: Was hätte ich eigentlich sagen wollen? Das ist der erste Schritt, um Nein sagen zu lernen, ohne dich schlecht zu fühlen. Ein Beispiel, das zeigt, wie der 30-Tage-Plan funktioniert: Lena hat in der ersten Woche nur aufgeschrieben, wann sie Ja gesagt hat, obwohl sie Nein meinte. Sie hat gemerkt, dass sie 15 Mal in einer Woche Ja gesagt hat, obwohl sie Nein meinte. Das war viel mehr, als sie gedacht hatte. In der zweiten Woche hat sie einmal am Tag Nein gesagt. Das war schwer, aber sie hat es geschafft. In der dritten Woche hat sie zweimal am Tag Nein gesagt. Das war schon leichter, weil sie gemerkt hat, dass die Welt nicht untergeht, wenn sie Nein sagt. In der vierten Woche hat sie dreimal am Tag Nein gesagt und einmal am Tag Ja, wenn sie Ja meinte. Sie hat den Malkurs gebucht, den sie schon lange machen wollte. Das war ein Ja, das ihr Spaß gemacht hat. Nach 30 Tagen hat sie gemerkt, dass sie sich besser fühlt. Nicht perfekt, aber besser. Sie hat mehr Zeit für sich selbst, sie ist weniger gereizt, sie hat bessere Beziehungen. Das ist kein Wunder, das ist Nein sagen. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du das letzte Mal Ja gesagt hast, obwohl du Nein meintest. Und frag dich: Was hätte ich eigentlich sagen wollen? Das ist der erste Schritt, um Nein sagen zu lernen, ohne dich schlecht zu fühlen. Ein weiterer Punkt zum 30-Tage-Plan ist, dass du nach 30 Tagen nicht fertig bist. Nach 30 Tagen hast du angefangen, aber du bist noch lange nicht am Ziel. Du musst dranbleiben, Monat für Monat, Jahr für Jahr. Lena hat nach 30 Tagen angefangen, aber sie ist nach 6 Monaten immer noch dabei. Sie wird auch in einem Jahr noch dabei sein, und in 5 Jahren. Das ist der Punkt: Nein sagen lernen ist kein Projekt, das man nach 30 Tagen abschließt und dann nie wieder darüber nachdenkt. Nein sagen lernen ist ein Prozess, der ein Leben lang dauert. Man lernt jeden Tag etwas Neues über sich selbst, weil man jeden Tag neue Situationen erlebt, in denen man Nein sagen muss. Und das ist gut, weil man dadurch immer besser wird, immer ehrlicher, immer selbstbewusster. Fang heute an. Mit einem Blatt Papier und einem Stift. Schreib auf, wann du das letzte Mal Ja gesagt hast, obwohl du Nein meintest. Und frag dich: Was hätte ich eigentlich sagen wollen? Das ist der erste Schritt, um Nein sagen zu lernen, ohne dich schlecht zu fühlen. Und wenn du den ersten Schritt gemacht hast, dann bist du schon weiter als alle, die noch warten. Nach 30 Tagen bist du nicht fertig, aber du hast angefangen. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann bist du schon weiter als alle, die noch warten. Bleib dran, Monat für Monat, Jahr für Jahr. Und wenn du einmal zurückfällst, dann steh wieder auf und mach weiter. Das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."]], "kat": "Sachbücher", "unter": "Psychologie"}, {"title": "Schulden loswerden - Ohne dich zu schämen", "chapters": [["Der Mann, der jeden Monat nur die Mindestrate zahlte", "Markus ist 41, arbeitet in Bielefeld in einem Lager, und er hat ein Problem, das er lange vor allen versteckt hat. Er hat 14.800 Euro Schulden. 6.200 Euro auf seiner Kreditkarte, 4.100 Euro Dispo auf seinem Konto, 3.500 Euro Ratenkredit für ein Auto, das er schon längst verkauft hat, und 1.000 Euro, die er seinem Bruder schuldet. Jeden Monat zahlt er nur die Mindestrate auf seiner Kreditkarte, 150 Euro, und denkt, er tut etwas Gutes. In Wahrheit wird seine Schuld kaum weniger, weil die Zinsen fast alles auffressen. Seine Kreditkarte kostet 17 Prozent Zinsen im Jahr. Das heißt, von seinen 150 Euro gehen 85 Euro nur für Zinsen drauf, und nur 65 Euro tilgen wirklich seine Schuld. Er zahlt also 150 Euro, aber seine Schuld wird nur 65 Euro weniger. So braucht er über 9 Jahre, um seine Kreditkarte abzubezahlen, und er zahlt insgesamt über 9.000 Euro Zinsen, für eine Schuld von 6.200 Euro. Markus hat das nicht verstanden, bis er eines Abends nicht mehr schlafen konnte, weil er Angst hatte, dass sein Konto gepfändet wird. Er hat sich geschämt. Er hat niemandem davon erzählt, nicht seiner Frau, nicht seinem Bruder, nicht seinen Freunden. Er dachte, Schulden zu haben, heißt, dass man versagt hat. In diesem Buch gehen wir genau das durch: Warum Schulden kein Versagen sind, sondern ein Problem, das man lösen kann, wie du den Überblick zurückbekommst, ohne dich zu schämen, und wie du Schritt für Schritt schuldenfrei wirst, auch wenn du nicht viel verdienst. Was Markus danach noch gelernt hat, war, dass die Mindestrate eine Falle ist. Die Bank freut sich, wenn du nur die Mindestrate zahlst, weil sie dann am meisten Zinsen bekommt. Wenn du nur die Mindestrate zahlst, dann zahlst du fast nur Zinsen und kaum Tilgung. Das ist, als würdest du ein Loch mit einem Teelöffel ausgraben, während es gleichzeitig wieder zugeschüttet wird. Markus hat das erst verstanden, als er sich ausgerechnet hat, wie lange er brauchen würde, wenn er nur die Mindestrate zahlt: Über 9 Jahre, und er würde 9.000 Euro Zinsen zahlen für 6.200 Euro Schuld. Das war ein Schock für ihn. Er hat gedacht, er tut etwas Gutes, weil er jeden Monat pünktlich zahlt. In Wahrheit hat er der Bank geholfen, Geld zu verdienen, nicht sich selbst. Als er das verstanden hat, hat er angefangen, mehr als die Mindestrate zu zahlen. Er hat 200 Euro statt 150 Euro gezahlt, und plötzlich wurde seine Schuld viel schneller weniger. Das ist der Punkt: Die Mindestrate ist das Minimum, das du zahlen musst, damit die Bank dich in Ruhe lässt. Es ist nicht das, was du zahlen solltest, um schuldenfrei zu werden. Wenn du schuldenfrei werden willst, dann musst du mehr zahlen als die Mindestrate, so viel wie du kannst, ohne dass du dich kaputt machst. Markus hat das gelernt, und es hat ihm geholfen, seine Schulden in 2 Jahren um 11.600 Euro zu reduzieren, statt in 9 Jahren. Ein weiterer Punkt, den Markus gelernt hat, ist, dass man nicht alles auf einmal ändern muss. Er hat nicht von heute auf morgen angefangen, alle seine Schulden abzuzahlen. Er hat mit einer Sache angefangen: Er hat 100 Euro für seinen Notgroschen gespart. Nur 100 Euro. Das war machbar. Nach einem Monat hat er 200 Euro gespart. Nach 10 Monaten hatte er 1.000 Euro. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Markus hat auch gelernt, dass Rückschläge normal sind. Es gab Monate, in denen er keine Rate zahlen konnte, weil sein Auto kaputtgegangen ist. Das war kein Scheitern, das war ein Rückfall. Er hat sich nicht dafür bestraft, sondern er hat gesagt: Okay, diesen Monat habe ich keine Rate gezahlt, nächsten Monat zahle ich wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie schuldenfrei. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird schuldenfrei, Schritt für Schritt, Monat für Monat. Was Markus am Ende am meisten geholfen hat, war nicht ein einzelner Trick, sondern die Erkenntnis, dass er nicht versagt hat, weil er Schulden hat. Er hat nur Fehler gemacht, wie jeder Mensch Fehler macht. Und Fehler kann man wieder gutmachen, wenn man ehrlich ist und einen Plan hat. Das ist der Punkt: Schulden sind kein Versagen, sondern ein Problem, das man lösen kann. Und wenn du dieses Buch gelesen hast, dann weißt du, wie du es lösen kannst, Schritt für Schritt, Monat für Monat.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Warum Schulden kein Versagen sind - was wirklich dahinter steckt", "Viele Menschen denken, Schulden zu haben, heißt, dass man dumm ist oder dass man nicht mit Geld umgehen kann. Das stimmt nicht. Markus ist nicht dumm. Er arbeitet seit 20 Jahren, er verdient 2.300 Euro netto im Monat, er zahlt seine Miete pünktlich. Er hat Schulden, weil das Leben passiert ist. Vor 5 Jahren ist seine Waschmaschine kaputtgegangen, er hat eine neue auf Raten gekauft. Vor 4 Jahren ist sein Auto kaputtgegangen, er hat einen Kredit aufgenommen. Vor 3 Jahren ist seine Frau krank geworden und er musste Geld für Medikamente ausgeben, die die Krankenkasse nicht bezahlt hat. Vor 2 Jahren hat er Weihnachtsgeschenke für seine Kinder auf Kreditkarte gekauft, weil er ihnen eine schöne Weihnacht machen wollte. Jede einzelne Entscheidung war verständlich. Zusammen sind sie zu 14.800 Euro geworden. Das ist kein Versagen, das ist Leben. In Deutschland haben über 6 Millionen Menschen Schulden, die sie nicht mehr alleine bezahlen können. Das sind nicht 6 Millionen Versager. Das sind 6 Millionen Menschen, denen das Leben dazwischengekommen ist. Wer sich schämt, weil er Schulden hat, der wird das Problem nicht lösen, weil Scham einen klein macht. Wer sich nicht schämt, sondern sagt: Ich habe ein Problem und ich löse es, der wird es lösen. Markus hat sich 3 Jahre lang geschämt und nichts getan. Seine Schulden sind in der Zeit größer geworden, nicht kleiner. Erst als er aufgehört hat, sich zu schämen, und angefangen hat, etwas zu tun, sind seine Schulden kleiner geworden. Scham ist der größte Feind, wenn man Schulden hat. Nicht die Zinsen, nicht die Gläubiger, sondern die Scham. Ein Beispiel, das zeigt, dass Schulden jeden treffen können: Markus hat einen Kollegen, der 4.500 Euro netto verdient, also fast doppelt so viel wie Markus, und der trotzdem Schulden hat, weil er ein teures Auto auf Kredit gekauft hat, weil er jedes Jahr zweimal in den Urlaub fliegt, weil er teure Klamotten kauft, weil er denkt, er müsse so leben, wie es andere in seinem Bekanntenkreis tun. Er hat 22.000 Euro Schulden, obwohl er viel mehr verdient als Markus. Das zeigt: Schulden haben nichts mit dem Einkommen zu tun, sondern mit den Ausgaben. Wer mehr verdient, aber noch mehr ausgibt, hat auch Schulden. Wer weniger verdient, aber weniger ausgibt, hat keine Schulden. Es ist nicht das Einkommen, das entscheidet, ob man Schulden hat, sondern die Ausgaben. Markus hat das verstanden, als er seinen Kollegen gesehen hat. Er hat gemerkt, dass er nicht der Einzige ist, der Schulden hat, und dass es nicht daran liegt, dass er zu wenig verdient, sondern daran, dass er mehr ausgegeben hat, als er hatte. Das hat ihm die Scham genommen, weil er gemerkt hat, dass Schulden kein Zeichen von Dummheit sind, sondern ein Zeichen dafür, dass man mehr ausgegeben hat, als man hatte. Und das kann jedem passieren, egal wie viel man verdient. Wichtig ist nicht, wie viel man verdient, sondern wie man mit dem umgeht, was man verdient. Ein weiterer Punkt ist, dass Schulden nicht nur Geld kosten, sondern auch Nerven. Markus hat 3 Jahre lang nicht gut geschlafen, weil er Angst hatte, dass sein Konto gepfändet wird. Er hat sich geschämt, wenn er Post bekommen hat. Er hat sich versteckt, wenn sein Telefon geklingelt hat, weil er dachte, es sei ein Gläubiger. Das hat ihn krank gemacht. Er hatte Kopfschmerzen, er hatte Bauchschmerzen, er war immer müde. Als er angefangen hat, seine Schulden abzuzahlen, sind seine Kopfschmerzen weniger geworden. Er schläft wieder gut. Er hat keine Angst mehr, wenn sein Telefon klingelt. Das ist der größte Gewinn: Nicht dass er weniger Schulden hat, sondern dass er wieder ruhig schlafen kann. Schulden sind nicht nur ein Geldproblem, sondern auch ein Gesundheitsproblem. Wer Schulden hat und sich dafür schämt, der wird krank. Wer Schulden hat und etwas dagegen tut, der wird gesund. Markus hat das erlebt. Er ist heute gesünder als vor 3 Jahren, obwohl er immer noch Schulden hat. Aber er hat einen Plan, und er hält ihn ein. Und das macht ihn ruhiger. Denn ein Plan ist besser als Angst. Angst macht krank. Ein Plan macht gesund. Schulden haben nichts mit Dummheit zu tun. Sie haben damit zu tun, dass das Leben passiert ist. Wenn du Schulden hast, dann bist du nicht dumm, du bist ein Mensch, dem das Leben dazwischengekommen ist. Und das ist in Ordnung. Wichtig ist nicht, warum du Schulden hast, sondern was du jetzt dagegen tust. Und wenn du dieses Buch liest, dann tust du schon etwas dagegen. Das ist der erste Schritt.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Der Überblick - alle Schulden auf ein Blatt, ohne Panik", "Der erste Schritt, um Schulden loszuwerden, ist, den Überblick zu bekommen. Markus hatte Angst davor, weil er dachte, wenn er alle Schulden aufschreibt, dann wird es noch schlimmer. In Wahrheit wurde es besser, als er es aufgeschrieben hat. Denn vorher hatte er nur ein diffuses Gefühl von Angst. Er wusste, dass er Schulden hat, aber er wusste nicht genau, wie viel. Als er es aufgeschrieben hat, wusste er es genau: 14.800 Euro. Das war viel, aber es war nicht unendlich. Es war eine Zahl, mit der man arbeiten kann. So machst du es: Nimm ein Blatt Papier und schreib auf, bei wem du Schulden hast, wie viel du schuldest, wie viel Zinsen du zahlst, und wie viel du jeden Monat zahlen musst. Nichts anderes. Keine Bewertung, keine Vorwürfe, nur Zahlen. Markus hat das gemacht: Kreditkarte 6.200 Euro, 17 Prozent Zinsen, 150 Euro Mindestrate. Dispo 4.100 Euro, 12 Prozent Zinsen, 80 Euro Zinsen im Monat. Ratenkredit Auto 3.500 Euro, 8 Prozent Zinsen, 120 Euro Rate. Bruder 1.000 Euro, 0 Prozent Zinsen, keine feste Rate. Zusammen 14.800 Euro. Er hat das Blatt an seinen Kühlschrank gehängt, damit er es jeden Tag sieht. Das war schwer, weil er sich jedes Mal geschämt hat, wenn er es gesehen hat. Aber nach einer Woche hat er sich daran gewöhnt. Und nach zwei Wochen hat er angefangen, das Blatt nicht mehr als Schande zu sehen, sondern als Plan. Denn ein Plan ist besser als Angst. Angst macht klein. Ein Plan macht stark. Ein Beispiel, das zeigt, wie befreiend der Überblick ist: Markus hat sein Blatt mit allen Schulden an seinen Kühlschrank gehängt. Am Anfang hat er sich jedes Mal geschämt, wenn er es gesehen hat. Nach einer Woche hat er sich daran gewöhnt. Nach zwei Wochen hat er angefangen, das Blatt nicht mehr als Schande zu sehen, sondern als Plan. Er hat jeden Monat, wenn er eine Rate gezahlt hat, die Zahl auf dem Blatt durchgestrichen und die neue Zahl daneben geschrieben. Zum Beispiel: Kreditkarte war 6.200 Euro, nach einem Monat 6.000 Euro, nach zwei Monaten 5.800 Euro. Das hat ihm gezeigt, dass seine Schulden weniger werden, auch wenn es langsam geht. Das war ein gutes Gefühl, weil er gesehen hat, dass sein Plan funktioniert. Früher hatte er nur Angst, weil er nicht wusste, wie viel er schuldet. Jetzt wusste er es genau, und er sah, dass es weniger wird. Das ist der Unterschied zwischen Angst und Plan: Angst macht klein, weil man nicht weiß, was los ist. Ein Plan macht stark, weil man weiß, was los ist und was man tun muss. Markus hat seinen Plan jeden Monat aktualisiert, und er hat sich jedes Mal gefreut, wenn die Zahl kleiner geworden ist. Das war seine Motivation, weiterzumachen, auch wenn es schwer war. Denn wer sieht, dass seine Schulden weniger werden, der bleibt dran. Wer nicht sieht, dass sie weniger werden, weil er keinen Überblick hat, der gibt auf. Ein weiterer Punkt zum Überblick ist, dass man ihn nicht nur einmal machen sollte, sondern jeden Monat. Markus hat sein Blatt mit allen Schulden jeden Monat aktualisiert. Er hat die alten Zahlen durchgestrichen und die neuen Zahlen daneben geschrieben. Das hat ihm gezeigt, dass seine Schulden weniger werden, auch wenn es langsam geht. Das war seine Motivation, weiterzumachen. Denn wer sieht, dass seine Schulden weniger werden, der bleibt dran. Wer nicht sieht, dass sie weniger werden, weil er keinen Überblick hat, der gibt auf. Markus hat sein Blatt an seinen Kühlschrank gehängt, damit er es jeden Tag sieht. Das war am Anfang schwer, weil er sich geschämt hat. Nach einer Woche hat er sich daran gewöhnt. Nach zwei Wochen hat er angefangen, das Blatt nicht mehr als Schande zu sehen, sondern als Plan. Und nach einem Monat hat er sich gefreut, wenn er die Zahl kleiner schreiben konnte. Das war ein gutes Gefühl, weil er gesehen hat, dass sein Plan funktioniert. Und das ist der Punkt: Man muss den Überblick nicht nur einmal haben, sondern immer. Denn nur wer den Überblick hat, weiß, wo er steht und was er noch tun muss, um schuldenfrei zu werden. Der Überblick ist der erste Schritt, um schuldenfrei zu werden. Ohne Überblick weißt du nicht, wo du stehst. Mit Überblick weißt du, wo du stehst und was du tun musst. Schreib deine Schulden auf, alle, ohne Ausnahme. Das ist schwer, weil man sich schämt. Aber es ist befreiend, weil man danach weiß, womit man es zu tun hat. Und eine Zahl, die man kennt, ist weniger beängstigend als eine Angst, die man nicht kennt.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Die Reihenfolge - welche Schuld zuerst weg muss", "Nicht alle Schulden sind gleich. Manche Schulden sind teurer als andere. Markus hat gelernt, dass er zuerst die teuerste Schuld abbezahlen muss, nicht die kleinste. Die teuerste Schuld ist die Kreditkarte mit 17 Prozent Zinsen. Die zweitteuerste ist der Dispo mit 12 Prozent. Die drittteuerste ist der Ratenkredit mit 8 Prozent. Die billigste ist die Schuld bei seinem Bruder mit 0 Prozent. Die Reihenfolge heißt: Erst Kreditkarte, dann Dispo, dann Ratenkredit, dann Bruder. Warum? Weil jeder Euro, den du an Zinsen zahlst, ein Euro ist, den du nicht zum Abbezahlen nutzen kannst. Wenn du 17 Prozent Zinsen zahlst, dann zahlst du für 6.200 Euro Schuld über 1.000 Euro Zinsen im Jahr. Das ist Geld, das einfach weg ist. Wenn du zuerst die Kreditkarte abbezahlst, dann sparst du 1.000 Euro Zinsen im Jahr. Das ist mehr, als wenn du zuerst den Ratenkredit abbezahlst, der nur 280 Euro Zinsen im Jahr kostet. Viele Menschen machen den Fehler, dass sie zuerst die kleinste Schuld abbezahlen, weil es sich gut anfühlt, wenn eine Schuld weg ist. Das ist verständlich, aber es ist teurer. Denn wenn du zuerst die kleinste Schuld abbezahlst, dann zahlst du weiter 17 Prozent Zinsen auf die große Schuld. Es gibt eine Ausnahme: Wenn du eine Schuld hast, bei der dir jemand droht, dass er dir etwas wegnimmt, dann bezahl diese zuerst, egal wie teuer sie ist. Aber sonst gilt: Erst die teuerste Schuld, dann die zweitteuerste, dann die drittteuerste. Markus hat das so gemacht. Er hat alle Extra-Geld, das er hatte, auf seine Kreditkarte gesteckt, bis sie weg war. Das hat 14 Monate gedauert. Danach hat er den Dispo abbezahlt. Das hat 9 Monate gedauert. Danach den Ratenkredit. Das hat 7 Monate gedauert. Danach seinen Bruder. Ein Beispiel, das zeigt, warum die Reihenfolge so wichtig ist: Markus hat zuerst überlegt, ob er zuerst die Schuld bei seinem Bruder abbezahlen soll, weil es ihm peinlich war, dass er seinem Bruder Geld schuldete. Er dachte, wenn er seinem Bruder das Geld zurückzahlt, dann schämt er sich weniger. Sein Berater bei der Schuldenberatung hat ihm gesagt: Nein, bezahl zuerst die Kreditkarte, weil sie 17 Prozent Zinsen kostet. Dein Bruder kostet 0 Prozent Zinsen. Wenn du zuerst deinem Bruder das Geld gibst, dann zahlst du weiter 17 Prozent Zinsen auf deine Kreditkarte, und das kostet dich 1.000 Euro im Jahr. Wenn du zuerst die Kreditkarte abbezahlst, dann sparst du 1.000 Euro Zinsen im Jahr. Das Geld, das du sparst, kannst du dann deinem Bruder geben. Markus hat das verstanden und hat zuerst die Kreditkarte abbezahlt. Er hat seinem Bruder gesagt: Ich schulde dir 1.000 Euro, aber ich muss zuerst meine Kreditkarte abbezahlen, weil sie so teuer ist. Danach bekommst du dein Geld. Sein Bruder hat gesagt: Das ist in Ordnung, ich habe Zeit. Das war eine Erleichterung für Markus, weil er gemerkt hat, dass sein Bruder ihn nicht weniger mag, weil er ihm das Geld nicht sofort zurückzahlt. Er mag ihn immer noch, weil er ehrlich zu ihm war. Das ist der Punkt: Man muss ehrlich sein, zu sich selbst und zu anderen, auch wenn es schwer ist. Und man muss die teuerste Schuld zuerst abbezahlen, auch wenn es sich nicht so gut anfühlt wie die kleinste Schuld abzubezahlen. Denn die teuerste Schuld kostet am meisten Geld, und Geld, das man an Zinsen spart, ist Geld, das man zum Abbezahlen nutzen kann. Ein weiterer Punkt zur Reihenfolge ist, dass man auch die Zinsen im Blick haben muss, nicht nur die Schuld selbst. Markus hat gelernt, dass Zinsen das sind, was Schulden so teuer macht. Wenn man 17 Prozent Zinsen zahlt, dann zahlt man für 6.200 Euro Schuld über 1.000 Euro Zinsen im Jahr. Das ist Geld, das einfach weg ist. Wenn man zuerst die teuerste Schuld abbezahlt, dann spart man am meisten Zinsen. Und das Geld, das man an Zinsen spart, kann man für die nächste Schuld nutzen. Das ist wie ein Schneeball, der immer größer wird, nur andersherum: Man spart immer mehr Zinsen, je mehr Schulden man abbezahlt. Markus hat das verstanden, als er ausgerechnet hat, wie viel Zinsen er in einem Jahr zahlt: 1.000 Euro für die Kreditkarte, 500 Euro für den Dispo, 280 Euro für den Ratenkredit. Zusammen 1.780 Euro Zinsen im Jahr. Das ist fast ein Monatslohn, den er nur für Zinsen zahlt, ohne dass seine Schulden weniger werden. Als er die Kreditkarte abbezahlt hatte, hat er 1.000 Euro Zinsen im Jahr gespart. Das war Geld, das er für den Dispo nutzen konnte. Und als er den Dispo abbezahlt hatte, hat er weitere 500 Euro Zinsen gespart. Das war Geld, das er für den Ratenkredit nutzen konnte. So ist er immer schneller schuldenfrei geworden, weil er immer weniger Zinsen zahlen musste und immer mehr Geld zum Abbezahlen hatte. Die Reihenfolge ist wichtig, weil sie dir Geld spart. Wenn du zuerst die teuerste Schuld abbezahlst, dann sparst du am meisten Zinsen. Und das Geld, das du an Zinsen sparst, kannst du für die nächste Schuld nutzen. Das ist wie ein Schneeball, der immer größer wird, nur dass er Schulden abträgt, statt sie zu vergrößern. Fang mit der teuersten Schuld an, dann mit der zweitteuersten, dann mit der drittteuersten. Das ist der Weg.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Der Notgroschen - warum du zuerst 1.000 Euro sparen musst, bevor du Schulden abzahlst", "Das klingt verrückt, aber es ist wahr: Bevor du deine Schulden abzahlst, musst du zuerst 1.000 Euro sparen. Markus hat das am Anfang nicht verstanden. Er hat gesagt: Ich habe 14.800 Euro Schulden, warum soll ich jetzt 1.000 Euro sparen, statt meine Schulden abzuzahlen? Die Antwort ist: Weil das Leben weitergeht, auch wenn du Schulden hast. Wenn deine Waschmaschine kaputtgeht und du keine 1.000 Euro hast, dann musst du wieder einen Kredit aufnehmen, um sie zu reparieren. Dann hast du wieder neue Schulden, ffee, 2 Euro für ein Brötchen, 4 Euro für einen Snack. Aber am Ende des Monats waren es 180 Euro. Das war ein Schock für ihn. Er hat angefangen, seinen Kaffee von zu Hause mitzunehmen und sein Essen selbst zu kochen. Er hat dadurch 120 Euro im Monat gespart. Das war Geld, das er für seine Schulden nutzen konnte. Das Haushaltsbuch hat ihm nicht gesagt, dass er schlecht mit Geld umgeht. Es hat ihm gezeigt, wo sein Geld hingeht, ohne dass er es merkt. Und das ist der Punkt: Man muss nicht alles aufschreiben, um gut mit Geld umzugehen. Man muss nur wissen, wo das Geld hingeht, das man nicht merkt. Denn das Geld, das man merkt, das für Miete, für Essen, für Auto, das ist nicht das Problem. Das Geld, das man nicht merkt, das für Kaffee, für Snacks, für Abos, das ist das Problem, weil es sich summiert, ohne dass man es merkt. Und wenn man es merkt, dann kann man es ändern, ohne dass es weh tut. Ein weiterer Punkt zum Haushaltsbuch ist, dass man es nicht perfekt machen muss. Markus hat sein Haushaltsbuch nicht perfekt geführt. Er hat manchmal vergessen, etwas aufzuschreiben. Er hat manchmal geschätzt, wie viel er ausgegeben hat, statt es genau aufzuschreiben. Das war in Ordnung, weil es nicht darum geht, perfekt zu sein, sondern darum, einen Überblick zu bekommen. Wenn man jeden Abend 5 Minuten aufschreibt, was man ausgegeben hat, dann hat man nach einem Monat einen Überblick, auch wenn man nicht jeden Cent aufgeschrieben hat. Man sieht, wo das Geld hingeht, das man nicht merkt. Und das reicht schon, um etwas zu ändern. Markus hat sein Haushaltsbuch 3 Monate lang geführt, dann hat er aufgehört, weil er wusste, wo sein Geld hingeht. Er wusste, dass er 180 Euro für Kaffee und Snacks ausgibt, dass er 120 Euro für Abos ausgibt, die er nicht nutzt, und dass er 200 Euro für Essen bestellen ausgibt. Er hat das geändert und spart jetzt 405 Euro im Monat. Er führt kein Haushaltsbuch mehr, weil er es nicht mehr braucht. Er weiß jetzt, wo sein Geld hingeht. Das ist der Punkt: Ein Haus
