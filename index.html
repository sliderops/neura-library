<script>
var BUECHER = [{"title": "Frugalismus Teil 2 - Freiheit nach 40", "chapters": [["1. Freiheit nach 40 ist anders", "Mit 20 ist Freiheit: Alles können. Mit 40 ist Freiheit: Nicht mehr müssen. Du lernst, warum Frugalismus nach 40 viel einfacher ist - weil du weißt, was du wirklich willst und was nicht. Checkliste: 3 Dinge aufschreiben, die du nicht mehr musst."], ["2. Die Wahrheit über dein Geld nach 40", "Nach 40 hast du meist mehr verdient als mit 25 - aber auch mehr ausgegeben. In diesem Kapitel machst du ehrlich Kassensturz: Einnahmen, Ausgaben, Schulden, Vermögen. Ohne Scham, nur mit Zahlen. Checkliste: Kassensturz auf 1 Seite machen."], ["3. Dein Freiheits-Zahl", "Wie viel Geld brauchst du, um frei zu sein? Nicht Millionär sein - frei sein. Du lernst die 25er-Regel: Jahresausgaben x 25 = deine Freiheits-Zahl. Und wie du sie in kleine Schritte teilst. Checkliste: Jahresausgaben ausrechnen, Freiheits-Zahl ausrechnen."], ["4. Sparquote nach 40", "Mit 40 kannst du oft 30-50% sparen, weil du schon vieles hast. Du lernst, wie du deine Sparquote Schritt für Schritt erhöhst, ohne dass deine Familie leidet. Checkliste: Aktuelle Sparquote ausrechnen, Ziel +5% setzen."], ["5. Wohnen nach 40: Kleiner ist freier", "Großes Haus, großer Kredit, große Kosten. Du lernst, warum kleiner wohnen nach 40 oft mehr Freiheit bringt - und wie du das ohne Streit mit der Familie besprichst. Checkliste: Wohnkosten aufschreiben, 1 Alternative durchrechnen."], ["6. Job: Weniger arbeiten, mehr leben", "Nach 40 musst du nicht mehr Vollzeit + Überstunden machen, um zu beweisen, dass du was kannst. Du lernst Teilzeit, 4-Tage-Woche, Sabbatical und wie du das deinem Chef vorschlägst. Checkliste: 1 Vorschlag für weniger Stunden aufschreiben."], ["7. Gesundheit ist dein größtes Vermögen", "Mit 40 merkst du: Ohne Gesundheit ist Geld nichts wert. Du lernst die 5 Basis-Gewohnheiten: Schlafen, Bewegen, Wasser, Gemüse, Stress runter. Checkliste: 1 Gewohnheit heute starten."], ["8. Kinder und Frugalismus", "Kinder müssen nicht alles haben, um glücklich zu sein. Sie brauchen Zeit mit dir. Du lernst, wie du mit Kindern sparsam, aber glücklich lebst - ohne dass sie sich ausgeschlossen fühlen. Checkliste: 1 kostenloses Familien-Erlebnis diese Woche planen."], ["9. Investieren nach 40", "Nach 40 hast du weniger Zeit als mit 20, aber mehr Geld. Du lernst, warum Einfachheit gewinnt: Breite Streuung, niedrige Kosten, lange halten. Keine Zockerei. Checkliste: Depot-Kosten prüfen, 1 Grundlagen-Video schauen."], ["10. Die 4%-Regel einfach erklärt", "Die 4%-Regel sagt: Wenn du 25x deine Jahresausgaben hast, kannst du jedes Jahr 4% davon nehmen und trotzdem leben. Du lernst, was das für dich konkret heißt. Checkliste: 4%-Betrag für dich ausrechnen."], ["11. Frugalismus im Alltag nach 40", "Keine Lust mehr auf Angebots-Jagd? Gut. Du lernst 10 ruhige Spar-Routinen, die keine Zeit kosten: Automatik, Einkaufsliste, 1x pro Woche kochen, 1x pro Monat Fixkosten-Check. Checkliste: 2 Routinen übernehmen."], ["12. Loslassen nach 40", "Karriere-Titel, großes Auto, teure Uhr - nach 40 darfst du loslassen, was du nur für andere gemacht hast. Du lernst die Loslass-Fragen: Will ich das wirklich? Oder will ich nur so wirken? Checkliste: 1 Sache aufschreiben, die du nur für andere machst."], ["13. Dein Plan B: Was, wenn es früher geht?", "Was, wenn du mit 50 schon aufhören könntest? Du lernst, wie du einen Plan B baust: Mini-Rente, Teilzeit, Nebenverdienst, der Spaß macht. Checkliste: 1 Plan-B-Idee aufschreiben."], ["14. Fahrplan für das Leben nach 40", "Jahr 1: Kassensturz + Automatik. Jahr 2-3: Sparquote hoch + Schulden runter. Jahr 4-5: Investieren + Job anpassen. Jahr 5+: Immer mehr Freiheit wählen. Checkliste: Fahrplan ausdrucken, Startdatum eintragen."]]}, {"title": "Frugalismus Teil 3 - Nie wieder arbeiten müssen", "chapters": [["1. Nie wieder arbeiten müssen - was heißt das?", "Es heißt nicht: Nie wieder etwas tun. Es heißt: Nur noch tun, was du willst. Du lernst, wie du dieses Ziel in Zahlen übersetzt. Checkliste: Aufschreiben, was du tun würdest, wenn du nicht müsstest."], ["2. Dein Leben aus Leidenschaft", "Was würdest du tun, wenn Geld egal wäre? Genau das ist dein Kompass. Du lernst, wie du deine Leidenschaft findest und testest, ohne alles hinzuwerfen. Checkliste: 3 Leidenschaften aufschreiben."], ["3. Die 3 Wege zur Freiheit", "Weg 1: Viel sparen. Weg 2: Mehr verdienen. Weg 3: Weniger brauchen. Die meisten kombinieren alle 3. Du lernst, welcher Weg zu dir passt. Checkliste: Deinen Weg wählen."], ["4. Dein Sparziel in Zahlen", "Wie viel musst du sparen, um frei zu sein? Du lernst, wie du dein Ziel in Monatsbeträge umrechnest. Checkliste: Sparziel in Monatsbetrag umrechnen."], ["5. Wohnen für die Freiheit", "Wohnen ist der größte Hebel. Du lernst, wie kleiner wohnen oder günstiger wohnen deine Freiheit um Jahre näher bringt. Checkliste: Wohnkosten prüfen."], ["6. Arbeiten, bis es nicht mehr nötig ist", "Du musst nicht kündigen, um frei zu sein. Du lernst, wie du deinen Job als Sprungbrett nutzt, nicht als Gefängnis. Checkliste: 1 Sache am Job schätzen, 1 Sache ändern."], ["7. Nebenverdienst, der Spaß macht", "Der beste Nebenverdienst ist einer, der sich nicht wie Arbeit anfühlt. Du lernst 10 Ideen, die zu Leidenschaft passen. Checkliste: 1 Idee wählen, 1 Schritt machen."], ["8. Investieren für die Freiheit", "Investieren heißt: Dein Geld arbeitet, während du schläfst. Du lernst die Grundlagen für Langfristigkeit und Ruhe. Checkliste: Grundlagen-Video schauen."], ["9. Gesundheit für die Freiheit", "Freiheit ohne Gesundheit ist halbe Freiheit. Du lernst die 5 Basis-Gewohnheiten für lange Gesundheit. Checkliste: 1 Gewohnheit starten."], ["10. Familie und Freiheit", "Freiheit geht auch mit Familie. Du lernst, wie du mit Partner und Kindern gemeinsam ein Freiheits-Ziel setzt, ohne dass sich jemand ausgeschlossen fühlt. Checkliste: Familien-Gespräch führen."], ["11. Die Angst vor dem Loslassen", "Viele haben Angst: Was, wenn ich dann nichts mehr bin? Du lernst, wie du diese Angst erkennst und trotzdem losgehst. Checkliste: 1 Angst aufschreiben, 1 Gegenbeweis finden."], ["12. Mini-Rente testen", "Bevor du ganz aufhörst, teste es: 1 Monat Sabbatical, 1 Monat Teilzeit, 1 Monat nur Leidenschaft. Du lernst, wie du das testest. Checkliste: 1 Test-Monat planen."], ["13. Der Tag, an dem du frei bist", "Stell dir vor: Du wachst auf und musst nichts. Was machst du? Du lernst, wie du diesen Tag schon heute einmal pro Woche übst. Checkliste: 1 freien Tag diese Woche üben."], ["14. Dein Plan für ein Leben aus Leidenschaft", "Jahr 1: Ziel + Automatik. Jahr 2-3: Sparen + Nebenverdienst. Jahr 4-5: Testen + Anpassen. Danach: Freiheit wählen. Checkliste: Plan ausdrucken."]]}, {"title": "Geizig sein Teil 2 - Noch mehr Tricks", "chapters": [["1. Level 2 des Geizigseins", "Level 1 war: Nicht mehr impulsiv kaufen. Level 2 ist: Clever leben, ohne dass es sich nach Verzicht anfühlt. Du lernst den Unterschied zwischen geizig und sparsam und warum clever geizig sein dich reicher und freier macht. Checkliste: 1 Impulskauf-Trigger aufschreiben, 1 cleveren Ersatz finden."], ["2. Der 5-Euro-Tag", "Ein Tag, an dem du nur 5 Euro ausgibst. Du lernst, wie du einen 5-Euro-Tag planst: Essen zu Hause, Wasser mitnehmen, kostenloses Programm. Einmal pro Woche, und du sparst im Monat 100 Euro und mehr. Checkliste: 1x 5-Euro-Tag diese Woche einplanen."], ["3. Gratis essen und trinken", "Es gibt mehr Gratis-Angebote als du denkst: Proben im Supermarkt, Verkostungen, Foodsharing, Reste vom Markt. Du lernst, wo es legal und fair Gratis-Essen gibt. Checkliste: 1 Foodsharing-Punkt in deiner Nähe suchen."], ["4. Tausch- und Leih-Community", "Warum kaufen, wenn du tauschen oder leihen kannst? Bohrmaschine, Buch, Fahrrad - in jeder Stadt gibt es Tauschgruppen, Bibliotheken und Leihläden. Checkliste: 1 Tauschgruppe beitreten, 1 Sache zum Tauschen anbieten."], ["5. Reparieren statt wegwerfen", "Reparieren spart Geld und ist gut für die Umwelt. Du lernst die 5 einfachsten Reparaturen: Knopf annähen, Fahrradschlauch flicken, Handy-Display-Schutz, Stuhl leimen, Reißverschluss reparieren. Checkliste: 1 kaputtes Teil zu Hause reparieren."], ["6. Die besten Apps zum Sparen", "Cashback, Gutscheine, Preisvergleich, Too Good To Go, Kleinanzeigen. Du lernst, welche 5 Apps wirklich Geld bringen und welche nur Zeit fressen. Checkliste: 2 Spar-Apps installieren, 1 Testkauf machen."], ["7. Verhandeln bei jedem Kauf", "Verhandeln ist nicht peinlich, es ist normal. Du lernst 3 Sätze, die fast immer funktionieren: Geht da noch was am Preis? Gibt es einen Rabatt bei Barzahlung? Was ist Ihr bester Preis? Checkliste: Beim nächsten Kauf 1x nach Rabatt fragen."], ["8. Geizig im Urlaub", "Urlaub muss nicht teuer sein. Du lernst: Nebensaison buchen, selbst kochen im Urlaub, kostenlose Stadtführungen, Tagesausflüge statt Pauschalreise. Checkliste: Nächsten Urlaub in Nebensaison planen."], ["9. Geizig feiern", "Feiern ohne Geld geht: Jeder bringt was mit, Deko aus dem was da ist, Musik selbst gemacht. Du lernst 10 Ideen für eine Feier unter 20 Euro. Checkliste: Nächste Feier als Mitbring-Feier planen."], ["10. Kleidung fast gratis", "Second Hand, Tauschpartys, Kleiderkreisel, Flohmarkt. Du lernst, wie du gut aussehende Kleidung für unter 5 Euro pro Teil findest. Checkliste: 1 Second-Hand-Laden besuchen."], ["11. Der Null-Euro-Monat", "Ein Monat, in dem du nur Fixkosten zahlst und sonst nichts kaufst. Kein Essen gehen, kein Shopping, kein Abo. Du lernst, wie du das durchhältst und was du dabei über dich lernst. Checkliste: Startdatum für Null-Euro-Woche festlegen."], ["12. Sparen mit Nachbarn", "Zusammen sparen ist leichter: Einkaufsgemeinschaft, Werkzeug teilen, Fahrgemeinschaft, gemeinsam kochen. Du lernst, wie du deine Nachbarn ansprichst, ohne dass es komisch wird. Checkliste: 1 Nachbarn ansprechen, 1 Sache zum Teilen vorschlagen."], ["13. Die 200 besten Alltagstricks", "Von der Zahnpasta-Tube bis zum Kaffeefilter: 200 kleine Tricks, die sich summieren. In diesem Kapitel stehen die 30 besten davon, mit genauer Anleitung. Checkliste: 5 Tricks heute ausprobieren."], ["14. Dein geiziges Jahr", "Januar: Bestandsaufnahme. Februar: 5-Euro-Tage. März: Reparieren. April: Tauschen. Mai: Urlaub planen. Juni: Feiern. Juli: Kleidung. August: Null-Euro-Woche. September: Nachbarn. Oktober: Apps. November: Verhandeln. Dezember: Jahresrückblick. Checkliste: Jahresplan ausdrucken."]]}, {"title": "Geizig sein Teil 3 - Der Profi-Sparer", "chapters": [["1. Vom Sparer zum Profi", "Profi-Sparer sparen nicht mehr, sie sparen klüger. Du lernst, wie Profis denken: Immer vergleichen, immer verhandeln, immer fragen. Checkliste: Heute 1 Preis vergleichen."], ["2. Der Profi-Einkauf", "Profi-Einkauf heißt: Liste, Angebote, Eigenmarke, Vorrat bei Angeboten. Du lernst die Profi-Einkaufs-Routine für 30 Minuten pro Woche. Checkliste: Einkaufsliste mit Angeboten schreiben."], ["3. Mobilität ohne Auto", "Auto ist teuer: Sprit, Versicherung, Steuer, Reparatur. Du lernst Fahrrad, Bus, Bahn, Carsharing und Fahrgemeinschaft - und was das im Jahr spart. Checkliste: Auto-Kosten für 1 Jahr ausrechnen."], ["4. Energie sparen wie ein Profi", "Strom, Heizung, Wasser - da stecken 500 Euro und mehr drin. Du lernst die 10 größten Stromfresser und wie du sie stoppst. Checkliste: 3 Stromfresser heute ausschalten."], ["5. Profi-Verhandeln", "Profi-Verhandeln heißt: Freundlich, ruhig, mit Alternative. Du lernst 5 Verhandlungs-Sätze für Handy, Internet, Versicherung und Kauf. Checkliste: 1 Vertrag heute verhandeln."], ["6. Kostenlose Freizeit", "Die besten Dinge sind oft gratis: Bibliothek, Park, Wandern, Museen am Gratis-Tag. Du lernst 20 kostenlose Freizeit-Ideen für deine Stadt. Checkliste: 1 kostenlose Aktivität diese Woche machen."], ["7. Profi-Küche", "Profi-Küche heißt: Reste verwerten, Vorkochen, Saison kaufen. Du lernst die Reste-Formel und 5 Reste-Rezepte. Checkliste: 1 Reste-Essen heute kochen."], ["8. Kleidung wie ein Profi", "Profi kauft Kleidung in der Nebensaison, im Sale und Second Hand. Du lernst die 3 besten Zeiten zum Kaufen. Checkliste: Nächsten Kauf auf Sale verschieben."], ["9. Profi-Urlaub", "Profi-Urlaub heißt: Früh buchen oder Last Minute, Nebensaison, selbst kochen. Du lernst, wie du 50% sparst, ohne dass es weniger schön ist. Checkliste: Nächsten Urlaub in Nebensaison planen."], ["10. Profi-Technik", "Handy und Laptop müssen nicht jedes Jahr neu sein. Du lernst, wie du Technik 5 Jahre nutzt und trotzdem gut dabei bist. Checkliste: Handy-Akku und Speicher prüfen."], ["11. Der Profi-Haushalt", "Ein Profi-Haushalt hat Ordnung, Vorräte und einen Plan. Du lernst die Haushalts-Routine für 15 Minuten am Tag. Checkliste: Haushalts-Plan aufschreiben."], ["12. Profi-Geld", "Profi-Geld heißt: Automatik, Überblick, keine Impulskäufe. Du lernst die Profi-Geld-Woche. Checkliste: Geld-Woche einmal durchführen."], ["13. Die Profi-Challenges", "7 Profi-Challenges: 7 Tage ohne Ausgabe, 30 Tage Koch-Challenge, 90 Tage Kein-Neukauf. Du lernst, wie du sie schaffst. Checkliste: 1 Challenge starten."], ["14. Dein Profi-Sparjahr", "Jeden Monat 1 Profi-Thema: Januar Energie, Februar Einkauf, März Mobilität, April Küche, Mai Verhandeln, Juni Freizeit, Juli Urlaub, August Technik, September Haushalt, Oktober Geld, November Kleidung, Dezember Rückblick. Checkliste: Jahresplan ausdrucken."]]}, {"title": "Geld sparen Teil 3 - Reich durch Routine", "chapters": [["1. Reichtum ist Routine", "Reichtum entsteht nicht durch einen großen Gewinn, sondern durch kleine Routinen jeden Tag. In diesem Kapitel lernst du die 3 Routinen der Sparmeister: Morgens 2 Minuten Geld-Check, wöchentlich 10 Minuten Fixkosten-Check, monatlich 30 Minuten Geld-Tag. Du lernst, warum Willenskraft versagt, aber Automatik gewinnt. Übung: Richte heute 1 Dauerauftrag ein. Checkliste: Dauerauftrag einrichten, Geld-App öffnen, 1 Abo prüfen."], ["2. Der perfekte Monatsstart", "Jeder Monat beginnt mit einem Geld-Tag. Am 1. des Monats: Einnahmen prüfen, Fixkosten prüfen, Sparbetrag überweisen, Budget für Lebensmittel festlegen. So weißt du immer, wo du stehst. Checkliste: Geld-Tag im Kalender eintragen, Sparbetrag festlegen."], ["3. Automatisieren wie die Profis", "Alles, was automatisch läuft, musst du nicht mehr entscheiden. Daueraufträge für Sparen, Miete, Versicherungen. So sparst du, ohne nachzudenken. Checkliste: 3 Daueraufträge prüfen, 1 neuen Spar-Dauerauftrag einrichten."], ["4. Die 1%-Methode", "Jeden Monat 1% besser. 1% mehr sparen, 1% weniger ausgeben. Nach einem Jahr sind das 12% - ohne dass es weh tut. Checkliste: Sparrate um 1% erhöhen."], ["5. Sparen ohne nachzudenken", "Die besten Sparer denken nicht ans Sparen. Sie haben Systeme. Du lernst das 3-Konten-System: Alltag, Fixkosten, Sparen. Checkliste: 3 Konten einrichten oder Unterkonten anlegen."], ["6. Einnahmen steigern im Alltag", "Sparen allein reicht nicht, Einnahmen helfen. Du lernst 10 Ideen für 50-200 Euro extra im Monat: Verkaufen, Nachhilfe, kleine Jobs, digitale Produkte. Checkliste: 1 Idee aussuchen, heute 1 Schritt machen."], ["7. Die 30-Tage-Geld-Challenge", "30 Tage, jeden Tag 1 kleine Spar-Aufgabe. Tag 1: 1 Abo kündigen. Tag 2: Einkaufsliste schreiben. Tag 3: 1 Essen selbst kochen. So wird Sparen zum Spiel. Checkliste: Challenge starten, Tag 1 heute machen."], ["8. Fixkosten-Audit", "Einmal im Quartal: Alle Fixkosten prüfen. Handy, Internet, Versicherungen, Abos. Oft lassen sich 100-200 Euro im Monat sparen, ohne Verzicht. Checkliste: Alle Fixkosten aufschreiben, 2 Anbieter vergleichen."], ["9. Clever einkaufen für Profis", "Einkaufsliste, nie hungrig einkaufen, Angebote nutzen, Eigenmarken testen. Du lernst die 5 Regeln für den Supermarkt. Checkliste: Einkaufsliste schreiben, 1 Eigenmarke testen."], ["10. Nebenverdienst ohne Stress", "Nebenverdienst muss nicht stressen. 2-3 Stunden pro Woche reichen für den Anfang. Du lernst, was zu dir passt und wie du anfängst, ohne zu kündigen. Checkliste: 2 Stunden pro Woche blocken, 1 Idee testen."], ["11. Schuldenfrei mit System", "Schulden abbauen mit der Lawinen- oder Schneeball-Methode. Kleinste Schuld zuerst für Motivation, oder teuerste zuerst für Zinsen. Du lernst beides und wählst, was zu dir passt. Checkliste: Alle Schulden aufschreiben, 1 Plan wählen."], ["12. Investieren mit 50 Euro", "Investieren geht schon mit 50 Euro. Du lernst, was ein ETF ist, warum Streuung wichtig ist und warum Zeit wichtiger ist als Timing. Kein Finanz-Tipp, nur Grundlagen. Checkliste: 1 Buch oder Video zum Thema anschauen, nichts überstürzen."], ["13. Die Millionärs-Gewohnheiten", "Millionäre sind meist nicht reich durch Glück, sondern durch Gewohnheiten: Früh aufstehen, lesen, sparen, investieren, gesund leben. Du lernst 5 Gewohnheiten, die du heute übernehmen kannst. Checkliste: 1 Gewohnheit heute starten."], ["14. Dein 365-Tage-Reich-Plan", "Tag 1-30: Überblick + Automatik. Tag 31-90: Fixkosten senken. Tag 91-180: Einnahmen steigern. Tag 181-365: Dranbleiben + Investieren lernen. Jeden Monat 1 Geld-Tag. Checkliste: Plan ausdrucken, Startdatum eintragen."]]}, {"title": "Geld sparen Teil 4 - Dein Geld arbeitet für dich", "chapters": [["1. Geld, das für dich arbeitet", "Dein Geld kann für dich arbeiten, wenn du es arbeiten lässt. Du lernst, was Zinseszins ist und warum Zeit dein bester Freund ist. Checkliste: Zinseszins-Rechner einmal ausprobieren."], ["2. Die Konten-Methode", "Ein Konto für Alltag, eins für Fixkosten, eins für Sparen, eins für Spaß. So weiß jeder Euro, wohin er gehört. Checkliste: 4 Konten oder Unterkonten einrichten."], ["3. Zinseszins verstehen", "Zinseszins heißt: Zinsen auf Zinsen. Nach 10 Jahren macht das einen riesigen Unterschied. Du lernst es mit 3 einfachen Beispielen. Checkliste: 1 Beispiel mit deinen Zahlen durchrechnen."], ["4. Dein Notgroschen", "Bevor du investierst, brauchst du einen Notgroschen: 3-6 Monatsausgaben auf einem Tagesgeldkonto. So musst du nie in Panik verkaufen. Checkliste: Notgroschen-Ziel aufschreiben."], ["5. ETF-Grundlagen", "ETF heißt: Viele Aktien in einem Paket. Du lernst, warum breite Streuung sicherer ist als eine einzelne Aktie. Kein Tipp, nur Grundlagen. Checkliste: 1 Grundlagen-Video schauen."], ["6. Sparplan einrichten", "Ein Sparplan heißt: Jeden Monat automatisch 50 oder 100 Euro investieren. Du lernst, wie das geht und worauf du bei Kosten achten musst. Checkliste: Sparplan-Kosten vergleichen."], ["7. Steuern einfach", "Steuern musst du nicht lieben, aber verstehen. Du lernst Freibetrag, Freistellungsauftrag und warum du ihn einrichten solltest. Checkliste: Freistellungsauftrag prüfen."], ["8. Versicherungen, die sich lohnen", "Nicht jede Versicherung lohnt sich. Du lernst, welche 3 wirklich wichtig sind und welche du kündigen kannst. Checkliste: Alle Versicherungen auflisten."], ["9. Geld und Gefühle", "Geld ist oft Gefühl, nicht Logik. Du lernst, warum du bei Stress mehr ausgibst und wie du das stoppst. Checkliste: 1 Stress-Ausgabe heute nicht machen."], ["10. Die 10-Jahres-Rechnung", "Wo stehst du in 10 Jahren, wenn du heute anfängst? Du lernst, wie du deine 10-Jahres-Rechnung machst. Checkliste: 10-Jahres-Ziel aufschreiben."], ["11. Nebenverdienst, der wächst", "Ein Nebenverdienst kann wachsen, wenn du ihn wie ein kleines Business behandelst. Du lernst, wie du klein anfängst und dranbleibst. Checkliste: 1 Nebenverdienst-Idee wählen."], ["12. Schulden vs. Investieren", "Zuerst teure Schulden weg, dann investieren. Du lernst die Reihenfolge, die für fast alle funktioniert. Checkliste: Schulden-Zinsen prüfen."], ["13. Geld-Gespräche in der Familie", "Geld ist kein Tabu. Du lernst, wie du mit Partner und Kindern offen über Geld sprichst, ohne Streit. Checkliste: 1 Geld-Gespräch diese Woche führen."], ["14. Dein 10-Jahres-Geldplan", "Jahr 1: Notgroschen. Jahr 2-3: Sparplan. Jahr 4-6: Erhöhen. Jahr 7-10: Dranbleiben. Checkliste: Plan ausdrucken."]]}, {"title": "Minimalismus Teil 3 - Endlich frei", "chapters": [["1. Freiheit beginnt im Kopf", "Freiheit beginnt nicht im Kleiderschrank, sie beginnt im Kopf. Viele Menschen denken, Minimalismus sei nur Aufräumen. In Wahrheit ist es eine Entscheidung: Ich lasse mich nicht mehr von Dingen steuern. Du lernst in diesem Kapitel, wie du deine eigenen Freiheits-Gründe findest, warum Vergleichen unglücklich macht und wie ein einziger klarer Satz - Mein Leben, meine Regeln - dir jeden Tag hilft. Übung: Schreibe deine 3 Freiheits-Gründe auf und hänge sie an den Kühlschrank. Checkliste: Gründe aufschreiben, 1 Vergleichs-Auslöser löschen (z.B. Shopping-App), 1 Nein heute sagen."], ["2. Die letzten 20% loslassen", "Die ersten 80% sind leicht, die letzten 20% sind schwer. Genau hier liegt die Freiheit. Du lernst die Kisten-Methode: Alles, was du 90 Tage nicht benutzt hast, kommt in eine Kiste. Nach 90 Tagen entscheidest du in Ruhe. So musst du nichts überstürzt wegwerfen. Checkliste: 1 Kiste holen, 20 Dinge reinlegen, Datum draufschreiben, nach 90 Tagen entscheiden."], ["3. Minimalismus im Job", "Dein Schreibtisch ist dein Kopf. Weniger Tabs, weniger Papier, weniger Meetings. Du lernst die 2-Minuten-Regel, die 1-Seiten-Regel für E-Mails und wie du deinen Arbeitsplatz in 15 Minuten klar bekommst. Checkliste: Schreibtisch leeren, nur 3 Dinge zurücklegen, 5 alte Mails löschen, 1 Meeting absagen."], ["4. Beziehungen entrümpeln", "Nicht Menschen wegwerfen, sondern Energie schützen. Du lernst, welche Beziehungen dir Energie geben und welche sie nehmen. Übung: Liste 5 Menschen auf, mit denen du dich gut fühlst, und plane diese Woche 1 Treffen. Checkliste: 1 energieraubendes Treffen verschieben, 1 gutes Treffen fest einplanen."], ["5. Minimalistisch reisen", "Reisen mit Handgepäck ist Freiheit. Du lernst die 7-Teile-Regel: 7 Kleidungsstücke, die alle zusammen passen. Plus Packliste für 7 Tage. Checkliste: Packliste schreiben, 1x Probe packen, wiegen."], ["6. Ein Zuhause das atmet", "Jeder Raum braucht Luft. Du lernst die 1-Freie-Fläche-Regel: Jeder Raum hat eine freie Fläche, die immer leer bleibt. So wirkt dein Zuhause sofort ruhig. Checkliste: In jedem Raum 1 freie Fläche schaffen."], ["7. Weniger Termine mehr Leben", "Ein voller Kalender ist kein volles Leben. Du lernst den freien Tag pro Woche und die Nein-Formel: Danke, aber diesmal nicht. Checkliste: 1 freien Tag in den Kalender schreiben, 1 Termin absagen."], ["8. Digital Detox für immer", "Handy ist Werkzeug, kein Chef. Du lernst App-Limits, Benachrichtigungen aus, und die Ladestation außerhalb vom Schlafzimmer. Checkliste: Benachrichtigungen für 5 Apps aus, Handy lädt nachts außerhalb vom Schlafzimmer."], ["9. Minimalismus und Gesundheit", "Weniger Zeug, mehr Bewegung. Du lernst: 10 Minuten Bewegung am Morgen, Wasser statt Limo, 1 gesundes Essen am Tag selbst kochen. Checkliste: Wasserflasche füllen, 10 Minuten Spaziergang, 1 selbst gekochtes Essen."], ["10. Loslassen von Erinnerungsstücken", "Erinnerungen leben in dir, nicht in der Kiste. Du lernst die Foto-Methode: Fotografiere das Stück, behalte das Foto, gib das Stück weiter. Checkliste: 5 Erinnerungsstücke fotografieren, 1 Kiste entscheiden."], ["11. Minimalistisch mit Kindern", "Kinder brauchen Zeit, keine 100 Spielsachen. Du lernst die Spielzeug-Rotation: Nur 10 Spielsachen draußen, Rest in Kiste, jede Woche tauschen. Checkliste: Spielzeug sortieren, 10 rauslegen, Rest in Kiste."], ["12. Geld und Freiheit", "Jedes Ding, das du nicht kaufst, ist Freiheit auf dem Konto. Du lernst die 24-Stunden-Regel und das 30-Tage-Wunsch-Buch. Checkliste: Wunsch-Buch anlegen, 1 Impulskauf heute nicht machen."], ["13. Deine neue Identität ohne Zeug", "Du bist nicht, was du besitzt. Du bist, was du tust. Du lernst, deine Geschichte neu zu erzählen: Ich bin jemand, der frei lebt. Checkliste: 1 Satz aufschreiben: Ich bin..."], ["14. Der 60-Tage-Freiheitsplan", "Woche 1-2: Kopf + 1 Raum. Woche 3-4: Kleiderschrank + Küche. Woche 5-6: Digital + Termine. Woche 7-8: Beziehungen + Geld. Jeden Tag 15 Minuten. Am Ende: Dein Freiheits-Tag. Checkliste: Plan ausdrucken, Startdatum eintragen."]]}, {"title": "Minimalismus Teil 4 - Das leichte Leben", "chapters": [["1. Leichtigkeit ist eine Entscheidung", "Leichtigkeit kommt nicht von allein. Du entscheidest dich jeden Tag: Was mache ich heute leicht? Du lernst die Leicht-Frage am Morgen und wie du schwere Aufgaben in 3 kleine Schritte teilst. Checkliste: 1 schwere Aufgabe in 3 Schritte teilen."], ["2. Dein Tag ohne Ballast", "Ein leichter Tag hat 3 Dinge: 1 wichtige Aufgabe, 1 Pause, 1 Freude. Mehr nicht. Du lernst, wie du deinen Tag so planst, dass er sich leicht anfühlt. Checkliste: Morgen mit 3 Punkten planen."], ["3. Erlebnisse statt Dinge", "Dinge verstauben, Erlebnisse bleiben. Du lernst, wie du Geld für Erlebnisse ausgibst, die wirklich glücklich machen: Zeit mit Menschen, Neues lernen, Natur. Checkliste: 1 Erlebnis für diese Woche planen."], ["4. Die 10-Minuten-Regel", "Alles, was 10 Minuten dauert, sofort machen. So bleibt nichts liegen. Du lernst, wie du mit dieser Regel Ordnung hältst, ohne je groß aufräumen zu müssen. Checkliste: Heute 3x 10-Minuten-Regel anwenden."], ["5. Leichte Küche", "Leicht kochen heißt: Wenig Zutaten, wenig Abwasch, viel Geschmack. Du lernst 5 leichte Gerichte für unter 15 Minuten. Checkliste: 1 leichtes Gericht heute kochen."], ["6. Leichter Kleiderschrank", "Ein leichter Kleiderschrank hat nur Teile, die du liebst und die zusammenpassen. Du lernst die 20-Teile-Regel für den Alltag. Checkliste: 5 Teile aussortieren, die du nicht liebst."], ["7. Leichte Beziehungen", "Leichte Beziehungen geben Energie. Du lernst, wie du schwierige Gespräche leicht führst und dich von Drama fernhältst. Checkliste: 1 gutes Gespräch heute führen."], ["8. Leichter arbeiten", "Weniger Meetings, klarere Prioritäten, Feierabend pünktlich. Du lernst die 3-Prioritäten-Regel für die Arbeit. Checkliste: Heute nur 3 Prioritäten festlegen."], ["9. Leicht reisen", "Nur Handgepäck, nur das Nötigste, nur Freude. Du lernst die leichte Packliste für 7 Tage. Checkliste: Packliste schreiben."], ["10. Leicht denken", "Weniger Grübeln, mehr Vertrauen. Du lernst die Stopp-Technik für Gedanken-Karussell und den Gedanken-Tagebuch-Trick. Checkliste: 1 Grübel-Gedanken heute stoppen."], ["11. Leicht mit Geld", "Leicht mit Geld heißt: Überblick, Automatik, Ruhe. Du lernst, wie du Geld-Themen in 10 Minuten pro Woche erledigst. Checkliste: 10-Minuten-Geld-Check diese Woche."], ["12. Leicht wohnen", "Jeder Raum 1 freie Fläche, jeder Schrank 1 freies Fach. So atmet dein Zuhause. Checkliste: 1 freies Fach schaffen."], ["13. Leicht feiern", "Feiern darf leicht sein: Wenig Deko, gutes Essen, gute Menschen. Du lernst die Leicht-Feier-Formel. Checkliste: Nächste Feier leicht planen."], ["14. Dein 90-Tage-Leicht-Plan", "Woche 1-3: Tag + Zuhause. Woche 4-6: Arbeit + Geld. Woche 7-9: Beziehungen + Denken. Woche 10-12: Feiern + Dranbleiben. Checkliste: Plan ausdrucken, Startdatum eintragen."]]}, {"title": "Minimalismus Teil 5 - Weniger, aber besser", "chapters": [["1. Weniger, aber besser", "Weniger ist nicht das Ziel. Besser ist das Ziel. Du lernst, wie du bei allem fragst: Ist das die beste Version davon? Checkliste: 1 Sache heute durch die bessere Version ersetzen."], ["2. Die Besser-Frage", "Bei jedem Kauf, jedem Termin, jeder Sache: Ist das die beste Version für mich? Wenn nein, dann nicht kaufen, nicht zusagen, nicht behalten. Checkliste: Besser-Frage heute 3x stellen."], ["3. Besser wohnen", "Ein besserer Wohnraum hat weniger, aber schöneres. Du lernst, wie du 1 Raum besser machst, statt 5 Räume voll zu haben. Checkliste: 1 Raum besser machen."], ["4. Besser essen", "Besser essen heißt nicht teurer essen. Es heißt: Frisch, selbst gekocht, in Ruhe gegessen. Du lernst die Besser-Küche. Checkliste: 1 Mahlzeit heute in Ruhe essen."], ["5. Besser arbeiten", "Besser arbeiten heißt: Weniger Aufgaben, aber die richtigen. Du lernst die 1-Wichtigste-Aufgabe-Regel. Checkliste: Heute nur 1 wichtigste Aufgabe."], ["6. Besser anziehen", "Besser anziehen heißt: Weniger Teile, aber Teile, die du liebst und die passen. Du lernst die Besser-Garderobe. Checkliste: 1 Lieblingsteil heute tragen."], ["7. Besser schlafen", "Besser schlafen heißt: Kein Handy im Bett, feste Zeit, dunkel und kühl. Du lernst die Besser-Schlaf-Routine. Checkliste: Handy heute aus dem Schlafzimmer."], ["8. Besser entscheiden", "Besser entscheiden heißt: Langsamer entscheiden, schneller loslassen. Du lernst die 10-10-10-Regel: Wie fühlt es sich in 10 Minuten, 10 Monaten, 10 Jahren an? Checkliste: 1 Entscheidung mit 10-10-10 treffen."], ["9. Besser mit Menschen", "Besser mit Menschen heißt: Weniger Kontakte, mehr Tiefe. Du lernst, wie du 3 tiefe Beziehungen pflegst, statt 30 oberflächliche. Checkliste: 1 tiefes Gespräch führen."], ["10. Besser mit Geld", "Besser mit Geld heißt: Weniger Ausgaben, aber die, die wirklich zählen. Du lernst die Besser-Ausgaben-Regel. Checkliste: 1 Ausgabe heute streichen, 1 bessere Ausgabe planen."], ["11. Besser mit Zeit", "Besser mit Zeit heißt: Weniger Termine, mehr Zeit für das, was zählt. Du lernst die Zeit-Besser-Regel. Checkliste: 1 Termin heute absagen."], ["12. Besser mit dir selbst", "Besser mit dir selbst heißt: Freundlicher mit dir reden. Du lernst den Besser-Selbst-Talk. Checkliste: Heute 1 freundlichen Satz zu dir sagen."], ["13. Die Besser-Liste", "Schreibe 10 Dinge auf, die du besser machen willst - und wähle 1 davon für diese Woche. So bleibt Besser machbar. Checkliste: Besser-Liste schreiben, 1 wählen."], ["14. Dein 30-Tage-Besser-Plan", "Tag 1-10: Wohnen + Essen. Tag 11-20: Arbeiten + Geld. Tag 21-30: Menschen + Du selbst. Jeden Tag 1 Besser-Schritt. Checkliste: Plan ausdrucken, Startdatum eintragen."]]}, {"title": "Geld sparen Teil 5 - Die Sparmeister", "chapters": [["Was ein Sparmeister anders macht", "In diesem Kapitel geht es um Was ein Sparmeister anders macht. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Die Sparmeister-Routine", "In diesem Kapitel geht es um Die Sparmeister-Routine. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Ausgaben die sich lohnen", "In diesem Kapitel geht es um Ausgaben die sich lohnen. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Einnahmen wie ein Meister", "In diesem Kapitel geht es um Einnahmen wie ein Meister. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Der Meister-Einkauf", "In diesem Kapitel geht es um Der Meister-Einkauf. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Fixkosten auf Meisterniveau", "In diesem Kapitel geht es um Fixkosten auf Meisterniveau. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende steht eine Checkliste, mit der du sofort anfangen kannst."], ["Schuldenfrei wie ein Meister", "In diesem Kapitel geht es um Schuldenfrei wie ein Meister. Du lernst, warum das wichtig ist, wie du es im Alltag umsetzt und was du heute schon tun kannst. Mit Beispielen aus dem echten Leben, Schritt fuer Schritt, ohne Fachchinesisch. Am Ende ste
