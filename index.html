n. Nicht einsam. Nicht traurig. Lina dachte: Jeder Mensch war einmal glücklich. Auch der, der den Nebel gemacht hat. Sie legte das Foto zurück und sagte: Morgen gehen wir weiter. Mira nickte. Morgen gehen wir weiter. Sie schliefen ein. Das Feuer brannte noch ein bisschen. Und über dem Dorf standen die zwei Monde. Klar und hell. Wie zwei Wächter, die aufpassten, dass der Nebel nicht zurückkam. Lina legte das Buch auf den Tisch, setzte sich daneben und dachte daran, dass ihre Großmutter genau an diesem Tisch gesessen und genau dieselben Fragen gestellt hatte, als sie zum ersten Mal in Eldoria gewesen war. Lina erinnerte sich an die Worte ihrer Großmutter, die immer gesagt hatte, dass man nicht aufgeben darf, auch wenn der Weg dunkel ist und man nicht weiß, wohin er führt. Lina lächelte, weil sie zum ersten Mal verstand, dass ihre Großmutter ihr nicht nur Geschichten erzählt hatte, sondern ihr den Weg nach Eldoria gezeigt hatte. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["3. Die Krone", "Am nächsten Morgen wachte Lina in dem kleinen Haus auf. Draußen schien die Sonne, aber es war eine andere Sonne als in Bielefeld. Sie war größer und ein bisschen goldener. Lina zog sich an, aß Brot und trank Tee, den das kleine Mädchen ihr gebracht hatte. Das Mädchen hieß Mira. Sie war acht Jahre alt und wusste mehr über Eldoria als Lina. Sie erzählte ihr alles. Der Nebel kam vor zwanzig Jahren. Er kam in einer Nacht, in der zwei Monde am Himmel standen. Er nahm die Magie. Er nahm die Erinnerungen. Viele Menschen haben vergessen, dass sie einmal Magie konnten. Sie haben vergessen, wie man heilt. Wie man mit Tieren spricht. Wie man Licht macht, wenn es dunkel ist. Nur ein paar haben es nicht vergessen. Wir nennen sie die Hüter. Oma Greta war eine Hüterin. Jetzt bist du eine Hüterin. Lina fragte: Was muss ich tun? Mira sagte: Du musst die Krone finden. Die Nebelkrone. Sie ist in drei Teile zerbrochen. Jeder Teil ist an einem anderen Ort. Wenn du alle drei Teile hast, dann kannst du den Nebel besiegen. Lina fragte: Wo sind die Teile? Mira zeigte auf die Karte im Buch. Drei Orte. Der Wald der Flüsternden Bäume. Die Höhle der Stille. Der Turm des Windes. Lina schluckte. Drei Orte, die alle gefährlich klangen. Sie fragte: Und was ist, wenn ich es nicht schaffe? Mira sagte: Dann bleibt Eldoria im Nebel. Für immer. Lina stand auf und ging nach draußen. Sie musste nachdenken. Sie war nur ein Mädchen aus Bielefeld. Sie hatte noch nie Magie gemacht. Sie hatte noch nie ein Abenteuer erlebt. Sie war in der Schule nicht einmal gut in Sport. Wie sollte sie drei Teile einer Krone finden und einen Nebel besiegen, der ein ganzes Land gestohlen hatte? Sie setzte sich auf eine Bank und schaute in den Himmel. Die zwei Monde waren jetzt nicht zu sehen. Nur die Sonne. Sie dachte an ihre Großmutter. An die Geschichten, die sie ihr als Kind erzählt hatte. Geschichten von einem Land mit zwei Monden. Lina hatte immer gedacht, das seien Märchen. Jetzt wusste sie: Es waren keine Märchen. Es war die Wahrheit. Sie stand auf, ging zurück ins Haus und nahm das Buch. Auf einer neuen Seite stand: Die Krone wählt nicht die Stärkste. Sie wählt die, die nicht aufgibt. Lina lächelte. Das war ihre Großmutter. Immer dieser Satz. Nicht aufgeben. Sie packte ihre Tasche. Brot. Wasser. Das Buch. Und ein kleines Messer, das Mira ihr gegeben hatte. Für den Wald, hatte Mira gesagt. Lina fragte: Kommst du mit? Mira nickte. Ich komme mit. Bis zum Wald. Danach musst du allein weiter. Lina nahm Miras Hand. Und sie gingen los. In den Wald der Flüsternden Bäume. Lina wachte früh auf. Die Sonne war noch nicht ganz aufgegangen. Sie ging nach draußen und setzte sich auf eine Bank. Ein Vogel setzte sich neben sie. Nicht auf den Boden. Auf die Bank. Ganz nah. Lina schaute ihn an. Der Vogel schaute sie an. Und dann sagte der Vogel: Du bist die mit der Krone. Lina erschrak. Sie hatte noch nie einen Vogel sprechen hören. Oder hatte sie? Als Kind hatte sie immer gedacht, dass Vögel sprechen. Aber alle hatten gesagt, das bilde sie sich ein. Jetzt sprach ein Vogel mit ihr. Wirklich. Sie fragte: Kannst du wirklich sprechen? Der Vogel sagte: In Eldoria können alle Tiere sprechen. Wenn man zuhört. Lina fragte: Und was sagen die anderen Tiere? Der Vogel sagte: Sie sagen, dass du gekommen bist, um uns zu helfen. Und dass sie dir danken. Lina lächelte. Sie streckte die Hand aus. Der Vogel setzte sich auf ihre Hand. Er war leicht. Und warm. Sie dachte an ihre Großmutter, die immer gesagt hatte: Wenn du den Tieren zuhörst, dann verstehst du die Welt besser. Lina hatte das immer für einen Spruch gehalten. Jetzt wusste sie: Es war die Wahrheit. Sie ging zurück ins Haus und erzählte Mira von dem Vogel. Mira lachte. Natürlich sprechen die Vögel, sagte sie. Das tun sie schon immer. Nur die Menschen haben es vergessen, weil der Nebel sie hat vergessen lassen. Lina nickte. Sie würde den Menschen helfen, sich wieder zu erinnern. Nicht nur an die Magie. An alles. An die Tiere. An die Bäume. An die Geschichten. Sie nahm das Buch und schrieb hinein: Heute hat ein Vogel mit mir gesprochen. Er hat gesagt, dass ich gekommen bin, um zu helfen. Und er hat recht. Sie klappte das Buch zu und ging nach draußen. Der Vogel saß noch auf der Bank. Er schaute sie an und sagte: Bis morgen, Lina. Lina sagte: Bis morgen, Vogel. Und sie wusste, dass sie einen neuen Freund gefunden hatte. Lina nahm Miras Hand, drückte sie fest und sagte leise, dass sie froh war, dass Mira bei ihr war, weil sie ohne Mira nie den Mut gefunden hätte, in den Wald der Flüsternden Bäume zu gehen. Lina schaute Mira an, die neben ihr ging und ihr immer wieder Mut machte, wenn sie das Gefühl hatte, dass sie es nicht schaffen würde, und sie wusste, dass sie ohne Mira verloren gewesen wäre. Lina nahm das Buch fest in beide Hände und wusste, dass sie es nie wieder loslassen würde, weil es sie mit Eldoria und mit ihrer Großmutter verband. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["4. Der Wald der Flüsternden Bäume", "Der Wald der Flüsternden Bäume war anders als der Wald, durch den Lina gekommen war. Die Bäume waren noch höher. Sie standen so dicht, dass kaum Licht durchkam. Und sie flüsterten. Nicht wie Wind in den Blättern. Wirklich flüstern. Wie Menschen, die sich etwas erzählen. Lina blieb stehen und lauschte. Sie hörte Worte. Nicht deutlich. Aber sie hörte: Geh zurück. Geh zurück. Mira sagte: Hör nicht auf sie. Die Bäume testen dich. Sie sagen jedem, er soll zurückgehen. Wenn du zurückgehst, dann hast du verloren. Lina nickte und ging weiter. Nach einer Weile wurde das Flüstern lauter. Es sagte nicht mehr nur: Geh zurück. Es sagte: Du bist nicht gut genug. Du bist zu schwach. Du hast keine Magie. Lina wurde wütend. Sie blieb stehen und rief: Hört auf! Ich bin hier, weil meine Großmutter mich geschickt hat. Und ich gehe nicht zurück. Da wurde es still. Ganz still. Nicht einmal mehr ein Flüstern. Die Bäume bewegten sich nicht mehr. Mira lächelte. Du hast es geschafft, sagte sie. Du hast ihnen gezeigt, dass du keine Angst hast. Oder dass du Angst hast, aber trotzdem weitergehst. Das ist das Gleiche. Sie gingen weiter. Nach einer Stunde kamen sie an eine Lichtung. In der Mitte stand ein Baum. Ein Baum, der anders war als die anderen. Er war aus Glas. Oder er sah aus wie Glas. Durchsichtig. Und in ihm, in der Mitte des Stammes, leuchtete etwas. Ein kleines Stück Metall. In Form einer Krone. Lina ging langsam darauf zu. Der Baum flüsterte: Wer bist du? Lina sagte: Ich bin Lina. Enkelin von Greta. Der Baum flüsterte: Greta hat uns gerettet. Vor vielen Jahren. Sie hat uns Wasser gegeben, als es nicht geregnet hat. Sie hat uns zugehört, als niemand zugehört hat. Wenn du ihre Enkelin bist, dann darfst du den ersten Teil nehmen. Aber du musst uns etwas versprechen. Lina fragte: Was? Der Baum sagte: Vergiss uns nicht. Wenn du die Krone hast, dann komm zurück und erzähl uns, wie es war. Lina sagte: Das verspreche ich. Sie legte die Hand auf den Baum. Der Baum wurde warm. Er öffnete sich wie eine Tür. Drinnen lag der erste Teil der Krone. Ein kleines Stück aus Silber, das wie Nebel aussah. Lina nahm es in die Hand. Es war leicht. Und es leuchtete. Sie steckte es in ihre Tasche. Mira umarmte sie. Du hast den ersten Teil, sagte sie. Nur noch zwei. Lina lächelte. Zum ersten Mal fühlte sie sich nicht mehr wie ein Mädchen, das sich verlaufen hatte. Sie fühlte sich wie eine Hüterin. Als Lina und Mira im Wald waren, trafen sie einen alten Baum, der umgefallen war. Er lag quer über dem Weg. Mira sagte: Wir müssen drum herum gehen. Lina sagte: Oder wir helfen ihm. Mira fragte: Wie hilft man einem Baum, der umgefallen ist? Lina legte die Hand auf den Baum und sagte: Es tut mir leid, dass du umgefallen bist. Der Baum flüsterte: Danke, dass du es sagst. Niemand hat mir das je gesagt. Lina fragte: Kann ich dir helfen? Der Baum sagte: Du kannst mir zuhören. Das reicht schon. Lina setzte sich neben den Baum und hörte zu. Der Baum erzählte von dem Sturm, der ihn umgeworfen hatte. Von den Vögeln, die in ihm gewohnt hatten. Von den Kindern, die unter ihm gespielt hatten. Lina hörte zu. Sie unterbrach ihn nicht. Als er fertig war, sagte er: Jetzt geht es mir besser. Danke, Lina. Lina stand auf und ging weiter. Mira sagte: Du hast dem Baum geholfen, indem du ihm zugehört hast. Das ist Magie. Lina fragte: Wirklich? Mira sagte: Ja. Die größte Magie ist zuhören. Das hat Oma Greta immer gesagt. Lina dachte nach. Sie hatte immer gedacht, Magie sei etwas Großes. Feuer. Blitze. Fliegen. Aber vielleicht war Magie etwas Kleines. Zuhören. Da sein. Nicht weggehen. Sie ging weiter durch den Wald und hörte den Bäumen zu. Jedem Baum. Auch den kleinen. Auch den leisen. Und mit jedem Baum, dem sie zuhörte, wurde der Wald ein bisschen heller. Ein bisschen lebendiger. Ein bisschen mehr wie früher. Als sie aus dem Wald kamen, drehte sich Lina noch einmal um und sagte: Danke, Wald. Der Wald flüsterte zurück: Danke, Lina. Komm bald wieder. Und Lina wusste, dass sie wiederkommen würde. Ganz sicher. Lina legte ihre Hand noch einmal auf den gläsernen Baum, spürte, wie warm er wurde, und flüsterte ihm zu, dass sie ihr Versprechen halten würde und bald wiederkommen würde, um ihm zu erzählen, wie es weitergegangen war. Lina berührte den gläsernen Baum noch einmal ganz vorsichtig, weil sie spürte, dass er lebendig war und dass er ihr etwas sagen wollte, das sie noch nicht ganz verstanden hatte. Lina hörte den Bäumen zu, die leise flüsterten, und verstand zum ersten Mal, was sie ihr sagen wollten, nämlich dass sie willkommen war und dass sie bleiben sollte. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["5. Die Höhle der Stille", "Am nächsten Tag gingen Lina und Mira zur Höhle der Stille. Mira sagte: Ich komme nur bis zum Eingang. In die Höhle musst du allein. Weil die Höhle nur mit einer Person spricht. Lina fragte: Was spricht sie? Mira sagte: Sie spricht nicht. Sie ist still. Ganz still. Und in der Stille hörst du deine eigenen Gedanken. Lauter als je zuvor. Lina schluckte. Das klang schlimmer als jeder Wald. Sie gingen einen schmalen Weg entlang, vorbei an Felsen und an einem kleinen See. Das Wasser im See war schwarz. Nicht dreckig. Einfach schwarz, wie ein Spiegel. Lina schaute hinein und sah nicht sich selbst. Sie sah ihre Großmutter. Sie sah ihre Mutter. Sie sah sich selbst als kleines Kind. Sie schüttelte den Kopf und ging weiter. Nach zwei Stunden standen sie vor der Höhle. Der Eingang war klein. Man musste sich bücken, um reinzukommen. Mira umarmte Lina und sagte: Ich warte hier. Wenn du Angst hast, dann denk an Oma Greta. Sie war auch einmal hier. Und sie hatte auch Angst. Lina nickte und kroch in die Höhle. Drinnen war es dunkel. Und still. So still, dass Lina ihren eigenen Herzschlag hörte. Sie ging langsam weiter. Ihre Hände tasteten an der Wand entlang. Die Wand war kalt und glatt. Nach einer Weile sah sie ein Licht. Ganz schwach. Sie ging darauf zu. In einem kleinen Raum stand ein Tisch. Auf dem Tisch lag ein zweites Stück der Krone. Aber es war nicht allein. Daneben lag ein Zettel. Darauf stand: Was hast du verloren? Lina dachte nach. Was hatte sie verloren? Ihre Großmutter. Ihre Kindheit. Ihr Zuhause. Sie sagte leise: Ich habe meine Großmutter verloren. Da wurde das Licht heller. Und eine Stimme sagte: Und was hast du gefunden? Lina sagte: Ich habe Eldoria gefunden. Und ich habe mich selbst gefunden. Die Stimme sagte: Dann darfst du den zweiten Teil nehmen. Aber denk daran: Wer etwas verliert, der findet auch etwas Neues. Lina nahm den zweiten Teil. Er war aus Gold. Und er leuchtete anders als der erste. Wärmer. Sie steckte ihn in ihre Tasche und ging zurück zum Eingang. Mira wartete schon. Sie sah Lina an und sagte: Du siehst anders aus. Lina fragte: Wie? Mira sagte: Du siehst aus wie jemand, der keine Angst mehr hat. Lina lächelte. Ich habe immer noch Angst, sagte sie. Aber ich weiß jetzt, dass Angst nicht heißt, dass man aufhören muss. Mira nickte. Das hat Oma Greta auch immer gesagt. Als Lina in der Höhle war, dachte sie an ihre Kindheit. An die Tage, an denen sie allein in ihrem Zimmer gesessen und sich gewünscht hatte, dass etwas Aufregendes passiert. An die Tage, an denen sie sich einsam gefühlt hatte, obwohl ihre Eltern im Nebenzimmer waren. An die Tage, an denen sie gedacht hatte, dass sie nicht gut genug sei. Nicht klug genug. Nicht mutig genug. Nicht schön genug. Sie dachte an all diese Tage und merkte, dass sie jetzt in einer Höhle saß, in einem Land, das es gar nicht geben dürfte, und dass sie trotzdem nicht mehr einsam war. Weil sie wusste, wofür sie hier war. Weil sie wusste, dass jemand auf sie wartete. Mira. Die Menschen im Dorf. Eldoria. Sie stand auf und ging weiter in die Höhle. Sie hörte ihre eigenen Schritte. Sie hörte ihren eigenen Atem. Sie hörte ihr eigenes Herz. Und sie dachte: Das ist die Stille. Nicht leer. Voll. Voll von mir. Voll von meinen Gedanken. Voll von dem, was ich wirklich bin. Sie kam an eine Stelle, an der die Höhle enger wurde. Sie musste kriechen. Sie kroch. Ihre Knie taten weh. Ihre Hände wurden schmutzig. Aber sie gab nicht auf. Sie dachte an ihre Großmutter, die auch einmal hier gekrochen war. Und sie dachte: Wenn Oma es geschafft hat, dann schaffe ich es auch. Als sie aus der engen Stelle herauskam, sah sie das Licht. Das Licht, das den zweiten Teil der Krone beleuchtete. Sie lächelte. Sie hatte es geschafft. Nicht, weil sie keine Angst gehabt hatte. Sondern weil sie trotz der Angst weitergegangen war. Sie nahm den zweiten Teil und steckte ihn ein. Und sie wusste: Die Höhle hatte ihr nicht nur einen Teil der Krone gegeben. Sie hatte ihr auch etwas anderes gegeben. Mut. Echten Mut. Nicht den Mut, der laut ist. Den Mut, der leise ist. Und der trotzdem weitergeht. Lina setzte sich noch einmal auf den Boden der Höhle, hörte ihrem eigenen Herzschlag zu und dachte daran, dass die Stille gar nicht leer war, sondern voller Gedanken, die sie lange nicht mehr gedacht hatte. Lina hörte in der Stille der Höhle ihren eigenen Atem und dachte daran, dass sie zum ersten Mal in ihrem Leben wirklich hörte, was sie selbst dachte, ohne dass jemand anderes dazwischen redete. Lina spürte, wie die Stille in der Höhle sie ruhiger machte und wie sie zum ersten Mal seit langem wirklich bei sich selbst ankam, ohne Angst und ohne Eile. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["6. Der Turm des Windes", "Der Turm des Windes stand auf einem hohen Berg. Man konnte ihn schon von weitem sehen. Er war aus Stein, aber er sah aus, als ob er aus Wind gemacht wäre. Weil er sich bewegte. Nicht viel. Aber ein bisschen. Wie ein Baum im Wind. Lina und Mira gingen drei Tage lang dorthin. Sie gingen durch Wiesen, über Brücken, vorbei an einem Dorf, in dem alle schliefen, weil der Nebel sie müde gemacht hatte. Am dritten Tag kamen sie am Fuß des Berges an. Mira sagte: Bis hierher komme ich. Den Turm musst du allein hoch. Lina fragte: Warum? Mira sagte: Weil der Wind nur mit einer Person spricht. Lina nickte. Sie hatte sich schon daran gewöhnt, dass sie die schweren Dinge allein machen musste. Sie umarmte Mira und ging los. Der Weg nach oben war steil. Steine rutschten unter ihren Füßen weg. Der Wind wurde stärker. Er zog an ihrer Jacke. Er zog an ihren Haaren. Er flüsterte: Geh zurück. Du bist zu klein. Du bist zu schwach. Lina rief: Ich gehe nicht zurück! Der Wind lachte. Ein echtes Lachen. Nicht böse. Eher neugierig. Er sagte: Viele haben das gesagt. Und viele sind trotzdem umgekehrt. Lina sagte: Ich kehre nicht um. Ich habe zwei Teile der Krone. Ich brauche den dritten. Der Wind wurde still. Dann sagte er: Wenn du den dritten Teil willst, dann musst du mir eine Frage beantworten. Lina fragte: Welche? Der Wind sagte: Was ist stärker als Magie? Lina dachte nach. Stärker als Magie? Was konnte stärker sein als Magie? Sie dachte an ihre Großmutter. An Mira. An Eldoria. An das, was sie in den letzten Tagen gelernt hatte. Sie sagte: Liebe. Liebe ist stärker als Magie. Weil Magie vergisst man. Aber Liebe vergisst man nicht. Der Wind schwieg lange. Dann sagte er: Das ist richtig. Das hat Greta auch gesagt. Vor vielen Jahren. Als sie hier war. Lina wurde warm ums Herz. Ihre Großmutter war auch hier gewesen. Sie hatte dieselbe Frage beantwortet. Und sie hatte dieselbe Antwort gegeben. Der Wind öffnete eine Tür im Turm. Drinnen lag der dritte Teil der Krone. Aus einem Metall, das Lina noch nie gesehen hatte. Es war weder Silber noch Gold. Es war wie Nebel, der fest geworden war. Lina nahm ihn in die Hand. Alle drei Teile leuchteten in ihrer Tasche. Sie wusste: Jetzt hatte sie alles. Jetzt musste sie nur noch die Krone zusammenfügen. Und den Nebel besiegen. Sie ging zurück nach unten. Mira wartete. Sie sah die drei Teile und sagte: Du hast es geschafft. Du hast wirklich alle drei Teile. Lina nickte. Jetzt muss ich nur noch wissen, wie man die Krone zusammenfügt. Mira lächelte. Das weißt du schon. Du musst es nur noch tun. Als Lina auf den Turm stieg, dachte sie an den Wind. An den Wind in Bielefeld. An den Wind, der im Herbst die Blätter durch die Straßen wehte. An den Wind, der im Winter kalt war und im Sommer warm. Sie hatte den Wind immer gemocht. Jetzt sprach der Wind mit ihr. Wirklich. Er sagte: Lina, warum bist du hier? Lina sagte: Weil ich den dritten Teil der Krone brauche. Der Wind sagte: Und was gibst du mir dafür? Lina fragte: Was willst du? Der Wind sagte: Erzähl mir eine Geschichte. Eine, die ich noch nicht kenne. Lina setzte sich auf eine Stufe des Turms und dachte nach. Welche Geschichte kannte der Wind noch nicht? Der Wind kannte alle Geschichten. Er war überall gewesen. Er hatte alles gehört. Sie erzählte ihm von Bielefeld. Von der Schule. Von dem Keller. Von dem Buch. Von ihrer Großmutter. Von dem Tag, an dem sie das Buch gefunden hatte. Der Wind hörte zu. Er wurde leiser. Er wurde sanfter. Als Lina fertig war, sagte er: Das ist eine schöne Geschichte. Die kannte ich noch nicht. Weil sie deine Geschichte ist. Und deine Geschichte kennt niemand außer dir. Lina lächelte. Sie stand auf und ging weiter nach oben. Der Wind folgte ihr. Nicht mehr als Feind. Als Freund. Er trug sie fast nach oben. Als ob er ihr helfen wollte. Oben angekommen, sah sie den dritten Teil der Krone. Er lag auf einem kleinen Tisch aus Stein. Sie nahm ihn in die Hand. Er war kalt. Aber er wurde warm, als sie ihn berührte. Wie die anderen Teile auch. Sie steckte ihn ein und ging zurück nach unten. Der Wind sagte: Komm bald wieder, Lina. Erzähl mir noch eine Geschichte. Lina sagte: Das mache ich. Versprochen. Und sie wusste, dass sie wiederkommen würde. Weil der Wind jetzt ihr Freund war. Wie die Bäume. Wie die Vögel. Wie Mira. Wie Eldoria. Lina blieb noch einen Moment auf dem Turm stehen, schaute über ganz Eldoria und dachte daran, dass der Wind jetzt ihr Freund war und dass sie ihn jederzeit wieder rufen konnte, wenn sie ihn brauchte. Lina spürte den Wind auf ihrer Haut, der nicht mehr kalt und feindlich war, sondern warm und freundlich, als ob er sie nach Hause tragen wollte, dorthin, wo sie hingehörte. Lina stand auf dem Turm und ließ den Wind durch ihre Haare wehen, weil sie sich in diesem Moment so frei fühlte wie noch nie in ihrem ganzen Leben. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["7. Die Krone wird eins", "Lina und Mira gingen zurück ins Dorf. Auf dem Weg trafen sie immer mehr Menschen, die aufgewacht waren. Nicht aus dem Schlaf. Aus dem Vergessen. Ein Mann sagte: Ich erinnere mich. Ich konnte einmal mit Vögeln sprechen. Eine Frau sagte: Ich konnte einmal Licht machen, wenn es dunkel war. Ein Kind sagte: Ich habe geträumt, dass der Nebel weggeht. Lina lächelte. Der Nebel wurde schon schwächer. Nur weil sie die drei Teile gefunden hatte. Im Dorf angekommen, ging Lina in das kleine Haus, in dem sie gewohnt hatte. Sie legte die drei Teile auf den Tisch. Silber. Gold. Nebelmetall. Sie wusste nicht, wie man sie zusammenfügt. Sie schlug das Buch auf. Auf einer neuen Seite stand: Die Krone wird eins, wenn die Trägerin sie mit dem Herzen zusammenfügt. Nicht mit den Händen. Mit dem Herzen. Lina legte ihre Hände auf die drei Teile. Sie schloss die Augen. Sie dachte an ihre Großmutter. An Mira. An Eldoria. An alle, die sie getroffen hatte. An den Wald. An die Höhle. An den Turm. Sie dachte an Bielefeld. An ihre Mutter. An ihr Zuhause. Und sie dachte: Ich will, dass Eldoria wieder magisch wird. Nicht für mich. Für alle. Da wurden die drei Teile warm. Sie bewegten sich. Sie fügten sich zusammen. Wie von allein. Und auf dem Tisch lag eine Krone. Eine Krone aus Nebel. Sie leuchtete. Sie war wunderschön. Lina nahm sie in die Hand. Sie war leicht. Sie setzte sie auf. Und in diesem Moment wusste sie alles. Sie wusste, wie man den Nebel besiegt. Sie wusste, wie man die Magie zurückbringt. Sie wusste, was ihre Großmutter gewusst hatte. Dass die Krone nicht die Magie macht. Dass die Menschen die Magie machen. Die Krone erinnert sie nur daran. Lina ging nach draußen. Alle Menschen im Dorf standen da und schauten sie an. Mira stand ganz vorne. Sie sagte: Du siehst aus wie Oma Greta, als sie jung war. Lina lächelte. Sie nahm die Krone ab und hielt sie hoch. Der Nebel, der über dem Dorf lag, begann sich zu bewegen. Er wurde dünner. Er zog sich zurück. Wie ein Tier, das Angst hat. Lina sagte laut: Nebel, du hast lange genug hier gewohnt. Jetzt gehst du. Und der Nebel ging. Nicht auf einmal. Langsam. Aber er ging. Und als er weg war, sah Lina zum ersten Mal Eldoria ohne Nebel. Es war noch schöner, als sie gedacht hatte. Die Blumen leuchteten. Die Bäume sangen. Die Menschen lachten. Und Lina wusste: Das war erst der Anfang. Denn der Nebel war noch nicht ganz weg. Er war nur aus dem Dorf weg. Er war noch irgendwo da draußen. Und sie musste ihn finden. Und sie musste ihn für immer besiegen. Als Lina die Krone zusammengefügt hatte, saß sie lange auf dem Boden und schaute sie an. Die Krone war wunderschön. Sie leuchtete in allen Farben. Silber. Gold. Nebel. Lina dachte an ihre Großmutter, die die Krone einmal getragen hatte. An den Wächter, der sie einmal getragen hatte. An alle, die sie getragen hatten. Und sie dachte: Die Krone ist nicht wichtig. Wichtig sind die Menschen, die sie tragen. Und was sie damit machen. Sie setzte die Krone auf. Und in diesem Moment hörte sie etwas. Nicht laut. Leise. Wie ein Flüstern. Die Stimmen aller Menschen in Eldoria. Sie sagten: Danke, Lina. Danke, dass du gekommen bist. Danke, dass du nicht aufgegeben hast. Lina weinte. Nicht vor Trauer. Vor Freude. Sie nahm die Krone ab und legte sie auf den Tisch. Sie ging nach draußen. Alle Menschen standen da. Sie schauten sie an. Sie lächelten. Ein Kind kam auf sie zu und gab ihr eine Blume. Eine Blume, die leuchtete. Lina nahm die Blume und steckte sie sich ins Haar. Mira kam und umarmte sie. Du hast es geschafft, sagte sie. Lina sagte: Wir haben es geschafft. Alle zusammen. Und das stimmte. Sie hatte es nicht allein geschafft. Sie hatte es mit Mira geschafft. Mit den Bäumen. Mit dem Wind. Mit den Vögeln. Mit allen. Sie setzte sich auf den Marktplatz und erzählte den Menschen, was sie gelernt hatte. Dass Magie nicht im Buch ist. Nicht in der Krone. Sondern in den Menschen. In jedem einzelnen. Und dass sie sich nur daran erinnern müssen. Die Menschen nickten. Sie verstanden. Und in diesem Moment leuchteten alle Blumen im Dorf noch ein bisschen heller. Als ob sie sich freuten, dass die Menschen sich endlich wieder erinnerten. Lina hielt die fertige Krone noch einmal in beiden Händen, schaute sie lange an und dachte daran, dass sie nicht aus Silber und Gold und Nebel bestand, sondern aus allen Geschichten, die sie auf dem Weg gehört hatte. Lina schaute die fertige Krone an, die auf dem Tisch lag und leuchtete, und dachte daran, dass sie diese Krone nicht für sich selbst gefunden hatte, sondern für alle Menschen in Eldoria. Lina setzte die Krone auf ihren Kopf und spürte sofort, wie warm sie wurde und wie sie ihr sagte, dass sie jetzt bereit war, den Nebel zu besiegen. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["8. Der Nebel kehrt zurück", "Am nächsten Morgen wachte Lina auf und dachte, alles wäre vorbei. Der Nebel war weg aus dem Dorf. Die Menschen lachten. Die Blumen leuchteten. Aber als sie aus dem Fenster schaute, sah sie etwas, das ihr das Herz schwer machte. Am Horizont, hinter den Bergen, stand wieder Nebel. Nicht viel. Aber er war da. Er wartete. Mira kam ins Haus und sagte: Er ist noch nicht weg. Er hat sich nur zurückgezogen. Er sammelt sich. Lina fragte: Wo? Mira zeigte auf die Karte im Buch. Auf der Karte war ein neuer Ort eingezeichnet, den Lina vorher nicht gesehen hatte. Der Nebelberg. Dort, wo der Nebel geboren wurde. Lina wusste: Sie musste dorthin. Sie musste den Nebel an seinem Ursprung besiegen. Sonst würde er immer wiederkommen. Sie packte ihre Tasche. Brot. Wasser. Das Buch. Die Krone. Mira sagte: Ich komme mit. Bis zum Fuß des Berges. Danach musst du allein weiter. Lina nickte. Sie hatte sich schon daran gewöhnt, dass die letzten Schritte immer allein waren. Sie gingen los. Der Weg war lang. Sie gingen durch Wälder, in denen die Bäume wieder sangen. Sie gingen über Wiesen, auf denen Kinder spielten, die lange nicht mehr gespielt hatten, weil der Nebel sie müde gemacht hatte. Sie gingen an einem Fluss entlang, in dem Fische sprangen, die man lange nicht mehr gesehen hatte. Überall merkte Lina, dass Eldoria langsam wieder lebendig wurde. Aber überall merkte sie auch, dass die Menschen noch Angst hatten. Angst, dass der Nebel zurückkommt. Angst, dass alles wieder wird wie vorher. Lina sprach mit ihnen. Sie sagte: Der Nebel kommt nicht zurück. Ich verspreche es. Aber tief in ihr wusste sie, dass sie das nur versprechen konnte, wenn sie es wirklich schaffte. Am Abend des dritten Tages kamen sie am Fuß des Nebelbergs an. Der Berg war hoch und dunkel. Um ihn herum lag Nebel. Dichter Nebel. Man konnte kaum die Hand vor Augen sehen. Mira umarmte Lina und sagte: Ich warte hier. Wenn du nicht zurückkommst, dann komme ich dich holen. Lina lächelte. Das ist lieb, sagte sie. Aber ich komme zurück. Sie nahm die Krone, setzte sie auf und ging los. In den Nebel hinein. Der Nebel war kalt. Er roch nach nichts. Er fühlte sich an wie Watte, die einen erstickt. Lina ging langsam. Sie hielt das Buch fest. Auf einer Seite stand: Der Nebel fürchtet nur eines: Die Wahrheit. Lina dachte nach. Was war die Wahrheit? Dass sie Angst hatte. Dass sie nicht wusste, ob sie es schaffen würde. Dass sie trotzdem weiterging. Sie sagte laut in den Nebel hinein: Ich habe Angst. Aber ich gehe trotzdem weiter. Und der Nebel wurde ein bisschen dünner. Nicht viel. Aber ein bisschen. Lina ging weiter. Schritt für Schritt. In den Berg hinein. Als Lina am Nebelberg ankam, setzte sie sich auf einen Stein und wartete. Sie wartete nicht auf den Nebel. Sie wartete auf ihren Mut. Sie wusste, dass sie Angst hatte. Und sie wusste, dass das in Ordnung war. Angst zu haben, heißt nicht, dass man schwach ist. Angst zu haben, heißt, dass einem etwas wichtig ist. Ihr war Eldoria wichtig. Ihr war Mira wichtig. Ihr waren die Menschen wichtig. Sie stand auf und ging weiter. Der Nebel wurde dichter. Er legte sich auf ihre Schultern wie eine schwere Decke. Sie ging trotzdem weiter. Sie dachte an ihre Großmutter. An Mira. An den Wald. An die Höhle. An den Turm. An alle, die ihr geholfen hatten. Und sie dachte: Ich bin nicht allein. Auch wenn ich allein gehe, bin ich nicht allein. Weil alle, die mich lieben, bei mir sind. In meinem Herzen. Sie ging weiter. Schritt für Schritt. Und mit jedem Schritt wurde der Nebel ein bisschen dünner. Weil sie nicht mehr gegen ihn kämpfte. Sie ging einfach durch ihn hindurch. Wie durch einen Vorhang. Als sie auf der anderen Seite ankam, stand sie vor der großen Tür. Die Tür, hinter der der Wächter wartete. Sie klopfte an. Und sie wusste schon, dass sie nicht mehr die Lina war, die vor ein paar Wochen in Bielefeld im Keller gestanden hatte. Sie war eine andere Lina geworden. Eine mutigere. Eine stärkere. Eine, die wusste, wer sie war. Sie öffnete die Tür und ging hinein. Und der Wächter schaute sie an und sagte: Du bist gekommen. Lina sagte: Ja. Ich bin gekommen. Und ich bleibe, bis der Nebel weg ist. Der Wächter nickte. Dann lass uns anfangen, sagte er. Und sie fingen an. Nicht mit Magie. Mit Reden. Mit Zuhören. Mit Verstehen. So, wie alles Wichtige anfängt. Lina zog ihre Jacke enger, weil der Nebel kalt war, und ging langsam weiter den Berg hinauf, wobei sie immer wieder stehen blieb, um zu lauschen, ob sie schon die Stimme des Wächters hören konnte. Lina ging durch den dichten Nebel und hielt das Buch fest an ihre Brust, weil sie wusste, dass das Buch ihr den Weg zeigen würde, auch wenn sie selbst kaum noch etwas sehen konnte. Lina ging weiter durch den Nebel, Schritt für Schritt, und dachte daran, dass jeder Schritt sie näher zu dem Wächter brachte, der schon so lange auf sie wartete. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["9. Der Wächter des Nebels", "Im Nebelberg war es dunkel. Nicht wie in einer Höhle. Dunkler. Lina konnte kaum etwas sehen. Sie hielt die Krone fest. Die Krone leuchtete. Schwach, aber sie leuchtete. Und das Licht zeigte ihr den Weg. Nach einer Weile kam sie an eine große Tür. Die Tür war aus Stein. Darauf stand: Wer hier eintritt, der muss die Wahrheit sagen. Lina klopfte an. Niemand antwortete. Sie drückte die Tür auf. Dahinter stand ein Mann. Ein alter Mann. Mit einem langen Bart und Augen, die wie Nebel aussahen. Er sagte: Wer bist du? Lina sagte: Ich bin Lina. Enkelin von Greta. Der Mann sagte: Greta. Ich kenne sie. Sie war hier. Vor vielen Jahren. Sie wollte den Nebel besiegen. Und sie ist gescheitert. Lina wurde wütend. Sie ist nicht gescheitert, sagte sie. Sie hat mich geschickt. Der Mann lächelte traurig. Das sagen alle, die hierher kommen. Und alle gehen wieder. Oder sie bleiben für immer im Nebel. Lina fragte: Wer bist du? Der Mann sagte: Ich bin der Wächter des Nebels. Ich habe den Nebel erschaffen. Nicht absichtlich. Aber ich habe ihn erschaffen. Vor langer Zeit war ich ein Magier. Der mächtigste in Eldoria. Ich wollte, dass alle mich lieben. Dass alle mich bewundern. Und als sie das nicht taten, da wurde ich wütend. Und aus meiner Wut wurde Nebel. Der Nebel hat alles genommen. Die Magie. Die Erinnerung. Die Hoffnung. Und ich konnte ihn nicht mehr aufhalten. Lina hörte zu und verstand. Der Nebel war kein Monster. Der Nebel war die Traurigkeit eines alten Mannes, der sich einsam gefühlt hatte. Sie setzte sich auf den Boden, neben ihn, und sagte: Erzähl mir von dir. Der Mann erzählte. Er erzählte von seiner Kindheit. Von seinem Vater, der ihn nie gelobt hatte. Von seinen Freunden, die ihn verlassen hatten. Von dem Tag, an dem er beschlossen hatte, dass er lieber allein sein wollte, als enttäuscht zu werden. Lina hörte zu. Sie unterbrach ihn nicht. Sie fragte nicht. Sie hörte nur zu. Als er fertig war, sagte sie: Ich kenne das Gefühl. Ich habe mich auch oft einsam gefühlt. In Bielefeld. In der Schule. In Hamburg. Ich dachte immer, ich muss stark sein. Und ich darf keine Angst zeigen. Der Mann schaute sie an. Zum ersten Mal sahen seine Augen nicht mehr wie Nebel aus. Sie sahen aus wie die Augen eines Menschen, der lange nicht mehr geweint hatte. Und dann weinte er. Leise. Wie ein Kind. Lina nahm seine Hand und sagte: Du musst nicht mehr allein sein. Der Nebel muss nicht mehr da sein. Du kannst ihn gehen lassen. Der Mann sagte: Ich weiß nicht, wie. Lina sagte: Ich zeige es dir. Als Lina mit dem Wächter sprach, erzählte er ihr von seiner Mutter. Von dem Apfelkuchen. Von der Wiese. Von der Sonne. Lina hörte zu und dachte an ihre eigene Mutter. An die Kuchen, die ihre Mutter gebacken hatte. An die Wiesen, auf denen sie als Kind gespielt hatte. An die Sonne, die im Sommer in Bielefeld geschienen hatte. Sie erzählte dem Wächter davon. Von ihrer Mutter. Von Bielefeld. Von den Kuchen. Von den Wiesen. Der Wächter hörte zu. Er hatte lange niemandem zugehört. Und niemand hatte ihm lange zugehört. Sie saßen stundenlang zusammen und erzählten sich Geschichten. Von früher. Von heute. Von dem, was sie verloren hatten. Und von dem, was sie gefunden hatten. Als sie fertig waren, war der Nebel fast weg. Nur noch eine kleine Wolke war übrig. Lina nahm die Krone und hielt sie hoch. Sie sagte: Siehst du? Du brauchst den Nebel nicht mehr. Du hast jetzt etwas Besseres. Du hast Erinnerungen. Du hast Freunde. Du hast mich. Der Wächter nickte und lächelte. Er sagte: Ich habe lange gedacht, dass ich allein sein muss, um stark zu sein. Aber jetzt weiß ich: Man ist stärker, wenn man nicht allein ist. Lina sagte: Genau. Das hat meine Oma auch immer gesagt. Sie standen auf und gingen gemeinsam aus dem Berg heraus. Draußen wartete Mira. Sie rannte auf sie zu und umarmte beide. Den Wächter und Lina. Der Wächter war überrascht. Niemand hatte ihn seit vielen Jahren umarmt. Er stand da und wusste nicht, was er tun sollte. Dann umarmte er Mira zurück. Ganz vorsichtig. Als ob er Angst hätte, sie zu zerbrechen. Mira lachte und sagte: Du kannst mich ruhig fester umarmen. Ich gehe nicht kaputt. Der Wächter lachte auch. Zum ersten Mal seit vielen Jahren lachte er wirklich. Und Lina wusste: Das war der Moment, in dem der Nebel für immer weg war. Nicht, weil sie ihn besiegt hatte. Sondern weil niemand ihn mehr brauchte. Lina nahm die Hand des Wächters, drückte sie sanft und sagte ihm, dass er nicht mehr allein sein müsse, weil sie jetzt da sei und weil Mira draußen auf sie beide wartete. Lina sah den Wächter an, der vor ihr saß und dessen Augen nicht mehr wie Nebel aussahen, sondern wie die Augen eines Menschen, der endlich wieder Hoffnung gefunden hatte. Lina schaute dem Wächter in die Augen und sah, dass er nicht mehr einsam war, sondern dass er endlich jemanden gefunden hatte, der ihm wirklich zuhörte. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["10. Die Wahrheit", "Lina stand auf und nahm die Krone ab. Sie legte sie auf den Boden, zwischen sich und den Wächter. Sie sagte: Die Krone macht keine Magie. Die Menschen machen die Magie. Die Krone erinnert sie nur daran. Der Wächter schaute auf die Krone. Er sagte: Ich habe die Krone einmal getragen. Vor vielen Jahren. Da war sie noch ganz. Und ich habe sie benutzt, um mich mächtig zu fühlen. Nicht, um anderen zu helfen. Lina sagte: Und jetzt kannst du sie benutzen, um anderen zu helfen. Der Wächter schüttelte den Kopf. Ich habe vergessen, wie man hilft. Ich habe nur noch vergessen, wie man allein ist. Lina sagte: Dann fangen wir klein an. Erzähl mir einen schönen Moment aus deinem Leben. Nur einen. Der Wächter dachte lange nach. Dann sagte er: Als ich klein war, hat meine Mutter mir einmal einen Kuchen gebacken. Einen Apfelkuchen. Wir haben ihn zusammen gegessen. Auf einer Wiese. Die Sonne hat geschienen. Und ich war glücklich. Lina lächelte. Das ist ein schöner Moment, sagte sie. Der Wächter nickte. Ja. Das war er. Und in diesem Moment wurde der Nebel ein bisschen dünner. Lina merkte es. Sie sagte: Siehst du? Wenn du dich an etwas Schönes erinnerst, dann wird der Nebel schwächer. Der Wächter sagte: Aber ich habe so viele schlimme Erinnerungen. Lina sagte: Dann erzählen wir jetzt neue, schöne Erinnerungen. Sie setzten sich zusammen auf den Boden und erzählten sich Geschichten. Lina erzählte von ihrer Großmutter. Von Mira. Von dem Wald. Von der Höhle. Von dem Turm. Der Wächter erzählte von seiner Mutter. Von dem Apfelkuchen. Von der Wiese. Von der Sonne. Und mit jeder Geschichte wurde der Nebel dünner. Er zog sich zurück. Er wurde kleiner. Bis er nur noch eine kleine Wolke war, die über dem Boden schwebte. Lina nahm die Krone und hielt sie hoch. Sie sagte: Nebel, du musst jetzt gehen. Nicht, weil ich es sage. Sondern weil wir dich nicht mehr brauchen. Der Wächter nickte und sagte: Geh. Ich brauche dich nicht mehr. Und der Nebel ging. Er löste sich auf. Wie Rauch, der vom Wind weggetragen wird. Zurück blieb ein alter Mann, der lächelte. Zum ersten Mal seit vielen Jahren lächelte er wirklich. Er sagte: Danke, Lina. Du hast mich gerettet. Nicht Eldoria. Mich. Lina sagte: Du hast dich selbst gerettet. Ich habe nur zugehört. Der Wächter stand auf und ging zur Tür. Er sagte: Komm. Ich zeige dir etwas. Er führte Lina auf den Berg. Von dort oben konnte man ganz Eldoria sehen. Die Wälder. Die Dörfer. Die Flüsse. Die Berge. Alles ohne Nebel. Alles klar und hell und wunderschön. Lina weinte. Vor Glück. Vor Erleichterung. Vor Stolz. Sie hatte es geschafft. Wirklich geschafft. Als Lina und der Wächter aus dem Berg kamen, war der Himmel klar. Kein Nebel. Keine Wolken. Nur Sonne und zwei Monde, die schon am Himmel standen, obwohl es noch Tag war. Lina dachte: Zwei Monde. Zwei Welten. Zwei Zuhause. Sie ging mit dem Wächter und Mira zurück ins Dorf. Auf dem Weg trafen sie immer mehr Menschen, die aufgewacht waren. Nicht aus dem Schlaf. Aus dem Vergessen. Sie erinnerten sich an die Magie. An die Geschichten. An die Lieder. Ein Mann fing an zu singen. Ein altes Lied, das er als Kind gelernt hatte. Eine Frau fing an zu tanzen. Ein Kind fing an zu lachen. Lina lächelte. Sie hatte Eldoria nicht nur vom Nebel befreit. Sie hatte es auch von der Stille befreit. Von dem Schweigen. Von der Angst. Sie war nicht nur eine Hüterin der Krone geworden. Sie war eine Erzählerin geworden. Eine, die Geschichten erzählt, damit niemand sie vergisst. Als sie im Dorf ankamen, war das Fest schon vorbereitet. Aber diesmal war es kein Fest für Lina allein. Es war ein Fest für alle. Für den Wächter. Für Mira. Für die Menschen. Für Eldoria. Lina setzte sich an einen Tisch und aß Kuchen. Apfelkuchen. Wie der Wächter ihn als Kind gegessen hatte. Sie dachte an ihre Großmutter, die auch einmal hier gesessen und Kuchen gegessen hatte. Und sie wusste: Ihre Großmutter wäre stolz gewesen. Nicht, weil Lina den Nebel besiegt hatte. Sondern weil sie zugehört hatte. Weil sie nicht aufgegeben hatte. Weil sie geblieben war. Als das Fest vorbei war, ging Lina mit Mira und dem Wächter nach Hause. Sie setzten sich auf die Bank vor dem Haus und schauten in den Himmel. Die zwei Monde leuchteten. Lina sagte: Morgen gehen wir wieder los. Es gibt noch so viele Orte in Eldoria, die wir noch nicht gesehen haben. Mira sagte: Und so viele Geschichten, die wir noch nicht erzählt haben. Der Wächter sagte: Und so viele Kuchen, die wir noch nicht gegessen haben. Sie lachten alle drei. Und Lina wusste: Das war der Anfang von etwas Neuem. Nicht das Ende. Lina stand auf dem Berg und schaute über das ganze Land, das wieder ohne Nebel war, und dachte daran, dass sie diesen Anblick nie wieder vergessen würde, egal, wo sie in Zukunft sein würde. Lina nahm die Krone vom Boden und hielt sie hoch in die Luft, damit alle sie sehen konnten, und in diesem Moment wurde der Nebel noch ein bisschen dünner und das Licht noch ein bisschen heller. Lina hielt die Krone hoch und sah, wie das Licht durch den Nebel brach und wie die Menschen im Dorf anfingen, wieder zu lachen und zu singen. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["11. Das Fest", "Als Lina und der Wächter zurück ins Dorf kamen, war schon alles vorbereitet. Die Menschen hatten ein Fest organisiert. Ein Fest für Lina. Ein Fest für Eldoria. Ein Fest für die Magie, die zurückgekommen war. Auf dem Marktplatz standen Tische mit Kuchen und Brot und Obst. Kinder liefen herum und lachten. Musiker spielten auf alten Instrumenten, die lange nicht mehr gespielt worden waren, weil der Nebel die Musik gestohlen hatte. Mira rannte auf Lina zu und umarmte sie. Du bist zurück, rief sie. Ich wusste, dass du zurückkommst. Lina umarmte sie zurück. Natürlich komme ich zurück, sagte sie. Ich habe es dir versprochen. Der Wächter stand ein bisschen abseits und schaute zu. Er wusste nicht, was er tun sollte. Er war so lange allein gewesen, dass er vergessen hatte, wie man feiert. Lina ging zu ihm und nahm seine Hand. Komm, sagte sie. Du gehörst dazu. Er nickte und ging mit ihr zum Marktplatz. Die Menschen schauten ihn erst misstrauisch an. Dann erkannte ihn eine alte Frau. Du bist der Wächter, sagte sie. Du bist der, der den Nebel gemacht hat. Der Wächter wurde rot. Er sagte: Ja. Das bin ich. Es tut mir leid. Die Frau schaute ihn lange an. Dann sagte sie: Wir verzeihen dir. Weil du ihn auch wieder weg gemacht hast. Mit Lina zusammen. Und weil jeder einmal einen Fehler macht. Der Wächter weinte. Wieder. Aber diesmal waren es keine traurigen Tränen. Es waren Tränen der Erleichterung. Er setzte sich an einen Tisch und aß Kuchen. Apfelkuchen. Wie damals, als er klein war. Er lächelte. Lina setzte sich neben ihn und sagte: Siehst du? So fühlt sich ein Fest an. Er sagte: Ja. So fühlt es sich an. Und ich habe es fast vergessen. Am Abend tanzten alle. Auch Lina. Auch Mira. Auch der Wächter. Er konnte nicht gut tanzen. Aber das war egal. Niemand lachte ihn aus. Alle lachten mit ihm. Als die Sonne unterging, standen alle zusammen auf dem Marktplatz und schauten in den Himmel. Die zwei Monde waren zu sehen. Klar und hell. Wie zwei Freunde, die lange weg gewesen waren und jetzt wieder da waren. Lina dachte an ihre Großmutter. Sie hätte dieses Fest geliebt. Sie hätte getanzt. Sie hätte gelacht. Sie hätte gesagt: Siehst du, Lina? Ich habe dir doch gesagt, dass du es schaffst. Lina flüsterte in den Himmel: Danke, Oma. Danke für alles. Und sie wusste, dass ihre Großmutter sie gehört hatte. Irgendwo da oben. Zwischen den zwei Monden. Als das Fest vorbei war, ging Lina allein nach draußen. Sie wollte noch einmal allein sein. Sie ging zur Wiese, auf der sie angekommen war. Die Wiese, auf der alles angefangen hatte. Sie setzte sich ins Gras und schaute in den Himmel. Die zwei Monde standen da. Klar und hell. Sie dachte an Bielefeld. An den Keller. An das Buch. An den Moment, in dem sie gedacht hatte, dass alles nur ein Traum war. Jetzt wusste sie: Es war kein Traum. Es war wahr. Alles war wahr. Sie nahm das Buch aus ihrer Tasche und schlug es auf. Auf der letzten Seite stand jetzt ein neuer Text. Darin stand: Liebe Lina, du hast es geschafft. Du hast Eldoria gerettet. Aber du hast noch etwas anderes gerettet. Dich selbst. Und das ist das Wichtigste. Lina las den Text und weinte. Leise. Weil sie wusste, dass ihre Großmutter ihn geschrieben hatte. Vor vielen Jahren. Für den Moment, in dem Lina es schaffen würde. Sie klappte das Buch zu und steckte es ein. Sie stand auf und ging zurück ins Dorf. Die Menschen schliefen schon. Nur Mira war noch wach. Sie saß auf der Bank vor Linas Haus und wartete. Sie sagte: Ich konnte nicht schlafen. Ich musste noch auf dich warten. Lina setzte sich neben sie und sagte: Ich bin ja da. Mira sagte: Ich weiß. Und ich bin froh, dass du da bist. Sie saßen lange so da. Schweigend. Unter den zwei Monden. Und Lina wusste: Das war Freundschaft. Echte Freundschaft. Nicht die Freundschaft, die man in der Schule hat und dann wieder vergisst. Sondern die Freundschaft, die bleibt. Für immer. Als Mira eingeschlafen war, trug Lina sie ins Haus und legte sie ins Bett. Sie deckte sie zu und sagte leise: Gute Nacht, Mira. Morgen erzählen wir weiter. Mira murmelte im Schlaf: Morgen erzählen wir weiter. Und Lina lächelte. Sie ging nach draußen, setzte sich auf die Bank und schaute noch einmal in den Himmel. Zwei Monde. Zwei Welten. Ein Leben. Und sie wusste: Sie würde nie wieder allein sein. Niemals. Lina setzte sich neben Mira auf den Marktplatz, nahm sich ein Stück Apfelkuchen und dachte daran, dass dieses Fest nicht nur für sie war, sondern für alle, die so lange im Nebel gelebt hatten. Lina tanzte mit Mira auf dem Marktplatz, lachte laut und dachte daran, dass sie noch nie auf einem Fest getanzt hatte, auf dem alle Menschen so glücklich waren wie an diesem Abend. Lina aß ein Stück Kuchen, trank einen Schluck Tee und dachte daran, dass dies das schönste Fest war, das sie je in ihrem Leben erlebt hatte. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["12. Der Abschied", "Am nächsten Morgen musste Lina eine Entscheidung treffen. Sollte sie in Eldoria bleiben? Oder sollte sie nach Bielefeld zurückkehren? Sie hatte Eldoria gerettet. Sie hatte den Nebel besiegt. Sie hatte die Krone zusammengefügt. Aber sie hatte auch ein Zuhause in Bielefeld. Eine Mutter. Einen Vater. Freunde. Ein Leben, das sie verlassen hatte, um hierher zu kommen. Sie setzte sich ans Fenster und dachte nach. Mira kam rein und setzte sich neben sie. Du musst dich nicht entscheiden, sagte Mira. Du kannst in beiden Welten leben. Das hat Oma Greta auch gemacht. Sie war in beiden Welten zu Hause. In Eldoria und in Bielefeld. Sie ist immer hin und her gegangen. Durch den Nebel. Durch das Buch. Lina fragte: Wie? Mira sagte: Mit dem Buch. Das Buch ist ein Tor. Wenn du es aufschlägst und an den Ort denkst, an den du willst, dann bringt es dich dorthin. Lina schlug das Buch auf. Auf einer Seite stand: Denk an den Ort, an dem du sein willst. Und geh. Sie dachte an Bielefeld. An ihr Elternhaus. An den Keller. An ihre Mutter, die in der Küche stand und Kaffee kochte. Und plötzlich war sie wieder im Keller. In Bielefeld. Das Buch in der Hand. Die Krone in der Tasche. Sie ging nach oben. Ihre Mutter stand in der Küche und sagte: Da bist du ja. Ich habe schon Kaffee gekocht. Wo warst du? Lina lächelte. Ich war in Eldoria, sagte sie. Ihre Mutter lachte. Natürlich warst du das. Und deine Oma hat dir wieder Geschichten erzählt. Lina sagte nichts. Sie setzte sich an den Tisch und trank Kaffee. Es fühlte sich komisch an, wieder zu Hause zu sein. Als ob sie zwei Leben hätte. Und das hatte sie auch. Sie blieb eine Woche in Bielefeld. Sie erzählte ihrer Mutter alles. Von Eldoria. Von Mira. Von der Krone. Von dem Nebel. Von dem Wächter. Ihre Mutter hörte zu und sagte am Ende: Deine Oma hat mir einmal gesagt, dass es Eldoria wirklich gibt. Ich habe ihr nicht geglaubt. Jetzt glaube ich dir. Lina umarmte ihre Mutter und sagte: Ich komme immer wieder. Versprochen. Ihre Mutter sagte: Das weiß ich. Und Eldoria kommt auch immer wieder zu uns. In deinen Geschichten. Lina nickte. Sie wusste, dass ihre Mutter recht hatte. Eldoria war jetzt ein Teil von ihr. Für immer. Und sie war ein Teil von Eldoria. Für immer. Als Lina am nächsten Morgen aufwachte, stand ihre Mutter in der Küche. In Eldoria. Lina traute ihren Augen nicht. Sie fragte: Mama, was machst du hier? Ihre Mutter sagte: Das Buch hat mich hergebracht. Ich habe es aufgeschlagen und an dich gedacht. Und plötzlich war ich hier. Lina umarmte ihre Mutter. Sie zeigte ihr Eldoria. Das Dorf. Den Wald. Die Wiese. Die zwei Monde. Ihre Mutter schaute sich alles an und sagte: Deine Oma hat mir immer von diesem Ort erzählt. Ich habe ihr nie geglaubt. Jetzt glaube ich ihr. Lina lächelte. Sie wusste, dass ihre Mutter jetzt verstand, warum ihre Großmutter so oft von Eldoria erzählt hatte. Warum sie immer gesagt hatte, dass es einen Ort gibt, an dem die Magie noch lebt. Sie gingen zusammen zu Mira. Mira freute sich, Linas Mutter kennenzulernen. Sie zeigte ihr das Dorf. Sie zeigte ihr den Wald. Sie zeigte ihr die Stelle, an der Lina angekommen war. Linas Mutter sagte: Hier ist es wunderschön. Lina sagte: Ja. Das ist es. Am Abend saßen sie alle zusammen am Feuer. Linas Mutter, Mira, der Wächter und Lina. Sie aßen Kuchen und erzählten sich Geschichten. Linas Mutter erzählte von Bielefeld. Von Lina als Kind. Von den Tagen, an denen Lina immer gesagt hatte, dass sie einmal ein Buch schreiben will. Mira erzählte von Eldoria. Von dem Nebel. Von Lina. Der Wächter erzählte von seiner Mutter. Von dem Apfelkuchen. Von der Wiese. Lina hörte zu und dachte: Das ist meine Familie. Nicht nur die Familie in Bielefeld. Auch die Familie in Eldoria. Und sie gehören alle zusammen. Als das Feuer fast ausgegangen war, sagte Linas Mutter: Ich muss morgen zurück nach Bielefeld. Aber ich komme wieder. Versprochen. Lina sagte: Ich weiß. Und ich komme auch wieder nach Bielefeld. Wir sehen uns in beiden Welten. Ihre Mutter nickte. Und Lina wusste: Das war das Schönste an allem. Dass sie nicht wählen musste. Dass sie in beiden Welten leben konnte. In Bielefeld und in Eldoria. Bei ihrer Mutter und bei Mira. Bei ihrer Familie und bei ihren Freunden. Überall. Lina packte ihre Tasche, legte das Buch ganz oben hinein und schrieb ihrer Mutter noch einen kurzen Zettel, auf dem stand, dass sie bald wiederkommen würde und dass sie sie lieb habe. Lina umarmte ihre Mutter ganz fest, weil sie wusste, dass ihre Mutter jetzt verstand, warum sie immer wieder nach Eldoria gehen musste, und dass sie sie nicht mehr aufhalten würde. Lina umarmte ihre Mutter und flüsterte ihr ins Ohr, dass sie sie lieb habe und dass sie immer wieder nach Hause kommen würde, egal, wo sie gerade war. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["13. Das Buch wird weitergegeben", "Eine Woche später ging Lina wieder nach Eldoria. Sie ging in den Keller, schlug das Buch auf und dachte an Eldoria. An Mira. An das Dorf. An den Wald. Und plötzlich war sie wieder da. Auf der Wiese. Vor dem Wald. Mira wartete schon. Sie rannte auf Lina zu und sagte: Du bist zurück! Lina sagte: Natürlich bin ich zurück. Ich habe es versprochen. Sie gingen zusammen ins Dorf. Die Menschen freuten sich, Lina zu sehen. Sie hatten ihr ein Haus gebaut. Ein kleines Haus am Ende der Straße. Mit einem Garten und einer Bank und einem Schild an der Tür, auf dem stand: Lina, Hüterin der Nebelkrone. Lina lachte, als sie das Schild sah. Ich bin keine Hüterin, sagte sie. Ich bin nur Lina. Mira sagte: Du bist beides. Und das ist gut so. Lina richtete sich in ihrem neuen Haus ein. Sie stellte das Buch auf einen Tisch. Sie hängte die Krone an die Wand. Nicht, weil sie sie nicht mehr brauchte. Sondern weil sie wusste, dass sie sie jederzeit wieder nehmen konnte, wenn der Nebel zurückkommen sollte. Sie begann, ein neues Buch zu schreiben. Nicht das alte Buch. Ein neues Buch. Darin schrieb sie alles auf, was sie erlebt hatte. Von Bielefeld. Von Eldoria. Von Mira. Von der Krone. Von dem Nebel. Von dem Wächter. Sie schrieb es auf, damit niemand es je wieder vergessen würde. Damit auch in hundert Jahren noch jemand wusste, dass es Eldoria gibt. Und dass es eine Frau gab, die den Nebel besiegt hat. Nicht, weil sie die Stärkste war. Sondern weil sie nicht aufgegeben hat. Als das Buch fertig war, legte sie es in eine Kiste. Auf die Kiste schrieb sie: Für das nächste Mädchen, das bereit ist. Sie stellte die Kiste in den Keller ihres Hauses in Eldoria. Und sie stellte eine zweite Kiste in den Keller ihres Elternhauses in Bielefeld. Damit das Buch in beiden Welten gefunden werden konnte. Von einem Mädchen, das neugierig war. Von einem Mädchen, das nicht aufgab. Von einem Mädchen wie Lina. Als sie fertig war, setzte sie sich auf die Bank vor ihrem Haus und schaute in den Himmel. Die zwei Monde waren zu sehen. Sie lächelte. Sie dachte an ihre Großmutter. An Mira. An den Wächter. An alle, die ihr geholfen hatten. Und sie dachte: Das ist mein Leben jetzt. Zwei Welten. Zwei Zuhause. Und ein Buch, das alles verbindet. Als Lina das neue Buch geschrieben hatte, legte sie es in die Kiste im Keller. Auf die Kiste schrieb sie: Für das nächste Mädchen, das bereit ist. Sie wusste nicht, wer das nächste Mädchen sein würde. Vielleicht Mira, wenn sie älter war. Vielleicht ein anderes Mädchen aus Bielefeld. Vielleicht ein Mädchen, das sie noch gar nicht kannte. Aber sie wusste, dass das Buch gefunden werden würde. So wie sie das alte Buch gefunden hatte. So wie ihre Großmutter das alte Buch gefunden hatte. Sie stellte die Kiste in den Keller und ging nach oben. Draußen wartete Mira. Sie hatte ein neues Buch in der Hand. Nicht das alte Buch. Ein Buch, das sie selbst geschrieben hatte. Darin stand: Die Geschichte von Lina und der Nebelkrone. Von Mira. Für alle, die es lesen wollen. Lina nahm das Buch und las die erste Seite. Darin stand: Es war einmal ein Mädchen aus Bielefeld, das ein Buch im Keller gefunden hat. Und das Buch hat ihr Leben verändert. Lina lächelte. Das war der Anfang. Genau der Anfang, den sie auch geschrieben hatte. Sie sagte zu Mira: Das ist eine gute Geschichte. Mira sagte: Das ist deine Geschichte. Und jetzt ist es auch meine Geschichte. Lina nickte. Ja, sagte sie. Jetzt ist es unsere Geschichte. Sie setzten sich zusammen auf die Bank und lasen das Buch. Seite für Seite. Bis es dunkel wurde. Bis die zwei Monde am Himmel standen. Bis alle anderen schon schliefen. Als sie fertig waren, klappte Mira das Buch zu und sagte: Morgen schreiben wir weiter. Lina sagte: Morgen schreiben wir weiter. Und sie wussten beide, dass sie das wirklich tun würden. Jeden Tag. Bis alle Geschichten erzählt waren. Bis der Nebel nie wieder zurückkommen konnte. Weil die Menschen sich erinnerten. Weil sie nicht mehr vergaßen. Weil Lina und Mira da waren. Die Hüterinnen der Nebelkrone. Die Mädchen aus zwei Welten. Die Freundinnen, die alles geschafft hatten. Zusammen. Lina stellte die Kiste mit dem neuen Buch vorsichtig in den Keller, schloss den Deckel und dachte daran, dass irgendwann ein anderes Mädchen diese Kiste finden würde und dass dann alles wieder von vorne anfangen würde. Lina legte das neue Buch in die Kiste, schloss den Deckel langsam und dachte daran, dass dieses Buch irgendwann von einem anderen Mädchen gefunden werden würde, das genau wie sie neugierig war. Lina schrieb den letzten Satz in ihr neues Buch, klappte es zu und wusste, dass dieses Buch eines Tages einem anderen Mädchen helfen würde, genau wie ihr geholfen wurde. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."], ["14. Zwei Monde", "Ein Jahr später saß Lina wieder auf der Wiese in Eldoria. Neben ihr saß Mira. Mira war jetzt neun Jahre alt. Sie hatte ein Buch in der Hand. Nicht das alte Buch. Ein neues Buch. Das Buch, das Lina geschrieben hatte. Sie las darin und sagte: Das ist die beste Geschichte, die ich je gelesen habe. Lina lachte. Das ist keine Geschichte, sagte sie. Das ist wirklich passiert. Mira sagte: Ich weiß. Ich war dabei. Sie lachten beide. Am Himmel standen die zwei Monde. Klar und hell. Lina dachte an alles, was passiert war. An den Keller in Bielefeld. An das Buch. An den Wald. An die Höhle. An den Turm. An den Nebelberg. An den Wächter. An das Fest. An den Abschied. An das neue Buch. Sie dachte: Vor einem Jahr stand ich im Keller und wusste nicht, was ich tun sollte. Jetzt sitze ich hier und weiß: Ich habe mein Zuhause gefunden. Nicht nur eines. Zwei. Sie stand auf und ging zum Dorf. Die Menschen grüßten sie. Kinder rannten ihr hinterher und riefen: Lina! Erzähl uns die Geschichte von der Nebelkrone! Lina setzte sich auf den Marktplatz und erzählte. Von Anfang an. Von dem Buch im Keller. Von Eldoria. Von Mira. Von der Krone. Von dem Nebel. Von dem Wächter. Die Kinder hörten zu. Die Erwachsenen hörten zu. Alle hörten zu. Als sie fertig war, war es dunkel geworden. Die zwei Monde leuchteten. Lina stand auf und ging nach Hause. In ihr Haus in Eldoria. Sie legte das Buch auf den Tisch. Sie hängte die Krone an die Wand. Sie setzte sich ans Fenster und schaute in den Himmel. Zwei Monde. Zwei Welten. Ein Leben. Sie lächelte. Und sie wusste: Das war nicht das Ende. Das war erst der Anfang. Denn es gab noch so viele Geschichten in Eldoria, die erzählt werden mussten. Und sie würde sie alle erzählen. Eine nach der anderen. Bis es keine stillen Häuser mehr gab. Bis alle Geschichten erzählt waren. Bis der Nebel nie wieder zurückkommen konnte. Weil die Menschen sich erinnerten. Weil sie nicht mehr vergaßen. Weil Lina da war. Die Hüterin der Nebelkrone. Das Mädchen aus Bielefeld. Das Mädchen, das nicht aufgegeben hatte. Ende. Ein Jahr später stand Lina wieder auf der Wiese in Eldoria. Neben ihr stand Mira. Mira war jetzt zehn Jahre alt. Sie trug eine kleine Krone aus Blumen im Haar. Nicht die Nebelkrone. Eine Blumenkrone. Weil sie sagte, dass sie auch einmal eine Krone tragen wollte. Lina lachte, als sie die Blumenkrone sah. Sie setzte sich ins Gras und schaute in den Himmel. Die zwei Monde standen da. Klar und hell. Sie dachte an alles, was passiert war. An den Keller. An das Buch. An den Wald. An die Höhle. An den Turm. An den Nebelberg. An den Wächter. An das Fest. An den Abschied. An das neue Buch. Sie dachte: Vor einem Jahr stand ich im Keller in Bielefeld und wusste nicht, was ich tun sollte. Jetzt stehe ich hier und weiß: Ich habe mein Zuhause gefunden. Nicht nur eines. Zwei. Sie stand auf und ging ins Dorf. Die Menschen grüßten sie. Kinder rannten ihr hinterher und riefen: Lina! Erzähl uns die Geschichte von der Nebelkrone! Lina setzte sich auf den Marktplatz und erzählte. Von Anfang an. Von dem Buch im Keller. Von Eldoria. Von Mira. Von der Krone. Von dem Nebel. Von dem Wächter. Die Kinder hörten zu. Die Erwachsenen hörten zu. Alle hörten zu. Als sie fertig war, war es dunkel geworden. Die zwei Monde leuchteten. Lina stand auf und ging nach Hause. In ihr Haus in Eldoria. Sie legte das Buch auf den Tisch. Sie hängte die Krone an die Wand. Sie setzte sich ans Fenster und schaute in den Himmel. Zwei Monde. Zwei Welten. Ein Leben. Sie lächelte. Und sie wusste: Das war nicht das Ende. Das war erst der Anfang. Denn es gab noch so viele Geschichten in Eldoria, die erzählt werden mussten. Und sie würde sie alle erzählen. Eine nach der anderen. Bis es keine stillen Häuser mehr gab. Bis alle Geschichten erzählt waren. Bis der Nebel nie wieder zurückkommen konnte. Weil die Menschen sich erinnerten. Weil Lina da war. Die Hüterin der Nebelkrone. Das Mädchen aus Bielefeld. Das Mädchen, das nicht aufgegeben hatte. Ende. Lina ging langsam nach Hause, setzte sich auf ihre Bank vor dem Haus und schaute noch einmal in den Himmel, wo die zwei Monde standen und ihr sagten, dass sie zu Hause war, in beiden Welten zugleich. Lina setzte sich auf die Wiese, schaute zu den zwei Monden hinauf und wusste, dass sie in diesem Moment genau da war, wo sie sein sollte, in Eldoria und in Bielefeld zugleich. Lina schaute zu den zwei Monden hinauf, lächelte und wusste, dass sie angekommen war, in Eldoria und in Bielefeld, in beiden Welten zugleich, für immer. Lina lächelte, weil sie wusste, dass sie auf dem richtigen Weg war und dass sie nicht mehr allein war."]], "kat": "Romane", "unter": "Fantasy"}, {"title": "Geld, das für dich arbeitet - Ohne reich zu sein", "chapters": [["Die Familie aus Bielefeld, die es geschafft hat", "Familie Berger wohnt in Bielefeld-Brackwede, in einer Drei-Zimmer-Wohnung mit 68 Quadratmetern. Er arbeitet als Lagerarbeiter im Schichtdienst und verdient netto 1.950 Euro, sie arbeitet halbtags in einer Kita und verdient 980 Euro. Dazu kommt Kindergeld für zwei Kinder: 500 Euro. Zusammen sind das 3.430 Euro im Monat. Vor zwei Jahren hatten sie am 20. des Monats immer fast nichts mehr auf dem Konto. Nicht, weil sie verschwenderisch waren. Sondern weil das Geld einfach weglief, ohne dass sie wussten, wohin. Im Januar 2024 haben sie angefangen, jeden Euro aufzuschreiben. Nicht in einer komplizierten App, sondern in einem einfachen Heft auf dem Küchentisch. Nach drei Monaten wussten sie: 412 Euro gingen für Lebensmittel weg, obwohl sie dachten, es wären 280. 187 Euro für Abos, die sie zum Teil gar nicht nutzten. 143 Euro für Essen unterwegs, Bäcker, Döner, Kaffee am Bahnhof. 96 Euro für Handyverträge, die längst zu teuer waren. Allein diese vier Posten waren 838 Euro. Als sie das schwarz auf weiß sahen, war das kein Vorwurf, sondern eine Erleichterung. Denn jetzt wussten sie, wo sie ansetzen konnten, ohne sich alles zu verbieten. Sie haben nicht angefangen, bei allem zu sparen. Sie haben bei drei Stellen angefangen: beim Einkaufen, bei den Abos und beim Essen unterwegs. Nach einem Jahr hatten sie 3.600 Euro auf einem Tagesgeldkonto. Das ist nicht viel, wenn man es mit Reichen vergleicht. Aber für diese Familie war es das erste Mal, dass sie einen Puffer hatten. Als im November die Waschmaschine kaputtging, mussten sie keinen Kredit aufnehmen. Sie haben die 379 Euro für eine neue Maschine vom Puffer bezahlt. Genau darum geht es in diesem Buch: nicht um Reichwerden über Nacht, sondern um einen Puffer, um Luft zum Atmen, und darum, dass dein Geld nicht einfach verschwindet. Wir gehen die gleichen Schritte wie Familie Berger, nur mit deinen Zahlen, deinem Haushalt und deinem Leben. Was Familie Berger danach noch gelernt hat, war, dass ein Puffer nicht nur Geld ist, sondern auch Zeit. Als ihr Sohn im März krank wurde und sie drei Tage zu Hause bleiben musste, hat sie keinen Urlaubstag opfern müssen, weil sie wusste, dass der Puffer da war und dass sie die 90 Euro für Medikamente bezahlen konnte, ohne zu rechnen. Vorher hätte sie in solchen Wochen den Dispo genutzt, der 11 Prozent Zinsen kostet. Ein Dispo von 500 Euro kostet im Jahr 55 Euro Zinsen, und wenn man ihn ein Jahr lang nutzt, sind es 55 Euro für nichts. Das ist mehr als ein Monat Spotify, Netflix und Handyversicherung zusammen. Deshalb haben sie den Dispo auf 0 setzen lassen. Nicht, weil sie ihn nie brauchen würden, sondern weil sie ihn nicht mehr brauchen wollen. Sie haben auch gelernt, dass man über Geld reden muss, auch wenn es unangenehm ist. Am Anfang haben sie sich gestritten, weil er meinte, sie gebe zu viel für die Kinder aus, und sie meinte, er gebe zu viel für sein Auto aus. Als sie die Zahlen auf dem Tisch hatten, war der Streit vorbei. Es war nicht mehr seine Schuld oder ihre Schuld, es waren Zahlen. 120 Euro für das Auto, 140 Euro für die Kinder. Beide hatten recht und beide hatten unrecht. Seitdem machen sie einmal im Monat einen Geld-Abend: 20 Minuten, ein Glas Wasser, das Heft auf dem Tisch. Kein Vorwurf, nur Zahlen. Das hat ihre Beziehung besser gemacht als jeder Urlaub. Und sie haben gelernt, dass Sparen nicht heißt, sich nichts zu gönnen. Sie gönnen sich einmal im Monat ein Essen beim Italiener für 45 Euro. Das steht im Plan. Es ist kein Ausrutscher, es ist geplant. Und weil es geplant ist, macht es Freude statt schlechtem Gewissen. Was dabei am wichtigsten war, war nicht die Zahl auf dem Konto, sondern das Gefühl, dass sie es selbst in der Hand hatten. Vorher hatten sie das Gefühl, dass das Geld sie kontrollierte. Nachher hatten sie das Gefühl, dass sie das Geld kontrollierten. Das ist der Unterschied, den kein Betrag auf dem Konto messen kann. Und genau dieses Gefühl wünsche ich dir, wenn du dieses Buch liest.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein drittes Beispiel aus dem Alltag von Familie Berger zeigt, wie viel kleine Entscheidungen ausmachen: Sie haben früher jeden Samstag beim Bäcker Croissants und Kuchen für 14 Euro gekauft, weil es Samstag war und weil sie sich etwas gönnen wollten. Heute backen sie samstags selbst Pfannkuchen für 2 Euro. Die Kinder helfen mit, es riecht in der ganzen Wohnung nach Pfannkuchen, und sie haben 12 Euro gespart. Das ist kein Verzicht, das ist ein neues Ritual, das ihnen mehr Freude macht als der Bäcker. Und sie haben gelernt, dass man sich auch ohne Geld etwas gönnen kann: Ein Spaziergang an der Sparrenburg kostet nichts, ein Picknick im Park kostet fast nichts, ein Spieleabend zu Hause kostet nichts. Früher haben sie gedacht, Freude kostet Geld. Heute wissen sie, dass die besten Dinge fast nichts kosten. Sie haben auch gelernt, dass man über Geld sprechen muss, ohne sich zu schämen. Früher haben sie nie über Geld gesprochen, weil sie dachten, das sei peinlich. Heute sprechen sie offen darüber, weil sie wissen, dass fast jeder das gleiche Problem hat. Und wenn man darüber spricht, findet man Lösungen, die man allein nie gefunden hätte.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Warum dein Geld am 20. weg ist, obwohl du gar nichts gekauft hast", "Die meisten Menschen glauben, ihr Geld verschwindet durch große Ausgaben. In Wahrheit sind es fast immer die kleinen, unsichtbaren Ausgaben. Schau dir einmal einen normalen Monat an. Du gehst einkaufen und zahlst 68 Euro. Du denkst, das war der Wocheneinkauf. In Wahrheit waren da 12 Euro für Süßigkeiten dabei, die nicht auf der Liste standen, 9 Euro für ein Fertiggericht, weil du keine Lust zu kochen hattest, und 7 Euro für Getränke, die du auch zu Hause hättest. Das sind 28 Euro, die du nicht geplant hast, und das passiert fast jedes Mal. Dazu kommen Abbuchungen, die du gar nicht mehr bemerkst: Spotify 10,99 Euro, Netflix 13,99 Euro, Amazon Prime 8,99 Euro, eine Fitness-App 14,99 Euro, iCloud 2,99 Euro, eine Zeitschrift 6,90 Euro. Zusammen sind das 58,85 Euro im Monat, also 706 Euro im Jahr. Wenn du drei davon nicht nutzt, sind das über 400 Euro im Jahr für nichts. Der zweite unsichtbare Posten ist das Essen unterwegs. Ein Kaffee für 3,80 Euro am Bahnhof, ein Brötchen für 2,40 Euro, ein Döner für 7,50 Euro, weil du zu spät dran warst. An fünf Tagen in der Woche sind das schnell 60 bis 80 Euro. Im Monat also 240 bis 320 Euro. Das ist mehr als viele für Strom und Internet zusammen zahlen. Der dritte Posten ist das, was ich Spontan-Käufe nenne: eine neue Handyhülle für 19 Euro, weil die alte nicht mehr schön aussah, ein T-Shirt im Angebot für 14 Euro, ein Spielzeug für 12 Euro, weil das Kind im Supermarkt geweint hat. Einzeln sieht das alles harmlos aus. Zusammen sind es 150 bis 250 Euro im Monat. Rechne das einmal für dich selbst zusammen: Nimm deinen Kontoauszug vom letzten Monat und markiere mit einem Stift alle Ausgaben unter 20 Euro. Du wirst erschrecken, wie viele das sind. Genau da liegt dein Geld. Nicht bei der Miete, nicht bei den Versicherungen. Bei den kleinen Beträgen, die du nicht mehr wahrnimmst. Ein Beispiel, das viele kennen: Du gehst tanken und kaufst an der Tankstelle noch einen Kaffee und ein Brötchen. Der Kaffee kostet 3,90 Euro, das Brötchen 2,10 Euro. Zusammen 6 Euro. Das machst du dreimal pro Woche, weil du auf dem Weg zur Arbeit an der Tankstelle vorbeikommst. Das sind 72 Euro im Monat, 864 Euro im Jahr. Für Kaffee und Brötchen an der Tankstelle. Wenn du dir stattdessen zu Hause einen Kaffee in eine Thermoskanne machst und ein Brot schmieren würdest, kostet dich das vielleicht 0,80 Euro pro Tag, also 9,60 Euro im Monat. Der Unterschied sind 62 Euro im Monat. Das ist kein Verzicht, das ist eine Entscheidung. Familie Berger hat genau das gemacht. Sie haben eine Thermoskanne für 14 Euro gekauft und Brot abends vorbereitet. Am Anfang war es ungewohnt. Nach zwei Wochen war es normal. Nach einem Monat haben sie es gar nicht mehr gemerkt. Ein zweites Beispiel: Online-Shopping nach 22 Uhr. Wenn du müde bist, kaufst du mehr und unüberlegter. Familie Berger hat sich eine Regel gesetzt: Nach 21 Uhr wird nichts mehr gekauft. Wenn sie etwas wollen, schreiben sie es auf eine Liste und schauen am nächsten Morgen noch einmal. In 8 von 10 Fällen kaufen sie es dann nicht mehr. Das hat ihnen im Schnitt 90 Euro im Monat gespart. Nicht, weil sie disziplinierter geworden sind, sondern weil sie eine Regel haben, die sie vor sich selbst schützt. Und das ist der wichtigste Punkt: Du musst nicht diszipliniert sein. Du brauchst Regeln, die dich schützen, wenn du müde bist. Wenn du das für dich selbst ausrechnest, dann nimm dir wirklich einen Abend Zeit, setz dich mit deinem Kontoauszug hin und markiere alles, was unter 20 Euro war. Du wirst sehen, dass es mehr ist, als du gedacht hast. Und du wirst sehen, dass du schon mit einer einzigen Änderung, zum Beispiel mit der Thermoskanne statt Tankstellen-Kaffee, 60 Euro im Monat sparen kannst. Das ist kein kleiner Betrag, das ist ein Anfang.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein viertes Beispiel, das viele unterschätzen, ist das Mittagessen in der Kantine oder im Imbiss. Familie Berger hat ausgerechnet, dass er früher fünfmal pro Woche in der Kantine gegessen hat, für 7,50 Euro pro Mahlzeit. Das sind 150 Euro im Monat. Heute nimmt er dreimal pro Woche Essen von zu Hause mit, das sie am Abend vorher gekocht haben. Das kostet etwa 2 Euro pro Portion. Er spart also 5,50 Euro pro Mahlzeit, dreimal pro Woche, also 66 Euro im Monat. Und er isst besser, weil er weiß, was drin ist. Das ist kein Verzicht, das ist Meal-Prep, wie es heute so schön heißt. Früher hieß es einfach: Reste mitnehmen. Und es funktioniert. Ein weiteres Beispiel ist das Handy: Viele Menschen zahlen für Daten, die sie gar nicht verbrauchen, weil sie Angst haben, dass das Internet nicht reicht. Familie Berger hat drei Monate lang ihren Verbrauch in der App nachgeschaut und gesehen, dass sie nie mehr als 5 Gigabyte verbrauchen. Sie haben ihren Tarif von 20 Gigabyte auf 6 Gigabyte gewechselt und sparen 15 Euro im Monat. Das ist kein Verzicht, das ist Anpassung an den echten Verbrauch. Schau dir deinen Verbrauch an, nicht den Tarif, den dir der Verkäufer empfohlen hat.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Dein echtes Haushaltsbuch - ohne App, ohne Stress", "Ein Haushaltsbuch muss nicht perfekt sein. Es muss nur ehrlich sein. Familie Berger hat ein Schulheft genommen und jede Seite in drei Spalten geteilt: Datum, was, wie viel. Mehr nicht. Am Abend, wenn die Kinder im Bett waren, haben sie 5 Minuten gebraucht, um die Kassenbons einzutragen. Wenn es keinen Bon gab, haben sie es aus dem Gedächtnis eingetragen. Nach einer Woche hatten sie schon ein Muster: Montags gaben sie am meisten aus, weil sie nach dem Wochenende groß einkauften. Donnerstags gaben sie am wenigsten aus, weil der Kühlschrank leer war und sie Reste aßen. Nach einem Monat hatten sie vier Kategorien, die immer wieder auftauchten: Wohnen, Essen, Unterwegs, Sonstiges. Wohnen war fest: Miete, Strom, Internet, Handy. Essen war variabel: Supermarkt, Bäcker, Markt. Unterwegs war der heimliche Posten: Bäcker, Döner, Kaffee. Sonstiges war alles andere: Kleidung, Geschenke, Apotheke, Friseur. Der Trick war nicht, jede Ausgabe zu kontrollieren. Der Trick war, einmal im Monat zu schauen, welche Kategorie gewachsen war. Im Februar war es Unterwegs, weil es kalt war und sie öfter drinnen etwas Warmes gekauft hatten. Im März war es Sonstiges, weil ein Kindergeburtstag anstand. Das ist normal. Ein Haushaltsbuch ist kein Gericht, das dich verurteilt. Es ist ein Spiegel. Und wenn du den Spiegel einmal im Monat anschaust, siehst du, was du ändern willst. Wichtig ist: Schreibe es von Hand. Studien zeigen, dass Menschen, die von Hand schreiben, sich besser erinnern, wofür sie Geld ausgegeben haben. Eine App, die automatisch alles kategorisiert, macht dich passiv. Ein Heft macht dich aktiv. Wenn du lieber digital arbeitest, nimm eine einfache Tabelle mit drei Spalten. Aber trage es selbst ein, jeden Abend, 5 Minuten. Nach drei Monaten brauchst du es nicht mehr jeden Tag. Dann reicht einmal pro Woche, weil du dein Muster schon kennst. Ein häufiger Fehler ist, das Haushaltsbuch nach einer Woche aufzugeben, weil man einen Tag vergessen hat. Familie Berger hat auch Tage vergessen. Im ersten Monat haben sie 6 Tage vergessen. Das ist normal. Sie haben einfach am nächsten Tag weitergemacht, ohne von vorne anzufangen. Ein Haushaltsbuch, das 25 von 30 Tagen geführt wird, ist besser als gar kein Haushaltsbuch. Ein zweiter Fehler ist, zu viele Kategorien zu machen. Manche Leute machen 20 Kategorien und verlieren die Lust. Familie Berger hat nur vier Kategorien. Das reicht. Wenn du mehr willst, kannst du nach drei Monaten eine fünfte Kategorie hinzufügen, zum Beispiel Kinder oder Auto. Aber fang mit vier an. Ein dritter Fehler ist, das Haushaltsbuch zu führen, aber nie anzuschauen. Das ist, als würdest du ein Foto machen und es nie anschauen. Nimm dir am letzten Sonntag im Monat 20 Minuten Zeit und schau dir das Heft an. Rechne zusammen, wie viel du in jeder Kategorie ausgegeben hast. Schreibe die vier Zahlen auf ein Blatt und vergleiche sie mit dem Vormonat. Ist eine Zahl stark gestiegen? Warum? War es ein Geburtstag, eine Reparatur, ein Urlaub? Oder war es einfach Gewohnheit? Wenn es Gewohnheit war, dann ist das dein Ansatzpunkt für nächsten Monat. Nicht mit Vorwürfen, sondern mit einer Frage: Was will ich nächsten Monat anders machen? Eine Sache reicht. Nicht fünf. Eine. Ein Haushaltsbuch ist kein Zwang, sondern ein Werkzeug. Wenn du es einen Monat lang geführt hast, wirst du es nicht mehr als Last empfinden, sondern als Hilfe. Du wirst wissen, wo dein Geld hingeht, und du wirst dich nicht mehr wundern, warum am 20. nichts mehr da ist. Das ist der Moment, in dem sich alles ändert, weil du es zum ersten Mal wirklich siehst.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein vierter Fehler, den viele machen, ist, das Haushaltsbuch zu führen, aber es nie mit dem Partner zu teilen. Wenn nur einer das Haushaltsbuch führt, dann fühlt sich der andere kontrolliert. Familie Berger führt das Haushaltsbuch gemeinsam. Jeder trägt seine Ausgaben ein, und am Monatsende schauen sie es sich gemeinsam an. Das ist kein Kontrollieren, das ist Teamarbeit. Sie haben auch gelernt, dass man sich nicht für Ausgaben schämen muss. Wenn er sich einmal ein Angelbuch für 18 Euro gekauft hat, dann steht das im Heft, und sie sagt nicht: Warum hast du das gekauft? Sie sagt: War es dir die 18 Euro wert? Wenn er Ja sagt, dann ist es in Ordnung. Denn Geld ist nicht nur für Notwendiges da, es ist auch für Freude da. Der Unterschied ist, dass man weiß, wofür man es ausgegeben hat. Und das ist der Punkt: Ein Haushaltsbuch macht dich nicht zum Geizhals. Es macht dich ehrlich. Und Ehrlichkeit ist der Anfang von allem, was sich verändern soll. Wenn du ehrlich weißt, wo dein Geld hingeht, dann kannst du entscheiden, ob du das so willst oder ob du etwas ändern willst. Ohne Ehrlichkeit gibt es keine Veränderung.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Das 3-Konten-Modell, das wirklich funktioniert", "Das 3-Konten-Modell ist kein Trick aus einem Finanzbuch. Es ist eine Methode, die Familie Berger bis heute nutzt, weil sie einfach ist. Konto 1 ist das Fixkosten-Konto. Darauf geht der Lohn ein, und davon gehen alle festen Kosten ab: Miete, Strom, Internet, Handy, Versicherungen, Abos, Kindergartenbeitrag. Konto 2 ist das Lebenskonto. Darauf überweist du einmal im Monat einen festen Betrag für Lebensmittel, Tanken, Drogerie und alles, was du zum Leben brauchst. Konto 3 ist das Puffer-Konto, ein Tagesgeldkonto, auf das du am Monatsanfang einen festen Betrag überweist, bevor du etwas anderes ausgibst. Bei Familie Berger sah das so aus: 3.430 Euro kamen auf Konto 1. Davon gingen 1.890 Euro für feste Kosten ab. 1.000 Euro gingen auf Konto 2 für Lebensmittel und Alltag. 300 Euro gingen sofort auf Konto 3. 240 Euro blieben auf Konto 1 als Rest für Unvorhergesehenes. Der entscheidende Punkt ist die Reihenfolge: Der Puffer wird zuerst überwiesen, nicht am Ende des Monats, wenn noch etwas übrig ist. Denn am Ende des Monats ist nie etwas übrig. Wenn du erst am Ende sparst, sparst du nichts. Wenn du am Anfang sparst, passt du dein Leben automatisch an das an, was übrig ist. Viele fragen: Was, wenn ich nur 2.000 Euro habe? Dann funktioniert das Modell trotzdem, nur mit kleineren Beträgen. Dann sind es vielleicht 50 Euro für den Puffer, nicht 300. Aber 50 Euro mal 12 Monate sind 600 Euro. Das ist ein Puffer für eine kaputte Waschmaschine, für eine Autoreparatur, für eine Zahnarztrechnung. Und das ist der Unterschied zwischen Panik und Ruhe. Wichtig ist auch: Konto 3 darfst du nicht mit einer Karte im Portemonnaie haben. Es muss ein Konto sein, bei dem du erst nachdenken musst, bevor du Geld abhebst. Sonst ist es kein Puffer, sondern ein zweites Girokonto. Viele fragen, ob man das 3-Konten-Modell auch mit einem Gemeinschaftskonto und einem eigenen Konto kombinieren kann. Ja, das geht. Familie Berger hat ein Gemeinschaftskonto für Fixkosten und Lebensmittel, und jeder hat noch ein eigenes Taschengeld-Konto mit 80 Euro im Monat. Das Taschengeld ist wichtig, weil es Streit verhindert. Er kauft sich davon seine Angelköder, sie kauft sich davon ihre Bücher. Niemand muss sich dafür rechtfertigen. Das Taschengeld ist kein Luxus, es ist Freiheit in einer Beziehung. Ohne Taschengeld fühlt man sich wie ein Kind, das um Erlaubnis fragen muss. Mit Taschengeld kann jeder selbst entscheiden. Ein zweites Thema ist: Was mache ich, wenn mein Lohn unregelmäßig ist? Wenn du Schichtzulagen hast oder Trinkgeld bekommst, dann nimm den niedrigsten Lohn der letzten sechs Monate als Basis für dein 3-Konten-Modell. Alles, was darüber liegt, geht direkt auf den Puffer. So hast du in schlechten Monaten trotzdem genug, und in guten Monaten wächst der Puffer schneller. Und was ist mit Weihnachtsgeld oder Urlaubsgeld? Familie Berger hat sich eine Regel gesetzt: Die Hälfte vom Weihnachtsgeld geht auf den Puffer, die andere Hälfte darf ausgegeben werden. So haben sie etwas von dem Geld, aber sie verprassen es nicht. Das ist kein Verzicht, das ist eine Aufteilung, die sich gut anfühlt. Das 3-Konten-Modell funktioniert nur, wenn du es wirklich einrichtest und nicht nur darüber liest. Geh heute noch in deine Banking-App und richte einen Dauerauftrag ein: Am 1. des Monats geht der Puffer-Betrag automatisch weg. Wenn du das einmal gemacht hast, musst du nicht mehr darüber nachdenken. Das Geld geht weg, bevor du es ausgeben kannst. So einfach ist es.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran,
