 dann schauen wir, ob wir dir ein neues Handy kaufen können. Seine Tochter hat gesagt: Okay, Papa, das verstehe ich. Sie war nicht sauer. Sie hat verstanden, dass ihr Papa gerade ein Problem löst und dass sie ihm dabei helfen kann, indem sie nicht immer etwas Neues will. Das hat Markus gezeigt, dass Kinder viel mehr verstehen, als man denkt, wenn man ehrlich zu ihnen ist. Kinder merken sowieso, wenn etwas nicht stimmt. Wenn man es ihnen nicht sagt, dann machen sie sich Sorgen, ohne zu wissen, warum. Wenn man es ihnen sagt, dann wissen sie, warum, und sie können helfen, indem sie weniger fordern. Das ist besser, als sie im Unklaren zu lassen. Ein weiterer Punkt zu Schulden und Familie ist, dass man auch mit seinem Partner über Schulden sprechen muss, nicht nur mit seinen Kindern. Markus hat lange nicht mit seiner Frau über seine Schulden gesprochen, weil er sich geschämt hat. Er hat gedacht, sie würde ihn verlassen, wenn sie wüsste, wie viele Schulden er hat. Als er es ihr dann doch gesagt hat, hat sie gesagt: Warum hast du mir das nicht früher gesagt? Wir hätten das gemeinsam lösen können. Das war eine Erleichterung für Markus, weil er gemerkt hat, dass seine Frau ihn nicht verlassen wird, weil er Schulden hat. Sie will ihm helfen, sie zu lösen. Seitdem sprechen Markus und seine Frau jeden Monat über ihr Geld. Sie schauen sich an, wie viel sie eingenommen haben, wie viel sie ausgegeben haben, und wie viel sie für ihre Schulden bezahlt haben. Das ist kein Streit, das ist ein Gespräch. Und es hat ihre Beziehung besser gemacht, weil sie jetzt ehrlich zueinander sind. Früher hat Markus sich versteckt, wenn er Post bekommen hat. Heute öffnet er die Post gemeinsam mit seiner Frau. Früher hat er Angst gehabt, wenn sein Telefon geklingelt hat. Heute nimmt er das Telefon gemeinsam mit seiner Frau ab. Das ist der Unterschied zwischen Verstecken und Ehrlichkeit. Verstecken macht einsam. Ehrlichkeit macht stark, weil man nicht mehr allein ist. Markus ist heute nicht mehr allein mit seinen Schulden. Er hat seine Frau an seiner Seite, und gemeinsam lösen sie das Problem. Deine Kinder merken sowieso, wenn etwas nicht stimmt. Wenn du es ihnen nicht sagst, dann machen sie sich Sorgen, ohne zu wissen, warum. Wenn du es ihnen sagst, dann wissen sie, warum, und sie können helfen, indem sie weniger fordern. Sag deinen Kindern ehrlich, dass du Schulden hast, ohne dich zu schämen. Sie werden dich nicht weniger lieben, weil du Schulden hast. Sie werden dich sogar mehr lieben, weil du ehrlich zu ihnen warst.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Inkasso und Mahnbescheid - was wirklich passiert, wenn du nicht zahlst", "Markus hat einmal einen Brief von einem Inkassounternehmen bekommen. Er hatte Angst. Er dachte, jetzt kommt die Polizei und nimmt ihm alles weg. In Wahrheit ist ein Inkassounternehmen nur eine Firma, die im Auftrag eines Gläubigers Geld eintreibt. Sie darf dich anrufen, sie darf dir Briefe schreiben, sie darf dich auffordern, zu zahlen. Sie darf dir aber nicht drohen, sie darf nicht zu dir nach Hause kommen und dir etwas wegnehmen, und sie darf dir keine Angst machen. Wenn du einen Brief von einem Inkassounternehmen bekommst, dann ruf an und sag, dass du zahlen willst, aber dass du im Moment nicht so viel zahlen kannst. Frag, ob du in Raten zahlen kannst. Die meisten Inkassounternehmen sind damit einverstanden, weil sie lieber kleine Raten bekommen als gar nichts. Wenn du einen Mahnbescheid bekommst, das ist ein gelber Brief vom Amtsgericht, dann ignoriere ihn nicht. Du hast 14 Tage Zeit, um zu widersprechen. Wenn du nicht widersprichst, dann wird der Mahnbescheid rechtskräftig und der Gläubiger kann dein Konto pfänden lassen. Wenn du widersprichst, dann muss der Gläubiger vor Gericht gehen, um sein Geld zu bekommen. Das dauert lange und kostet ihn Geld. Deshalb ist es wichtig, dass du auf einen Mahnbescheid reagierst, auch wenn du nur schreibst: Ich widerspreche dem Mahnbescheid. Das reicht. Du musst dich nicht rechtfertigen. Du musst nur widersprechen, innerhalb von 14 Tagen. Markus hat einen Mahnbescheid bekommen und hat widersprochen. Der Gläubiger hat daraufhin angerufen und hat einer Ratenzahlung zugestimmt. Das war besser, als wenn Markus den Mahnbescheid ignoriert hätte und sein Konto gepfändet worden wäre. Ein Beispiel, das zeigt, was wirklich passiert, wenn man einen Mahnbescheid bekommt: Markus hat einen gelben Brief vom Amtsgericht bekommen. Er hatte Angst. Er dachte, jetzt kommt die Polizei und nimmt ihm alles weg. In Wahrheit war der Mahnbescheid nur ein Brief, in dem stand, dass ein Gläubiger Geld von ihm will und dass er 14 Tage Zeit hat, um zu widersprechen. Markus hat widersprochen, indem er auf den Brief geschrieben hat: Ich widerspreche dem Mahnbescheid. Das hat er per Einschreiben zurückgeschickt. Der Gläubiger hat daraufhin angerufen und hat einer Ratenzahlung zugestimmt. Das war besser, als wenn Markus den Mahnbescheid ignoriert hätte. Wenn er ihn ignoriert hätte, dann wäre der Mahnbescheid nach 14 Tagen rechtskräftig geworden und der Gläubiger hätte sein Konto pfänden lassen können. Das heißt, die Bank hätte sein Konto gesperrt und das Geld, das darauf war, an den Gläubiger überwiesen. Das wäre schlimm gewesen, weil Markus dann kein Geld mehr für Miete und Essen gehabt hätte. Deshalb ist es so wichtig, dass man auf einen Mahnbescheid reagiert, auch wenn man nur schreibt: Ich widerspreche. Das reicht. Man muss sich nicht rechtfertigen. Man muss nur widersprechen, innerhalb von 14 Tagen. Und man sollte den Brief per Einschreiben zurückschicken, damit man einen Beweis hat, dass man widersprochen hat. Das hat Markus gelernt, und es hat ihm geholfen, dass sein Konto nicht gepfändet wurde. Ein weiterer Punkt zu Inkasso ist, dass man keine Angst haben muss, wenn man einen Brief von einem Inkassounternehmen bekommt. Ein Inkassounternehmen ist nur eine Firma, die im Auftrag eines Gläubigers Geld eintreibt. Sie darf dich anrufen, sie darf dir Briefe schreiben, sie darf dich auffordern, zu zahlen. Sie darf dir aber nicht drohen, sie darf nicht zu dir nach Hause kommen und dir etwas wegnehmen, und sie darf dir keine Angst machen. Wenn du einen Brief von einem Inkassounternehmen bekommst, dann ruf an und sag, dass du zahlen willst, aber dass du im Moment nicht so viel zahlen kannst. Frag, ob du in Raten zahlen kannst. Die meisten Inkassounternehmen sind damit einverstanden, weil sie lieber kleine Raten bekommen als gar nichts. Und: Du musst nicht alle Forderungen bezahlen, die ein Inkassounternehmen von dir will. Manche Inkassounternehmen verlangen Gebühren, die viel zu hoch sind. Lass dir die Forderung genau aufschlüsseln und prüfe, ob sie stimmt. Wenn du dir nicht sicher bist, dann geh zur Verbraucherzentrale oder zur Schuldenberatung und lass sie prüfen. Das ist kostenlos und es hilft dir, weil du dann nicht mehr bezahlst, als du wirklich musst. Markus hat das gemacht. Er hat eine Forderung von einem Inkassounternehmen prüfen lassen und hat gemerkt, dass die Gebühren zu hoch waren. Er hat nur die Hälfte zahlen müssen. Das hat ihm 300 Euro gespart. Das ist Geld, das er für seine Schulden nutzen konnte. Ein Inkassobrief ist kein Weltuntergang. Ein Mahnbescheid ist kein Weltuntergang. Es sind Briefe, auf die man reagieren muss, aber man muss keine Angst vor ihnen haben. Wenn du einen Mahnbescheid bekommst, dann widersprich innerhalb von 14 Tagen. Das reicht. Du musst dich nicht rechtfertigen. Du musst nur widersprechen. Und wenn du einen Inkassobrief bekommst, dann ruf an und sag, dass du zahlen willst, aber dass du im Moment nicht so viel zahlen kannst. Das ist alles.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Schuldenberatung - wann du dir Hilfe holen solltest, ohne Scham", "Markus hat sich nach einem Jahr entschieden, zur Schuldenberatung zu gehen. Er hatte Angst davor, weil er dachte, die Leute dort würden ihn auslachen oder ihm sagen, dass er selbst schuld sei. In Wahrheit waren die Leute dort sehr nett. Sie haben ihm zugehört, ohne ihn zu verurteilen. Sie haben sich seine Schulden angeschaut und haben ihm einen Plan gemacht, wie er sie abbezahlen kann. Sie haben auch mit seinen Gläubigern gesprochen und haben erreicht, dass die Zinsen gestoppt werden und dass er nur noch 200 Euro im Monat zahlen muss, statt 350 Euro. Das hat ihm geholfen, weil er jetzt weniger zahlen muss und trotzdem seine Schulden abbezahlt. Schuldenberatung ist kostenlos, wenn du zu einer gemeinnützigen Schuldenberatung gehst, zum Beispiel bei der Caritas, bei der Diakonie, oder bei der Verbraucherzentrale. Du musst dich nicht schämen, wenn du zur Schuldenberatung gehst. Die Leute dort haben schon tausende Menschen gesehen, die Schulden haben. Du bist nicht der Erste und nicht der Letzte. Und: Schuldenberatung ist kein Zeichen von Versagen, sondern von Stärke, weil man erkennt, dass man Hilfe braucht und sich Hilfe holt. Markus hat sich erst nach einem Jahr zur Schuldenberatung getraut, weil er sich geschämt hat. Er sagt heute: Ich wünschte, ich wäre gleich am Anfang zur Schuldenberatung gegangen. Dann hätte ich mir ein Jahr Stress gespart. Wenn du Schulden hast und nicht mehr weiterweißt, dann geh zur Schuldenberatung. Es ist kostenlos, es ist ohne Vorwürfe, und es hilft dir wirklich. Du kannst auch anonym anrufen, wenn du dich noch nicht traust, hinzugehen. Die Nummer findest du im Internet, wenn du nach Schuldenberatung in deiner Stadt suchst. Ein Beispiel, das zeigt, wie Schuldenberatung wirklich abläuft: Markus ist zur Schuldenberatung bei der Caritas gegangen. Er war nervös. Er dachte, die Leute dort würden ihn auslachen. In Wahrheit hat ihn eine Frau empfangen, die gesagt hat: Guten Tag, Herr Markus, schön, dass Sie da sind. Setzen Sie sich, erzählen Sie mir, was los ist. Markus hat erzählt, dass er 14.800 Euro Schulden hat und dass er nicht mehr weiterweiß. Die Frau hat nicht gesagt: Sie sind selbst schuld. Sie hat gesagt: Das ist ein Problem, das wir gemeinsam lösen können. Sie hat sich seine Schulden angeschaut, sie hat einen Plan gemacht, und sie hat mit seinen Gläubigern gesprochen. Sie hat erreicht, dass die Zinsen gestoppt werden und dass er nur noch 200 Euro im Monat zahlen muss, statt 350 Euro. Das hat ihm geholfen, weil er jetzt weniger zahlen muss und trotzdem seine Schulden abbezahlt. Und sie hat ihm gesagt, dass er sich nicht schämen muss, weil sie schon tausende Menschen gesehen hat, die Schulden haben. Das war eine Erleichterung für Markus, weil er gemerkt hat, dass er nicht allein ist. Schuldenberatung ist kostenlos, wenn man zu einer gemeinnützigen Schuldenberatung geht. Man muss sich nicht schämen, wenn man dort hingeht. Die Leute dort helfen einem wirklich, ohne Vorwürfe, ohne zu verurteilen. Das ist der Punkt: Schuldenberatung ist kein Zeichen von Versagen, sondern von Stärke, weil man erkennt, dass man Hilfe braucht und sich Hilfe holt. Ein weiterer Punkt zu Schuldenberatung ist, dass man nicht warten sollte, bis es zu spät ist. Markus hat ein Jahr gewartet, bis er zur Schuldenberatung gegangen ist, weil er sich geschämt hat. Er sagt heute: Ich wünschte, ich wäre gleich am Anfang zur Schuldenberatung gegangen. Dann hätte ich mir ein Jahr Stress gespart. Wenn du Schulden hast und nicht mehr weiterweißt, dann geh zur Schuldenberatung. Es ist kostenlos, es ist ohne Vorwürfe, und es hilft dir wirklich. Du kannst auch anonym anrufen, wenn du dich noch nicht traust, hinzugehen. Die Nummer findest du im Internet, wenn du nach Schuldenberatung in deiner Stadt suchst. Und: Schuldenberatung ist nicht nur für Menschen, die gar kein Geld mehr haben. Sie ist auch für Menschen, die noch Geld haben, aber nicht wissen, wie sie ihre Schulden abbezahlen sollen. Markus hatte noch Geld, aber er wusste nicht, wie er seine Schulden abbezahlen soll. Die Schuldenberatung hat ihm einen Plan gemacht, und sie hat mit seinen Gläubigern gesprochen. Das hat ihm geholfen, weil er jetzt weniger zahlen muss und trotzdem seine Schulden abbezahlt. Das ist der Punkt: Man muss nicht erst am Boden sein, um zur Schuldenberatung zu gehen. Man kann auch hingehen, wenn man noch steht, aber nicht weiß, wie man weitergehen soll. Die Schuldenberatung hilft einem, den Weg zu finden. Schuldenberatung ist kostenlos, wenn du zu einer gemeinnützigen Schuldenberatung gehst. Du musst dich nicht schämen, wenn du dort hingehst. Die Leute dort haben schon tausende Menschen gesehen, die Schulden haben. Du bist nicht der Erste und nicht der Letzte. Und Schuldenberatung ist kein Zeichen von Versagen, sondern von Stärke, weil man erkennt, dass man Hilfe braucht und sich Hilfe holt. Geh zur Schuldenberatung, wenn du nicht mehr weiterweißt. Es hilft dir wirklich.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Markus 2 Jahre später - was sich wirklich verändert hat", "Markus hat jetzt seit 2 Jahren seine Schulden abbezahlt. Er hatte 14.800 Euro Schulden. Heute hat er noch 3.200 Euro Schulden, nur noch den Ratenkredit für das Auto. Seine Kreditkarte ist weg, sein Dispo ist weg, die Schuld bei seinem Bruder ist weg. Er hat 11.600 Euro Schulden abbezahlt in 2 Jahren. Das ist viel. Er hat es geschafft, indem er jeden Monat 350 Euro für seine Schulden bezahlt hat, indem er seine Ausgaben reduziert hat, indem er Dinge verkauft hat, die er nicht mehr braucht, und indem er zur Schuldenberatung gegangen ist. Aber das Wichtigste ist nicht das Geld. Das Wichtigste ist, dass Markus sich verändert hat. Früher hat er sich geschämt, weil er Schulden hatte. Heute schämt er sich nicht mehr, weil er weiß, dass Schulden kein Versagen sind, sondern ein Problem, das man lösen kann. Früher hat er nicht mehr schlafen können, weil er Angst hatte, dass sein Konto gepfändet wird. Heute schläft er wieder gut, weil er weiß, dass er einen Plan hat und dass er ihn einhält. Früher hat er seinen Kindern nicht erzählt, dass er Schulden hat, weil er Angst hatte, dass sie ihn weniger lieben. Heute wissen seine Kinder, dass er Schulden hatte, und sie lieben ihn sogar mehr, weil er ehrlich zu ihnen war. Das ist der größte Gewinn: Nicht dass Markus weniger Schulden hat, sondern dass er wieder ruhig schlafen kann und dass er ehrlich zu sich selbst und zu seiner Familie ist. Und in einem Jahr wird er schuldenfrei sein. Das ist sein Ziel. Und er wird es schaffen, weil er einen Plan hat und weil er dranbleibt. Ein Beispiel, das zeigt, was sich nach 2 Jahren wirklich verändert hat: Markus hat nach 2 Jahren nicht nur weniger Schulden, sondern auch mehr Selbstvertrauen. Früher hat er sich geschämt, weil er Schulden hatte. Heute schämt er sich nicht mehr, weil er weiß, dass Schulden kein Versagen sind, sondern ein Problem, das man lösen kann. Früher hat er nicht mehr schlafen können, weil er Angst hatte, dass sein Konto gepfändet wird. Heute schläft er wieder gut, weil er weiß, dass er einen Plan hat und dass er ihn einhält. Früher hat er seinen Kindern nicht erzählt, dass er Schulden hat, weil er Angst hatte, dass sie ihn weniger lieben. Heute wissen seine Kinder, dass er Schulden hatte, und sie lieben ihn sogar mehr, weil er ehrlich zu ihnen war. Das ist der größte Gewinn: Nicht dass Markus weniger Schulden hat, sondern dass er wieder ruhig schlafen kann und dass er ehrlich zu sich selbst und zu seiner Familie ist. Und in einem Jahr wird er schuldenfrei sein. Das ist sein Ziel. Und er wird es schaffen, weil er einen Plan hat und weil er dranbleibt. Er hat auch angefangen, 50 Euro im Monat in einen ETF zu stecken, weil er gelernt hat, dass Investieren wichtig ist, nachdem man seine Schulden abbezahlt hat. Das ist der nächste Schritt: Erst Schulden abbezahlen, dann Notgroschen aufbauen, dann investieren. Markus ist auf dem Weg, und er wird es schaffen. Ein weiterer Punkt zu Markus 2 Jahre später ist, dass er nicht nur schuldenfrei wird, sondern auch ein Vorbild für seine Kinder. Seine Kinder haben gesehen, wie ihr Papa seine Schulden abbezahlt hat. Sie haben gesehen, dass er ehrlich war, dass er einen Plan hatte, und dass er dran geblieben ist, auch wenn es schwer war. Das ist eine Lektion, die sie ihr ganzes Leben brauchen werden. Sie haben gelernt, dass man Fehler machen kann und dass man sie wieder gutmachen kann, wenn man ehrlich ist und einen Plan hat. Sie haben gelernt, dass Schulden kein Versagen sind, sondern ein Problem, das man lösen kann. Und sie haben gelernt, dass man nicht alles haben muss, was andere haben, um glücklich zu sein. Markus hat seinen Kindern beigebracht, dass man nicht alles kaufen muss, was man sieht, sondern dass man nur das kaufen sollte, was man wirklich braucht und was man sich leisten kann. Das ist eine Lektion, die mehr wert ist als jedes Geld, das man auf dem Sparbuch liegen lassen könnte. Denn Geld, das man auf dem Sparbuch liegen lässt, wird weniger wert. Wissen, das man weitergibt, wird mehr wert, weil es sich vermehrt, wenn man es teilt. Markus hat seinen Kindern Wissen weitergegeben, das sie ihr ganzes Leben brauchen werden. Und das ist das Schönste an der Geschichte. Markus ist heute nicht schuldenfrei, aber er ist auf dem Weg. In einem Jahr wird er schuldenfrei sein. Und er wird es schaffen, weil er einen Plan hat und weil er dranbleibt. Das ist der Punkt: Man muss nicht sofort schuldenfrei sein, um stolz auf sich zu sein. Man muss nur auf dem Weg sein und dranbleiben, Monat für Monat, Jahr für Jahr. Und wenn du auf dem Weg bist, dann bist du schon weiter als alle, die noch warten.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."], ["Dein Plan für die nächsten 30 Tage - schuldenfrei werden, Schritt für Schritt", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein macht dich nicht schuldenfrei. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Schreib alle deine Schulden auf ein Blatt Papier. Bei wem, wie viel, wie viel Zinsen, wie viel Rate. Nur aufschreiben, nichts ändern. Woche 2: Spare 100 Euro für deinen Notgroschen. Leg sie auf ein Tagesgeldkonto, damit du sie nicht ausgibst. Woche 3: Ruf einen Gläubiger an, bei dem du die teuerste Schuld hast, und frag, ob du die Rate senken kannst oder ob die Zinsen gestoppt werden können. Nur einen anrufen, nicht alle. Woche 4: Schreib jeden Abend auf, was du an dem Tag ausgegeben hast. Nur aufschreiben, nichts ändern. Nach 30 Tagen hast du den Überblick, du hast 100 Euro Notgroschen, du hast mit einem Gläubiger gesprochen, und du weißt, wo dein Geld hingeht. Das ist der Anfang. Nach einem Jahr wirst du weniger Schulden haben als heute. Nach zwei Jahren wirst du noch weniger Schulden haben. Und irgendwann wirst du schuldenfrei sein. Markus hat mit 14.800 Euro Schulden angefangen. Heute hat er noch 3.200 Euro. In einem Jahr wird er 0 Euro haben. Du kannst das auch. Fang heute an. Nicht morgen. Heute. Mit einem Blatt Papier und einem Stift. Schreib deine Schulden auf. Das ist der erste Schritt, um schuldenfrei zu werden, ohne dich zu schämen. Ein Beispiel, das zeigt, wie der 30-Tage-Plan funktioniert: Markus hat in der ersten Woche nur aufgeschrieben, wie viel Schulden er hat. Das war schwer, weil er sich geschämt hat. Aber nach einer Woche hat er sich daran gewöhnt. In der zweiten Woche hat er 100 Euro für seinen Notgroschen gespart. Das war schwer, weil er das Geld lieber für seine Schulden nutzen wollte. Aber er hat es trotzdem gemacht, weil er wusste, dass der Notgroschen wichtig ist. In der dritten Woche hat er einen Gläubiger angerufen und gefragt, ob er die Rate senken kann. Das war schwer, weil er Angst hatte. Aber es hat funktioniert, weil der Gläubiger Ja gesagt hat. In der vierten Woche hat er jeden Abend aufgeschrieben, was er an dem Tag ausgegeben hat. Das war lästig, aber es hat ihm gezeigt, wo sein Geld hingeht. Nach 30 Tagen hatte er den Überblick, er hatte 100 Euro Notgroschen, er hatte mit einem Gläubiger gesprochen, und er wusste, wo sein Geld hingeht. Das war der Anfang. Nach einem Jahr hatte er weniger Schulden als heute. Nach zwei Jahren hatte er noch weniger Schulden. Und in einem Jahr wird er schuldenfrei sein. Das ist kein Wunder, das ist ein Plan, der funktioniert, weil er klein und machbar ist. Fang heute an. Mit einem Blatt Papier und einem Stift. Schreib deine Schulden auf. Das ist der erste Schritt, um schuldenfrei zu werden, ohne dich zu schämen. Ein weiterer Punkt zum 30-Tage-Plan ist, dass du nach 30 Tagen nicht fertig bist. Nach 30 Tagen hast du angefangen, aber du bist noch lange nicht am Ziel. Du musst dranbleiben, Monat für Monat, Jahr für Jahr. Markus hat nach 30 Tagen angefangen, aber er ist nach 2 Jahren immer noch dabei. Er wird auch in einem Jahr noch dabei sein, bis er schuldenfrei ist. Und danach wird er weiter sparen, weil er gelernt hat, dass Sparen wichtig ist. Das ist der Punkt: Schuldenfrei werden ist kein Projekt, das man nach 30 Tagen abschließt und dann nie wieder darüber nachdenkt. Schuldenfrei werden ist ein Prozess, der ein Leben lang dauert, weil man immer wieder aufpassen muss, dass man nicht wieder neue Schulden macht. Aber wenn man einmal gelernt hat, wie man mit Geld umgeht, dann wird es leichter. Markus hat gelernt, wie man mit Geld umgeht. Er weiß jetzt, wie viel er ausgibt, er weiß, wo sein Geld hingeht, er weiß, wie er seine Schulden abbezahlt. Und er wird dieses Wissen sein ganzes Leben nutzen, auch wenn er schuldenfrei ist. Das ist der größte Gewinn: Nicht dass er schuldenfrei wird, sondern dass er gelernt hat, wie man mit Geld umgeht. Und das wird ihn sein ganzes Leben begleiten. Nach 30 Tagen bist du nicht schuldenfrei, aber du hast angefangen. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann bist du schon weiter als alle, die noch warten. Bleib dran, Monat für Monat, Jahr für Jahr. Und wenn du einmal zurückfällst, dann steh wieder auf und mach weiter. Das ist der Weg, um schuldenfrei zu werden, ohne dich zu schämen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, dich zu schämen, weil du Schulden hast, und anfängst, etwas dagegen zu tun. Wenn du den Überblick bekommst, wenn du einen Plan hast, wenn du dranbleibst, Monat für Monat, Jahr für Jahr. Dann wirst du schuldenfrei, nicht sofort, aber irgendwann. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte."]], "kat": "Sachbücher", "unter": "Geld & Freiheit"}, {"title": "Warum du nachts nicht schlafen kannst - Und was wirklich hilft", "chapters": [["Die Frau, die um 3 Uhr nachts wach lag und nicht mehr einschlafen konnte", "Anna ist 36, arbeitet in Bielefeld als Krankenschwester, und sie hat ein Problem, das sie lange für normal gehalten hat. Sie kann nachts nicht schlafen. Sie geht um 22 Uhr ins Bett, weil sie um 6 Uhr aufstehen muss. Um 22:30 Uhr ist sie noch wach. Um 23 Uhr ist sie noch wach. Um 0 Uhr ist sie noch wach. Um 1 Uhr schläft sie endlich ein, weil sie so müde ist, dass ihr Körper einfach aufgibt. Um 3 Uhr wacht sie wieder auf. Sie muss auf die Toilette, oder sie hört ihren Mann schnarchen, oder sie denkt an die Arbeit. Und dann kann sie nicht mehr einschlafen. Sie liegt bis 5 Uhr wach, starrt an die Decke, und denkt: Morgen werde ich so müde sein, ich schaffe das nicht. Um 6 Uhr klingelt ihr Wecker. Sie ist gerädert. Sie trinkt drei Kaffee, um überhaupt wach zu werden. Auf der Arbeit ist sie gereizt, weil sie so müde ist. Abends ist sie so müde, dass sie um 20 Uhr auf dem Sofa einschläft. Aber wenn sie um 22 Uhr ins Bett geht, kann sie wieder nicht schlafen. Das ist ein Teufelskreis. Anna hat das 2 Jahre lang so gemacht. Sie dachte, das sei normal, wenn man Schicht arbeitet. Sie dachte, man könne nichts dagegen tun. Erst als sie eines Tages auf der Arbeit fast eingeschlafen ist, während sie einem Patienten Medikamente gegeben hat, hat sie gemerkt, dass das so nicht weitergehen kann. Sie ist zu ihrer Ärztin gegangen. Die Ärztin hat gesagt: Du hast eine Schlafstörung, und wir müssen herausfinden, warum du nachts nicht schlafen kannst. In diesem Buch gehen wir genau das durch: Warum du nachts nicht schlafen kannst, was wirklich hilft und was nur Geld kostet, und wie du wieder lernst, durchzuschlafen, ohne Tabletten, ohne Tricks, sondern mit einem Plan, der wirklich funktioniert. Was Anna danach noch gelernt hat, war, dass Schlafmangel nicht nur müde macht, sondern auch krank. Sie hatte immer Kopfschmerzen, wenn sie nicht geschlafen hatte. Sie hatte Bauchschmerzen, wenn sie nicht geschlafen hatte. Sie war oft erkältet, weil ihr Immunsystem geschwächt war, weil sie nicht geschlafen hatte. Sie hat das nicht verstanden, bis ihre Ärztin ihr gesagt hat: Wenn du nicht schläfst, dann kann dein Körper sich nicht erholen. Schlaf ist die Zeit, in der dein Körper repariert wird, was am Tag kaputtgegangen ist. Wenn du nicht schläfst, dann wird nichts repariert, und du wirst krank. Das war ein Moment, in dem Anna gemerkt hat, dass Schlaf nicht Luxus ist, sondern Medizin. Sie hat angefangen, ihren Schlaf ernst zu nehmen, nicht als etwas, das man macht, wenn man Zeit hat, sondern als etwas, das man machen muss, um gesund zu bleiben. Sie geht jetzt immer um 22 Uhr ins Bett, auch wenn sie noch Wäsche zu machen hat, auch wenn sie noch Fernsehen schauen will. Denn sie weiß, dass Schlaf wichtiger ist als Wäsche und Fernsehen. Und wenn sie gut schläft, dann hat sie am nächsten Tag mehr Energie, um Wäsche zu machen und Fernsehen zu schauen. Das ist der Unterschied zwischen Menschen, die gut schlafen, und Menschen, die schlecht schlafen. Die einen haben Energie, weil sie schlafen. Die anderen haben keine Energie, weil sie nicht schlafen. Ein weiterer Punkt, den Anna gelernt hat, ist, dass man nicht alles auf einmal ändern muss. Sie hat nicht von heute auf morgen angefangen, alles anders zu machen. Sie hat mit einer Sache angefangen: Kein Kaffee nach 14 Uhr. Nur eine Sache. Das war machbar. Nach einer Woche hat sie eine zweite Sache geändert: Kein Handy im Schlafzimmer. Nach zwei Wochen eine dritte Sache: Immer zur gleichen Zeit ins Bett gehen. So hat sie Schritt für Schritt ihren Schlaf verbessert, ohne dass es zu viel war. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Anna hat auch gelernt, dass Rückschläge normal sind. Es gab Nächte, in denen sie wieder nicht schlafen konnte, obwohl sie alles richtig gemacht hatte. Das war kein Scheitern, das war ein Rückfall. Sie hat sich nicht dafür bestraft, sondern sie hat gesagt: Okay, heute Nacht habe ich nicht gut geschlafen, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal eine schlechte Nacht hat, der wird nie wieder gut schlafen. Wer weitermacht, auch wenn er einmal eine schlechte Nacht hat, der wird wieder gut schlafen, Nacht für Nacht.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Warum du nicht schlafen kannst - was in deinem Kopf wirklich passiert", "Wenn Anna nachts wach liegt, dann ist ihr Kopf nicht leer. Er ist voll. Sie denkt an die Arbeit. Sie denkt daran, dass sie morgen früh aufstehen muss. Sie denkt daran, dass sie heute noch Wäsche waschen wollte. Sie denkt daran, dass ihr Sohn morgen eine Klassenarbeit schreibt. Sie denkt daran, dass sie ihrer Mutter noch anrufen wollte. Ihr Kopf ist wie ein Radio, das man nicht ausschalten kann. Es spielt immer weiter, auch wenn sie schlafen will. Das ist der Grund, warum sie nicht schlafen kann. Nicht weil sie nicht müde ist. Sie ist todmüde. Sondern weil ihr Kopf nicht aufhört zu denken. Wissenschaftler nennen das Grübeln. Grübeln heißt, dass man immer wieder über die gleichen Gedanken nachdenkt, ohne dass man zu einer Lösung kommt. Man denkt: Was, wenn ich morgen zu spät zur Arbeit komme? Was, wenn mein Sohn die Klassenarbeit nicht schafft? Was, wenn ich meiner Mutter nicht anrufe und sie sauer ist? Das sind Fragen, auf die man nachts keine Antwort findet, weil man nachts nicht handeln kann. Man kann nachts nicht zur Arbeit gehen. Man kann nachts seinem Sohn nicht bei der Klassenarbeit helfen. Man kann nachts seiner Mutter nicht anrufen. Man kann nur liegen und denken. Und je mehr man denkt, desto wacher wird man. Denn Denken macht wach. Schlafen macht müde. Das ist das Paradoxon: Je mehr man versucht, einzuschlafen, desto wacher wird man, weil man darüber nachdenkt, dass man nicht schlafen kann. Anna hat das erlebt. Sie hat gedacht: Ich muss jetzt schlafen, sonst bin ich morgen müde. Und genau dieser Gedanke hat sie wach gehalten. Denn wer denkt, ich muss jetzt schlafen, der ist wach, weil er denkt. Wer einfach nur liegt und atmet, der schläft irgendwann ein, ohne es zu merken. Ein Beispiel, das zeigt, wie Grübeln funktioniert: Anna liegt im Bett und denkt: Was, wenn ich morgen zu spät zur Arbeit komme? Dann denkt sie: Was, wenn meine Chefin sauer ist? Dann denkt sie: Was, wenn ich meinen Job verliere? Dann denkt sie: Was, wenn wir dann unsere Miete nicht mehr bezahlen können? Dann denkt sie: Was, wenn wir dann aus unserer Wohnung ausziehen müssen? Das ist Grübeln. Ein Gedanke führt zum nächsten, und der nächste Gedanke ist immer schlimmer als der vorherige. Am Anfang ist es nur ein kleiner Gedanke: Was, wenn ich morgen zu spät komme? Am Ende ist es ein riesiger Gedanke: Was, wenn wir unsere Wohnung verlieren? Das ist kein logisches Denken, das ist Katastrophendenken. Und Katastrophendenken macht wach, weil es Angst macht. Anna hat gelernt, dass sie, wenn sie merkt, dass sie grübelt, aufstehen und ihre Sorgen-Liste schreiben soll. Sie schreibt auf: Ich habe Angst, dass ich morgen zu spät zur Arbeit komme. Dann fragt sie sich: Ist das realistisch? Sie kommt fast nie zu spät zur Arbeit. Sie stellt ihren Wecker immer auf 6 Uhr, und sie steht immer um 6 Uhr auf. Die Angst ist nicht realistisch. Sie ist nur ein Gedanke, der ihr Angst macht, ohne dass es einen Grund dafür gibt. Wenn sie das aufschreibt, dann wird der Gedanke kleiner, weil er auf Papier steht und nicht mehr nur in ihrem Kopf ist. Auf Papier ist er nur ein Satz. Im Kopf ist er ein riesiges Monster, das immer größer wird. Das ist der Grund, warum Aufschreiben hilft: Es macht Gedanken kleiner, weil sie auf Papier nicht mehr so groß sind wie im Kopf. Ein weiterer Punkt ist, dass man seine Gedanken nicht kontrollieren kann, aber man kann lernen, mit ihnen umzugehen. Anna kann nicht verhindern, dass sie nachts an die Arbeit denkt. Sie kann aber lernen, dass sie nicht jedem Gedanken glauben muss, der ihr nachts durch den Kopf geht. Wenn sie nachts denkt: Ich werde morgen zu spät zur Arbeit kommen, dann kann sie sagen: Das ist nur ein Gedanke, keine Tatsache. Ich komme fast nie zu spät zur Arbeit. Das ist der Unterschied zwischen Gedanken und Tatsachen. Gedanken sind nur Gedanken. Sie sind nicht die Wahrheit. Sie sind nur das, was einem durch den Kopf geht, wenn man müde ist und Angst hat. Wenn man das versteht, dann wird man ruhiger, weil man nicht mehr jedem Gedanken glauben muss. Anna hat gelernt, dass sie, wenn sie nachts grübelt, aufstehen und ihre Sorgen-Liste schreiben soll, statt im Bett zu liegen und zu grübeln. Das hilft ihr, weil sie dann ihre Gedanken auf Papier bringt und sie nicht mehr nur im Kopf hat. Auf Papier sind Gedanken kleiner als im Kopf. Im Kopf sind sie riesige Monster, die immer größer werden. Auf Papier sind sie nur Sätze, die man lesen kann und die man morgen lösen kann. Das ist der Punkt: Man muss seine Gedanken nicht kontrollieren, man muss sie nur aufschreiben, damit sie nicht mehr im Kopf herumschwirren und einen wach halten.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Der Teufelskreis - müde sein, nicht schlafen können, noch müder sein", "Anna ist in einem Teufelskreis. Sie ist müde, weil sie nicht schlafen kann. Sie kann nicht schlafen, weil sie müde ist und Angst hat, dass sie morgen noch müder ist. Sie trinkt Kaffee, um wach zu werden. Kaffee macht sie wach, aber er macht sie auch nervös, und nervös kann sie nachts nicht schlafen. Sie schläft tagsüber auf dem Sofa ein, weil sie so müde ist. Wenn sie tagsüber schläft, dann kann sie nachts noch weniger schlafen, weil sie tagsüber schon geschlafen hat. Sie geht früher ins Bett, weil sie so müde ist. Wenn sie früher ins Bett geht, dann liegt sie noch länger wach, weil sie noch nicht müde genug ist, um einzuschlafen. Sie nimmt ihr Handy mit ins Bett, um sich abzulenken. Das Handy macht sie wach, weil das blaue Licht ihr Gehirn wach hält. Sie schaut auf die Uhr, um zu sehen, wie spät es ist. Wenn sie sieht, dass es schon 2 Uhr ist und sie noch nicht schläft, dann wird sie noch nervöser, und sie kann noch weniger schlafen. Das ist der Teufelskreis. Jeder Schritt, den Anna macht, um besser zu schlafen, macht es schlimmer. Sie trinkt Kaffee, um wach zu werden, und kann nachts nicht schlafen. Sie schläft tagsüber, und kann nachts nicht schlafen. Sie geht früher ins Bett, und liegt noch länger wach. Sie nimmt ihr Handy mit ins Bett, und wird noch wacher. Sie schaut auf die Uhr, und wird noch nervöser. Der einzige Weg, um aus dem Teufelskreis herauszukommen, ist, ihn zu durchbrechen. Nicht an einer Stelle, sondern an mehreren Stellen gleichzeitig. Man muss aufhören, Kaffee nach 14 Uhr zu trinken. Man muss aufhören, tagsüber zu schlafen. Man muss immer zur gleichen Zeit ins Bett gehen, nicht früher, auch wenn man müde ist. Man muss das Handy aus dem Schlafzimmer verbannen. Man muss die Uhr umdrehen, damit man nicht darauf schauen kann. Das klingt einfach, aber es ist schwer, weil man es jeden Tag machen muss, auch wenn man müde ist. Ein Beispiel, das zeigt, wie man den Teufelskreis durchbricht: Anna hat früher jeden Tag um 14 Uhr einen Kaffee getrunken, weil sie müde war. Der Kaffee hat sie wach gemacht, aber er hat sie auch nachts wach gehalten. Sie hat aufgehört, nach 14 Uhr Kaffee zu trinken. Am Anfang war sie nachmittags noch müder, weil sie keinen Kaffee mehr hatte. Nach einer Woche hat sie gemerkt, dass sie nachmittags weniger müde war, weil sie nachts besser geschlafen hat. Das war der Durchbruch. Sie hat den Teufelskreis durchbrochen, indem sie an einer Stelle aufgehört hat, etwas zu tun, was ihr geschadet hat. Sie hat nicht alles auf einmal geändert. Sie hat nur eine Sache geändert: Kein Kaffee nach 14 Uhr. Das war machbar. Nach einer Woche hat sie eine zweite Sache geändert: Kein Handy im Schlafzimmer. Nach zwei Wochen eine dritte Sache: Immer zur gleichen Zeit ins Bett gehen. So hat sie Schritt für Schritt den Teufelskreis durchbrochen, ohne dass es zu viel war. Das ist der Weg: Nicht alles auf einmal ändern, sondern eine Sache nach der anderen, Schritt für Schritt, Woche für Woche. Und nach einem Monat hat sie gemerkt, dass sie besser schläft, weil sie 4 Dinge geändert hat, die ihr vorher geschadet haben. Das ist kein Wunder, das ist ein Plan, der funktioniert, weil er klein und machbar ist. Ein weiterer Punkt zum Teufelskreis ist, dass man ihn an mehreren Stellen gleichzeitig durchbrechen muss, nicht nur an einer. Anna hat nicht nur aufgehört, Kaffee nach 14 Uhr zu trinken. Sie hat auch aufgehört, tagsüber zu schlafen. Sie hat auch aufgehört, ihr Handy mit ins Bett zu nehmen. Sie hat auch angefangen, immer zur gleichen Zeit ins Bett zu gehen. Sie hat auch angefangen, ihre Sorgen-Liste zu schreiben. Sie hat auch angefangen, Sport zu machen. Sie hat auch angefangen, abends leicht zu essen. Das sind 7 Dinge, die sie geändert hat, nicht nur eine. Und jede einzelne Änderung hat ein bisschen geholfen. Zusammen haben sie viel geholfen. Das ist wie ein Puzzle: Ein einzelnes Teil macht noch kein Bild. Aber wenn man alle Teile zusammenlegt, dann sieht man das ganze Bild. So ist es auch mit dem Schlaf. Eine einzelne Änderung hilft ein bisschen. Aber wenn man 7 Änderungen zusammen macht, dann schläft man richtig gut. Das ist der Punkt: Man muss nicht nur eine Sache ändern, sondern mehrere, Schritt für Schritt, Woche für Woche, bis man alle Änderungen gemacht hat, die einem helfen, besser zu schlafen. Und dann muss man sie jeden Tag machen, auch wenn man müde ist. Denn nur wer jeden Tag die richtigen Dinge tut, schläft nachts gut.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Kaffee, Handy, Licht - die 3 Schlaf-Killer, die du jeden Tag benutzt", "Es gibt 3 Dinge, die fast jeder benutzt und die den Schlaf kaputt machen, ohne dass man es merkt. Erstens: Kaffee. Anna trinkt 4 Kaffee am Tag. Einen um 7 Uhr, einen um 10 Uhr, einen um 14 Uhr, und einen um 17 Uhr. Der Kaffee um 17 Uhr ist das Problem. Koffein bleibt 6 bis 8 Stunden im Körper. Wenn Anna um 17 Uhr einen Kaffee trinkt, dann ist um 22 Uhr noch die Hälfte des Koffeins in ihrem Körper. Sie ist also um 22 Uhr noch halb wach, weil der Kaffee sie noch wach hält. Die Regel ist: Kein Kaffee nach 14 Uhr. Das ist schwer, weil man nachmittags müde ist und einen Kaffee braucht, um wach zu werden. Aber wenn man nach 14 Uhr keinen Kaffee mehr trinkt, dann kann man nachts besser schlafen. Und wenn man nachts besser schläft, dann ist man nachmittags weniger müde und braucht keinen Kaffee mehr. Das ist ein positiver Kreislauf, statt eines Teufelskreises. Zweitens: Handy. Anna nimmt ihr Handy mit ins Bett und scrollt durch Instagram, bis sie einschläft. Das ist das Schlimmste, was man tun kann, weil das blaue Licht vom Handy dem Gehirn sagt: Es ist Tag, bleib wach. Das Gehirn denkt, es sei noch Tag, und es produziert kein Melatonin, das Hormon, das einen müde macht. Die Regel ist: Kein Handy im Schlafzimmer, mindestens eine Stunde vor dem Schlafengehen. Anna hat sich einen Wecker gekauft, einen echten Wecker, der nicht leuchtet und nicht piept, wenn man eine Nachricht bekommt. Sie legt ihr Handy um 21 Uhr in die Küche und holt es erst am nächsten Morgen wieder. Das war schwer, weil sie Angst hatte, dass sie etwas verpasst. Nach einer Woche hat sie gemerkt, dass sie nichts verpasst hat. Drittens: Licht. Anna schläft mit dem Rollladen halb offen, weil sie Angst hat, dass sie sonst den Wecker nicht hört. Das Licht von der Straßenlaterne fällt in ihr Zimmer und macht sie wach. Die Regel ist: Schlafzimmer muss dunkel sein, so dunkel wie möglich. Rollladen runter, Vorhänge zu, kein Licht, das in die Augen fällt. Das Gehirn braucht Dunkelheit, um Melatonin zu produzieren. Ohne Dunkelheit kein Melatonin, ohne Melatonin kein Schlaf. Ein Beispiel, das zeigt, wie viel Kaffee wirklich ausmacht: Anna hat früher 4 Kaffee am Tag getrunken. Sie hat auf 2 Kaffee am Tag reduziert, einen um 7 Uhr und einen um 10 Uhr. Nach 14 Uhr trinkt sie keinen Kaffee mehr. Sie trinkt stattdessen Wasser oder Tee, ohne Koffein. Am Anfang war das schwer, weil sie nachmittags immer müde war und einen Kaffee brauchte, um wach zu werden. Nach einer Woche hat sie gemerkt, dass sie nachmittags weniger müde war, weil sie nachts besser geschlafen hat. Das war ein positiver Kreislauf. Sie schläft nachts besser, weil sie nachmittags keinen Kaffee mehr trinkt. Sie ist nachmittags weniger müde, weil sie nachts besser schläft. Sie braucht nachmittags keinen Kaffee mehr, weil sie nachmittags weniger müde ist. Das ist der Unterschied zwischen einem Teufelskreis und einem positiven Kreislauf. Ein Teufelskreis macht alles schlimmer. Ein positiver Kreislauf macht alles besser. Anna ist jetzt in einem positiven Kreislauf, weil sie eine Sache geändert hat: Kein Kaffee nach 14 Uhr. Und das hat alles andere verbessert. Sie schläft besser, sie ist weniger müde, sie ist weniger gereizt, sie ist besser auf der Arbeit. Das ist der Punkt: Eine kleine Änderung kann alles verändern, wenn man sie konsequent macht, jeden Tag, auch wenn man müde ist. Ein weiterer Punkt zu Kaffee, Handy, Licht ist, dass man sie nicht nur abends meiden sollte, sondern auch tagsüber darauf achten sollte, wie viel man davon benutzt. Anna hat gemerkt, dass sie tagsüber zu viel Handy benutzt hat, nicht nur abends. Sie hat tagsüber ständig auf ihr Handy geschaut, auch wenn sie bei der Arbeit war, auch wenn sie mit ihren Kindern gespielt hat. Das hat sie nervös gemacht, weil sie ständig Nachrichten bekommen hat, die sie abgelenkt haben. Sie hat angefangen, tagsüber weniger Handy zu benutzen. Sie schaut nur noch 3 Mal am Tag auf ihr Handy: Morgens, mittags, und abends um 20 Uhr. Das war schwer, weil sie es gewohnt war, ständig auf ihr Handy zu schauen. Aber es hat ihr geholfen, weil sie dadurch ruhiger geworden ist. Sie ist nicht mehr so nervös, weil sie nicht ständig von Nachrichten abgelenkt wird. Und wenn sie abends weniger nervös ist, dann schläft sie nachts besser. Das ist der Punkt: Handy macht nicht nur abends wach, sondern auch tagsüber nervös. Und wenn man tagsüber nervös ist, dann ist man abends auch nervös, und wenn man abends nervös ist, dann kann man nachts nicht schlafen. Deshalb sollte man tagsüber weniger Handy benutzen, nicht nur abends. Anna hat das gelernt, und sie ist heute ruhiger, weil sie weniger Handy benutzt, tagsüber und abends.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Die Schlafhygiene - was wirklich hilft und was nur Geld kostet", "Man hört viel über Schlafhygiene. Man soll Lavendelöl auf sein Kopfkissen sprühen, man soll warme Milch mit Honig trinken, man soll ein Schlaf-Tagebuch führen, man soll Magnesium nehmen, man soll Melatonin-Tabletten nehmen. Was hilft wirklich, und was kostet nur Geld? Anna hat alles ausprobiert. Lavendelöl hat ihr nicht geholfen. Es hat gut gerochen, aber sie hat trotzdem nicht geschlafen. Warme Milch mit Honig hat ihr nicht geholfen. Sie war danach nur noch mehr wach, weil sie auf die Toilette musste. Magnesium hat ihr nicht geholfen. Sie hat es 3 Wochen genommen, und sie hat keinen Unterschied gemerkt. Melatonin-Tabletten haben ihr geholfen, einzuschlafen, aber sie ist trotzdem um 3 Uhr aufgewacht und konnte nicht mehr einschlafen. Was wirklich geholfen hat, war etwas ganz Einfaches: Immer zur gleichen Zeit ins Bett gehen und immer zur gleichen Zeit aufstehen, auch am Wochenende. Das war schwer, weil sie am Wochenende gerne länger geschlafen hätte. Aber es hat funktioniert, weil ihr Körper dadurch gelernt hat, wann er schlafen muss und wann er wach sein muss. Das zweite, was wirklich geholfen hat, war, das Schlafzimmer nur zum Schlafen zu benutzen. Kein Fernsehen im Bett, kein Handy im Bett, kein Essen im Bett. Nur Schlafen. Wenn man nur zum Schlafen ins Bett geht, dann lernt das Gehirn: Bett heißt Schlafen. Wenn man im Bett fernsieht, Handy schaut, und isst, dann lernt das Gehirn: Bett heißt Wachsein. Das dritte, was wirklich geholfen hat, war, das Schlafzimmer kühl zu halten. 18 Grad, nicht wärmer. Wenn es zu warm ist, kann man nicht schlafen. Wenn es kühl ist, schläft man besser. Das sind die 3 Dinge, die wirklich helfen, und sie kosten kein Geld. Alles andere, was man kaufen kann, ist meistens nur Geldverschwendung. Ein Beispiel, das zeigt, was wirklich hilft und was nur Geld kostet: Anna hat 50 Euro für ein Lavendel-Kissen ausgegeben, das ihr beim Schlafen helfen sollte. Es hat nicht geholfen. Sie hat 30 Euro für Melatonin-Tabletten ausgegeben. Sie haben ihr geholfen, einzuschlafen, aber sie ist trotzdem um 3 Uhr aufgewacht. Sie hat 100 Euro für eine Schlaf-App ausgegeben, die ihr beim Einschlafen helfen sollte, indem sie Geräusche von Regen abspielt. Sie hat ihr nicht geholfen, weil sie das Handy dafür im Schlafzimmer haben musste, und das Handy hat sie wach gehalten. Was wirklich geholfen hat, war etwas, das kein Geld gekostet hat: Immer zur gleichen Zeit ins Bett gehen. Das Schlafzimmer nur zum Schlafen benutzen. Das Schlafzimmer kühl und dunkel halten. Das sind 3 Dinge, die kein Geld kosten, aber die wirklich helfen. Alles andere, was man kaufen kann, ist meistens nur Geldverschwendung, weil es das eigentliche Problem nicht löst. Das eigentliche Problem ist nicht, dass man kein Lavendel-Kissen hat. Das eigentliche Problem ist, dass man keinen Rhythmus hat, dass man das Schlafzimmer für alles andere benutzt, außer zum Schlafen, und dass das Schlafzimmer zu warm und zu hell ist. Wenn man diese 3 Dinge ändert, dann schläft man besser, ohne Geld auszugeben. Das hat Anna gelernt, und sie gibt heute kein Geld mehr für Schlaf-Produkte aus, weil sie weiß, dass sie es nicht braucht. Sie braucht nur einen Rhythmus, ein dunkles, kühles Schlafzimmer, und ein Bett, das nur zum Schlafen da ist. Ein weiterer Punkt zur Schlafhygiene ist, dass man nicht alles glauben sollte, was man im Internet liest. Anna hat im Internet gelesen, dass man Lavendelöl auf sein Kopfkissen sprühen soll, dass man warme Milch mit Honig trinken soll, dass man Magnesium nehmen soll, dass man eine Schlaf-App benutzen soll. Sie hat alles ausprobiert, und nichts hat geholfen, außer den 3 Dingen, die wirklich helfen: Immer zur gleichen Zeit ins Bett gehen, das Schlafzimmer nur zum Schlafen benutzen, das Schlafzimmer kühl und dunkel halten. Das sind die 3 Dinge, die Wissenschaftler in Studien nachgewiesen haben, dass sie wirklich helfen. Alles andere ist meistens nur Geldverschwendung, weil es das eigentliche Problem nicht löst. Das eigentliche Problem ist nicht, dass man kein Lavendelöl hat. Das eigentliche Problem ist, dass man keinen Rhythmus hat, dass man das Schlafzimmer für alles andere benutzt, außer zum Schlafen, und dass das Schlafzimmer zu warm und zu hell ist. Wenn man diese 3 Dinge ändert, dann schläft man besser, ohne Geld auszugeben. Das hat Anna gelernt, und sie gibt heute kein Geld mehr für Schlaf-Produkte aus, weil sie weiß, dass sie es nicht braucht. Sie braucht nur einen Rhythmus, ein dunkles, kühles Schlafzimmer, und ein Bett, das nur zum Schlafen da ist. Das ist alles. Und das kostet kein Geld, nur Disziplin, jeden Tag, auch wenn man müde ist.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Grübeln stoppen - die Sorgen-Liste, die dir den Kopf frei macht", "Anna hat gelernt, dass Grübeln der Hauptgrund ist, warum sie nicht schlafen kann. Sie hat eine Methode gelernt, die ihr geholfen hat, das Grübeln zu stoppen. Sie nennt sie die Sorgen-Liste. Jeden Abend, um 20 Uhr, setzt sie sich an ihren Küchentisch und schreibt auf ein Blatt Papier alles auf, was ihr Sorgen macht. Alles. Nicht nur die großen Sorgen, sondern auch die kleinen. Zum Beispiel: Ich muss morgen Wäsche waschen. Ich muss meiner Mutter anrufen. Mein Sohn hat morgen eine Klassenarbeit. Ich habe Angst, dass ich morgen zu spät zur Arbeit komme. Sie schreibt alles auf, bis ihr nichts mehr einfällt. Dann schaut sie sich die Liste an und fragt sich bei jeder Sorge: Kann ich das jetzt lösen? Wenn die Antwort Nein ist, weil es schon 20 Uhr ist und sie es erst morgen lösen kann, dann schreibt sie daneben: Morgen. Wenn die Antwort Ja ist, weil sie es jetzt noch lösen kann, dann löst sie es jetzt. Zum Beispiel: Sie kann jetzt noch ihrer Mutter eine Nachricht schreiben, dass sie morgen anruft. Das dauert 30 Sekunden. Danach ist diese Sorge weg. Wenn sie alle Sorgen aufgeschrieben hat, dann faltet sie das Blatt zusammen und legt es in eine Schublade. Sie sagt zu sich selbst: Meine Sorgen sind jetzt in der Schublade. Ich muss sie nicht mehr im Kopf behalten. Morgen früh hole ich sie wieder raus und kümmere mich darum. Das funktioniert, weil das Gehirn aufhört zu grübeln, wenn es weiß, dass die Sorgen aufgeschrieben sind und dass man sie morgen wiederfindet. Früher hat Anna ihre Sorgen nur im Kopf behalten, und ihr Kopf hat sie nachts immer wieder hervorgeholt, weil er Angst hatte, sie zu vergessen. Heute stehen ihre Sorgen auf einem Blatt Papier in einer Schublade, und ihr Kopf weiß, dass er sie nicht vergessen wird, weil sie aufgeschrieben sind. Deshalb kann er nachts ruhig sein. Ein Beispiel, das zeigt, wie die Sorgen-Liste im Alltag hilft: Anna hat jeden Abend um 20 Uhr ihre Sorgen-Liste geschrieben. Am Anfang hat sie 20 Sorgen aufgeschrieben. Nach einer Woche hat sie nur noch 10 Sorgen aufgeschrieben, weil sie gemerkt hat, dass viele Sorgen sich von selbst gelöst haben, ohne dass sie etwas tun musste. Zum Beispiel: Sie hatte sich Sorgen gemacht, dass ihr Sohn die Klassenarbeit nicht schafft. Er hat sie geschafft. Sie hatte sich Sorgen gemacht, dass ihre Mutter sauer ist, weil sie nicht angerufen hat. Ihre Mutter war nicht sauer. Sie hatte sich Sorgen gemacht, dass sie zu spät zur Arbeit kommt. Sie ist nicht zu spät gekommen. Das hat ihr gezeigt, dass viele Sorgen gar keine echten Sorgen sind, sondern nur Gedanken, die ihr Angst machen, ohne dass es einen Grund dafür gibt. Wenn man sie aufschreibt, dann sieht man, dass sie nicht so schlimm sind, wie man dachte. Und wenn man sie in eine Schublade legt, dann kann man sie loslassen, weil man weiß, dass sie morgen noch da sind, wenn man sie braucht. Anna hat ihre Sorgen-Liste jeden Abend geschrieben, 5 Minuten lang, und es hat ihr geholfen, nachts besser zu schlafen, weil ihr Kopf nicht mehr grübeln musste, weil er wusste, dass die Sorgen aufgeschrieben sind und dass er sie morgen wiederfindet. Das ist der Punkt: Grübeln ist der Versuch des Gehirns, Sorgen nicht zu vergessen. Wenn man sie aufschreibt, dann muss das Gehirn sie nicht mehr im Kopf behalten, und es kann nachts ruhig sein. Ein weiterer Punkt zur Sorgen-Liste ist, dass man sie nicht nur abends schreiben sollte, sondern auch morgens, wenn man aufwacht und sich an seine Sorgen erinnert. Anna schreibt jeden Morgen, wenn sie aufwacht, ihre Sorgen-Liste aus der Schublade heraus und schaut sie sich an. Sie fragt sich bei jeder Sorge: Ist sie heute noch wichtig? Kann ich sie heute lösen? Wenn die Antwort Nein ist, dann legt sie sie wieder in die Schublade und kümmert sich morgen darum. Wenn die Antwort Ja ist, dann löst sie sie heute. Zum Beispiel: Sie hatte sich Sorgen gemacht, dass sie ihrer Mutter anrufen muss. Heute ruft sie ihre Mutter an. Das dauert 5 Minuten. Danach ist diese Sorge weg. Sie hatte sich Sorgen gemacht, dass ihr Sohn eine Klassenarbeit schreibt. Heute schreibt ihr Sohn die Klassenarbeit, ohne dass sie etwas tun kann. Sie legt diese Sorge wieder in die Schublade, weil sie nichts tun kann, um sie zu lösen. Das ist der Punkt: Man muss nicht alle Sorgen sofort lösen. Man muss nur wissen, welche Sorgen man heute lösen kann und welche nicht. Und die, die man heute nicht lösen kann, legt man wieder in die Schublade und kümmert sich morgen darum. Das ist der Unterschied zwischen Grübeln und Planen. Grübeln heißt, dass man immer wieder über die gleichen Sorgen nachdenkt, ohne sie zu lösen. Planen heißt, dass man sich fragt, welche Sorgen man heute lösen kann und welche nicht, und dass man die, die man heute lösen kann, heute löst, und die, die man heute nicht lösen kann, morgen löst. Anna plant heute, statt zu grübeln. Und das hilft ihr, nachts besser zu schlafen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Wenn du um 3 Uhr aufwachst - was du dann wirklich tun sollst", "Anna wacht oft um 3 Uhr auf. Früher hat sie dann im Bett gelegen und versucht, wieder einzuschlafen. Sie hat sich hin und her gewälzt, sie hat auf die Uhr geschaut, sie hat gedacht: Ich muss jetzt wieder einschlafen, sonst bin ich morgen müde. Und je mehr sie versucht hat, wieder einzuschlafen, desto wacher wurde sie. Heute macht sie etwas anderes. Wenn sie um 3 Uhr aufwacht und nach 20 Minuten immer noch nicht wieder eingeschlafen ist, dann steht sie auf. Sie geht ins Wohnzimmer, setzt sich auf das Sofa, und liest ein Buch. Kein spannendes Buch, sondern ein langweiliges Buch, das sie schon kennt. Sie liest, bis sie müde wird. Dann geht sie wieder ins Bett und schläft ein. Das klingt verrückt, weil man denkt, wenn man aufsteht, dann wird man noch wacher. In Wahrheit wird man müder, weil man nicht mehr im Bett liegt und sich ärgert, dass man nicht schlafen kann. Man liegt nicht mehr im Bett und denkt: Ich muss jetzt schlafen. Man sitzt auf dem Sofa und liest, ohne Druck. Und ohne Druck schläft man irgendwann ein. Die Regel ist: Wenn du nach 20 Minuten nicht wieder eingeschlafen bist, dann steh auf. Geh in ein anderes Zimmer, mach etwas Langweiliges, kein Handy, kein Fernsehen, nur Lesen oder Radio hören, leise. Geh erst wieder ins Bett, wenn du müde bist. Das ist schwer, weil man denkt, man müsse im Bett bleiben, um einzuschlafen. Aber wenn man im Bett liegt und sich ärgert, dann lernt das Gehirn: Bett heißt Ärgern. Wenn man aufsteht und erst wieder ins Bett geht, wenn man müde ist, dann lernt das Gehirn: Bett heißt Schlafen. Anna hat das 2 Wochen lang gemacht. Am Anfang ist sie jede Nacht 2 Mal aufgestanden. Nach 2 Wochen ist sie nur noch einmal aufgestanden. Nach einem Monat ist sie gar nicht mehr aufgestanden, weil sie durchgeschlafen hat. Das war der Durchbruch. Ein Beispiel, das zeigt, wie Aufstehen hilft, wenn man nicht schlafen kann: Anna ist um 3 Uhr aufgewacht und konnte nicht mehr einschlafen. Früher hat sie im Bett gelegen und sich geärgert, dass sie nicht schlafen kann. Heute steht sie auf, geht ins Wohnzimmer, setzt sich auf das Sofa, und liest ein Buch, das sie schon kennt. Sie liest, bis sie müde wird, dann geht sie wieder ins Bett. Am Anfang ist sie jede Nacht 2 Mal aufgestanden. Nach 2 Wochen nur noch einmal. Nach einem Monat gar nicht mehr, weil sie durchgeschlafen hat. Das war der Durchbruch. Sie hat gelernt, dass Aufstehen nicht bedeutet, dass man aufgibt, sondern dass man seinem Gehirn sagt: Bett heißt Schlafen, nicht Ärgern. Wenn man im Bett liegt und sich ärgert, dann lernt das Gehirn: Bett heißt Ärgern. Wenn man aufsteht und erst wieder ins Bett geht, wenn man müde ist, dann lernt das Gehirn: Bett heißt Schlafen. Das ist der Unterschied. Und es funktioniert, auch wenn es am Anfang schwer ist, weil man denkt, man müsse im Bett bleiben, um einzuschlafen. In Wahrheit schläft man besser, wenn man aufsteht, wenn man nicht schlafen kann, und erst wieder ins Bett geht, wenn man müde ist. Das ist kein Trick, das ist Wissenschaft. Und es hat Anna geholfen, wieder durchzuschlafen, ohne Tabletten, ohne Tricks, nur indem sie aufgestanden ist, wenn sie nicht schlafen konnte. Ein weiterer Punkt zu Aufwachen um 3 Uhr ist, dass man nicht auf die Uhr schauen sollte, wenn man aufwacht. Anna hat früher immer auf die Uhr geschaut, wenn sie um 3 Uhr aufgewacht ist. Sie hat gesehen, dass es schon 3 Uhr ist und dass sie noch nicht geschlafen hat, und sie ist noch nervöser geworden. Heute hat sie ihre Uhr umgedreht, damit sie nicht darauf schauen kann. Sie weiß nicht, wie spät es ist, wenn sie aufwacht. Sie weiß nur, dass sie aufgewacht ist und dass sie wieder einschlafen will. Das hilft ihr, weil sie nicht mehr weiß, wie lange sie schon wach ist und wie lange sie noch schlafen muss, bevor ihr Wecker klingelt. Sie denkt nicht mehr: Oh, es ist schon 3 Uhr, ich habe nur noch 3 Stunden, bis mein Wecker klingelt. Sie denkt nur: Ich bin aufgewacht, ich lege mich wieder hin und schlafe wieder ein. Das ist ein Unterschied. Wenn man auf die Uhr schaut, dann rechnet man aus, wie viel Schlaf einem noch fehlt, und das macht einen nervös. Wenn man nicht auf die Uhr schaut, dann rechnet man nicht aus, wie viel Schlaf einem fehlt, und man bleibt ruhiger. Anna hat ihre Uhr umgedreht, und sie schläft besser, weil sie nicht mehr auf die Uhr schaut, wenn sie aufwacht. Das ist ein kleiner Trick, aber er hilft viel. Probier es aus: Dreh deine Uhr um, damit du nicht darauf schauen kannst, wenn du nachts aufwachst. Du wirst merken, dass du ruhiger bleibst und schneller wieder einschläfst.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du aufhörst, gegen deinen Schlaf zu kämpfen, und anfängst, für deinen Schlaf zu sorgen. Wenn du jeden Tag die richtigen Dinge tust, damit du nachts gut schlafen kannst. Wenn du nicht mehr versuchst, einzuschlafen, sondern wenn du einfach nur liegst und atmest, und dein Körper von selbst einschläft, weil er müde ist und weil er weiß, dass es Zeit ist zu schlafen. Das ist der Weg, um wieder durchzuschlafen, Nacht für Nacht."], ["Schichtarbeit und Schlaf - wie Anna trotz Nachtschicht schlafen lernt", "Anna arbeitet als Krankenschwester im Schichtdienst. Manchmal hat sie Frühschicht, von 6 bis 14 Uhr. Manchmal Spätschicht, von 14 bis 22 Uhr. Manchmal Nachtschicht, von 22 bis 6 Uhr. Das ist das Schlimmste für den
