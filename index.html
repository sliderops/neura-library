s stimmt nicht. Dein Broker macht das für dich. Er zieht die Steuern automatisch ab und gibt sie ans Finanzamt weiter. Du musst nur in deiner Steuererklärung angeben, dass du ein Depot hast. Das ist alles. Und wenn du dir nicht sicher bist, dann kannst du einen Lohnsteuerhilfeverein fragen, der dir hilft. Das kostet wenig und es lohnt sich. Ein weiterer Punkt zu Steuern ist, dass du deine Steuererklärung nicht allein machen musst, wenn du dir unsicher bist. Michael hat seine erste Steuererklärung mit einem Programm gemacht, das ihn Schritt für Schritt durchführt. Das hat 30 Euro gekostet, aber es hat sich gelohnt, weil er 1.240 Euro zurückbekommen hat. Er hat in dem Programm angegeben, dass er ein Depot hat, und das Programm hat alles andere automatisch gemacht. Er musste nur seine Lohnsteuerbescheinigung eingeben und seine Belege für Fahrtkosten und Fortbildungen. Das war alles. Wenn du dir unsicher bist, dann kannst du auch zum Lohnsteuerhilfeverein gehen, der dir hilft, wenn du nicht zu viel verdienst. Das kostet wenig und es lohnt sich. Und: Wenn du einen ETF hast, dann musst du in deiner Steuererklärung angeben, dass du ein Depot hast. Das ist alles. Dein Broker gibt dir jedes Jahr eine Bescheinigung, auf der steht, wie viel Gewinn du gemacht hast und wie viel Steuern du schon gezahlt hast. Diese Bescheinigung gibst du in deiner Steuererklärung an. Das ist alles. Du musst keine komplizierten Formulare ausfüllen. Dein Broker macht das für dich. Das ist der Grund, warum du keine Angst vor Steuern haben musst, wenn du in ETFs investierst. Steuern sind kein Grund, nicht zu investieren. Dein Broker macht das für dich. Er zieht die Steuern automatisch ab und gibt sie ans Finanzamt weiter. Du musst nur in deiner Steuererklärung angeben, dass du ein Depot hast. Und die ersten 1.000 Euro Gewinn im Jahr sind steuerfrei. Das heißt, in den ersten Jahren zahlst du gar keine Steuern, weil dein Gewinn noch unter 1.000 Euro ist. Das ist ein Geschenk, das du nutzen solltest.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Die 5 Fehler, die Anfänger immer machen", "Fehler Nummer 1: Man kauft, weil ein Freund gesagt hat, dass eine Aktie gut ist. Michael hat einen Freund, der ihm gesagt hat, dass er eine bestimmte Aktie kaufen soll, weil sie bald steigen wird. Michael hat sie nicht gekauft, weil er nur ETFs kauft. Sein Freund hat die Aktie gekauft und hat 40 Prozent verloren, weil die Aktie gefallen ist. Der Freund hatte auf einen Tipp gehört, ohne zu wissen, was er da kauft. Fehler Nummer 2: Man schaut jeden Tag auf sein Depot. Michael hat am Anfang jeden Tag auf sein Depot geschaut. Wenn es gefallen ist, war er traurig. Wenn es gestiegen ist, war er glücklich. Das hat ihn verrückt gemacht. Heute schaut er nur noch einmal im Monat auf sein Depot, wenn sein Sparplan ausgeführt wird. Das reicht. Fehler Nummer 3: Man verkauft, wenn es fällt. Das haben wir schon besprochen. Wer verkauft, wenn es fällt, macht den Verlust wirklich. Fehler Nummer 4: Man kauft zu viele verschiedene ETFs. Michael hat am Anfang gedacht, er müsse 10 ETFs haben, um sicher zu sein. In Wahrheit reicht einer. Wer 10 ETFs hat, der hat nur mehr Arbeit und mehr Gebühren, aber nicht mehr Sicherheit. Fehler Nummer 5: Man wartet auf den perfekten Zeitpunkt. Michael hat einen Kollegen, der seit 5 Jahren sagt: Ich warte, bis die Börse fällt, dann kaufe ich. Die Börse ist in den 5 Jahren um 60 Prozent gestiegen. Er hat 5 Jahre gewartet und hat nichts verdient. Michael hat nicht gewartet. Er hat einfach angefangen. Und er hat in den 5 Jahren 60 Prozent Gewinn gemacht, weil er angefangen hat, statt zu warten. Ein Beispiel, das zeigt, wie teuer Fehler sein können: Michael hat einen Kollegen, der in Kryptowährungen investiert hat, weil ein Freund gesagt hat, dass man damit schnell reich wird. Der Kollege hat 2.000 Euro in eine Kryptowährung gesteckt, die er nicht verstanden hat. Nach einem Monat war sie nur noch 500 Euro wert. Er hat 1.500 Euro verloren. Er hat nicht verstanden, was er da gekauft hat. Er hat nur auf einen Tipp gehört. Michael hat das nicht gemacht. Er hat nur einen ETF gekauft, den er versteht. Er weiß, was drin ist: 1.500 Firmen aus der ganzen Welt. Er weiß, wie viel er kostet: 0,2 Prozent im Jahr. Er weiß, wie lange er ihn halten will: 20 Jahre. Das ist der Unterschied zwischen Investieren und Zocken. Investieren heißt: Man kauft etwas, das man versteht, und man hält es lange. Zocken heißt: Man kauft etwas, das man nicht versteht, weil man hofft, dass es schnell steigt. Michael investiert, er zockt nicht. Und deshalb wird er langfristig Gewinn machen, während sein Kollege, der zockt, langfristig verlieren wird. Das ist kein Zufall, das ist Mathematik. Wer zockt, verliert langfristig immer. Wer investiert, gewinnt langfristig fast immer, wenn er lange genug dabei bleibt. Ein weiterer Punkt zu Fehlern ist, dass man aus Fehlern lernen kann. Michael hat am Anfang den Fehler gemacht, dass er jeden Tag auf sein Depot geschaut hat. Er hat gemerkt, dass ihn das verrückt gemacht hat, und er hat aufgehört, jeden Tag drauf zu schauen. Er schaut jetzt nur noch einmal im Monat drauf. Das war ein Fehler, aus dem er gelernt hat. Sein Freund hat den Fehler gemacht, dass er auf einen Tipp gehört hat und 2.000 Euro verloren hat. Er hat daraus gelernt, dass man nicht auf Tipps hören sollte, sondern nur in Dinge investieren sollte, die man versteht. Fehler sind nicht schlimm, wenn man aus ihnen lernt. Sie sind nur schlimm, wenn man sie immer wieder macht, ohne daraus zu lernen. Michael hat aus seinen Fehlern gelernt, und deshalb macht er sie nicht mehr. Sein Freund hat aus seinem Fehler gelernt, und er investiert jetzt auch nur noch in ETFs, die er versteht. Das ist der Punkt: Fehler sind Lehrer, wenn man ihnen zuhört. Wenn man sie ignoriert, dann wiederholen sie sich. Hör deinen Fehlern zu, lerne aus ihnen, und mach sie nicht wieder. Dann wirst du besser, nicht nur beim Investieren, sondern in allem, was du tust. Fehler sind Lehrer, wenn man ihnen zuhört. Wenn du einen Fehler machst und daraus lernst, dann war der Fehler gut, weil er dich weitergebracht hat. Wenn du einen Fehler machst und ihn immer wieder machst, ohne daraus zu lernen, dann war der Fehler schlecht, weil er dich nicht weitergebracht hat. Hör deinen Fehlern zu, lerne aus ihnen, und mach sie nicht wieder. Dann wirst du besser, nicht nur beim Investieren, sondern in allem.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Wie viel solltest du monatlich investieren - ohne dass es weh tut", "Michael verdient 2.400 Euro netto im Monat. Er hat zuerst ausgerechnet, was er jeden Monat braucht: Miete 800 Euro, Essen 300 Euro, Auto 200 Euro, Handy und Internet 80 Euro, Versicherungen 150 Euro. Das sind 1.530 Euro. Er hat also 870 Euro übrig. Davon legt er 200 Euro auf sein Tagesgeldkonto, für Notfälle, wenn die Waschmaschine kaputt geht oder das Auto repariert werden muss. Und 100 Euro steckt er in seinen ETF. Der Rest, 570 Euro, ist für alles andere: Klamotten, Urlaub, Ausgehen, Geschenke. Das ist sein Plan. Er investiert nicht so viel, dass es weh tut. Er investiert so viel, dass er es gar nicht merkt. Die Regel ist: Erst das Wichtige, dann das Investieren, dann das Vergnügen. Viele Menschen machen es andersherum: Erst das Vergnügen, dann das Investieren, wenn noch was übrig ist. Am Ende ist nie was übrig. Deshalb ist ein Sparplan so gut: Er wird automatisch am 1. des Monats abgebucht, bevor du das Geld für Vergnügen ausgeben kannst. Du musst dich nicht entscheiden, ob du investieren willst oder nicht. Es passiert automatisch. Wie viel solltest du investieren? Fang mit dem an, was du nicht merkst. Wenn du 25 Euro nicht merkst, dann fang mit 25 Euro an. Wenn du 50 Euro nicht merkst, dann fang mit 50 Euro an. Wenn du 100 Euro nicht merkst, dann fang mit 100 Euro an. Steigere dich langsam. Michael hat mit 50 Euro angefangen und ist nach einem Jahr auf 100 Euro gegangen, weil er gemerkt hat, dass er die 50 Euro gar nicht vermisst hat. Das ist der Weg: Klein anfangen, langsam steigern, dranbleiben. Ein Beispiel, das zeigt, wie viel man investieren sollte: Michael hat eine Freundin, die 3.000 Euro netto verdient und 500 Euro im Monat investiert. Sie hat am Anfang 500 Euro investiert und hat gemerkt, dass es weh tut, weil sie am Ende des Monats kaum noch Geld für andere Dinge hatte. Sie hat dann auf 200 Euro reduziert und hat gemerkt, dass das besser ist. Sie investiert jetzt 200 Euro im Monat und hat noch genug Geld für Urlaub, für Essen, für Klamotten. Das ist der Punkt: Man sollte so viel investieren, dass es nicht weh tut. Wenn es weh tut, dann hört man auf. Wenn es nicht weh tut, dann bleibt man dran. Michael investiert 100 Euro im Monat, weil er das nicht merkt. Seine Freundin investiert 200 Euro, weil sie das nicht merkt. Jeder muss selbst herausfinden, wie viel er investieren kann, ohne dass es weh tut. Die Regel ist: Erst das Wichtige, dann das Investieren, dann das Vergnügen. Wenn du das einhältst, dann investierst du jeden Monat, ohne dass es weh tut. Und wenn du merkst, dass du mehr investieren kannst, dann steigerst du dich langsam. Michael hat mit 50 Euro angefangen und ist nach einem Jahr auf 100 Euro gegangen. Das war kein großer Sprung, aber es war ein Schritt in die richtige Richtung. Ein weiterer Punkt zu monatlich investieren ist, dass man auch mal mehr investieren kann, wenn man mehr Geld hat. Michael hat zu Weihnachten 500 Euro Weihnachtsgeld bekommen. Er hat 250 Euro davon in seinen ETF gesteckt und 250 Euro für Weihnachtsgeschenke ausgegeben. Das war kein Verzicht, das war eine Aufteilung, die sich gut angefühlt hat. Er hat etwas für sich selbst getan und etwas für seine Familie. Das ist der Punkt: Wenn du zusätzliches Geld bekommst, zum Beispiel Weihnachtsgeld, Urlaubsgeld, Steuerrückzahlung, dann steck nicht alles in deinen ETF, sondern die Hälfte. Die andere Hälfte darfst du ausgeben, für dich selbst, für deine Familie, für etwas, das dir Freude macht. So hast du beides: Du investierst und du lebst. Wer alles investiert und nie etwas ausgibt, der wird unglücklich. Wer alles ausgibt und nie investiert, der wird im Alter arm sein. Die Hälfte ist ein guter Kompromiss. Michael hat das so gemacht, und es hat ihm gut getan, weil er das Gefühl hatte, dass er sich selbst etwas gönnt und gleichzeitig für seine Zukunft sorgt. Das ist kein Verzicht, das ist Balance. Wie viel du monatlich investieren solltest, hängt davon ab, wie viel du übrig hast, ohne dass es weh tut. Fang mit dem an, was du nicht merkst. Wenn du 25 Euro nicht merkst, dann fang mit 25 Euro an. Wenn du 50 Euro nicht merkst, dann fang mit 50 Euro an. Steigere dich langsam, wenn du merkst, dass du mehr kannst. Und wenn du mal einen Monat pausieren musst, dann ist das kein Scheitern, das ist Leben. Fang danach wieder an.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Michael 3 Jahre später - was sich wirklich verändert hat", "Michael hat jetzt seit 3 Jahren einen ETF-Sparplan. Er hat 3.600 Euro eingezahlt, 100 Euro im Monat. Sein Depot ist heute 4.400 Euro wert. Er hat also 800 Euro Gewinn gemacht, ohne etwas zu tun, außer dass er jeden Monat 100 Euro überwiesen hat. Das ist nicht viel Geld, aber es ist ein Anfang. Und es ist mehr, als er auf dem Sparbuch bekommen hätte. Auf dem Sparbuch hätte er in 3 Jahren 3.610 Euro gehabt, also 10 Euro Zinsen. Im ETF hat er 800 Euro Gewinn. Das ist 80 Mal mehr. Aber das Wichtigste ist nicht das Geld. Das Wichtigste ist, dass Michael sich verändert hat. Früher hat er gedacht, Geld sei etwas, das man nicht versteht, wenn man nicht studiert hat. Heute weiß er, dass er Geld verstehen kann, auch wenn er Lagerarbeiter ist. Früher hat er gedacht, Investieren sei nur was für Reiche. Heute weiß er, dass Investieren für jeden ist, der 25 Euro im Monat übrig hat. Früher hat er Angst vor der Börse gehabt. Heute schaut er einmal im Monat auf sein Depot und freut sich, wenn es gestiegen ist, und er bleibt ruhig, wenn es gefallen ist, weil er weiß, dass es wieder steigen wird. Sein Sohn ist stolz auf ihn. Er sagt: Papa, du hast es geschafft. Du hast angefangen. Das ist das Wichtigste. Michael hat nicht viel Geld, aber er hat angefangen. Und wer angefangen hat, der ist schon weiter als alle, die noch warten. Ein Beispiel, das zeigt, was sich nach 3 Jahren verändert hat: Michael hat nach 3 Jahren nicht nur mehr Geld, sondern auch mehr Selbstvertrauen. Früher hat er gedacht, Geld sei etwas, das nur Reiche verstehen. Heute weiß er, dass er Geld verstehen kann, auch wenn er Lagerarbeiter ist. Früher hat er gedacht, er müsse viel Geld haben, um zu investieren. Heute weiß er, dass er mit 25 Euro anfangen kann. Früher hat er Angst vor der Börse gehabt. Heute schaut er einmal im Monat auf sein Depot und bleibt ruhig, auch wenn es gefallen ist. Das ist der größte Gewinn: Nicht das Geld, sondern das Selbstvertrauen. Michael hat seinem Sohn beigebracht, wie man einen ETF kauft. Sein Sohn ist 18 und hat jetzt auch einen Sparplan mit 25 Euro im Monat. Er wird mit 65 viel mehr Geld haben als Michael, weil er früher angefangen hat. Das ist das Schönste an der Geschichte: Michael hat nicht nur für sich selbst etwas verändert, sondern auch für seinen Sohn. Er hat ihm gezeigt, dass man nicht reich sein muss, um zu investieren. Man muss nur anfangen. Und das ist ein Geschenk, das mehr wert ist als jedes Geld, das man auf dem Sparbuch liegen lassen könnte. Ein weiterer Punkt zu Michael 3 Jahre später ist, dass er nicht nur für sich selbst etwas verändert hat, sondern auch für seine Familie. Seine Frau hat jetzt auch einen Sparplan mit 50 Euro im Monat. Sie hat am Anfang gesagt: Ich verstehe nichts von Börse. Michael hat ihr das Buch gegeben und gesagt: Lies das, es ist ohne Fachchinesisch. Sie hat es gelesen und hat verstanden, was ein ETF ist. Jetzt investiert sie auch. Und sein Sohn investiert auch, mit 25 Euro im Monat. Die ganze Familie investiert jetzt. Das ist das Schönste an der Geschichte: Michael hat nicht nur sein eigenes Leben verändert, sondern auch das Leben seiner Familie. Er hat ihnen gezeigt, dass man nicht reich sein muss, um zu investieren. Man muss nur anfangen. Und er hat ihnen gezeigt, dass Investieren nicht kompliziert ist, wenn man es einfach erklärt bekommt. Das ist ein Geschenk, das mehr wert ist als jedes Geld, das man auf dem Sparbuch liegen lassen könnte. Denn Geld, das man auf dem Sparbuch liegen lässt, wird weniger wert. Wissen, das man weitergibt, wird mehr wert, weil es sich vermehrt, wenn man es teilt. Michael hat nach 3 Jahren nicht nur mehr Geld, sondern auch mehr Selbstvertrauen. Er weiß jetzt, dass er Geld verstehen kann, auch wenn er Lagerarbeiter ist. Er weiß, dass er investieren kann, auch wenn er nicht reich ist. Und er hat seinem Sohn beigebracht, wie man investiert. Das ist das Schönste an der Geschichte: Er hat nicht nur sein eigenes Leben verändert, sondern auch das Leben seiner Familie. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."], ["Dein Plan für die nächsten 30 Tage - dein erster ETF in 4 Schritten", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein macht dich nicht reicher. Deshalb hier dein Plan für die nächsten 30 Tage. Woche 1: Rechne aus, wie viel Geld du im Monat übrig hast. Schreib auf, was du einnimmst und was du ausgibst. Woche 2: Eröffne ein Depot. Das dauert 15 Minuten. Du brauchst nur deinen Personalausweis und dein Handy. Woche 3: Richte einen Sparplan ein. Fang mit 25 Euro oder 50 Euro oder 100 Euro an, je nachdem, was du nicht merkst. Nimm einen MSCI World ETF. Woche 4: Lass den Sparplan laufen und schau nicht jeden Tag auf dein Depot. Schau einmal im Monat drauf, wenn dein Sparplan ausgeführt wird. Das ist alles. Nach 30 Tagen hast du deinen ersten ETF. Nach einem Jahr hast du 300 Euro oder 600 Euro oder 1.200 Euro investiert, je nachdem, wie viel du im Monat investierst. Nach 10 Jahren hast du viel mehr, weil der Zinseszins für dich arbeitet. Nach 20 Jahren hast du noch viel mehr. Michael hat mit 45 Jahren angefangen. Du kannst heute anfangen, egal wie alt du bist. Fang nicht morgen an. Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. In 30 Tagen wirst du dich wundern, was sich verändert hat. Nicht weil du reich geworden bist, sondern weil du angefangen hast. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann bist du schon weiter als alle, die noch warten. Ein Beispiel, das zeigt, wie der 30-Tage-Plan funktioniert: Michael hat in der ersten Woche nur ausgerechnet, wie viel Geld er im Monat übrig hat. Er hat gemerkt, dass er 870 Euro übrig hat, nachdem er alles bezahlt hat. In der zweiten Woche hat er ein Depot eröffnet. Das hat 15 Minuten gedauert. In der dritten Woche hat er einen Sparplan eingerichtet, mit 50 Euro im Monat. In der vierten Woche hat er seinen Sparplan laufen lassen und nicht jeden Tag auf sein Depot geschaut. Nach 30 Tagen hatte er seinen ersten ETF. Nach einem Jahr hatte er 600 Euro investiert. Nach 3 Jahren hatte er 3.600 Euro investiert und 4.400 Euro auf dem Depot. Das ist kein Wunder, das ist ein Plan, der funktioniert, weil er klein und machbar ist. Du musst nicht in 30 Tagen reich werden. Du musst in 30 Tagen anfangen. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann bist du schon weiter als alle, die noch warten. Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. In 30 Tagen wirst du dich wundern, was sich verändert hat. Ein weiterer Punkt zum 30-Tage-Plan ist, dass du nach 30 Tagen nicht fertig bist. Nach 30 Tagen hast du angefangen, aber du bist noch lange nicht am Ziel. Du musst dranbleiben, Monat für Monat, Jahr für Jahr. Michael hat nach 30 Tagen angefangen, aber er ist nach 3 Jahren immer noch dabei. Er wird auch in 10 Jahren noch dabei sein, und in 20 Jahren. Das ist der Punkt: Investieren ist kein Sprint, sondern ein Marathon. Man muss nicht schnell sein, man muss nur dranbleiben. Wer dranbleibt, der gewinnt langfristig. Wer aufhört, weil es einmal nicht gut läuft, der verliert. Michael bleibt dran, auch wenn die Börse fällt, auch wenn er mal einen Monat pausieren muss, auch wenn er mal Zweifel hat. Er bleibt dran, weil er weiß, dass es sich lohnt. Und das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du anfängst, und dass du dranbleibst, Monat für Monat, Jahr für Jahr, bis du mit 65 sagen kannst: Ich habe es geschafft. Ich habe angefangen, und ich bin drangeblieben. Und das ist mehr wert als jedes Geld, das man auf dem Sparbuch liegen lassen könnte. Nach 30 Tagen bist du nicht fertig, aber du hast angefangen. Und Anfangen ist der schwerste Teil. Wenn du angefangen hast, dann bist du schon weiter als alle, die noch warten. Bleib dran, Monat für Monat, Jahr für Jahr. Und wenn du einmal pausieren musst, dann fang danach wieder an. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher, Schritt für Schritt, Tag für Tag.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr wartest, bis du alles weißt, sondern wenn du anfängst, mit dem, was du hast, auch wenn es nur 25 Euro sind. Wenn du anfängst, dann lernst du dabei, und wenn du dabei lernst, dann wirst du besser, Monat für Monat, Jahr für Jahr. Und in 20 Jahren wirst du sagen: Ich bin froh, dass ich damals angefangen habe, auch wenn ich Angst hatte. Das ist der Weg, um mit ETFs Geld zu verdienen, nicht schnell, sondern langsam, aber sicher.  Fang heute an. Mit 15 Minuten für dein Depot und 25 Euro für deinen ersten Sparplan. Das ist alles, was du brauchst, um anzufangen."]], "kat": "Sachbücher", "unter": "Geld & Freiheit"}, {"title": "Nein sagen, ohne schlechtes Gewissen", "chapters": [["Die Frau, die nie Nein sagen konnte", "Lena ist 38, arbeitet in Bielefeld in einem Büro, und sie hat ein Problem, das sie lange nicht als Problem gesehen hat. Sie sagt nie Nein. Wenn ihre Chefin fragt, ob sie am Wochenende arbeiten kann, sagt Lena Ja, obwohl sie eigentlich mit ihren Kindern zum See wollte. Wenn ihre Freundin fragt, ob sie ihr beim Umzug helfen kann, sagt Lena Ja, obwohl sie selbst schon Rückenschmerzen hat. Wenn ihre Mutter anruft und fragt, ob sie am Sonntag zum Essen kommen kann, sagt Lena Ja, obwohl sie eigentlich einfach nur ausschlafen wollte. Am Anfang dachte Lena, das sei nett. Sie dachte, nette Menschen sagen immer Ja. Dann hat sie gemerkt, dass sie immer müder wurde. Sie hatte keine Zeit mehr für sich selbst. Sie war gereizt, weil sie immer Dinge tat, die sie eigentlich nicht tun wollte. Eines Abends saß sie auf dem Sofa und hat geweint, ohne zu wissen, warum. Sie hatte alles, was man haben sollte: einen Job, einen Mann, zwei Kinder, Freunde. Aber sie fühlte sich leer. Sie ist zu einer Beratung gegangen. Die Beraterin hat sie gefragt: Wann hast du das letzte Mal Nein gesagt, ohne dich dafür zu entschuldigen? Lena konnte sich nicht erinnern. Sie hat immer Ja gesagt, zu allem und zu jedem. Die Beraterin hat ihr gesagt: Du musst nicht lernen, egoistisch zu sein. Du musst lernen, Nein zu sagen, ohne dich schlecht zu fühlen. Denn Nein sagen ist kein Angriff auf andere. Es ist eine Entscheidung für dich selbst. In diesem Buch gehen wir genau das durch: Warum du so schwer Nein sagen kannst, was das schlechte Gewissen wirklich ist, und wie du lernst, Nein zu sagen, ohne dass du dich danach schlecht fühlst. Was Lena danach noch gelernt hat, war, dass Ja sagen nicht immer nett ist. Manchmal ist Ja sagen unfair, weil man der anderen Person nicht die Wahrheit sagt. Wenn Lena zu ihrer Chefin Ja gesagt hat, obwohl sie eigentlich Nein meinte, dann hat sie ihrer Chefin nicht geholfen, sondern sie hat ihr vorgemacht, dass alles in Ordnung ist. In Wahrheit war Lena wütend, und ihre Chefin hat das gespürt, ohne zu wissen, warum. Das hat ihre Beziehung schlechter gemacht, nicht besser. Als Lena angefangen hat, ehrlich Nein zu sagen, hat ihre Chefin das zuerst komisch gefunden, aber nach einer Weile hat sie gesagt: Jetzt weiß ich wenigstens, woran ich bin. Das ist ehrlicher als ein Ja, das man nicht meint. Lena hat auch gelernt, dass man nicht für alles verantwortlich ist. Früher dachte sie, sie müsse alle Probleme lösen, die andere hatten. Wenn ihre Mutter traurig war, dann dachte Lena, sie müsse sie aufmuntern. Wenn ihr Mann gestresst war, dann dachte Lena, sie müsse ihn beruhigen. Heute weiß sie: Jeder ist für seine eigenen Gefühle verantwortlich. Sie kann da sein, sie kann zuhören, sie kann helfen, wenn sie will. Aber sie muss nicht die Gefühle von anderen reparieren. Das hat sie entlastet, weil sie nicht mehr das Gefühl hatte, dass sie für das Glück aller anderen verantwortlich ist. Sie ist nur für ihr eigenes Glück verantwortlich. Und das ist schon genug Arbeit. Ein weiterer Punkt, den Lena gelernt hat, ist, dass man nicht alles auf einmal ändern muss. Sie hat nicht von heute auf morgen angefangen, überall Nein zu sagen. Sie hat mit einer Sache angefangen: Sie hat einmal am Tag Nein gesagt, wenn sie Nein meinte. Nur einmal. Das war machbar. Nach einer Woche hat sie zweimal am Tag Nein gesagt. Nach einem Monat hat sie so oft Nein gesagt, wie sie Nein meinte. Das ist der Unterschied zwischen einem Plan, der funktioniert, und einem Plan, der nicht funktioniert. Ein Plan, der funktioniert, ist klein und machbar. Ein Plan, der nicht funktioniert, ist groß und überfordernd. Lena hat auch gelernt, dass Rückschläge normal sind. Es gab Tage, an denen sie wieder Ja gesagt hat, obwohl sie Nein meinte. Das war kein Scheitern, das war ein Rückfall. Sie hat sich nicht dafür bestraft, sondern sie hat gesagt: Okay, heute habe ich wieder Ja gesagt, morgen versuche ich es wieder. Das ist der Unterschied zwischen Aufgeben und Weitermachen. Wer aufgibt, wenn er einmal einen Rückfall hat, der wird nie etwas ändern. Wer weitermacht, auch wenn er einmal einen Rückfall hat, der wird etwas ändern, Schritt für Schritt, Tag für Tag. Und das ist der Punkt: Es geht nicht darum, perfekt zu sein, sondern darum, dran zu bleiben, auch wenn es einmal nicht klappt. Was Lena am Ende am meisten geholfen hat, war nicht ein einzelner Trick, sondern die Erkenntnis, dass sie nicht egoistisch ist, wenn sie Nein sagt. Sie ist nicht egoistisch, sie ist ehrlich. Und Ehrlichkeit ist besser als ein Ja, das man nicht meint. Wenn du Nein sagst, wenn du Nein meinst, dann bist du ehrlich, zu dir selbst und zu anderen. Und Ehrlichkeit macht frei, auch wenn es am Anfang schwer ist.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Warum Nein sagen so schwer ist - was du als Kind gelernt hast", "Als Kind hast du gelernt, dass Ja sagen belohnt wird und Nein sagen bestraft wird. Wenn du als Kind Ja gesagt hast, wenn deine Mutter dich gefragt hat, ob du ihr helfen kannst, dann hat sie gesagt: Du bist ein braves Kind. Wenn du Nein gesagt hast, dann hat sie gesagt: Sei nicht so egoistisch. Du hast gelernt: Ja sagen heißt geliebt werden. Nein sagen heißt abgelehnt werden. Lena hat das als Kind gelernt. Ihre Eltern haben sie gelobt, wenn sie Ja gesagt hat, und sie haben sie kritisiert, wenn sie Nein gesagt hat. Sie hat daraus eine Regel gemacht, die ihr ganzes Leben bestimmt hat: Ich muss immer Ja sagen, sonst mag mich keiner. Als Erwachsene glaubt sie das immer noch, obwohl es nicht stimmt. Denn Erwachsene, die dich wirklich mögen, mögen dich auch, wenn du Nein sagst. Aber dein inneres Kind glaubt das immer noch. Es denkt, wenn du Nein sagst, dann wirst du nicht mehr geliebt. Das ist der Grund, warum Nein sagen so schwer ist. Es ist nicht nur ein Wort. Es ist eine Angst, die tief in dir sitzt. Eine Angst, die du als Kind gelernt hast und die du als Erwachsene immer noch hast. Die Aufgabe ist, diese alte Regel zu finden und zu prüfen, ob sie heute noch stimmt. Frag dich: Wenn ich heute Nein sage, werde ich dann wirklich nicht mehr gemocht? Oder ist das nur eine alte Angst, die ich als Kind gelernt habe und die heute gar nicht mehr stimmt? Ein Beispiel, das zeigt, wie tief solche Regeln sitzen: Lena hat einmal in einer Besprechung eine Idee gehabt, aber sie hat sie nicht gesagt, weil sie dachte, sie sei nicht gut genug. Nach der Besprechung hat eine Kollegin die gleiche Idee gesagt, und alle haben sie gelobt. Lena war wütend auf sich selbst, weil sie ihre Idee nicht gesagt hatte. Sie hat gemerkt, dass ihre Regel Ich muss immer perfekt sein, sonst bin ich nichts wert, sie daran gehindert hat, ihre Idee zu sagen. Sie dachte, ihre Idee müsse perfekt sein, sonst dürfe sie sie nicht sagen. In Wahrheit war ihre Idee gut genug, auch wenn sie nicht perfekt war. Das ist der Punkt: Perfekt gibt es nicht. Jede Idee, die man nicht sagt, ist eine verpasste Chance. Lena hat angefangen, ihre Ideen zu sagen, auch wenn sie nicht perfekt sind. Sie hat gesagt: Ich habe eine Idee, sie ist noch nicht ganz ausgereift, aber vielleicht hilft sie uns weiter. Das war schwer, weil sie sich dabei verletzlich gefühlt hat. Aber es hat funktioniert, weil ihre Kollegen ihre Ideen geschätzt haben, auch wenn sie nicht perfekt waren. Sie haben gesagt: Danke, dass du das gesagt hast, das hilft uns. Das hat Lena gezeigt, dass ihre Regel nicht stimmt. Man muss nicht perfekt sein, um etwas Wertvolles zu sagen. Man muss nur mutig genug sein, es zu sagen, auch wenn es nicht perfekt ist. Ein weiterer Punkt ist, dass man seine Kindheit nicht ändern kann, aber man kann ändern, was man daraus macht. Lena kann nicht ändern, dass ihre Eltern ihr beigebracht haben, immer Ja zu sagen. Aber sie kann ändern, was sie heute daraus macht. Sie kann die alte Regel prüfen und fragen: Stimmt sie heute noch? Und wenn sie nicht mehr stimmt, dann kann sie eine neue Regel aufstellen, die zu dem Leben passt, das sie heute führen will. Zum Beispiel: Ich darf Nein sagen, wenn ich Nein meine, und ich werde trotzdem gemocht. Das ist eine neue Regel, die besser zu ihrem Leben passt als die alte Regel: Ich muss immer Ja sagen, sonst mag mich keiner. Die alte Regel hat sie als Kind gelernt, als sie noch klein war und von ihren Eltern abhängig war. Die neue Regel hat sie als Erwachsene gelernt, als sie gemerkt hat, dass sie auch Nein sagen kann und trotzdem gemocht wird. Das ist der Unterschied zwischen Kindheit und Erwachsensein: Als Kind muss man Ja sagen, um geliebt zu werden. Als Erwachsene darf man Nein sagen und wird trotzdem geliebt. Das ist eine Erkenntnis, die Lena frei gemacht hat, weil sie gemerkt hat, dass sie nicht mehr ein Kind ist, das brav sein muss, sondern eine Erwachsene, die selbst entscheiden darf, was sie will und was sie nicht will. Deine Kindheit ist nicht deine Schuld, aber sie ist deine Verantwortung. Du kannst nicht ändern, was deine Eltern damals gemacht haben, aber du kannst ändern, was du heute daraus machst. Du kannst die alte Regel prüfen und eine neue Regel aufstellen, die besser zu deinem Leben passt. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Das schlechte Gewissen - was es wirklich ist", "Wenn Lena Nein sagt, dann hat sie sofort ein schlechtes Gewissen. Sie denkt: Oh, jetzt ist die andere Person sauer auf mich. Jetzt denkt sie, ich sei egoistisch. Jetzt mag sie mich nicht mehr. Das schlechte Gewissen ist wie ein Alarm, der in ihrem Kopf losgeht, sobald sie Nein sagt. Aber was ist das schlechte Gewissen wirklich? Es ist kein Beweis, dass du etwas Falsches getan hast. Es ist nur ein Gefühl, das dir sagt, dass du etwas getan hast, was du früher nicht tun durftest. Als Kind durftest du nicht Nein sagen. Heute darfst du es. Aber dein schlechtes Gewissen weiß das noch nicht. Es denkt immer noch, du seist ein Kind, das brav sein muss. Das schlechte Gewissen ist wie ein alter Wecker, der immer noch klingelt, obwohl du schon wach bist. Du musst ihn nicht glauben. Du musst nur wissen, dass er klingeln wird, wenn du Nein sagst, und dass er nach einer Weile wieder aufhört zu klingeln. Lena hat gelernt, dass das schlechte Gewissen nach einem Nein etwa eine Stunde lang da ist und dann wieder weggeht. Am Anfang dachte sie, es würde für immer bleiben. Jetzt weiß sie: Es geht vorbei. Es ist wie ein Muskelkater, wenn man das erste Mal Sport macht. Es tut weh, aber es geht vorbei. Und je öfter man Nein sagt, desto weniger tut es weh. Nach drei Monaten hat Lena gemerkt, dass ihr schlechtes Gewissen nach einem Nein nur noch 10 Minuten da war, nicht mehr eine Stunde. Nach sechs Monaten war es fast gar nicht mehr da. Das ist der Weg: Nicht warten, bis das schlechte Gewissen weg ist, sondern Nein sagen, obwohl es da ist. Ein Beispiel, das zeigt, wie das schlechte Gewissen arbeitet: Lena hat einmal Nein gesagt, als ihre Freundin sie gefragt hat, ob sie ihr beim Umzug helfen kann. Sie hat gesagt: Nein, das geht bei mir heute nicht, weil ich Rückenschmerzen habe. Danach hatte sie eine Stunde lang ein schlechtes Gewissen. Sie dachte: Jetzt denkt meine Freundin, ich sei eine schlechte Freundin. Sie dachte: Jetzt mag sie mich nicht mehr. In Wahrheit hat ihre Freundin das schon nach fünf Minuten vergessen. Sie hat jemand anderen gefragt, und der hat Ja gesagt. Lena hat gelernt, dass das schlechte Gewissen lügt. Es sagt dir, dass alles schlimm wird, wenn du Nein sagst. In Wahrheit wird gar nichts schlimm. Die andere Person findet jemand anderen, oder sie macht es allein, oder sie verschiebt es auf nächste Woche. Das Leben geht weiter, auch wenn du Nein sagst. Das ist der Grund, warum das schlechte Gewissen so schwer zu ertragen ist: Man überschätzt, wie schlimm es wird. Wenn man es einmal gemacht hat, merkt man, dass es gar nicht so schlimm war. Und beim zweiten Mal ist es schon leichter. Beim dritten Mal ist es schon fast normal. Lena sagt heute Nein, ohne darüber nachzudenken, wenn sie Nein meint. Das ist kein Talent, das ist Übung. Und Übung macht den Meister, auch beim Nein sagen. Ein weiterer Punkt zum schlechten Gewissen ist, dass es nicht immer Recht hat. Manchmal hat man ein schlechtes Gewissen, obwohl man nichts Falsches getan hat. Lena hatte ein schlechtes Gewissen, als sie Nein gesagt hat, obwohl sie nichts Falsches getan hat. Sie hat nur Nein gesagt, weil sie keine Zeit hatte. Das ist kein Verbrechen. Das ist eine Entscheidung. Aber ihr schlechtes Gewissen hat ihr gesagt, dass sie etwas Falsches getan hat. Sie hat gelernt, dass das schlechte Gewissen lügt. Es sagt dir, dass du etwas Falsches getan hast, auch wenn du etwas Richtiges getan hast. Du musst lernen, zwischen einem schlechten Gewissen, das Recht hat, und einem schlechten Gewissen, das lügt, zu unterscheiden. Wenn du jemanden absichtlich verletzt hast, dann hast du Recht, ein schlechtes Gewissen zu haben. Dann solltest du dich entschuldigen. Wenn du nur Nein gesagt hast, weil du keine Zeit hattest, dann hast du kein Recht, ein schlechtes Gewissen zu haben. Dann lügt dein schlechtes Gewissen. Lena hat gelernt, das zu unterscheiden. Sie fragt sich heute: Habe ich jemanden absichtlich verletzt? Wenn die Antwort Nein ist, dann sagt sie zu ihrem schlechten Gewissen: Danke, dass du mich warnen willst, aber ich habe nichts Falsches getan. Und dann lässt sie das schlechte Gewissen wieder los, ohne ihm zu glauben. Das schlechte Gewissen wird nie ganz verschwinden. Es wird immer da sein, leise im Hintergrund. Aber es muss nicht mehr der Chef in deinem Kopf sein. Du kannst es zu einem Berater machen, der dir sagt, dass du etwas Neues machst, ohne dich dabei klein zu machen. Und wenn es klingelt, dann kannst du sagen: Danke, dass du mich warnen willst, aber ich habe nichts Falsches getan.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Nein sagen bei der Arbeit - ohne dass du deinen Job verlierst", "Lena hat bei der Arbeit immer Ja gesagt, weil sie Angst hatte, ihren Job zu verlieren, wenn sie Nein sagt. Wenn ihre Chefin gefragt hat, ob sie Überstunden machen kann, hat Lena Ja gesagt, obwohl sie schon müde war. Wenn ihre Kollegin gefragt hat, ob sie ihre Schicht übernehmen kann, hat Lena Ja gesagt, obwohl sie schon drei Tage hintereinander Überstunden gemacht hatte. Sie dachte, sie müsse das tun, um ihren Job zu behalten. In Wahrheit hat sie ihren Job nicht behalten, weil sie immer Ja gesagt hat, sondern trotzdem. Und sie hat sich dabei selbst kaputt gemacht. Wie sagst du bei der Arbeit Nein, ohne deinen Job zu verlieren? Erstens: Sag nicht sofort Ja. Sag: Ich muss kurz nachdenken, ich melde mich in einer Stunde. Das gibt dir Zeit, zu überlegen, ob du wirklich Ja sagen willst. Zweitens: Sag Nein ohne lange Erklärung. Du musst dich nicht rechtfertigen. Ein einfaches: Nein, das geht bei mir heute nicht, ich habe schon etwas vor, reicht. Wenn du dich lange rechtfertigst, dann fühlt sich das Nein wie eine Lüge an. Drittens: Biete eine Alternative an, wenn du willst. Zum Beispiel: Heute kann ich nicht, aber nächste Woche könnte ich. Das zeigt, dass du helfen willst, aber nicht heute. Viertens: Halte das schlechte Gewissen aus. Es wird da sein, am Anfang. Aber es geht vorbei. Lena hat das erste Mal bei der Arbeit Nein gesagt, als ihre Chefin sie gefragt hat, ob sie am Samstag arbeiten kann. Sie hat gesagt: Nein, das geht bei mir am Samstag nicht, weil ich schon etwas mit meinen Kindern vorhabe. Ihre Chefin hat gesagt: Okay, dann frage ich jemand anderen. Lena war danach eine Stunde lang nervös. Sie dachte, ihre Chefin sei jetzt sauer. In Wahrheit hat ihre Chefin das schon nach fünf Minuten vergessen. Ein Beispiel, das zeigt, wie man bei der Arbeit Nein sagt, ohne den Job zu verlieren: Lena hat zu ihrer Chefin gesagt: Ich kann diese Woche Überstunden machen, aber nächste Woche brauche ich zwei Tage frei, weil ich schon drei Wochen hintereinander Überstunden gemacht habe. Ihre Chefin hat gesagt: Okay, das ist fair. Lena war überrascht, weil sie dachte, ihre Chefin würde sauer sein. In Wahrheit hat ihre Chefin das respektiert, weil Lena es klar und ruhig gesagt hat, ohne Vorwürfe, ohne Drama. Sie hat nicht gesagt: Du beutest mich aus. Sie hat gesagt: Ich kann das machen, aber ich brauche dafür einen Ausgleich. Das ist Verhandeln, nicht Jammern. Und Verhandeln ist besser als Ja sagen, weil es zeigt, dass du dich selbst ernst nimmst. Ein zweites Beispiel: Eine Kollegin hat Lena gefragt, ob sie ihre Schicht übernehmen kann. Lena hat gesagt: Ich kann deine Schicht am Freitag übernehmen, wenn du meine Schicht am Montag übernimmst. Die Kollegin hat Ja gesagt. Das ist ein Tausch, kein Opfer. Früher hätte Lena einfach Ja gesagt und hätte sich danach geärgert, weil sie am Freitag eigentlich frei haben wollte. Heute sagt sie Ja, aber nur, wenn sie dafür etwas bekommt. Das ist kein Egoismus, das ist Fairness. Und Fairness ist wichtig, damit man sich bei der Arbeit nicht ausgenutzt fühlt. Ein weiterer Punkt zu Nein sagen bei der Arbeit ist, dass man auch mal Ja sagen muss, wenn man wirklich Ja meint. Lena hat nicht nur gelernt, Nein zu sagen, wenn sie Nein meinte, sondern auch Ja zu sagen, wenn sie Ja meinte. Früher hat sie auch zu Dingen Nein gesagt, die sie eigentlich wollte, weil sie dachte, sie sei nicht gut genug. Zum Beispiel: Sie wollte eine Fortbildung machen, aber sie hat Nein gesagt, weil sie dachte, sie sei nicht gut genug dafür. Heute sagt Lena Ja, wenn sie Ja meint. Sie hat die Fortbildung gemacht, sie hat nach einer Gehaltserhöhung gefragt, sie hat sich auf einen neuen Job beworben. Das ist der Punkt: Nein sagen ist wichtig, aber Ja sagen, wenn man Ja meint, ist genauso wichtig. Denn wenn man immer Nein sagt, auch wenn man Ja meint, dann verpasst man das Leben. Und das Leben ist zu kurz, um es zu verpassen, weil man Angst hat, Ja zu sagen. Lena sagt heute Ja zu Dingen, die ihr Spaß machen, ohne sich dafür zu entschuldigen. Das ist kein Egoismus, das ist Leben. Und sie sagt Nein zu Dingen, die ihr nicht Spaß machen, ohne sich dafür zu entschuldigen. Das ist kein Egoismus, das ist Selbstachtung. Beides gehört zusammen: Ja sagen, wenn man Ja meint, und Nein sagen, wenn man Nein meint. Das ist Ehrlichkeit, zu sich selbst und zu anderen. Bei der Arbeit geht es nicht nur darum, was du tust, sondern auch darum, wie du es tust. Wenn du immer Ja sagst und dabei innerlich wütend bist, dann merken das die anderen, auch wenn du es nicht sagst. Wenn du ehrlich Nein sagst, wenn du Nein meinst, dann merken die anderen, dass du ehrlich bist, und sie respektieren dich dafür. Ehrlichkeit ist ansteckend.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Nein sagen in der Familie - ohne dass es Streit gibt", "In der Familie ist Nein sagen am schwersten, weil die Familie dich am besten kennt und weil du sie am wenigsten enttäuschen willst. Lena hat in ihrer Familie immer Ja gesagt. Wenn ihre Mutter angerufen hat und gefragt hat, ob sie am Sonntag zum Essen kommen kann, hat Lena Ja gesagt, obwohl sie eigentlich ausschlafen wollte. Wenn ihr Schwager gefragt hat, ob sie ihm beim Renovieren helfen kann, hat Lena Ja gesagt, obwohl sie selbst schon Rückenschmerzen hatte. Sie hatte Angst, dass ihre Familie sie nicht mehr mag, wenn sie Nein sagt. Aber das Gegenteil ist passiert. Je mehr sie Ja gesagt hat, desto gereizter wurde sie, und desto schlechter war die Stimmung in der Familie. Sie war beim Familienessen gereizt, weil sie eigentlich nicht da sein wollte. Sie war beim Renovieren gereizt, weil sie eigentlich Rückenschmerzen hatte. Ihre Familie hat gemerkt, dass sie gereizt war, aber sie wusste nicht, warum. Als Lena angefangen hat, in der Familie Nein zu sagen, hat sich die Stimmung verbessert. Sie hat gesagt: Mama, am Sonntag kann ich nicht kommen, weil ich ausschlafen muss. Aber nächsten Sonntag komme ich gerne. Ihre Mutter war zuerst enttäuscht, aber nach einer Weile hat sie gesagt: Das ist in Ordnung, ich verstehe das. Du brauchst auch mal Zeit für dich. Das war eine Erleichterung für Lena. Sie hat gelernt, dass ihre Familie sie nicht weniger mag, wenn sie Nein sagt. Sie mag sie sogar mehr, weil sie jetzt ehrlich ist und nicht mehr gereizt beim Familienessen sitzt. Nein sagen in der Familie heißt nicht, dass man die Familie nicht mag. Es heißt, dass man sich selbst ernst nimmt, damit man für die Familie da sein kann, wenn man wirklich da ist, nicht nur körperlich, sondern auch im Kopf. Ein Beispiel, das zeigt, wie Nein sagen in der Familie die Stimmung verbessert: Lena hat früher beim Familienessen immer Ja gesagt, wenn ihre Mutter sie gefragt hat, ob sie noch einen Nachtisch will, obwohl sie schon satt war. Sie hat Ja gesagt, wenn ihr Vater sie gefragt hat, ob sie ihm beim Computer helfen kann, obwohl sie selbst schon müde war. Sie war beim Familienessen immer gereizt, weil sie immer Dinge tat, die sie nicht tun wollte. Ihre Familie hat gemerkt, dass sie gereizt war, aber sie wusste nicht, warum. Als Lena angefangen hat, in der Familie Nein zu sagen, hat sich die Stimmung verbessert. Sie hat gesagt: Nein, ich will keinen Nachtisch mehr, ich bin satt. Nein, ich kann dir heute nicht beim Computer helfen, weil ich müde bin. Aber morgen kann ich dir helfen. Ihre Familie war zuerst überrascht, aber nach einer Weile hat sie gesagt: Das ist gut, dass du ehrlich sagst, was du willst. Früher warst du immer gereizt, und wir wussten nicht, warum. Heute bist du ehrlich, und wir wissen, woran wir sind. Das war eine Erleichterung für Lena. Sie hat gelernt, dass ihre Familie sie nicht weniger mag, wenn sie Nein sagt. Sie mag sie sogar mehr, weil sie jetzt ehrlich ist und nicht mehr gereizt beim Familienessen sitzt. Nein sagen in der Familie heißt nicht, dass man die Familie nicht mag. Es heißt, dass man sich selbst ernst nimmt, damit man für die Familie da sein kann, wenn man wirklich da ist. Ein weiterer Punkt zu Nein sagen in der Familie ist, dass man auch zu seinen Eltern Nein sagen darf, auch wenn sie älter sind und Hilfe brauchen. Lena hat eine Mutter, die 68 Jahre alt ist und die gerne hätte, dass Lena jeden Sonntag zum Essen kommt. Lena hat gesagt: Mama, ich kann nicht jeden Sonntag kommen, weil ich auch mal Zeit für meine eigene Familie brauche. Aber jeden zweiten Sonntag komme ich gerne. Ihre Mutter war zuerst enttäuscht, aber nach einer Weile hat sie gesagt: Das ist in Ordnung, ich verstehe das. Du hast auch deine eigene Familie. Das war eine Erleichterung für Lena, weil sie gemerkt hat, dass ihre Mutter sie nicht weniger liebt, weil sie Nein gesagt hat. Sie liebt sie sogar mehr, weil sie jetzt ehrlich ist. Und Lena hat gemerkt, dass sie nicht für das Glück ihrer Mutter verantwortlich ist. Ihre Mutter ist für ihr eigenes Glück verantwortlich. Lena kann da sein, sie kann zuhören, sie kann helfen, wenn sie will. Aber sie muss nicht jeden Sonntag zum Essen kommen, wenn sie eigentlich ausschlafen will. Das ist kein Egoismus, das ist Selbstachtung. Und Selbstachtung ist die Grundlage dafür, dass man überhaupt für andere da sein kann. Wenn du selbst kaputt bist, kannst du für niemanden da sein. Wenn du für dich selbst sorgst, dann kannst du auch für andere da sein. In der Familie geht es nicht darum, immer Ja zu sagen, sondern darum, ehrlich zu sein. Wenn du ehrlich Nein sagst, wenn du Nein meinst, dann wird deine Familie dich dafür respektieren, nicht weniger lieben. Denn deine Familie will, dass es dir gut geht, nicht dass du dich verstellst, um ihnen zu gefallen. Und wenn sie das nicht will, dann ist es keine echte Familie, sondern nur eine Pflicht.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Nein sagen zu Freunden - ohne dass du sie verlierst", "Lena hat zu ihren Freunden immer Ja gesagt, weil sie Angst hatte, sie zu verlieren, wenn sie Nein sagt. Wenn ihre Freundin gesagt hat, dass sie am Samstag feiern gehen will, hat Lena Ja gesagt, obwohl sie eigentlich lieber zu Hause bleiben wollte. Sie hatte Angst, dass sie nicht mehr eingeladen wird, wenn sie Nein sagt. Sie hatte Angst, dass sie nicht mehr dazugehört, wenn sie nicht mitmacht. Das ist ein Gefühl, das fast jeder kennt. Man will dazugehören, man will gemocht werden, man will nicht allein sein. Aber wenn du dich verstellst, um dazuzugehören, dann gehörst du nicht wirklich dazu, weil die anderen nicht dich mögen, sondern die Rolle, die du spielst. Lena hat das gemerkt, als sie einmal Nein gesagt hat und trotzdem eingeladen wurde. Ihre Freundin hat gesagt: Schade, dass du nicht kommst, aber wir sehen uns nächste Woche. Sie war nicht sauer. Sie hat sie immer noch gemocht. Das war eine Erleichterung für Lena. Sie hat gelernt, dass echte Freundschaft nicht davon abhängt, ob man immer Ja sagt, sondern davon, ob man ehrlich ist. Wenn du ehrlich sagst, dass du heute keine Lust hast, dann werden deine echten Freunde das verstehen. Und die, die es nicht verstehen, waren vielleicht gar keine echten Freunde, sondern nur Menschen, die dich brauchten, damit du immer Ja sagst. Das ist hart, aber es ist wahr. Und es ist besser, zwei echte Freunde zu haben, als zehn Freunde, bei denen man sich verstellen muss. Lena hat heute zwei enge Freundinnen, mit denen sie ehrlich sein kann. Früher hatte sie zehn Freunde, bei denen sie sich verstellen musste. Heute ist sie glücklicher, weil sie ehrlich sein kann, ohne Angst zu haben, dass sie ihre Freunde verliert. Ein Beispiel, das zeigt, wie man echte Freundschaft erkennt: Lena hat eine Freundin, die immer nur anruft, wenn sie etwas braucht. Wenn Lena sie anruft, weil sie selbst etwas braucht, dann hat die Freundin keine Zeit. Lena hat lange gedacht, das sei normal, weil man Freunden helfen muss. Dann hat sie gemerkt, dass das keine Freundschaft ist, sondern ein Einbahnstraßen-Verhältnis. Sie gibt immer, die andere nimmt immer. Sie hat der Freundin gesagt: Ich habe das Gefühl, dass ich immer nur gebe und du immer nur nimmst. Ich brauche auch einmal Hilfe. Die Freundin war sauer und hat gesagt: Du bist egoistisch geworden. Lena war traurig, aber sie hat gemerkt, dass das keine echte Freundschaft war. Denn eine echte Freundin hätte gesagt: Oh, das tut mir leid, das habe ich gar nicht gemerkt. Lass uns darüber reden. Eine Freundin, die sauer wird, wenn man ehrlich sagt, wie man sich fühlt, ist keine Freundin. Lena hat diese Freundschaft beendet. Das war schwer, aber es hat ihr gut getan, weil sie jetzt mehr Zeit für die Freunde hat, die wirklich für sie da sind. Und sie hat gemerkt, dass sie lieber zwei echte Freunde hat als zehn Freunde, bei denen sie sich verstellen muss. Das ist hart, aber es ist wahr. Und es ist besser, ehrlich zu sein und zwei echte Freunde zu haben, als sich zu verstellen und zehn falsche Freunde zu haben. Ein weiterer Punkt zu Nein sagen zu Freunden ist, dass man Freunde nicht nur braucht, wenn es einem gut geht, sondern auch, wenn es einem schlecht geht. Lena hat gemerkt, dass sie ihren Freunden immer nur dann erzählt hat, wenn es ihr gut ging. Wenn es ihr schlecht ging, hat sie nichts gesagt, weil sie dachte, sie dürfe ihre Freunde nicht belasten. Das ist kein Zeichen von Stärke, sondern von Angst. Sie hatte Angst, dass ihre Freunde sie nicht mehr mögen, wenn sie ihnen erzählt, wie es ihr wirklich geht. Als sie das erste Mal einer Freundin erzählt hat, dass es ihr nicht gut geht, weil sie immer Ja sagt und sich dabei selbst verliert, hat die Freundin gesagt: Das geht mir genauso. Ich sage auch immer Ja, obwohl ich Nein meine. Das war eine Erleichterung für Lena, weil sie gemerkt hat, dass sie nicht allein ist. Viele Menschen haben das gleiche Problem, aber niemand spricht darüber, weil alle denken, sie seien die Einzigen, die so sind. Wenn man darüber spricht, dann merkt man, dass man nicht allein ist. Und das ist der Anfang von echter Freundschaft, weil echte Freundschaft nicht davon abhängt, ob man immer gut drauf ist, sondern davon, ob man ehrlich ist, auch wenn es einem schlecht geht. Lena hat heute zwei Freundinnen, mit denen sie ehrlich sein kann, auch wenn es ihr schlecht geht. Das ist mehr wert als zehn Freunde, bei denen sie sich verstellen muss. Freunde, die dich nur mögen, wenn du immer Ja sagst, sind keine echten Freunde. Echte Freunde mögen dich, auch wenn du Nein sagst. Sie mögen dich, weil du du bist, nicht weil du immer Ja sagst. Und wenn du das verstehst, dann wirst du aufhören, dich zu verstellen, um dazuzugehören. Du wirst du selbst sein, und das ist gut genug.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Nein sagen zu deinen Kindern - ohne schlechtes Gewissen als Mutter", "Lena hat auch zu ihren Kindern immer Ja gesagt, weil sie Angst hatte, eine schlechte Mutter zu sein, wenn sie Nein sagt. Wenn ihre Kinder gefragt haben, ob sie noch eine Folge schauen dürfen, hat Lena Ja gesagt, obwohl sie wusste, dass sie schon zu lange ferngesehen hatten. Wenn ihre Kinder gefragt haben, ob sie noch ein Eis haben dürfen, hat Lena Ja gesagt, obwohl sie schon zwei Eis gegessen hatten. Sie dachte, eine gute Mutter sagt immer Ja. In Wahrheit ist eine gute Mutter eine Mutter, die auch Nein sagen kann. Denn Kinder brauchen Grenzen. Wenn Kinder immer Ja bekommen, dann lernen sie nicht, dass man auch mal Nein sagen kann und dass man damit leben kann. Lena hat gelernt, zu ihren Kindern Nein zu sagen, ohne sich schlecht zu fühlen. Sie sagt: Nein, heute gibt es keine Folge mehr, weil du morgen früh aufstehen musst. Sie sagt: Nein, heute gibt es kein Eis mehr, weil du schon zwei gegessen hast. Das ist kein e Welt untergeht. Und das ist eine Lektion, die ihre Kinder ihr ganzes Leben brauchen werden. Ein weiterer Punkt zu Nein sagen zu Kindern ist, dass Kinder nicht nur Grenzen brauchen, sondern auch Liebe. Lena hat gelernt, dass Nein sagen und Liebe zusammengehören. Wenn sie zu ihren Kindern Nein sagt, dann sagt sie gleichzeitig: Ich liebe dich, und ich will, dass es dir gut geht. Deshalb sage ich Nein, weil ich weiß, dass es dir gut tut, wenn du nicht noch eine Folge schaust, sondern schläfst. Das ist kein Widerspruch, das ist Liebe. Viele Eltern denken, Liebe heißt, immer Ja zu sagen. In Wahrheit heißt Liebe, auch mal Nein zu sagen, wenn es dem Kind gut tut. Ein Kind, das immer Ja bekommt, lernt nicht, dass man auch mal Nein sagen kann und dass man damit leben kann. Ein Kind, das auch mal Nein bekommt, lernt, dass Nein sagen normal ist und dass man damit leben kann. Das ist eine Lektion, die Kinder ihr ganzes Leben brauchen werden. Lena hat das verstanden, als sie zu ihrer Tochter Nein gesagt hat und ihre Tochter nach fünf Minuten schon wieder gespielt hat und sie immer noch lieb hatte. Sie hat gemerkt, dass ihre Tochter sie nicht weniger lieb hat, weil sie Nein gesagt hat. Sie hat sie sogar mehr lieb, weil sie weiß, dass ihre Mutter ehrlich ist und dass sie sich auf sie verlassen kann. Das ist der Punkt: Nein sagen ist kein Zeichen dafür, dass man jemanden nicht liebt. Es ist ein Zeichen dafür, dass man jemanden liebt und dass man ehrlich ist. Kinder brauchen keine Mutter, die immer Ja sagt. Sie brauchen eine Mutter, die auch Nein sagen kann, weil sie ihnen zeigt, dass man auch Nein sagen kann, ohne dass die Welt untergeht. Und sie brauchen eine Mutter, die ehrlich ist, weil sie ihnen zeigt, dass Ehrlichkeit wichtiger ist als ein Ja, das man nicht meint. Das ist die beste Lektion, die du deinen Kindern geben kannst.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Die 7 Sätze, die dir Nein sagen leicht machen", "Es gibt Sätze, die dir Nein sagen leicht machen, weil du sie auswendig lernen kannst und sie dann einfach sagen musst, ohne lange nachzudenken. Lena hat sich 7 Sätze aufgeschrieben und sie an ihren Kühlschrank gehängt. Satz Nummer 1: Ich muss kurz nachdenken, ich melde mich später. Das gibt dir Zeit, ohne sofort Ja sagen zu müssen. Satz Nummer 2: Nein, das geht bei mir heute nicht. Das ist ein klares Nein, ohne lange Erklärung. Satz Nummer 3: Heute kann ich nicht, aber nächste Woche könnte ich. Das ist ein Nein mit einer Alternative, wenn du willst. Satz Nummer 4: Das passt bei mir gerade nicht, weil ich schon etwas anderes vorhabe. Das ist ein Nein mit einer Begründung, die niemand bestreiten kann. Satz Nummer 5: Ich brauche heute Zeit für mich. Das ist ein ehrliches Nein, das zeigt, dass du dich selbst ernst nimmst. Satz Nummer 6: Danke, dass du an mich gedacht hast, aber ich muss absagen. Das ist ein freundliches Nein, das zeigt, dass du die andere Person wertschätzt, auch wenn du absagst. Satz Nummer 7: Nein. Nur Nein. Ohne Erklärung, ohne Entschuldigung. Das ist der schwerste Satz, aber auch der stärkste. Denn manchmal braucht man keine Erklärung. Ein Nein reicht. Lena hat am Anfang Satz Nummer 1 benutzt, weil er am leichtesten ist. Er gibt dir Zeit, ohne dass du sofort Nein sagen musst. Nach einer Weile hat sie Satz Nummer 2 benutzt. Heute benutzt sie auch Satz Nummer 7, wenn sie wirklich Nein meint und keine Lust hat, sich zu erklären. Das ist kein Egoismus, das ist Selbstachtung. Und Selbstachtung ist die Grundlage dafür, dass man auch zu anderen Ja sagen kann, wenn man wirklich Ja meint. Ein Beispiel wegung kennt und weil der Muskel stärker geworden ist. So ist es auch beim Nein sagen. Am Anfang ist es schwer, weil man es nicht gewohnt ist. Nach einer Weile wird es leichter, weil man es geübt hat und weil der Muskel stärker geworden ist. Lena hat die 7 Sätze jeden Morgen vor dem Spiegel geübt, eine Minute lang, bevor sie zur Arbeit gegangen ist. Das hat ihr geholfen, weil sie dann schon einmal Nein gesagt hatte, bevor sie überhaupt zur Arbeit gegangen ist. Und wenn sie dann bei der Arbeit Nein sagen musste, dann war es schon leichter, weil sie es schon einmal gesagt hatte. Das ist der Trick: Übe Nein sagen, wenn es noch nicht ernst ist, dann fällt es dir leichter, wenn es ernst wird. Die 7 Sätze sind kein Zauber, sondern eine Hilfe, die dir Nein sagen leicht macht, weil du sie auswendig lernen kannst und sie dann einfach sagen musst, ohne lange nachzudenken. Übe sie jeden Morgen vor dem Spiegel, eine Minute lang, und du wirst merken, dass es dir immer leichter fällt, Nein zu sagen, wenn du Nein meinst. Und nach einer Weile wirst du sie gar nicht mehr brauchen, weil Nein sagen für dich normal geworden ist.  Und genau das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr versuchst, es allen recht zu machen, sondern wenn du anfängst, ehrlich zu sein, zu dir selbst und zu anderen. Wenn du Nein sagst, wenn du Nein meinst, und Ja sagst, wenn du Ja meinst, ohne dich dafür zu entschuldigen. Dann wirst du ruhiger, weil du nicht mehr gegen dich selbst kämpfst, sondern mit dir selbst. Und das ist der Weg, um Nein sagen zu lernen, ohne dich schlecht zu fühlen."], ["Wenn andere sauer werden, weil du Nein sagst", "Wenn Lena Nein sagt, dann werden manche Menschen sauer. Nicht alle, aber manche. Ihre Mutter war am Anfang sauer, als Lena Nein gesagt hat. Ihre Kollegin war sauer, als Lena Nein gesagt hat. Das ist normal. Wenn du immer Ja gesagt hast und plötzlich Nein sagst, dann sind die anderen verwirrt. Sie haben sich daran gewöhnt, dass du immer Ja sagst. Sie haben
