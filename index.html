auch wenn es einmal nicht klappt. Ein drittes Thema ist: Was mache ich, wenn ich Geld geschenkt bekomme? Familie Berger bekommt zu Weihnachten von den Großeltern 100 Euro für die Kinder. Früher haben sie das Geld einfach ausgegeben. Heute legen sie 50 Euro für die Kinder auf ein Tagesgeldkonto und 50 Euro dürfen die Kinder ausgeben. So lernen die Kinder, dass Geschenke nicht nur zum Ausgeben da sind, sondern auch zum Sparen. Und die Eltern haben ein gutes Gefühl, weil sie wissen, dass das Geld nicht einfach weg ist. Ein viertes Thema ist: Was mache ich mit dem Kindergeld? Viele Menschen rechnen das Kindergeld zu ihrem Lohn dazu und geben es einfach aus. Familie Berger hat das Kindergeld auf ein separates Konto überwiesen und bezahlt davon alles, was die Kinder brauchen: Kleidung, Schuhe, Kita, Freizeit. So sehen sie, ob das Kindergeld reicht oder nicht. Früher dachten sie, das Kindergeld reicht nicht. Heute wissen sie, dass es reicht, wenn sie es nicht für andere Dinge ausgeben. Das ist kein Trick, das ist eine Trennung, die Klarheit schafft. Und Klarheit ist das, was am meisten fehlt, wenn man nicht weiß, wohin das Geld geht.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Einkaufen: 100 Euro weniger im Monat, ohne zu hungern", "Familie Berger hat beim Einkaufen 112 Euro im Monat gespart, ohne weniger zu essen. Wie? Erstens: Sie haben angefangen, mit einer Liste einzukaufen, die sie am Sonntagabend geschrieben haben, nachdem sie in den Kühlschrank geschaut hatten. Vorher sind sie dreimal pro Woche einkaufen gegangen und haben jedes Mal etwas mitgenommen, was nicht auf der Liste stand. Jetzt gehen sie einmal pro Woche groß einkaufen und einmal klein für frisches Brot und Obst. Zweitens: Sie kaufen nie hungrig ein. Das klingt wie ein Witz, ist aber der größte Faktor. Wer hungrig einkauft, kauft im Schnitt 20 Prozent mehr, und das meiste davon sind Süßigkeiten, Fertigprodukte und Snacks. Drittens: Sie haben drei teure Gewohnheiten geändert. Sie kaufen keinen geschnittenen Käse mehr, sondern ein Stück am Stück. Sie kaufen kein Mineralwasser in kleinen Flaschen mehr, sondern einen Kasten. Sie kaufen keine Fertigsoßen mehr, sondern machen Tomatensoße aus passierten Tomaten, die 0,79 Euro kosten statt 2,49 Euro. Viertens: Sie haben angefangen, am Samstagmittag auf dem Markt einzukaufen. Um 12 Uhr verkaufen viele Stände Gemüse und Obst günstiger, weil sie es nicht wieder mitnehmen wollen. Fünftens: Sie haben einen festen Wochentag für Resteessen eingeführt. Donnerstags gibt es bei ihnen Reste. Alles, was im Kühlschrank ist, wird verwertet. Daraus sind die besten Gerichte entstanden: Pfannkuchen mit Restgemüse, Nudeln mit Restsoße, Eintopf mit Restkartoffeln. Das ist kein Verzicht. Das ist Kochen mit dem, was da ist. Und es spart nicht nur Geld, sondern auch Zeit, weil man nicht jeden Tag überlegen muss, was man kocht. Ein konkretes Beispiel für einen Wocheneinkauf bei Familie Berger: Sie kaufen 1 Kilo Kartoffeln für 1,49 Euro, 1 Kilo Möhren für 0,99 Euro, 500 Gramm Nudeln für 0,89 Euro, passierte Tomaten für 0,79 Euro, 1 Liter Milch für 1,19 Euro, 10 Eier für 1,89 Euro, 500 Gramm Haferflocken für 0,79 Euro, 1 Brot für 1,99 Euro, Äpfel für 1,99 Euro, und Käse am Stück für 3,49 Euro. Zusammen sind das etwa 16 Euro für die Basis. Dazu kommen 20 Euro für Fleisch oder Fisch, 15 Euro für Gemüse und Obst nach Saison, und 10 Euro für Drogerie. Das sind 61 Euro für eine Woche, für vier Personen. Früher haben sie 95 Euro pro Woche ausgegeben. Der Unterschied sind 34 Euro pro Woche, also 136 Euro im Monat. Wie haben sie das geschafft? Sie kaufen Saison-Gemüse, das heißt, im Winter Kohl und Möhren, im Sommer Tomaten und Zucchini. Sie kaufen Eigenmarken statt Marken, weil der Unterschied bei Nudeln oder Milch fast immer nur die Verpackung ist. Sie frieren Brot ein, das sie nicht sofort essen, damit es nicht schimmelt. Und sie haben eine Liste für den Vorratsschrank: Wenn etwas leer ist, wird es auf die Liste geschrieben, und erst beim nächsten Einkauf gekauft. So kaufen sie nichts doppelt. Ein weiterer Trick: Sie kochen doppelte Portionen und frieren eine ein. Am Mittwoch, wenn sie wenig Zeit haben, holen sie die eingefrorene Portion raus statt zu bestellen. Das spart 25 Euro pro Bestellung, und das passiert zweimal im Monat. Beim Einkaufen ist der größte Fehler, ohne Plan zu gehen. Mit Plan gibst du weniger aus, isst besser und wirfst weniger weg. Familie Berger wirft heute fast nichts mehr weg, weil sie nur kauft, was sie wirklich braucht. Früher haben sie jede Woche Lebensmittel für 20 Euro weggeworfen, weil sie verdorben waren. Heute sind es fast 0 Euro. Das ist Geld, das sie vorher in den Müll geworfen haben.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein sechstes Beispiel für den Einkauf: Familie Berger kauft jetzt Obst und Gemüse, das kurz vor dem Verfallsdatum ist, wenn es im Supermarkt reduziert ist. Das spart 30 bis 50 Prozent. Sie essen es am gleichen Tag, zum Beispiel als Suppe oder als Smoothie. Das ist kein Ekel, das ist klug. Und sie kaufen keine XXL-Packungen, nur weil sie günstiger aussehen. Eine XXL-Packung Käse, die man nicht aufbraucht, ist teurer als eine kleine Packung, die man aufbraucht. Sie haben gelernt, dass der Kilopreis wichtig ist, aber nur, wenn man das Produkt auch wirklich aufbraucht. Ein siebtes Beispiel: Sie haben einen Einkaufszettel, der immer gleich ist: Milch, Eier, Brot, Kartoffeln, Möhren, Äpfel, Nudeln, Tomaten, Käse, Haferflocken. Das ist die Basis. Alles andere kommt nur drauf, wenn sie es wirklich brauchen. So kaufen sie nie t nutze ich es, macht es mich glücklich? Wenn du es weniger als einmal pro Woche nutzt und es mehr als 10 Euro kostet, kündige es. Du kannst es jederzeit wieder abschließen, wenn du es vermisst. In den meisten Fällen vermisst du es nicht. Ein Fall, den Familie Berger erlebt hat: Sie hatten ein Abo für eine Musik-App, die sie gar nicht nutzten, weil sie Spotify hatten. Das Abo kostete 9,99 Euro im Monat und lief seit 14 Monaten. Das sind 139,86 Euro für nichts. Sie haben es erst gemerkt, als sie den Kontoauszug durchgingen. Das passiert vielen Menschen. Abos sind so gebaut, dass man sie vergisst. Sie buchen automatisch ab, und man bekommt keine Rechnung, die man anfassen kann. Deshalb ist es wichtig, einmal im Jahr den Kontoauszug von Januar bis Dezember durchzugehen und alle Abbuchungen zu markieren, die jeden Monat gleich sind. Das sind deine Abos. Schreibe sie auf ein Blatt: Name, Betrag, letzte Nutzung. Wenn du es seit drei Monaten nicht genutzt hast, kündige es. Wenn du dir nicht sicher bist, ob du es noch brauchst, setze eine Erinnerung für in einem Monat. Wenn du es in dem Monat nicht genutzt hast, kündige es dann. Ein zweiter Tipp: Kündige nicht per E-Mail, sondern ruf an oder nutze das Online-Formular, und mach einen Screenshot von der Kündigungsbestätigung. Sonst buchen sie weiter ab und du musst dich streiten. Familie Berger hat nach der Kündigung aller unnötigen Abos 96 Euro im Monat gespart. Das Geld geht jetzt automatisch auf den Puffer. Sie merken es gar nicht mehr, weil es nie auf dem Girokonto ankommt. Bei Abos ist der wichtigste Satz: Wenn du es drei Monate nicht genutzt hast, brauchst du es nicht. Das gilt für Streaming, für Apps, für Zeitschriften und für alles andere. Kündige es, und wenn du es wirklich vermisst, kannst du es jederzeit wieder abschließen. In den meisten Fällen vermisst du es nicht, und du hast jeden Monat mehr Geld auf dem Konto.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein dritter Tipp für Abos: Schau dir an, ob du ein Familien-Abo statt zwei Einzel-Abos nutzen kannst. Familie Berger hat Spotify als Familien-Abo für 17,99 Euro statt zwei Einzel-Abos für 21,98 Euro. Das spart 4 Euro im Monat, also 48 Euro im Jahr. Das ist nicht viel, aber es ist ein Anfang. Und schau dir an, ob du Abos pausieren kannst, statt sie zu kündigen. Manche Streaming-Dienste bieten an, das Abo für drei Monate zu pausieren. Das ist gut, wenn du im Sommer sowieso weniger fernsiehst. Ein vierter Tipp: Wenn du ein Abo kündigst, dann kündige es sofort, nicht am Ende des Monats. Sonst vergisst du es wieder. Und mach einen Screenshot von der Kündigungsbestätigung, damit du beweisen kannst, dass du gekündigt hast. Familie Berger hat einmal ein Abo gekündigt und es wurde trotzdem weiter abgebucht, weil die Kündigung nicht angekommen war. Mit dem Screenshot konnten sie das Geld zurückbekommen. Ohne Screenshot hätten sie es nicht zurückbekommen. Das ist ein kleiner Aufwand, der sich lohnt. Und: Wenn du ein Abo kündigst, dann freu dich darüber. Du hast gerade Geld gespart, ohne etwas zu verlieren.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Strom, Handy, Versicherung: Einmal im Jahr vergleichen, 500 Euro sparen", "Einmal im Jahr, an einem festen Tag, vergleicht Familie Berger ihre Verträge. Sie haben sich dafür den ersten Samstag im Februar ausgesucht, weil da die Heizkostenabrechnung kommt und sie sowieso über Geld nachdenken. Sie schauen sich drei Verträge an: Strom, Handy und Versicherungen. Beim Strom haben sie festgestellt, dass sie seit drei Jahren im Grundtarif waren, der 38 Cent pro Kilowattstunde kostete, obwohl es Tarife für 29 Cent gab. Bei einem Verbrauch von 2.800 Kilowattstunden im Jahr waren das 252 Euro Unterschied. Sie haben gewechselt und zahlen jetzt 29 Cent. Beim Handy hatten sie zwei Verträge: Er hatte einen Vertrag für 29,99 Euro mit 20 Gigabyte, obwohl er nur 4 Gigabyte verbrauchte, weil er fast immer WLAN hatte. Sie hatte einen Vertrag für 19,99 Euro mit 10 Gigabyte, obwohl sie nur 3 Gigabyte verbrauchte. Sie haben beide auf Prepaid-Tarife für 9,99 Euro gewechselt und sparen zusammen 30 Euro im Monat, also 360 Euro im Jahr. Bei den Versicherungen haben sie festgestellt, dass sie eine Handyversicherung hatten, die 8 Euro im Monat kostete, obwohl das Handy schon drei Jahre alt war und der Neuwert nur noch 180 Euro betrug. Die haben sie gekündigt. Und sie haben ihre Hausratversicherung verglichen und eine gefunden, die 40 Euro im Jahr günstiger war, bei gleichem Schutz. Zusammen waren das über 600 Euro im Jahr, nur durch einmaliges Vergleichen. Das dauert einen Nachmittag, aber es lohnt sich mehr als jede Spar-App. Wichtig: Wechsle nicht zu einem Anbieter, den du nicht kennst, nur weil er 2 Euro günstiger ist. Nimm einen Anbieter mit gutem Service und lies die Kündigungsfristen. Und schreibe dir die neuen Verträge auf, damit du nächstes Jahr wieder vergleichen kannst. Ein Beispiel für einen Stromwechsel, den Familie Berger gemacht hat: Sie waren bei einem Anbieter, der 38 Cent pro Kilowattstunde verlangte und 120 Euro Grundgebühr im Jahr. Der neue Anbieter verlangt 29 Cent und 90 Euro Grundgebühr. Bei 2.800 Kilowattstunden im Jahr spart das 252 Euro für den Strom plus 30 Euro Grundgebühr, also 282 Euro im Jahr. Der Wechsel hat 15 Minuten gedauert. Sie haben im Internet ihren Verbrauch eingegeben, einen neuen Tarif gewählt, und der neue Anbieter hat den alten gekündigt. Es gab keine Unterbrechung, kein Techniker musste kommen. Das Einzige, was sie machen mussten, war, den Zählerstand am Tag des Wechsels abzulesen und an beide Anbieter zu schicken. So einfach ist das. Beim Handy war es ähnlich. Sie haben bei ihrem alten Anbieter angerufen und gesagt, dass sie kündigen wollen. Der Anbieter hat ihnen sofort einen günstigeren Tarif angeboten. Das ist normal. Anbieter wollen dich behalten und bieten dir erst einen besseren Preis, wenn du kündigen willst. Lass dich davon nicht unter Druck setzen. Sag: Schicken Sie mir das Angebot schriftlich, ich überlege es mir. Und vergleiche es dann in Ruhe mit anderen Anbietern. Bei Versicherungen ist es wichtig, nicht nur auf den Preis zu schauen, sondern auch auf die Leistungen. Eine Haftpflichtversicherung für 3 Euro im Monat, die nur 1 Million Euro abdeckt, ist schlechter als eine für 5 Euro, die 10 Millionen abdeckt. Denn wenn du wirklich einen Schaden verursachst, sind 1 Million schnell weg. Beim Vergleichen von Verträgen ist der größte Fehler, es auf morgen zu verschieben. Morgen wird nie kommen, wenn du es nicht in den Kalender einträgst. Nimm dir einen festen Termin, zum Beispiel den ersten Samstag im Februar, und vergleiche an diesem Tag Strom, Handy und Versicherungen. Ein Nachmittag, der dir jedes Jahr 500 Euro bringt, ist der bestbezahlte Nachmittag des Jahres.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein dritter Bereich, den Familie Berger verglichen hat, ist die Kfz-Versicherung. Sie hatten einen Tarif, der 720 Euro im Jahr kostete. Nach dem Vergleich haben sie einen Tarif gefunden, der 540 Euro im Jahr kostete, bei gleichem Schutz. Das sind 180 Euro Unterschied. Der Wechsel hat 20 Minuten gedauert. Sie mussten nur die Fahrzeugscheinnummer eingeben und den neuen Tarif wählen. Der neue Versicherer hat den alten gekündigt. So einfach ist das. Ein vierter Bereich ist der Internet-Anbieter. Sie hatten einen Vertrag für 39,99 Euro im Monat mit 50 Mbit. Nach dem Vergleich haben sie einen Vertrag für 29,99 Euro mit 100 Mbit gefunden. Das sind 10 Euro weniger im Monat, also 120 Euro im Jahr, und schnelleres Internet. Das ist kein Verzicht, das ist ein besserer Vertrag. Und: Wenn du deinen Internet-Anbieter wechseln willst, dann ruf vorher bei deinem alten Anbieter an und sag, dass du kündigen willst. Oft bieten sie dir dann einen besseren Preis an. Nimm das Angebot nicht sofort an, sondern lass es dir schriftlich schicken und vergleiche es in Ruhe. So hast du die Wahl und musst dich nicht unter Druck entscheiden.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Der Puffer: Warum 1.000 Euro dein Leben verändern", "Ein Puffer ist kein Sparziel. Ein Puffer ist Ruhe. Wenn du keinen Puffer hast, ist jede unerwartete Rechnung eine Krise. Die Waschmaschine geht kaputt: 400 Euro. Das Auto braucht neue Bremsen: 320 Euro. Der Zahnarzt sagt, du brauchst eine Krone: 450 Euro. Ohne Puffer musst du dafür einen Kredit aufnehmen oder die Rechnung in Raten zahlen, und das kostet noch mehr. Mit einem Puffer von 1.000 Euro kannst du das einfach bezahlen und weiterleben. Familie Berger hat ihren Puffer in 10 Monaten aufgebaut, mit 100 Euro im Monat am Anfang, später mit 300 Euro. Sie haben das Geld auf einem Tagesgeldkonto, das sie nicht im Alltag sehen. Das ist wichtig: Wenn du den Puffer jeden Tag in deiner Banking-App siehst, denkst du, du bist reich, und gibst ihn aus. Wenn er auf einem separaten Konto ist, vergisst du ihn, und er wächst. Der zweite Schritt nach 1.000 Euro ist 3 Monatsausgaben. Bei Familie Berger sind das 3 mal 2.500 Euro, also 7.500 Euro. Das ist viel, und das dauert. Aber du musst nicht sofort dahin. Fange mit 1.000 Euro an. Das ist der erste Meilenstein. Wenn du den hast, hast du schon mehr geschafft als die meisten. In Deutschland haben fast 40 Prozent der Menschen keinen Puffer von 1.000 Euro. Das ist kein Zeichen von Faulheit. Das ist ein Zeichen dafür, dass das System so gebaut ist, dass man sein Geld sofort ausgibt. Wenn du das änderst, änderst du dein Leben. Nicht, weil du reich wirst, sondern weil du nicht mehr in Panik gerätst, wenn etwas kaputtgeht. Ein Puffer von 1.000 Euro klingt für viele unerreichbar. Aber er ist erreichbar, wenn man ihn in kleine Schritte teilt. Familie Berger hat angefangen, jeden Montag 25 Euro auf den Puffer zu überweisen. Das sind 100 Euro im Monat. Nach 10 Monaten waren es 1.000 Euro. Sie haben nicht gemerkt, dass das Geld weg war, weil es am Montagmorgen überwiesen wurde, bevor sie es ausgeben konnten. Wenn du nur 25 Euro im Monat sparen kannst, dann sind es 40 Monate bis 1.000 Euro. Das klingt lang. Aber 40 Monate vergehen sowieso. Die Frage ist: Willst du in 40 Monaten 1.000 Euro Puffer haben oder immer noch keinen? Ein zweiter Weg ist, zusätzliches Geld direkt auf den Puffer zu überweisen: Weihnachtsgeld, Steuerrückzahlung, Geldgeschenke zum Geburtstag. Familie Berger hat ihre Steuerrückzahlung von 1.240 Euro komplett auf den Puffer überwiesen. Das war schwer, weil sie sich davon auch etwas gönnen wollten. Aber sie haben sich gesagt: Wir gönnen uns 200 Euro davon, und 1.040 Euro gehen auf den Puffer. So hatten sie beides: Freude und Sicherheit. Und wenn der Puffer einmal da ist, darfst du ihn auch benutzen. Ein Puffer, den du nie benutzt, ist kein Puffer, sondern ein Sparschwein. Wenn die Waschmaschine kaputtgeht, nimm das Geld vom Puffer. Und danach füllst du ihn wieder auf, mit 100 Euro im Monat, bis er wieder bei 1.000 Euro ist. Das ist kein Scheitern, das ist der Sinn eines Puffers. Ein Puffer ist kein Sparziel für Reiche, sondern ein Schutz für alle. Wenn du 1.000 Euro Puffer hast, dann bist du schon weiter als fast die Hälfte der Menschen in Deutschland. Das ist kein kleiner Erfolg, das ist ein großer Erfolg. Und wenn du ihn einmal hast, dann lass ihn nicht wieder auf 0 fallen. Füll ihn immer wieder auf, wenn du ihn benutzt hast.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein dritter Weg, den Puffer aufzubauen, ist, Geld zu verkaufen, das man nicht mehr braucht. Familie Berger hat im Keller Sachen gefunden, die sie seit Jahren nicht mehr benutzt hatten: Ein Fahrrad, das zu klein geworden war, ein Kinderwagen, den sie nicht mehr brauchten, ein altes Handy, das noch funktionierte. Sie haben alles auf einem Flohmarkt verkauft und 340 Euro bekommen. Das Geld ist direkt auf den Puffer gegangen. Das war kein Verzicht, das war Aufräumen. Und sie haben gelernt, dass man oft Geld im Keller hat, ohne es zu wissen. Schau dir einmal deinen Keller, deinen Dachboden und deinen Schrank an. Was hast du, was du seit einem Jahr nicht mehr benutzt hast? Das kannst du verkaufen. Und das Geld geht auf den Puffer. Ein vierter Weg ist, Überstunden oder einen Nebenjob zu machen, aber nur für einen festen Zeitraum, zum Beispiel drei Monate, und das Geld direkt auf den Puffer zu überweisen. Familie Berger hat das nicht gemacht, weil sie keine Zeit hatten. Aber sie haben gelernt, dass man auch mit kleinen Beträgen einen Puffer aufbauen kann. Es geht nicht darum, wie schnell du ihn aufbaust, sondern darum, dass du ihn aufbaust.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Schulden: Wie du sie loswirst, ohne dich zu schämen", "Schulden sind kein Charakterfehler. Familie Berger hatte 2.400 Euro auf einer Kreditkarte, weil sie im Urlaub das Geld ausgegeben hatten, das sie nicht hatten, und weil sie die Waschmaschine auf Raten gekauft hatten. Die Kreditkarte kostete 14 Prozent Zinsen im Jahr. Das heißt, sie zahlten 336 Euro im Jahr nur für Zinsen, ohne dass die Schulden weniger wurden. Sie haben es so gemacht: Erst haben sie alle Schulden aufgeschrieben: Wem schulde ich was, wie viel, zu welchem Zinssatz? Dann haben sie die Schulden nach Zinssatz sortiert, nicht nach Höhe. Die teuerste Schuld zuerst. Das war die Kreditkarte mit 14 Prozent. Die haben sie zuerst abbezahlt, mit 200 Euro im Monat extra, während sie bei den anderen Schulden nur die Mindestrate zahlten. Nach 12 Monaten war die Kreditkarte weg. Dann haben sie sich die Raten für die Waschmaschine vorgenommen. Nach weiteren 6 Monaten waren sie schuldenfrei, außer der Miete. Wichtig ist: Schäme dich nicht für Schulden. Fast jeder hat Schulden. Der Unterschied ist, ob du sie ignorierst oder ob du sie angehst. Und: Nimm keinen neuen Kredit auf, um einen alten zu bezahlen, außer der neue ist deutlich günstiger und du hast einen Plan, ihn abzubezahlen. Sonst schiebst du das Problem nur vor dir her. Wenn du gar nicht mehr weißt, wie du deine Schulden bezahlen sollst, geh zur Schuldnerberatung. Das ist kostenlos, und die helfen dir, ohne dich zu verurteilen. In Bielefeld gibt es mehrere Stellen, die das machen. Das ist kein Versagen, das ist klug. Ein konkretes Beispiel für Schulden, das viele kennen: Du hast einen Ratenkredit für ein Handy, 24 Monate, 25 Euro im Monat. Das klingt harmlos. Aber wenn du das Handy nach 12 Monaten verlierst oder es kaputtgeht, zahlst du noch 12 Monate für ein Handy, das du gar nicht mehr hast. Familie Berger hat das einmal erlebt. Sie haben gelernt: Kaufe nichts auf Raten, was du nicht auch bar bezahlen könntest. Wenn du es bar bezahlen kannst und trotzdem Raten nimmst, weil es 0 Prozent Zinsen gibt, dann lege das Geld für die Raten auf ein separates Konto und zahle davon die Raten. Sonst gibst du das Geld aus und hast am Ende keine Raten mehr bezahlen können. Ein zweiter Fall: Dispokredit. Der Dispo ist der teuerste Kredit, den es gibt, weil er 11 bis 13 Prozent Zinsen kostet und weil du ihn nie zurückzahlen musst. Du kannst jahrelang im Dispo sein und jeden Monat nur Zinsen zahlen. Familie Berger war drei Monate lang 800 Euro im Dispo und hat 26 Euro Zinsen im Monat bezahlt. Das sind 78 Euro für nichts. Sie haben den Dispo auf 0 gesetzt und stattdessen einen Puffer aufgebaut. Wenn du im Dispo bist, dann ist dein erster Schritt nicht Sparen, sondern den Dispo auf 0 bringen. Denn jeder Euro, den du im Dispo sparst, spart dir 11 Prozent Zinsen. Das ist mehr, als jeder ETF dir im Schnitt bringt. Also: Erst Dispo auf 0, dann Puffer aufbauen, dann investieren. Das ist die Reihenfolge, die wirklich funktioniert. Bei Schulden ist der wichtigste Schritt, sie aufzuschreiben. Solange sie nur in deinem Kopf sind, sind sie ein diffuses Gefühl von Angst. Wenn sie auf Papier stehen, sind sie Zahlen. Und Zahlen kann man abarbeiten, eine nach der anderen. Fang mit der teuersten Schuld an, nicht mit der kleinsten. So sparst du die meisten Zinsen und bist am schnellsten schuldenfrei.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein dritter Fall für Schulden ist der Ratenkauf im Möbelhaus. Du kaufst eine Couch für 1.200 Euro auf Raten, 0 Prozent Zinsen, 24 Monate, 50 Euro im Monat. Das klingt harmlos. Aber wenn du nach einem Jahr umziehst und die Couch nicht mehr passt, zahlst du noch 12 Monate für eine Couch, die du gar nicht mehr hast. Familie Berger hat das erlebt. Sie haben gelernt: Kaufe nichts auf Raten, was du nicht auch bar bezahlen könntest. Und wenn du es bar bezahlen kannst, dann lege das Geld für die Raten auf ein separates Konto und zahle davon die Raten. So hast du das Geld schon, bevor du die Raten bezahlst. Ein vierter Fall ist der Kredit für ein Auto. Viele Menschen kaufen ein Auto für 15.000 Euro auf Kredit, weil sie denken, sie brauchen ein neues Auto. In Wahrheit brauchen sie ein Auto, das fährt. Ein gebrauchtes Auto für 5.000 Euro, das man bar bezahlt, ist oft besser als ein neues Auto für 15.000 Euro, das man auf Kredit kauft. Denn das neue Auto verliert im ersten Jahr 20 Prozent an Wert, und du zahlst noch Zinsen dazu. Familie Berger fährt ein Auto, das 8 Jahre alt ist und das sie bar bezahlt haben. Es fährt, es ist sicher, und es kostet sie keinen Kredit.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Kinder und Geld: Was Kinder wirklich über Geld lernen", "Kinder lernen nicht durch Vorträge über Geld. Sie lernen durch das, was sie sehen. Wenn du im Supermarkt jedes Mal Ja sagst, wenn dein Kind etwas will, lernt es, dass Geld immer da ist. Wenn du sagst: Wir haben heute 10 Euro für Süßigkeiten, du darfst dir aussuchen, was du dafür nimmst, lernt es, dass man sich entscheiden muss. Familie Berger hat ihren Kindern Taschengeld gegeben: Die Ältere bekommt 15 Euro im Monat, der Jüngere 10 Euro. Das Geld bekommen sie am 1. des Monats, in bar, nicht aufs Konto. Denn bares Geld kann man sehen und anfassen. Wenn es weg ist, ist es weg. Die Ältere hat sich im ersten Monat am 3. schon ein Spielzeug für 14 Euro gekauft und hatte dann den Rest des Monats nichts mehr. Das war hart, aber sie hat gelernt, dass man nicht alles sofort ausgeben kann. Im zweiten Monat hat sie 5 Euro gespart, im dritten Monat 8 Euro. Jetzt spart sie auf ein Fahrrad. Der Jüngere hat sein Geld in drei Gläser aufgeteilt: Eins für Ausgeben, eins für Sparen, eins für Spenden. Das hat er selbst so entschieden, nachdem sie darüber gesprochen hatten. Das ist kein perfektes System. Aber es ist besser als gar kein System. Wichtig ist: Gib deinen Kindern kein Geld, wenn sie es sofort wieder ausgegeben haben und weinen. Lass sie die Konsequenz spüren. Das ist die beste Lektion. Und: Sprich mit deinen Kindern über Geld, ohne Angst. Sag ihnen, was du verdienst, was die Miete kostet, was Lebensmittel kosten. Kinder, die wissen, wie viel Geld die Familie hat, sind nicht belastet. Sie sind vorbereitet. Ein Beispiel, das Familie Berger erlebt hat: Ihre Tochter wollte ein Spielzeug für 35 Euro, das alle Kinder in der Kita hatten. Sie hat gesagt: Ich will das haben. Sie haben gesagt: Du hast 15 Euro Taschengeld, du kannst 20 Euro dazu sparen, dann hast du es in zwei Monaten. Die Tochter war wütend. Sie hat geweint. Nach zwei Tagen hat sie gesagt: Ich spare darauf. Nach sechs Wochen hatte sie 35 Euro zusammen und hat das Spielzeug gekauft. Sie war stolz wie nie. Und sie hat das Spielzeug viel mehr geschätzt als die Spielzeuge, die sie einfach so bekommen hatte. Das ist die Lektion: Kinder, die auf etwas sparen, lernen, dass Geld nicht vom Himmel fällt. Und sie lernen, dass Warten sich lohnt. Ein zweites Beispiel: Der Sohn wollte jeden Tag ein Eis für 1,50 Euro. Das sind 45 Euro im Monat. Sie haben gesagt: Du bekommst am Samstag ein Eis, das ist unser Eis-Tag. An den anderen Tagen gibt es Obst. Am Anfang war er unzufrieden. Nach zwei Wochen hat er sich auf den Samstag gefreut wie auf Weihnachten. Und sie haben 35 Euro im Monat gespart. Das ist kein Verzicht, das ist eine Regel, die Freude macht. Wichtig ist auch: Sprich mit deinen Kindern über deine eigenen Fehler. Familie Berger hat ihren Kindern erzählt, dass sie einmal einen Kredit für einen Urlaub aufgenommen haben und dass sie das bereut haben. Die Kinder haben das verstanden. Sie haben gelernt, dass auch Erwachsene Fehler machen und daraus lernen. Das ist wertvoller als jede Taschengeld-Regel. Bei Kindern ist der wichtigste Punkt, dass sie Fehler machen dürfen. Wenn dein Kind sein Taschengeld am 3. schon ausgegeben hat, dann gib ihm kein neues Geld. Lass es die Konsequenz spüren. Das ist hart, aber es ist die beste Lektion, die du deinem Kind geben kannst. Denn im echten Leben gibt dir auch niemand am 3. neues Geld, wenn du alles ausgegeben hast.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein drittes Beispiel für Kinder und Geld: Familie Berger hat ihren Kindern gezeigt, wie viel Geld sie für Lebensmittel ausgeben. Sie haben die Kinder mit zum Einkaufen genommen und gesagt: Wir haben heute 60 Euro für den Wocheneinkauf. Hilf uns, alles zu finden, was wir brauchen, und schau, ob wir unter 60 Euro bleiben. Die Kinder haben das wie ein Spiel gefunden. Sie haben Preise verglichen, sie haben gesagt: Mama, das ist zu teuer, nimm das andere. Und sie haben gelernt, dass man nicht alles kaufen kann, was man will. Das ist eine Lektion, die man nicht in der Schule lernt, sondern im Supermarkt. Ein viertes Beispiel: Die Kinder haben einen Flohmarkt gemacht und ihre alten Spielzeuge verkauft. Sie haben 45 Euro bekommen und durften selbst entscheiden, was sie damit machen. Die Ältere hat 30 Euro gespart und 15 Euro ausgegeben. Der Jüngere hat 45 Euro ausgegeben. Beide haben gelernt, dass Geld, das man selbst verdient hat, mehr wert ist als Geld, das man geschenkt bekommen hat. Und sie haben gelernt, dass man mit Geld Entscheidungen treffen muss. Das ist die wichtigste Lektion überhaupt.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Der erste ETF: Was das wirklich ist, an einem echten Beispiel", "Ein ETF ist kein Zauber. Ein ETF ist ein Korb, in dem viele Aktien drin sind. Wenn du einen ETF auf den MSCI World kaufst, kaufst du damit Anteile an über 1.500 Firmen auf der ganzen Welt: Apple, Microsoft, Nestlé, Toyota, und viele mehr. Wenn eine Firma schlecht läuft, merken es die anderen Firmen aus. Wenn alle Firmen gut laufen, steigt der ETF. In den letzten 30 Jahren ist der MSCI World im Schnitt um etwa 8 Prozent pro Jahr gestiegen. Das heißt nicht, dass er jedes Jahr um 8 Prozent gestiegen ist. Es gab Jahre, in denen er um 20 Prozent gefallen ist, und Jahre, in denen er um 30 Prozent gestiegen ist. Aber im Schnitt waren es 8 Prozent. Was heißt das für dich? Wenn du 100 Euro im Monat in einen ETF sparst, hast du nach 10 Jahren etwa 17.000 Euro eingezahlt und, wenn es gut läuft, etwa 18.000 bis 20.000 Euro auf dem Konto. Nach 20 Jahren hast du 24.000 Euro eingezahlt und etwa 45.000 bis 55.000 Euro auf dem Konto. Das ist kein Versprechen, das ist eine Rechnung mit dem Durchschnitt der Vergangenheit. Familie Berger hat angefangen, 50 Euro im Monat in einen ETF zu sparen, als ihr Puffer bei 1.000 Euro war. Nicht vorher. Denn ein ETF ist kein Puffer. Wenn du das Geld in einem Jahr brauchst, darf es nicht in einem ETF sein, weil der ETF in einem Jahr auch fallen kann. Ein ETF ist für Geld, das du 10 Jahre oder länger nicht brauchst. Wie fängst du an? Du eröffnest ein Depot bei einer Bank oder einem Online-Broker, das kostet nichts. Du suchst dir einen ETF auf den MSCI World oder den FTSE All-World, mit niedrigen Kosten, unter 0,2 Prozent pro Jahr. Du richtest einen Sparplan ein: 50 Euro am 1. des Monats, automatisch. Und dann schaust du nicht jeden Tag drauf. Du schaust einmal im Jahr drauf. Das ist der schwierigste Teil: nicht ständig zu schauen und nicht in Panik zu verkaufen, wenn es einmal fällt. Ein Beispiel, das zeigt, warum man nicht in Panik verkaufen darf: Im März 2020 ist der MSCI World um 30 Prozent gefallen, weil Corona kam. Viele Menschen haben in Panik verkauft und ihr Geld verloren. Wer damals nicht verkauft hat, sondern weiter 100 Euro im Monat gespart hat, hatte ein Jahr später mehr Geld als vorher. Denn die Kurse sind wieder gestiegen, und wer weiter gespart hat, hat in der Krise günstig gekauft. Familie Berger hat das nicht selbst erlebt, aber sie haben es in einem Buch gelesen und sich eine Regel gesetzt: Wenn der ETF fällt, schauen wir nicht drauf. Wir schauen nur einmal im Jahr, im Januar, ob wir noch dabei sind. Und wir verkaufen nicht, wenn es fällt. Wir verkaufen erst, wenn wir das Geld brauchen, und das ist erst in 15 Jahren, wenn die Kinder ausziehen. Ein zweites Beispiel: Kosten. Es gibt ETFs, die 0,07 Prozent im Jahr kosten, und es gibt ETFs, die 0,5 Prozent kosten. Der Unterschied klingt klein, aber bei 50.000 Euro sind das 35 Euro gegen 250 Euro im Jahr. Nach 20 Jahren sind das über 4.000 Euro Unterschied. Deshalb ist es wichtig, auf die Kosten zu schauen. Nimm einen ETF mit niedrigen Kosten, der breit gestreut ist. Du brauchst keinen ETF, der nur auf ein Land oder eine Branche setzt. Du brauchst einen, der die ganze Welt abbildet. Und: Lass dich nicht von Leuten verunsichern, die sagen, du musst jetzt in Kryptowährungen oder in einzelne Aktien investieren. Das ist Glücksspiel, kein Sparen. Ein ETF ist langweilig. Und genau deshalb funktioniert er. Beim ETF ist der wichtigste Satz: Nicht in Panik verkaufen. Wenn der Kurs fällt, dann ist das normal. Es gab in den letzten 30 Jahren viele Krisen, und jedes Mal ist der Kurs wieder gestiegen. Wer in der Krise verkauft hat, hat verloren. Wer weitergespart hat, hat gewonnen. Das ist keine Garantie, aber es ist die Erfahrung der Vergangenheit.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein drittes Beispiel für ETFs: Familie Berger hat einen Freund, der in einzelne Aktien investiert hat und 2.000 Euro verloren hat, weil er auf einen Tipp gehört hat. Er hat gesagt: Ich habe gehört, dass diese Aktie steigen wird. Sie ist gefallen. Er hat verkauft und 2.000 Euro verloren. Familie Berger hat daraus gelernt: Höre nicht auf Tipps. Investiere nicht in Dinge, die du nicht verstehst. Ein ETF ist langweilig, aber er ist verständlich. Du weißt, was drin ist, du weißt, wie viel er kostet, und du weißt, dass er die ganze Welt abbildet. Das ist mehr, als man von den meisten Tipps sagen kann. Ein viertes Beispiel: Viele Menschen fragen, ob sie jetzt in einen ETF einsteigen sollen, weil der Kurs gerade hoch ist. Familie Berger hat gelernt: Der beste Zeitpunkt, um anzufangen, war vor 10 Jahren. Der zweitbeste Zeitpunkt ist heute. Es ist egal, ob der Kurs gerade hoch oder niedrig ist, wenn du 10 Jahre oder länger dabei bleibst. Denn über 10 Jahre ist der Kurs fast immer gestiegen. Und wenn du jeden Monat einen festen Betrag sparst, dann kaufst du automatisch mehr Anteile, wenn der Kurs niedrig ist, und weniger, wenn er hoch ist. Das nennt man Durchschnittskosteneffekt. Du musst nichts timen, du musst nur dranbleiben.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Versicherungen: Welche du wirklich brauchst und welche nicht", "Viele Menschen sind überversichert und unterversichert zugleich. Überversichert heißt: Sie haben Versicherungen, die sie nicht brauchen. Unterversichert heißt: Sie haben die wichtigen Versicherungen nicht. Familie Berger hatte eine Handyversicherung, eine Brillenversicherung und eine Garantieverlängerung für den Fernseher. Die haben sie alle gekündigt, weil sie zusammen 28 Euro im Monat kosteten und im Schadensfall nur einen Teil bezahlt hätten. Dafür haben sie drei Versicherungen, die wirklich wichtig sind: Eine Haftpflichtversicherung, die kostet etwa 5 Euro im Monat und bezahlt, wenn du aus Versehen etwas kaputt machst, zum Beispiel das Handy eines Freundes oder den Teppich in einer Mietwohnung. Eine Berufsunfähigkeitsversicherung, die bezahlt, wenn du wegen Krankheit nicht mehr arbeiten kannst. Die ist teuer, aber sie ist die wichtigste Versicherung überhaupt, wenn du von deinem Lohn lebst. Und eine Hausratversicherung, die bezahlt, wenn deine Wohnung abbrennt oder einbricht. Die kostet etwa 10 Euro im Monat. Alles andere ist optional. Eine Rechtsschutzversicherung kann sinnvoll sein, wenn du oft Streit mit Vermietern oder Arbeitgebern hast. Eine Zahnzusatzversicherung kann sinnvoll sein, wenn du schlechte Zähne hast. Eine Reiserücktrittsversicherung ist nur sinnvoll, wenn du eine teure Reise buchst. Eine Lebensversicherung als Geldanlage ist fast nie sinnvoll, weil die Kosten zu hoch sind. Wenn du Geld fürs Alter sparen willst, ist ein ETF günstiger. Geh deine Versicherungen einmal im Jahr durch und frage dich: Was passiert, wenn ich diese Versicherung nicht habe und der Fall eintritt? Kann ich das selbst bezahlen? Wenn ja, brauchst du die Versicherung nicht. Wenn nein, und wenn der Schaden deine Existenz bedroht, dann brauchst du sie. Ein Beispiel, das zeigt, wie wichtig die Haftpflicht ist: Ein Kind von Familie Berger hat beim Spielen das Handy eines Freundes fallen lassen. Das Display war kaputt. Die Reparatur kostete 280 Euro. Die Haftpflicht hat bezahlt. Ohne Haftpflicht hätten sie 280 Euro selbst zahlen müssen. Die Haftpflicht kostet 5 Euro im Monat, also 60 Euro im Jahr. Sie hat sich in diesem einen Fall schon bezahlt gemacht. Ein zweites Beispiel: Berufsunfähigkeit. Ein Bekannter von Familie Berger ist mit 42 Jahren krank geworden und konnte nicht mehr arbeiten. Er hatte keine Berufsunfähigkeitsversicherung. Er bekommt jetzt nur noch die Erwerbsminderungsrente, die viel zu wenig ist, um davon zu leben. Er muss von seinen Ersparnissen leben. Familie Berger hat daraufhin eine Berufsunfähigkeitsversicherung abgeschlossen, die 45 Euro im Monat kostet. Das ist viel Geld, aber es ist die wichtigste Versicherung, die sie haben. Denn wenn einer von beiden nicht mehr arbeiten kann, fällt die Hälfte vom Einkommen weg, aber die Miete bleibt gleich. Ohne diese Versicherung müssten sie ausziehen. Mit dieser Versicherung können sie in der Wohnung bleiben. Deshalb: Wenn du nur eine Versicherung abschließen kannst, dann ist es die Berufsunfähigkeitsversicherung, wenn du von deinem Lohn lebst. Alles andere ist zweitrangig. Und: Schließe sie ab, solange du jung und gesund bist. Denn wenn du erst einmal krank bist, nimmt dich keine Versicherung mehr oder sie verlangt so viel Geld, dass du sie dir nicht leisten kannst. Bei Versicherungen ist der wichtigste Punkt, dass du nur das versicherst, was du nicht selbst bezahlen kannst. Ein Handy für 200 Euro kannst du selbst bezahlen. Eine Berufsunfähigkeit, die dich 2.000 Euro im Monat kostet, kannst du nicht selbst bezahlen. Deshalb ist die Berufsunfähigkeitsversicherung so wichtig, und die Handyversicherung so unwichtig.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein drittes Beispiel für Versicherungen: Ein Nachbar von Familie Berger hatte einen Wasserschaden in der Wohnung. Die Waschmaschine war ausgelaufen und der Boden war kaputt. Die Hausratversicherung hat 2.400 Euro bezahlt. Ohne Hausratversicherung hätte er 2.400 Euro selbst bezahlen müssen. Die Hausratversicherung kostet 10 Euro im Monat, also 120 Euro im Jahr. Sie hat sich in diesem einen Fall schon für 20 Jahre bezahlt gemacht. Das ist der Sinn einer Versicherung: Sie bezahlt, wenn der Schaden so groß ist, dass du ihn nicht selbst bezahlen kannst. Ein viertes Beispiel: Eine Freundin von Familie Berger hatte einen Unfall und konnte 6 Monate nicht arbeiten. Sie hatte eine Berufsunfähigkeitsversicherung, die ihr 1.200 Euro im Monat bezahlt hat. Ohne diese Versicherung hätte sie von ihren Ersparnissen leben müssen und wäre nach 3 Monaten pleite gewesen. Mit der Versicherung konnte sie sich erholen, ohne sich um Geld sorgen zu müssen. Das ist der Unterschied zwischen einer Versicherung, die sich lohnt, und einer, die sich nicht lohnt. Eine Versicherung, die dir hilft, wenn du sie wirklich brauchst, ist ihr Geld wert. Eine Versicherung, die dir nur ein gutes Gefühl gibt, aber im Schadensfall nichts bezahlt, ist ihr Geld nicht wert.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Steuern: Was du zurückbekommst, wenn du es richtig machst", "Familie Berger hat im ersten Jahr, in dem sie eine Steuererklärung gemacht haben, 1.240 Euro zurückbekommen. Vorher hatten sie nie eine gemacht, weil sie dachten, das sei nur etwas für Reiche. In Wahrheit bekommen die meisten Arbeitnehmer Geld zurück, wenn sie eine Steuererklärung machen. Warum? Weil du viele Dinge absetzen kannst, die du sowieso bezahlst: Fahrtkosten zur Arbeit, Arbeitskleidung, Fortbildungen, Homeoffice, Kinderbetreuungskosten, Handwerkerrechnungen, Haushaltsnahe Dienstleistungen. Bei Familie Berger waren es: Er fährt 22 Kilometer zur Arbeit, das sind 1.100 Euro Werbungskosten im Jahr. Sie hat eine Fortbildung für 450 Euro gemacht. Sie haben 1.200 Euro für eine neue Heizung bezahlt, von denen sie 20 Prozent absetzen konnten. Und sie haben 600 Euro für eine Putzhilfe bezahlt, von denen sie ebenfalls einen Teil absetzen konnten. Zusammen waren das über 2.000 Euro, die ihr zu versteuerndes Einkommen gesenkt haben. Wie machst du eine Steuererklärung? Du kannst ein Programm nutzen, das dich Schritt für Schritt durchführt. Das kostet etwa 30 Euro im Jahr, aber es rechnet sich fast immer. Oder du gehst zum Lohnsteuerhilfeverein, der dir hilft, wenn du nicht zu viel verdienst. Wichtig ist: Hebe alle Belege auf. Jeden Bon für Arbeitskleidung, jede Rechnung für Handwerker, jede Bescheinigung für Fortbildungen. Leg sie in einen Ordner, den du Steuer nennst, und wirf nichts weg. Am Ende des Jahres hast du alles zusammen. Und: Mach die Steuererklärung nicht erst im Dezember, wenn du schon alles vergessen hast. Mach sie im Februar, wenn du die Lohnsteuerbescheinigung bekommst. Dann ist alles noch frisch. Ein Beispiel für eine Steuererklärung, die sich gelohnt hat: Ein Freund von Familie Berger hat drei Jahre lang keine Steuererklärung gemacht, weil er dachte, er bekommt sowieso nichts zurück. Als er sie dann doch gemacht hat, hat er für drei Jahre zusammen 2.800 Euro zurückbekommen. Er hatte Fahrtkosten, Fortbildungen und Handwerkerrechnungen, die er nie abgesetzt hatte. Das Geld war einfach liegen geblieben. Deshalb: Mach deine Steuererklärung, auch wenn du denkst, du bekommst nichts zurück. Du hast vier Jahre Zeit, sie nachträglich zu machen. Das heißt, du kannst heute noch die Steuererklärung für 2022 machen, wenn du sie noch nicht gemacht hast. Ein zweiter Tipp: Hebe nicht nur Belege auf, sondern auch Bescheinigungen. Wenn du Spenden gemacht hast, wenn du in einen Verein eingetreten bist, wenn du Kinderbetreuungskosten bezahlt hast, dann gibt es dafür Bescheinigungen, die du brauchst. Leg sie in einen Ordner, den du Steuer nennst, und wirf nichts weg. Und: Wenn du Homeoffice machst, kannst du 6 Euro pro Tag absetzen, bis zu 1.260 Euro im Jahr. Das ist viel Geld. Du musst dafür kein eigenes Arbeitszimmer haben. Es reicht, wenn du am Küchentisch arbeitest und das nachweisen kannst. Familie Berger hat das im ersten Jahr vergessen und 600 Euro verschenkt. Im zweiten Jahr haben sie es richtig gemacht und 600 Euro mehr zurückbekommen. Das ist der Unterschied zwischen Wissen und Nicht-Wissen. Bei Steuern ist der wichtigste Punkt, dass du deine Belege aufhebst. Ohne Belege bekommst du nichts zurück. Mit Belegen bekommst du oft über 1.000 Euro zurück. Leg einen Ordner an, wirf jeden Beleg für Arbeit, Fortbildung und Handwerker hinein, und mach deine Steuererklärung im Februar, wenn alles noch frisch ist.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein drittes Beispiel für Steuern: Familie Berger hat gelernt, dass man auch Handwerkerrechnungen absetzen kann. Sie haben einen Handwerker bezahlt, der ihre Heizung repariert hat. Die Rechnung war 800 Euro, davon waren 200 Euro Arbeitskosten. Von diesen 200 Euro konnten sie 20 Prozent absetzen, also 40 Euro. Das klingt wenig, aber es ist Geld, das sie sonst verschenkt hätten. Und sie haben gelernt, dass man auch Haushaltsnahe Dienstleistungen absetzen kann, zum Beispiel eine Putzhilfe oder einen Gärtner. Wenn du eine Putzhilfe für 600 Euro im Jahr bezahlst, kannst du 20 Prozent davon absetzen, also 120 Euro. Das ist Geld, das du zurückbekommst, nur weil du eine Rechnung aufgehoben hast. Ein viertes Beispiel: Wenn du Homeoffice machst, dann kannst du nicht nur die 6 Euro pro Tag absetzen, sondern auch deinen Schreibtisch, deinen Stuhl und deinen Monitor, wenn du sie für die Arbeit gekauft hast. Familie Berger hat einen Schreibtisch für 150 Euro gekauft und konnte ihn komplett absetzen. Das ist Geld, das sie sonst verschenkt hätten. Deshalb: Hebe alle Belege auf, auch wenn sie klein aussehen. Kleine Belege sind auch Geld.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."], ["Dein Plan für die nächsten 12 Monate - Monat für Monat", "Jetzt hast du das ganze Buch gelesen. Aber Lesen allein ändert nichts. Deshalb hier dein Plan, Monat für Monat, so wie Familie Berger ihn gemacht hat. Monat 1: Schreibe ein Haushaltsbuch. Nur aufschreiben, nichts ändern. Monat 2: Schau dir deine Abos an und kündige, was du nicht nutzt. Monat 3: Richte das 3-Konten-Modell ein und überweise den Puffer automatisch. Monat 4: Vergleiche Strom, Handy und Versicherungen. Monat 5: Fange an, mit Liste einzukaufen und einen Reste-Tag einzuführen. Monat 6: Prüfe deine Schulden und mache einen Plan, sie abzubezahlen. Monat 7: Fange an, deinen Kindern Taschengeld zu geben und mit ihnen über Geld zu sprechen. Monat 8: Mache deine Steuererklärung für das letzte Jahr. Monat 9: Wenn dein Puffer bei 1.000 Euro ist, informiere dich über ETFs und eröffne ein Depot. Monat 10: Richte einen ETF-Sparplan ein, auch wenn es nur 25 Euro sind. Monat 11: Schau dir dein Haushaltsbuch an und vergleiche es mit Monat 1. Was hat sich geändert? Monat 12: Feiere, was du geschafft hast. Nicht mit einer teuren Anschaffung, sondern mit etwas, das dir wirklich Freude macht: Ein Ausflug mit der Familie, ein Essen mit Freunden, ein Tag ohne Handy. Das ist der Unterschied zwischen einem Buch, das du gelesen hast, und einem Leben, das sich verändert hat. Familie Berger hat nach 12 Monaten 3.600 Euro Puffer, keine Schulden mehr auf der Kreditkarte, und sie wissen, wohin ihr Geld geht. Sie sind nicht reich. Aber sie sind ruhig. Und das ist mehr wert als jedes Auto, das man auf Kredit kauft. Fang heute an. Nicht morgen. Heute. Mit einem Heft und einem Stift. Ein Jahr später, im Januar 2025, hat Familie Berger ihr Haushaltsbuch noch einmal angeschaut. Im Januar 2024 hatten sie 3.430 Euro Einnahmen und 3.420 Euro Ausgaben. Sie hatten 10 Euro übrig. Im Januar 2025 hatten sie 3.550 Euro Einnahmen, weil er eine Lohnerhöhung bekommen hatte, und 3.050 Euro Ausgaben. Sie hatten 500 Euro übrig. 300 Euro gingen auf den Puffer, 200 Euro gingen auf das ETF-Depot. Das ist der Unterschied, den ein Jahr macht. Nicht, weil sie mehr verdienen, sondern weil sie wissen, wohin ihr Geld geht. Sie haben auch gelernt, dass man nicht alles auf einmal ändern muss. Sie haben in jedem Monat nur eine Sache geändert. Im Januar das Haushaltsbuch, im Februar die Abos, im März das 3-Konten-Modell. So war es nicht überfordernd. Und sie haben gelernt, dass es Rückschläge gibt. Im August 2024 haben sie 400 Euro mehr ausgegeben als geplant, weil sie in den Urlaub gefahren sind. Das war kein Scheitern, das war Urlaub. Sie haben im September einfach wieder weitergemacht, ohne sich Vorwürfe zu machen. Das ist der wichtigste Punkt: Wenn du einmal über dein Budget gehst, ist das kein Grund, aufzugeben. Es ist ein Grund, weiterzumachen. Denn ein Monat, in dem du zu viel ausgegeben hast, ist besser als ein Jahr, in dem du gar nichts aufgeschrieben hast. Fang heute an. Mit einem Heft und einem Stift. Und in einem Jahr wirst du dich wundern, was sich verändert hat. Dein Plan für die nächsten 12 Monate ist kein Zwang, sondern ein Angebot. Du musst nicht alles in 12 Monaten schaffen. Wenn du in einem Jahr nur das Haushaltsbuch und den Puffer geschafft hast, dann hast du schon mehr geschafft als die meisten Menschen. Fang mit einer Sache an, und mach sie richtig. Der Rest kommt von allein, wenn du dranbleibst.  Und genau deshalb lohnt es sich, heute damit anzufangen, auch wenn es nur ein kleiner Schritt ist. Ein kleiner Schritt heute ist besser als ein perfekter Plan morgen, den man nie umsetzt. Fang an, und bleib dran, auch wenn es einmal nicht klappt. Ein Jahr später hat Familie Berger nicht nur Geld gespart, sondern auch Zeit gewonnen. Früher haben sie jeden Monat Stunden damit verbracht, sich zu streiten, wo das Geld geblieben ist. Heute brauchen sie 20 Minuten im Monat für den Geld-Abend, und danach ist alles klar. Sie haben auch gelernt, dass Sparen nicht heißt, sich nichts zu gönnen. Sie gönnen sich einmal im Jahr einen Urlaub, den sie vom Puffer bezahlen, nicht vom Dispo. Und sie gönnen sich einmal im Monat ein Essen beim Italiener. Das ist kein Luxus, das ist Leben. Und sie haben gelernt, dass man nicht perfekt sein muss. Es gibt Monate, in denen sie über ihr Budget gehen. Es gibt Monate, in denen sie vergessen, das Haushaltsbuch zu führen. Das ist normal. Wichtig ist, dass sie danach wieder weitermachen. Denn ein Leben ohne Geldsorgen ist kein Leben ohne Fehler. Es ist ein Leben, in dem man weiß, wo man steht, und in dem man Entscheidungen trifft, statt sich treiben zu lassen. Und genau das wünsche ich dir, wenn du dieses Buch gelesen hast: Dass du weißt, wo du stehst, und dass du Entscheidungen triffst, die sich gut anfühlen.  Das ist der Punkt, an dem sich alles ändert: Wenn du nicht mehr rätst, sondern weißt. Wenn du nicht mehr hoffst, dass es reicht, sondern siehst, dass es reicht. Und wenn du merkst, dass du es selbst in der Hand hast, was mit deinem Geld passiert, jeden Monat, jede Woche, jeden Tag."]], "kat": "Sachbücher", "unter": "Geld & Freiheit"}];
function lesezeit(b){var w=0;for(var i=0;i<b.chapters.length;i++){w+=b.chapters[i][1].split(/\s+/).length;}return Math.max(1,Math.round(w/200));}

function zeigeKats(){ANSICHT='kats';var n=document.getElementById('nav');n.innerHTML='';var l=document.getElementById('liste');l.innerHTML='';l.className='grid';ALLE_KATS.forEach(function(k){var d=document.createElement('div');d.className='katcard';d.innerHTML='<h2>'+k+'</h2><p>'+(KAT_TEXT[k]||'')+'</p><p>'+katCount(k)+' Bücher - Antippen</p>';d.onclick=function(){zeigeUnter(k)};l.appendChild(d)})}
function zeigeUnter(k){AKT_KAT=k;ANSICHT='unter';var n=document.getElementById('nav');n.innerHTML='';var b=document.createElement('button');b.className='navbtn';b.textContent='← Alle Kategorien';b.onclick=function(){zeigeKats()};n.appendChild(b);var l=document.getElementById('liste');l.innerHTML='';l.className='grid';var t2=document.createElement('h2');t2.textContent=k+' - Unterkategorien';l.appendChild(t2);unterList(k).forEach(function(u){var d=document.createElement('div');d.className='katcard';d.innerHTML='<h2>'+u+'</h2><p>'+unterCount(k,u)+' Bücher - Antippen</p>';d.onclick=function(){zeigeBuecher(k,u)};l.appendChild(d)})}
function zeigeBuecher(k,u){AKT_KAT=k;AKT_UNTER=u;ANSICHT='buecher';var n=document.getElementById('nav');n.innerHTML='';var b1=document.createElement('button');b1.className='navbtn';b1.textContent='← Alle Kategorien';b1.onclick=function(){zeigeKats()};n.appendChild(b1);var b2=document.createElement('button');b2.className='navbtn';b2.textContent='← '+k;b2.onclick=function(){zeigeUnter(k)};n.appendChild(b2);var l=document.getElementById('liste');l.innerHTML='';l.className='';var t2=document.createElement('h2');t2.textContent=k+' - '+u+' ('+unterCount(k,u)+' Bücher)';l.appendChild(t2);var gef=BUECHER.filter(function(b){return b.kat===k&&b.unter===u});if(gef.length===0){var e=document.createElement('p');e.textContent='Noch keine Bücher in dieser Kategorie - kommt bald.';l.appendChild(e);return}gef.forEach(function(b){var d=document.createElement('div');d.className='card';d.innerHTML='<b>'+b.title+'</b><br><span style="color:#d8b4fe">'+b.kat+' - '+b.unter+'</span><br>14 Kapitel - Lesezeit: ca. '+lesezeit(b)+' Min - Zum Lesen antippen';d.onclick=function(){oeffnen(b)};l.appendChild(d)})}
function filtern(){var q=document.getElementById('suche').value.toLowerCase().trim();if(!q){if(ANSICHT==='kats')zeigeKats();else if(ANSICHT==='unter')zeigeUnter(AKT_KAT);else zeigeBuecher(AKT_KAT,AKT_UNTER);return}var n=document.getElementById('nav');n.innerHTML='';var b=document.createElement('button');b.className='navbtn';b.textContent='← Alle Kategorien';b.onclick=function(){document.getElementById('suche').value='';zeigeKats()};n.appendChild(b);var l=document.getElementById('liste');l.innerHTML='';l.className='';var t2=document.createElement('h2');t2.textContent='Suchergebnis';l.appendChild(t2);BUECHER.filter(function(b){return b.title.toLowerCase().includes(q)||b.kat.toLowerCase().includes(q)||b.unter.toLowerCase().includes(q)}).forEach(function(b){var d=document.createElement('div');d.className='card';d.innerHTML='<b>'+b.title+'</b><br><span style="color:#d8b4fe">'+b.kat+' - '+b.unter+'</span><br>14 Kapitel - Lesezeit: ca. '+lesezeit(b)+' Min - Zum Lesen antippen';d.onclick=function(){oeffnen(b)};l.appendChild(d)})}
function oeffnen(b){var r=document.getElementById('reader');var h='<button onclick="document.getElementById(\'reader\').innerHTML=\'\'">X Schliessen</button><h2>'+b.title+'</h2><p>'+b.kat+' - '+b.unter+'</p><p>Lesezeit: ca. '+lesezeit(b)+' Min - '+b.chapters.length+' Kapitel</p>';b.chapters.forEach(function(c,idx){h+='<h3>Kapitel '+(idx+1)+' - '+c[0]+'</h3><p>'+c[1]+'</p>'});r.innerHTML=h;window.scrollTo(0,r.offsetTop)}
zeigeKats();
</script></body></html>
